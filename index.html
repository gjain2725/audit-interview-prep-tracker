  { q:'Under SA 450 the auditor must communicate uncorrected misstatements to those charged with governance and also:', o:['Modify the opinion once they exceed performance materiality','Withdraw from the engagement where management refuses to correct them','Aggregate them with clearly trivial items before any comparison','Obtain a written representation that the effects are immaterial'], c:3, why:'SA 450 requires a written representation with a summary of the uncorrected items attached; clearly trivial items are excluded from accumulation and exceeding performance materiality is not itself an opinion trigger.' },
  { q:'A misstatement of 12 lakh caused by a control failure in the purchase cycle is identified when overall materiality is 60 lakh, and management corrects it. Under SA 450 the auditor should:', o:['Treat the matter as closed once the correcting entry is posted','Consider whether more misstatements exist and revise the plan','Increase overall materiality to reflect the corrected balances','Report the matter under section 143 12 as a suspected fraud case'], c:1, why:'SA 450 requires the auditor to consider whether an identified misstatement indicates that others exist and whether the approach must change; correction alone does not answer that, and a control failure is not automatically fraud.' },
  { q:'Which statement about projected misstatement from audit sampling is correct in the SA 450 evaluation?', o:['Only factual misstatements accumulate since projections are estimates','Projected amounts are compared with performance materiality alone','Projected items join factual and judgemental ones in the aggregate','Management may clear a projection by correcting the sampled items'], c:2, why:'SA 450 recognises factual, judgemental and projected misstatements and requires all three in the aggregate assessment; corrections must address the population, not just the sample.' },
  { q:'A group auditor sets group materiality at 2 crore. For a component contributing 30 percent of consolidated revenue, component materiality should be:', o:['Lower than group materiality to allow for aggregation risk','Exactly 30 percent of group materiality to mirror the revenue share','Equal to group materiality since the group is the reporting entity','Derived solely from the component standalone financial statements'], c:0, why:'Component materiality must sit below group materiality to allow for aggregation across components; a mechanical revenue share or a standalone only basis ignores that aggregation risk.' },
  { q:'Which best describes the interaction between materiality and audit risk?', o:['They vary directly, so higher materiality means higher audit risk','Materiality is fixed after audit risk and cannot influence it','Materiality affects only evaluation, never the planning of work','They are inverse, so lower materiality calls for more extensive work'], c:3, why:'A lower materiality means smaller misstatements matter, so detection risk must be lowered through more extensive or effective work; materiality is set at planning and drives nature, timing and extent.' },
  { q:'A company has revenue of 100 crore, profit before tax of 40 lakh after one off director bonuses, and net assets of 60 crore. The most defensible benchmark choice is:', o:['Profit before tax, the primary indicator for all commercial entities','Normalised profit before tax after the one off bonus adjustment','Total revenue at 5 percent, being the largest reported figure','Net assets, because equity holders are always the primary users'], c:1, why:'SA 320 permits normalising a benchmark for unusual one off items or selecting a more stable measure; using a distorted profit or simply picking the largest number is not reasoned selection.' },
  { q:'Which is NOT an appropriate reason to set performance materiality at a lower percentage of overall materiality?', o:['A history of numerous misstatements found in prior year audits','A first year audit with limited accumulated knowledge of the entity','A wish to limit testing and hold down the agreed audit fee','Significant deficiencies identified in the entity control environment'], c:2, why:'Performance materiality is lowered where the risk of undetected misstatement is higher, such as prior errors, first year audits or weak controls; commercial fee pressure is never a valid basis.' },
  { q:'When misstatements identified during the audit are corrected by management, the auditor under SA 450 should still:', o:['Communicate them and request correction of all non trivial items','Disregard them entirely once the correcting entries have been posted','Report them to the Registrar of Companies as accounting irregularities','Add them back when comparing the aggregate with overall materiality'], c:0, why:'SA 450 requires timely communication and a request to correct all accumulated misstatements; corrected items leave the uncorrected aggregate but the pattern may still signal control weaknesses.' },
  { q:'Which situation best illustrates a judgemental misstatement under SA 450?', o:['A sales invoice posted twice because of a keying error at entry','A shortfall extrapolated from a sample of inventory differences','An expense in the wrong period from a cut off failure at year end','A gap between the management credit loss and auditor estimate'], c:3, why:'Judgemental misstatements arise from differences over estimates or policy selection; duplicated invoices and cut off errors are factual and extrapolated shortfalls are projected.' },
  { q:'In assessing the aggregate effect of uncorrected misstatements the auditor also considers prior period items because:', o:['SA 450 requires every prior period misstatement to be corrected now','Carried forward items can reverse into current period results','Comparatives must be restated whenever an uncorrected item existed','Prior period misstatements lapse once the earlier report is issued'], c:1, why:'Uncorrected items carried forward can reverse into the current period and build up in balances, so the auditor weighs the effect on both current results and period end balances.' },
  { q:'Materiality of 2.5 crore is derived from revenue of 500 crore and is challenged by the engagement quality reviewer. The strongest defence is:', o:['The client agreed the amount when signing the engagement letter','The identical percentage was applied in the prior year audit file','Revenue is the relevant stable measure and the rate is accepted','It yields an efficient sample size for testing the revenue ledger'], c:2, why:'The justification must rest on relevance to users, stability of the benchmark and an appropriate percentage; client agreement, precedent and sampling efficiency are not valid grounds.' },
  { q:'The aggregate of uncorrected misstatements is 48 lakh against overall materiality of 50 lakh. The most appropriate response is to:', o:['Recognise that undetected items may push the total past materiality','Issue an unmodified opinion as the aggregate is below materiality','Qualify the opinion since the aggregate is close to materiality','Raise overall materiality to 60 lakh to restore proper headroom'], c:0, why:'SA 450 requires the auditor to consider that when the aggregate approaches materiality, undetected misstatements may push the total past it, so more work or correction is needed; raising materiality to accommodate errors is unacceptable.' }
];

MCQ_BANK['risk'] = [
  { q:'Which statement about the audit risk model is most accurate?', o:['Audit risk equals inherent risk plus control risk less detection risk','Detection risk is assessed from the entity control environment','Control risk falls as substantive procedures become more extensive','RMM combines inherent and control risk; detection risk is inverse'], c:3, why:'Inherent and control risk exist independently of the audit and together form RMM; the auditor manages only detection risk through nature, timing and extent of procedures.' },
  { q:'An auditor assesses control risk as low for the revenue cycle but performs no tests of controls. Under SA 330 the consequence is that:', o:['Control risk must be taken at maximum for those assertions','Detection risk may be raised on the low control risk assessment','Prior year control testing may be relied on for several years','Substantive analytics alone become sufficient for the revenue cycle'], c:0, why:'Reduced substantive work is permitted only where tests of controls evidence operating effectiveness; without such testing the assurance must be obtained substantively.' },
  { q:'Which characteristic would NOT by itself indicate a significant risk under SA 315?', o:['High subjectivity in measuring an accounting estimate at year end','A non routine related party deal outside the ordinary course','High volume routine sales through a well controlled system','Accounting complexity with recent changes to the reporting rules'], c:2, why:'Routine high volume transactions subject to systematic processing sit lower on the inherent risk spectrum; significant risks stem from subjectivity, complexity, uncertainty, change or susceptibility to bias and fraud.' },
  { q:'Where the auditor plans a wholly substantive approach to a significant risk, SA 330 requires that:', o:['Substantive analytics alone suffice where the data is predictable','Controls must nevertheless be tested in every reporting period','The procedures must include tests of details for that risk','The procedures may be done at interim with no roll forward work'], c:2, why:'SA 330 states that a substantive only approach to a significant risk must include tests of details, and substantive procedures for significant risks are directed to the period end rather than interim alone.' },
  { q:'Risks of material misstatement at the financial statement level are best addressed by:', o:['Increasing sample sizes for the specific account balances affected','Testing operating effectiveness of application controls per cycle','Obtaining further written representations from management','Overall responses on scepticism, staffing and unpredictability'], c:3, why:'FS level risks are pervasive and relate to the control environment and management integrity, so SA 330 calls for overall responses; sampling and application control testing address assertion level risks.' },
  { q:'The control environment is weak but the auditor identifies a well designed reconciliation control over trade payables. The most appropriate conclusion is:', o:['A weak environment may undermine the specific control','The specific control is reliable regardless of the environment','Control risk must be set at maximum for the entire audit','ITGC testing is unnecessary because this control is manual'], c:0, why:'The control environment underpins the other components, so pervasive weaknesses cast doubt on specific controls; this does not mechanically force maximum control risk everywhere.' },
  { q:'The SA 315 requirement to understand internal control relevant to the audit obliges the auditor to:', o:['Test operating effectiveness of all controls in the five components','Accept management process narratives as control documentation','Evaluate design and determine implementation beyond inquiry','Assess control risk below maximum for every material balance'], c:2, why:'Design and implementation must be evaluated by combining inquiry with observation, inspection or tracing a transaction; operating effectiveness testing is a separate SA 330 decision.' },
  { q:'Building unpredictability into the selection of audit procedures is required mainly because:', o:['SA 330 requires audit team members to be rotated every three years','Management aware of the usual pattern can conceal fraud better','It lowers the inherent risk attaching to the affected accounts','It substitutes for the mandatory testing of journal entries'], c:1, why:'Predictable audit patterns make concealment easier, so SA 240 and SA 330 require an element of unpredictability; it does not change inherent risk and never replaces journal entry testing.' },
  { q:'Where controls tested in a prior audit are unchanged, SA 330 permits reliance on that earlier testing subject to which limit?', o:['Reliance for up to five years without any further retesting','Reliance indefinitely once management confirms no change','Reliance only where the control is automated and ITGCs work','Retest at least every third audit; significant risks each year'], c:3, why:'The rotation limit is three years for unchanged controls with a portion tested each period, but controls mitigating a significant risk must be tested in the current period.' },
  { q:'Which item would most likely be assessed as a significant risk requiring specific audit attention?', o:['Depreciation computed by the fixed asset module at standard rates','Allocating consideration across a multi element contract','Statutory dues computed directly from the payroll master data','Routine utility expenses supported by matched vendor invoices'], c:1, why:'Significant risks involve high subjectivity, complexity or judgement, which multi element allocation clearly does; the other items are systematic, routine and objectively supported.' },
  { q:'Why does the distinction between inherent risk and control risk matter in practice?', o:['Inherent risk can be reduced by the auditor but control risk cannot','Only control risk has any bearing on the determination of samples','It shows where exposure arises and drives different responses','Inherent risk is only at statement level and control at assertion'], c:2, why:'Neither can be changed by the auditor, but separating them clarifies whether the exposure comes from the nature of the item or from control failure; both can arise at either level.' },
  { q:'Before relying on a substantive analytical procedure over payroll expense, SA 520 and SA 330 require the auditor to:', o:['Assess data reliability and set the acceptable difference first','Set the tolerable difference after comparing with the recorded sum','Perform it only where control risk is assessed at the maximum','Restrict it to balances falling below performance materiality'], c:0, why:'Reliability of the data, suitability for the assertion, precision of the expectation and a predetermined acceptable difference are the preconditions; setting the threshold afterwards defeats the test.' },
  { q:'Which statement about risk assessment procedures under SA 315 is correct?', o:['They alone give sufficient appropriate evidence for the opinion','Analytical procedures may not serve as risk assessment procedures','Observation and inspection are barred as risk procedures','They must be supplemented by further audit procedures'], c:3, why:'SA 315 is explicit that risk assessment procedures provide the basis for identifying risks but not sufficient evidence for the opinion; inquiry, analytics, observation and inspection are all valid.' },
  { q:'A company implements a new ERP three months before year end. The most appropriate audit response is to:', o:['Rely on legacy system testing for the year as processes are alike','Assess control risk as low given the embedded automated controls','Test controls for each period and address data conversion risk','Restrict all control testing to the post implementation period'], c:2, why:'Controls differ across the two periods so each must be tested in its own period, and migration creates completeness and accuracy risk over converted balances; embedded controls are not effective merely by existing.' },
  { q:'SA 330 requires substantive procedures irrespective of the assessed risk of material misstatement for:', o:['Every single account balance exceeding performance materiality','Only those assertions for which controls were not tested at all','Only accounts affected by an identified significant risk','Each material class, balance and disclosure in the statements'], c:3, why:'The standard mandates substantive procedures for every material class, balance and disclosure regardless of assessed RMM, because controls alone cannot give complete assurance.' },
  { q:'Performing substantive procedures at an interim date increases which risk, and what response does SA 330 require?', o:['Detection risk for the remaining period; cover it by procedures','Inherent risk; reperform the whole interim sample at the year end','Control risk; controls must then be tested only at the year end','Sampling risk; the interim sample size must be doubled at year end'], c:0, why:'Interim testing leaves the intervening period uncovered, so substantive procedures or a combination with control testing must cover the remaining period; full reperformance is not required.' },
  { q:'Which is the best example of an assertion level response to the risk of management override of controls?', o:['Assigning an engagement partner with greater industry experience','Increasing the frequency of engagement team discussions on risk','Testing journal entries, especially non standard year end ones','Obtaining a management representation covering control override'], c:2, why:'Journal entry testing focused on unusual and period end entries is the specific procedure SA 240 requires for override; team composition and discussions are overall responses and a representation is not evidence.' },
  { q:'Inventory valuation at a plant is assessed as high risk because of slow moving stock. The most responsive procedure is to:', o:['Attending the physical count and observing the count procedures','Confirming inventory held by third parties for the entity','Testing cut off of goods received notes around the year end','Testing ageing and net realisable value against later prices'], c:3, why:'Ageing, NRV testing and challenge of the provision address valuation directly; count attendance and confirmations address existence and rights while cut off addresses completeness and occurrence.' }
];

MCQ_BANK['controls'] = [
  { q:'Which pairing of a COSO component with an example is accurate?', o:['Control activities and audit committee oversight of reporting','Risk assessment and segregation of duties over cash receipts','Monitoring and internal audit evaluation of controls','Information and communication and the entity code of conduct'], c:2, why:'Ongoing and separate evaluations such as internal audit reviews are monitoring; audit committee oversight and the code of conduct sit in the control environment and segregation of duties is a control activity.' },
  { q:'A walkthrough is performed primarily in order to:', o:['Confirm the flow and evaluate design and implementation','Conclude on operating effectiveness across the whole period','Provide a statistically valid sample of the control operations','Discharge the SA 330 requirement for tests of controls'], c:0, why:'A walkthrough of one or a few transactions establishes understanding, design and implementation; a single instance cannot support an operating effectiveness conclusion or form a valid sample.' },
  { q:'A control is well designed but the person performing it has no authority to enforce the follow up action. In an IFC evaluation this is best classified as:', o:['A design deficiency, since the objective is not met as designed','An operating effectiveness deficiency and nothing further','Not a deficiency while the control sits in the process narrative','A compensating control matter needing no separate evaluation'], c:0, why:'A design deficiency exists where a control is missing or is not designed such that the objective is met even when operated as intended, which covers a performer lacking the necessary authority or competence.' },
  { q:'Which best distinguishes a significant deficiency from a material weakness in IFC reporting?', o:['A significant deficiency is a gap; a weakness is an actual error','A significant deficiency is reported; a weakness goes to management','A material weakness can arise only in listed public companies','A material weakness means material misstatement may go undetected'], c:3, why:'The distinction is severity measured by likelihood and magnitude of potential misstatement, not by whether an error occurred; a material weakness drives an adverse IFC opinion.' },
  { q:'Reporting on internal financial controls under section 143 3 i of the Companies Act 2013 is NOT required for:', o:['A listed public company of any size or turnover level','A public company with paid up share capital of 100 crore','An unlisted public company having bank borrowings of 60 crore','A private company meeting the notified exemption conditions'], c:3, why:'The exemption notification relieves certain private companies including one person and small companies and those within turnover and borrowing limits; all public companies remain covered.' },
  { q:'Which of the following is a general IT control rather than an application control?', o:['A three way match of purchase order, goods receipt and invoice','Restricted privileged database access with periodic review','A system edit check rejecting negative quantities on entry','Automatic sequential numbering of outgoing sales invoices'], c:1, why:'ITGCs cover access to programs and data, program change, development and computer operations; matching logic, edit checks and sequencing are application controls inside a business process.' },
  { q:'ITGCs over program change management are found to be ineffective. For an automated three way match control this means:', o:['The automated control still holds since a walkthrough passed','ITGC failures touch user access only, never processing logic','Reliance fails as the logic may have changed in the period','An adverse internal financial controls opinion follows at once'], c:2, why:'Automated controls depend on ITGCs for consistent operation across the period, so a change management failure means point in time testing may not represent the full period; severity still needs separate evaluation.' },
  { q:'Which combination of duties held by one person creates the highest risk of undetected misappropriation of cash?', o:['Recording sales invoices and preparing the receivables ageing list','Approving purchase orders and preparing the annual budget','Preparing bank reconciliations and filing statutory returns','Receiving cheques, posting receipts and authorising write offs'], c:3, why:'Custody of receipts combined with recording and write off authority allows lapping to be concealed by writing off the shortfall; the other pairings do not combine asset custody with the ability to hide a loss.' },
  { q:'The extent of testing of a manual control that operates daily is influenced most by:', o:['The absolute materiality of the related account balance','Frequency of operation, deviation rates and assurance sought','The number of employees working in the accounting department','The monetary value of the largest transaction processed'], c:1, why:'Attribute sampling for controls is driven by frequency and deviation rates and the assurance sought; monetary value drives substantive sampling rather than tests of controls.' },
  { q:'One deviation is found in forty tested instances of an authorisation control. The most appropriate initial response is to:', o:['Conclude the control is ineffective and abandon reliance now','Extend the sample by exactly forty further items in each case','Accept it since one in forty is within a normal tolerable rate','Investigate the cause and judge whether it is systematic'], c:3, why:'SA 530 requires investigation of the nature and cause of every deviation and consideration of its effect; neither automatic rejection nor mechanical extension nor dismissal is appropriate first.' },
  { q:'Which statement about the auditor responsibility under section 143 3 i is most accurate?', o:['The auditor designs and implements the internal controls','The conclusion is expressed as limited negative assurance','The auditor opines on adequacy and operating effectiveness','The conclusion covers all operational and compliance controls'], c:2, why:'Clause i requires a reasonable assurance opinion on adequacy and operating effectiveness with reference to the financial statements; establishing and maintaining controls remains a management and board responsibility.' },
  { q:'Entity level controls that are sufficiently precise may:', o:['Replace all transaction level control testing in the audit','Be evaluated for design only and never for effectiveness','Be ignored wherever process level controls are documented','Reduce but not always eliminate transaction level testing'], c:3, why:'A highly precise management review can reduce process level testing, but most entity level controls are indirect and support the environment rather than addressing specific assertions.' },
  { q:'The essential difference between a test of controls and a test of details is that:', o:['Controls testing evidences operation; details evidence amounts','A test of controls always uses a larger sample than a test of details','A test of details can be performed only at the year end date','A test of controls is mandated by statute for all companies'], c:0, why:'Tests of controls target the operation of the control and are evaluated by deviation rates, whereas tests of details target recorded amounts and are evaluated in monetary terms.' },
  { q:'Dual purpose testing means:', o:['Testing two different controls from a single document sample','Testing the same control at interim and again at the year end date','One sample evidences control operation and monetary accuracy','Two auditors independently reperform the identical procedure'], c:2, why:'A dual purpose test combines a test of controls with a test of details on the same items, though the auditor must confirm the sample size satisfies both attribute and monetary objectives.' },
  { q:'Which would most likely constitute a material weakness in IFC for a manufacturing company?', o:['A two day delay in preparing one monthly bank reconciliation file','Absence of a written petty cash policy below a small limit','Occasional missing second signature on low value requisitions','An ineffective revenue control allowing material error to pass'], c:3, why:'Material weakness turns on a reasonable possibility that material misstatement is not prevented or detected, which the revenue control failure meets; the others are minor deficiencies.' },
  { q:'Management remediates a control deficiency two months before the year end. The auditor should:', o:['Conclude controls are effective as the new control now runs','Assess whether it ran long enough and weigh the earlier gap','Disregard the earlier deficiency as the opinion is as at date','Issue a disclaimer of opinion on internal financial controls'], c:1, why:'The IFC opinion is as at the balance sheet date but a sufficient period of operation is needed to test the new control, and the earlier failure may have caused misstatements requiring substantive work.' },
  { q:'Which gives the strongest evidence of the operating effectiveness of a management review control over the expected credit loss model?', o:['Inspecting the reviewer signature on the printed model output','Inquiring of the reviewer about the process actually followed','Examining criteria, thresholds and resolution of outliers','Confirming the model was run before the sign off date arrived'], c:2, why:'Management review controls are effective only if their precision is demonstrable, so evidence of criteria, thresholds and outlier resolution is required; a signature or inquiry does not establish precision.' },
  { q:'A company outsources payroll processing to a service organisation. Under SA 402 the auditor should:', o:['Understand the services and get a type 2 report before relying','Assume the controls are effective as the provider is independent','Test only the user entity controls and disregard the provider','Require the client to bring payroll processing back in house'], c:0, why:'SA 402 requires understanding the nature of the services and relevant controls; a type 1 report covers design and implementation only, so reliance on operating effectiveness needs a type 2 report or direct testing.' }
];

MCQ_BANK['fraud'] = [
  { q:'The three elements of the fraud triangle described in SA 240 are:', o:['Motive, means and materiality of the fraud committed','Collusion, concealment and override of the controls','Incentive or pressure, opportunity, rationalisation','Deficiency, deviation and resulting misstatement'], c:2, why:'SA 240 describes incentive or pressure, a perceived opportunity arising from weak controls or the ability to override them, and an attitude or rationalisation that lets the person justify the act.' },
  { q:'Which statement about the presumption of fraud risk in revenue recognition under SA 240 is correct?', o:['It is rebuttable and the reasons must be documented','It is irrebuttable and always a significant risk area','It applies only to listed entities and their subsidiaries','It applies only where revenue exceeds overall materiality'], c:0, why:'SA 240 requires the auditor to presume fraud risk in revenue recognition and evaluate which types of revenue give rise to it; the presumption may be rebutted only with documented reasons.' },
  { q:'The primary distinction between fraudulent financial reporting and misappropriation of assets is that:', o:['Fraudulent financial reporting is committed only by employees','Misappropriation always causes a material misstatement','Fraudulent reporting never involves concealment of any kind','Reporting fraud deceives users; misappropriation is theft'], c:3, why:'Fraudulent reporting is usually by management to deceive users about performance, whereas misappropriation is typically by employees and hidden by false records even where amounts are immaterial.' },
  { q:'Which approach to selecting journal entries is most responsive to management override risk under SA 240?', o:['Unusual accounts, period end postings and round sum entries','A random sample drawn from all entries posted in the year','Only entries with a value above the overall materiality level','Only entries reviewed and approved by the finance head'], c:0, why:'SA 240 directs selection on characteristics indicating inappropriate entries because override typically uses unusual, late, unsupported or round sum entries that random or value based selection would miss.' },
  { q:'Which best describes the auditor responsibility for fraud under SA 240?', o:['To detect every fraud in the entity regardless of amount','To certify that no fraud occurred during the financial year','To act as forensic investigator on any fraud risk factor','To obtain reasonable assurance about material misstatement'], c:3, why:'The auditor gives reasonable and not absolute assurance and the risk of not detecting fraud is higher than for error because of concealment and collusion; prevention and detection rest primarily with management and those charged with governance.' },
  { q:'Under section 143 12 read with the rules, an auditor with reason to believe a fraud of one crore or above has been committed by officers or employees must:', o:['Report direct to the Registrar of Companies within thirty days','Board or Audit Committee in two days, then Central Government','Deal with the matter only through CARO in the audit report','Report the matter to the Serious Fraud Office immediately'], c:1, why:'The prescribed route is a two day report to the Board or Audit Committee, a forty five day window for their reply, and onward reporting to the Central Government within fifteen days of receiving or not receiving that reply.' },
  { q:'For a suspected fraud below the threshold specified under section 143 12, the auditor is required to:', o:['No action is needed since the amount is below the legal limit','Report to the Central Government in the same way as larger frauds','Report to the Audit Committee or Board and in the Board report','Qualify the audit opinion in every such case of suspected fraud'], c:2, why:'Frauds below the specified threshold are reported to the Audit Committee or Board rather than to the Central Government, and the rules require prescribed particulars in the Board report.' },
  { q:'The most important reason SA 240 mandates an engagement team discussion about fraud is to:', o:['To allocate the audit work efficiently among team members','To document compliance with firm quality control policies','To agree materiality levels for fraud sensitive accounts','To exchange ideas on where the statements are vulnerable'], c:3, why:'The discussion is a brainstorming requirement centred on susceptibility to fraud and on how management might override controls, reinforcing scepticism; efficiency and materiality are separate planning matters.' },
  { q:'A fraud risk factor was identified but the auditor concluded no material misstatement arose. SA 240 documentation then requires:', o:['No documentation at all, as the conclusion reached was clean','Assessed fraud risks, responses and communications made','Only a brief note in the audit completion memorandum','Evidence only where the risk factor concerned revenue'], c:1, why:'SA 240 sets specific documentation requirements covering risks, responses, communications and rebuttal reasoning irrespective of the eventual conclusion reached.' },
  { q:'Which circumstance most strongly indicates an incentive or pressure fraud risk factor for fraudulent financial reporting?', o:['A high volume of manual journal entries in the ledger','Segregation of duties weaknesses in the stores department area','Pay tied to profit targets with a covenant breach looming','Absence of any internal audit function within the entity'], c:2, why:'Pay tied to aggressive targets combined with covenant pressure is a classic incentive factor; manual entries, weak segregation and no internal audit are opportunity factors instead.' },
  { q:'If the auditor identifies a fraud involving senior management, SA 240 requires communication:', o:['Timely to governance, with any regulatory duty considered','Only to the level of management immediately above those involved','Only through the written representation letter obtained','Only after the audit report has been signed and issued'], c:0, why:'Fraud involving management, employees with significant control roles, or fraud causing material misstatement must be reported to those charged with governance on a timely basis, and statutory duties under section 143 12 must also be weighed.' },
  { q:'Management override of controls is treated as a risk present in every entity primarily because:', o:['All managements are presumed to lack integrity until tested','Automated controls can never be overridden by any person','Segregation of duties is impossible in a smaller entity','Management can manipulate records and override controls'], c:3, why:'SA 240 treats override as an unpredictable risk in all entities because of the position management occupies, without presuming dishonesty, and requires specific procedures regardless of the view taken on integrity.' },
  { q:'Which procedure specifically addresses the risk of management bias in accounting estimates as required by SA 240?', o:['A retrospective review of prior period estimates for bias','Recalculating depreciation from the fixed asset register','Obtaining bank confirmations for all the operating accounts','Verifying the mathematical accuracy of the trial balance'], c:0, why:'SA 240 requires a retrospective review of the judgements and assumptions behind prior period estimates to detect a pattern of bias; the other procedures address quite different assertions.' },
  { q:'Unusual or unexplained relationships noted while performing analytical procedures near the end of the audit should be:', o:['Ignored where the accounts were already tested substantively','Reported directly to the Central Government without more work','Evaluated for whether they signal an unrecognised fraud risk','Resolved by obtaining a written representation from management'], c:2, why:'SA 240 requires evaluation of whether late stage analytical procedures reveal a previously unrecognised fraud risk; a representation is not sufficient evidence to resolve such an indicator.' },
  { q:'The auditor concludes that a material misstatement from fraud makes continuing the engagement impossible. The most appropriate course under SA 240 is to:', o:['Resign at once without any further communication to anyone','Issue an unmodified opinion with an emphasis of matter paragraph','Continue the audit while restricting the remaining scope','Weigh legal duties, inform governance and consider withdrawal'], c:3, why:'SA 240 requires determining professional and legal responsibilities, communicating with those charged with governance and any regulator, and where withdrawal is possible discussing and reporting the reasons; statutory duties survive resignation.' },
  { q:'Which is the clearest example of an opportunity fraud risk factor rather than an attitude or rationalisation?', o:['Management justifying aggressive accounting as immaterial','Domination by one individual without effective oversight','A known history of securities law violations by management','Management showing excessive interest in the share price'], c:1, why:'Domination by one person without effective oversight combined with unusual related party transactions creates the opportunity to commit and conceal fraud; the others describe attitudes, rationalisations or incentives.' },
  { q:'The auditor identifies a misstatement that may indicate fraud although the amount is immaterial. SA 240 requires the auditor to:', o:['Disregard it because it falls below the materiality level','Deal with it through CARO reporting in the audit report','Adjust the statements without any further procedures','Evaluate its implications, as fraud is rarely isolated'], c:3, why:'SA 240 states fraud is seldom an isolated occurrence, so even an immaterial indicator requires reassessment of risks, the reliability of evidence and representations, and possibly the whole approach.' },
  { q:'Written representations obtained under SA 240 include management acknowledgement that:', o:['The statements contain no fraud of any amount whatsoever','Responsibility for controls and disclosure of known fraud','The auditor bears responsibility for detecting entity fraud','The entity has never faced any regulatory inquiry at all'], c:1, why:'SA 240 requires representations covering responsibility for controls, the results of the management fraud risk assessment and disclosure of known, suspected or alleged fraud; absolute assurance that no fraud exists cannot be given.' }
];

MCQ_BANK['assertions'] = [
  { q:'Selecting items from the goods received note file and tracing them into the purchase ledger directly addresses which assertion?', o:['Occurrence of the purchases recorded in the period','Existence of inventory held at the reporting date','Completeness of purchases and the related liabilities','Rights and obligations over the inventory on hand'], c:2, why:'Testing from source documents into the accounting records tests completeness because the risk is omission; tracing in the reverse direction from ledger to document would test occurrence.' },
  { q:'The direction of testing best suited to detecting overstatement of trade receivables is:', o:['Selecting from despatch records and tracing to the sales ledger','Selecting recorded balances and vouching to despatch notes','Reviewing the ageing report for balances over six months','Recomputing the interest charged on overdue balances'], c:1, why:'Overstatement is found by starting with recorded amounts and seeking support, which tests existence and occurrence; starting from source documents tests completeness and detects understatement.' },
  { q:'Which set of assertions applies to account balances at the period end under SA 315?', o:['Occurrence, completeness, accuracy, cut off and classification','Presentation, disclosure, aggregation and disaggregation','Occurrence and rights, completeness and understandability','Existence, rights and obligations, completeness, valuation'], c:3, why:'Balance assertions centre on existence, rights and obligations, completeness and accuracy valuation and allocation; occurrence and cut off belong to classes of transactions.' },
  { q:'An auditor traces despatch notes dated in the first week after year end to the sales register to confirm they were excluded from current year sales. This primarily addresses:', o:['Cut off for revenue and occurrence of the recorded sales','Valuation of the related trade receivables at year end','Rights and obligations over the goods despatched later','Classification of sales between reportable segments'], c:0, why:'Testing post year end despatches for inclusion in the current year targets cut off and would reveal revenue booked before control transferred, an occurrence failure.' },
  { q:'The rights and obligations assertion for inventory is best tested by:', o:['Attending the physical count and observing the procedures','Testing the standard cost roll and variance absorption','Examining supplier and consignment arrangements on site','Reviewing the ageing profile of slow moving stock lines'], c:2, why:'Consignment stock and goods on approval sit on the premises without being owned, so contractual review addresses rights; counting tests existence, costing tests valuation and ageing tests net realisable value.' },
  { q:'Which of the following is a presentation assertion rather than one relating to transactions or balances?', o:['Cut off of transactions around the reporting date','Existence of the recorded assets at that date','Accuracy of the amounts recorded in the ledger','Classification and understandability of disclosures'], c:3, why:'Presentation assertions cover occurrence and rights of disclosed matters, completeness of disclosure, classification and understandability, and accuracy and valuation of disclosures.' },
  { q:'External confirmation of a bank balance provides the strongest evidence for which combination of assertions?', o:['Completeness and valuation of all the cash balances','Cut off and classification of banking transactions','Existence and rights, with little on completeness','Accuracy and valuation to the exclusion of all else'], c:2, why:'A bank confirmation evidences the existence of the confirmed balance and the entity right to it, but not completeness, because undisclosed accounts would never be circularised.' },
  { q:'For a construction contract measured on a percentage of completion basis, the assertion most at risk is:', o:['Accuracy and valuation, given judgement over progress','Existence of the related contract receivable balances','Classification between current and non current items','Rights and obligations over the recognised contract asset'], c:0, why:'Revenue and contract asset amounts depend on estimated total costs and measured progress, so subjective valuation drives the risk while the other assertions are comparatively mechanical.' },
  { q:'Reviewing payments made in the two months after year end to see whether the related liability was recorded at the reporting date primarily addresses:', o:['Existence of the trade payables that were recorded','Classification of the related expenses in the ledger','Cut off of the inventory receipts at the year end','Completeness of liabilities, the main payables risk'], c:3, why:'The subsequent payments search finds obligations that existed at the reporting date but were never recorded; payables carry an understatement rather than an overstatement risk.' },
  { q:'Which procedure best addresses the completeness assertion for provisions against legal claims?', o:['Recomputing the provision on the management assumptions','Lawyer confirmations, minutes and legal expense review','Comparing the closing provision with the prior year','Confirming settled claims were paid after the year end'], c:1, why:'Completeness requires a search for matters management may not have disclosed, which lawyer confirmations, minutes and legal expense scrutiny provide; recomputation only tests what is already recorded.' },
  { q:'The accuracy assertion for a class of transactions means that:', o:['All transactions that should be recorded have been recorded','Recorded transactions occurred and pertain to the entity','Amounts and related data have been recorded appropriately','Transactions are recorded in the correct accounting period'], c:2, why:'Accuracy concerns whether amounts and related data were recorded appropriately; the other options define completeness, occurrence and cut off respectively.' },
  { q:'An auditor selects items from the fixed asset register and locates them physically on the factory floor. This tests:', o:['Existence of the assets recorded in the register','Completeness of the fixed asset register itself','Valuation of the assets carried in the register','Rights and obligations over assets held on lease'], c:0, why:'Moving from the register to the floor confirms recorded assets exist; the reverse direction, from assets on the floor to the register, would test completeness.' },
  { q:'A company offsets trade receivables and trade payables for the same counterparty without a legally enforceable right of set off. Which assertion is violated?', o:['Existence of the trade receivables so presented','Completeness of the trade payables recorded','Classification and presentation of the amounts','Cut off of the underlying transactions posted'], c:2, why:'Both balances exist and are complete in the underlying records; the defect is improper offsetting, a presentation and classification failure that distorts the amounts on the face of the balance sheet.' },
  { q:'Recalculating the expected credit loss allowance using entity default history and forward looking adjustments primarily supports:', o:['Existence of the trade receivable balances','Rights and obligations over the receivables','Completeness of the recorded receivables','Accuracy, valuation and allocation of receivables'], c:3, why:'The allowance affects the carrying amount, so the procedure tests valuation and allocation; existence, ownership and completeness of the gross balances need different procedures.' },
  { q:'For revenue, the occurrence assertion is most at risk where:', o:['Bill and hold or channel stuffing inflates year end sales','Sales run through a controlled platform with despatch matching','Sales returns are processed shortly after the reporting date','Discounts are applied inconsistently between the customers'], c:0, why:'Bill and hold and channel stuffing record revenue where control has not transferred, so the transactions did not properly occur; inconsistent discounts affect accuracy and later returns affect estimates.' },
  { q:'Which mapping of a procedure to an assertion is INCORRECT?', o:['Observing the inventory count maps to existence','Inspecting title deeds maps to rights and obligations','Testing sales either side of year end maps to cut off','Testing receivables ageing maps to completeness'], c:3, why:'Ageing analysis supports valuation through the assessment of recoverability rather than completeness; the other three mappings are correct.' },
  { q:'To obtain evidence that all employee benefit liabilities have been recorded, the most effective procedure is to:', o:['Vouch a sample of recorded accruals to payroll records','Confirm outstanding balances with individual employees','Reconcile headcount and payroll to statutory returns','Recompute the gratuity provision on the prior year base'], c:2, why:'Completeness needs an independent source capable of revealing omissions, which headcount, statutory filings and actuarial reports supply; vouching recorded items cannot detect what was never recorded.' },
  { q:'Which statement about the relationship between assertions and audit procedures is most accurate?', o:['Each audit procedure evidences exactly one assertion only','A procedure can evidence several assertions but not substitute','Analytical procedures address all assertions equally well','Tests of controls directly evidence the monetary accuracy of items'], c:1, why:'Inspecting a sales invoice can evidence occurrence and accuracy together, yet strong existence evidence never substitutes for missing completeness work; controls testing evidences the control, not the amount.' }
];
