MCQ_BANK['sampling'] = [
  { q:'An auditor selects every 40th voucher after a random start from a population of 8000 payment vouchers. Under SA 530 this selection is best described as:', o:['Systematic selection, which can support statistical sampling if the random start is used and the population is not patterned','Non-statistical selection because judgement fixed the interval','Monetary unit sampling because a fixed interval is used','Haphazard selection since no explicit probability is computed'], c:0, why:'Systematic selection with a random start gives each item a known chance of selection, so it qualifies for statistical sampling, provided the population has no structure that coincides with the sampling interval. MUS also uses an interval, but the interval runs over monetary units, not physical items.' },
  { q:'Which of the following is a consequence of sampling risk rather than non-sampling risk?', o:['The auditor applies an inappropriate audit procedure to the selected items','The auditor fails to recognise a misstatement in an item that was examined','The auditor concludes a control is effective when in fact the population deviation rate exceeds the tolerable rate','The audit team member misinterprets the response received from a customer'], c:2, why:'Sampling risk is the risk that the conclusion from the sample differs from the conclusion had the entire population been tested, which is exactly the risk of incorrectly accepting effective controls. Applying wrong procedures or missing a misstatement in an item actually examined are non-sampling risks and are not reduced by increasing sample size.' },
  { q:'In monetary unit sampling for a trade receivables balance, which population item is CERTAIN to be selected?', o:['Any item equal to the average book value of the population','Any item with a negative book value','Any item selected in the prior year sample','Any item whose book value equals or exceeds the sampling interval'], c:3, why:'In MUS each rupee is a sampling unit, so an item at least as large as the interval must contain at least one selected monetary unit and is picked with certainty. Negative balances are actually a known weakness of MUS and must be tested separately, not automatically included.' },
  { q:'An auditor sets tolerable misstatement at 60 percent of performance materiality for a substantive sample. Increasing tolerable misstatement while all else is unchanged will:', o:['Increase the required sample size','Decrease the required sample size','Have no effect on sample size but increase sampling risk','Require the auditor to switch to statistical sampling'], c:1, why:'Sample size varies inversely with tolerable misstatement, because a larger amount the auditor is willing to accept demands less precision. The tempting answer is that a bigger tolerance means more work, but the relationship is the opposite.' },
  { q:'SA 530 permits the auditor to treat a misstatement as an anomaly only when:', o:['The misstatement arose from a one-off cause and the auditor has a high degree of certainty it is not representative of the population','The misstatement is below performance materiality','Management agrees to correct the misstatement in full','The misstatement was caused by a control deviation rather than an error in recording'], c:0, why:'An anomaly requires a high degree of certainty, supported by additional procedures, that the item is demonstrably not representative of the population. Size and management correction are irrelevant to whether the cause could recur elsewhere in the population.' },
  { q:'Stratification of an accounts receivable population by balance size primarily achieves which of the following?', o:['Elimination of non-sampling risk within each stratum','Conversion of a non-statistical approach into a statistical one','Removal of the need to project misstatements found in the low value stratum','Reduction in the variability of items within each stratum, allowing a smaller overall sample for a given assurance level'], c:3, why:'Stratification groups items with similar characteristics so that variability within each stratum falls, which reduces the total sample size needed. Misstatements found in a stratum still have to be projected to that stratum, and stratification does nothing about non-sampling risk.' },
  { q:'An auditor tests 60 items from a population of 12000 purchase orders and finds 3 without required approval. The tolerable deviation rate is 5 percent. The most appropriate immediate conclusion is:', o:['The sample deviation rate of 5 percent equals tolerable rate so the control is effective','The three items should be treated as anomalies and excluded','The sample deviation rate is 5 percent, and since allowance for sampling risk must be added, the results do not support reliance at the planned level','The auditor should extend the sample to 120 items and average the two deviation rates'], c:2, why:'A sample deviation rate equal to the tolerable rate leaves no room for the allowance for sampling risk, so the upper deviation rate exceeds tolerable and reliance is not supported. Treating deviations as anomalies requires demonstrated non-representativeness, which is not established here.' },
  { q:'Which factor would MOST reduce the required sample size in a test of details of a large inventory balance?', o:['An increase in the assessed risk of material misstatement','A decrease in the amount of misstatement the auditor expects to find in the population','Stratifying the population into fewer, wider strata','An increase in the number of items in the population from 50000 to 90000'], c:1, why:'Lower expected misstatement means less allowance is needed and sample size falls. Population size has almost no effect on sample size for large populations, which is a common misconception, and higher assessed risk increases sample size.' },
  { q:'After projecting the misstatement from a substantive sample, the projected misstatement is below performance materiality but close to it. Under SA 530 the auditor should:', o:['Conclude the population is not materially misstated because the projection is below performance materiality','Reduce performance materiality so that the projection falls comfortably within it','Automatically request management to record the projected misstatement as an audit adjustment','Consider that the projection plus sampling risk allowance may exceed tolerable misstatement, and perform further procedures'], c:3, why:'The evaluation must compare projected misstatement plus the allowance for sampling risk against tolerable misstatement, so a projection close to the threshold means the population may still be materially misstated. Lowering materiality after the fact to fit the result reverses the required logic.' },
  { q:'Which statement about projecting misstatements is correct under SA 530?', o:['Misstatements in items selected on a 100 percent basis are not projected, but are added in full to the total misstatement','Anomalies are projected but with a reduced weighting','Misstatements found in items examined 100 percent because they exceed a threshold are projected to the rest of the population','Only understatements are projected, since overstatements are corrected directly'], c:0, why:'Items tested in full are not part of the sampled remainder, so misstatements in them are known misstatements added in full rather than projected. Projecting them would double count and overstate the estimated misstatement.' },
  { q:'An auditor plans a test of controls over authorisation of journal entries and expects zero deviations. Which change would MOST increase the sample size?', o:['Increasing the tolerable deviation rate from 5 percent to 8 percent','Reducing the desired confidence level from 95 percent to 90 percent','Increasing the expected deviation rate from 0 percent to 2 percent','Increasing the population from 4000 to 9000 journal entries'], c:2, why:'When the expected deviation rate moves closer to the tolerable rate, the required sample size rises sharply. Raising tolerable rate and lowering confidence both shrink the sample, and population size is largely irrelevant for large populations.' },
  { q:'Which approach does NOT constitute audit sampling as defined in SA 530?', o:['Selecting 45 items using random number tables from a population of 3000 invoices','Selecting all items above a specified amount and testing only those items','Selecting 30 items haphazardly, with each item having a chance of selection','Selecting every 25th shipping document after a random start'], c:1, why:'Audit sampling requires all items in the population to have a chance of selection so a conclusion can be drawn about the whole population. Testing only items above a threshold is selective testing of specific items and provides no evidence about the untested remainder.' },
  { q:'A key limitation of monetary unit sampling that the auditor must address separately is:', o:['It cannot be used for populations with more than 10000 items','It cannot be combined with stratification of any kind','It requires the population to be normally distributed','It is inefficient at detecting understatement and does not select zero or credit balances'], c:3, why:'MUS gives selection probability proportional to recorded amount, so items recorded at zero, omitted altogether, or with credit balances are effectively excluded, making it weak for understatement. Population size and distribution shape are not constraints on MUS.' },
  { q:'The auditor discovers that the receivables listing used to select a sample excluded a branch ledger. The correct response is:', o:['Treat the omission as an anomaly and continue with the existing sample','Project the misstatement rate found in the sample to include the branch balances','Recognise the population was incomplete, so conclusions cannot be drawn about the full balance, and reperform selection over the complete population','Increase the sample size by the proportion the branch bears to the total'], c:2, why:'Sampling conclusions extend only to the population from which the sample was drawn, so an incomplete population invalidates the extrapolation. Simply scaling up the sample does not create evidence about a segment never eligible for selection.' },
  { q:'Which of the following best distinguishes statistical from non-statistical sampling under SA 530?', o:['Statistical sampling uses random selection and probability theory to measure sampling risk','Statistical sampling always produces smaller sample sizes','Statistical sampling eliminates the need for auditor judgement in evaluating results','Non-statistical sampling does not permit projection of misstatements'], c:0, why:'The defining features of statistical sampling are random selection and the use of probability theory to quantify sampling risk. Judgement is still required throughout, and non-statistical samples must also be projected to the population.' },
  { q:'When performing a test of controls, the auditor finds the control was not performed for a two week period during which the responsible officer was on leave. This is best treated as:', o:['An anomaly, since the absence was a one-off event','A deviation affecting only the items in that period, requiring consideration of whether a separate population and separate testing is appropriate','A non-sampling risk that requires no further evaluation','A scope limitation requiring a modified opinion in all cases'], c:1, why:'Where a control operated differently for an identifiable part of the period, that part is effectively a separate population and needs its own evaluation or alternative procedures. Labelling it an anomaly would wrongly ignore every transaction in the affected period.' },
  { q:'In evaluating a substantive sample, the auditor computes projected misstatement using the ratio method. This method is MOST appropriate when:', o:['Misstatement amounts are unrelated to the book values of the items','Only a single misstatement is found in the entire sample','The population is heavily stratified with a certainty stratum','Misstatements are roughly proportional to the book values of the sampled items'], c:3, why:'The ratio approach scales the misstatement to book value, so it fits when errors are proportionate to size. Where errors are of similar absolute size regardless of item value, the difference method is the better estimator.' },
  { q:'The auditor increases the assessed risk of material misstatement for the existence of receivables. Assuming other substantive procedures are unchanged, the effect on the sample size for positive confirmations is:', o:['No change, because confirmation sample sizes depend only on population size','A decrease, because higher risk means the auditor relies more on analytics','An increase, because a lower acceptable level of detection risk demands more persuasive evidence','An increase only if the entity operates in more than one location'], c:2, why:'Higher assessed risk means detection risk must be driven lower, which requires more evidence and therefore a larger sample. Higher risk does not justify shifting reliance onto analytics, which are less precise for existence at the item level.' }
];
MCQ_BANK['analytical'] = [
  { q:'Under SA 520, a substantive analytical procedure differs from an analytical procedure used in risk assessment principally because the substantive procedure:', o:['Must be performed at the planning stage of the audit','Must be documented in the audit strategy memorandum','Must be performed only on income statement balances','Requires the auditor to develop an expectation sufficiently precise to identify a misstatement that could be material'], c:3, why:'A substantive analytical procedure only gives assurance if the expectation is precise enough to detect a material misstatement. Risk assessment analytics may be broad and imprecise since their purpose is to identify areas of risk, not to obtain substantive evidence.' },
  { q:'Which situation makes a substantive analytical procedure MOST likely to be effective on its own?', o:['A large volume of predictable transactions such as rental income from fixed long term leases','A small number of complex construction contracts with variable claims','Provisions for litigation determined by management judgement','Related party transactions occurring at irregular intervals'], c:0, why:'Analytical procedures work best where relationships are stable, predictable, and driven by known factors such as fixed rents and known occupancy. Judgemental, low volume, or irregular balances lack the predictability needed to build a precise expectation.' },
  { q:'An auditor develops an expectation for payroll cost using headcount times average salary and finds a difference of 4 percent from the recorded amount. The threshold for investigation should be set:', o:['At performance materiality, since anything smaller is immaterial','By reference to the difference acceptable without further investigation, considering materiality and the assurance desired','At the level of the largest individual payroll variance in the year','At 5 percent as a standard rule of thumb for payroll'], c:1, why:'SA 520 requires the auditor to determine an acceptable difference by reference to materiality and the assurance sought, not a fixed rule. Setting the threshold at full performance materiality would leave no allowance for aggregation with other misstatements.' },
  { q:'Which factor most directly improves the PRECISION of a substantive analytical procedure over revenue?', o:['Using annual totals rather than monthly data','Using unaudited management prepared budgets as the expectation','Disaggregating revenue by product line and location before forming the expectation','Comparing current year revenue only to prior year revenue in total'], c:2, why:'Disaggregation reduces the chance that offsetting movements hide a misstatement, so it sharply improves precision. Annual totals and simple prior year comparisons are the least precise, and unaudited budgets carry management bias unless their reliability is tested.' },
  { q:'The auditor uses data produced by the entity system as an input to a substantive analytical procedure. SA 520 requires the auditor to:', o:['Accept the data if the general IT controls have been tested in a prior year','Use the data only if it has been reviewed by the internal audit function','Obtain a written representation from management confirming the data is accurate, which is sufficient','Evaluate the reliability of the data, including testing controls over its preparation or testing the data directly'], c:3, why:'Reliability of the underlying data is a precondition for any assurance from the analytical procedure, and it must be established by testing controls or the data itself. A written representation is not a substitute for evidence, and prior year control testing does not carry forward automatically.' },
  { q:'A gross margin analysis shows margin has been stable at 32 percent for three years despite a documented 12 percent increase in input costs and no price increase. The auditor should conclude that:', o:['The unexpected absence of an expected fluctuation is itself a matter requiring investigation','The stability confirms strong cost control and no further work is required','The procedure has failed and must be replaced by a test of details of every purchase','The margin should be recalculated using net rather than gross figures'], c:0, why:'SA 520 treats relationships that fail to fluctuate as expected in the same way as unexpected fluctuations, both signalling possible misstatement. Reading stability as automatically favourable is the classic error, as it can indicate manipulation of inventory or cost of sales.' },
  { q:'When an analytical procedure identifies a fluctuation inconsistent with other information, the auditor should FIRST:', o:['Propose an audit adjustment for the full amount of the difference','Accept management explanation if it is plausible and consistent with the business','Inquire of management and evaluate the responses, corroborating them with other evidence','Report the matter to those charged with governance as a significant deficiency'], c:2, why:'SA 520 requires inquiry of management followed by corroboration of the responses with other audit evidence. Accepting a plausible explanation without corroboration is precisely what the standard prohibits, because plausibility alone is not evidence.' },
  { q:'Which of the following is the BEST example of a plausible and predictable relationship suitable for substantive analytics?', o:['Relationship between advertising spend and the following year revenue in a competitive market','Relationship between number of employees, pay scales, and total payroll cost in a stable workforce','Relationship between directors remuneration and profit before tax','Relationship between legal provision balances and revenue growth'], c:1, why:'Payroll driven by known headcount and pay rates is a strong and stable relationship with verifiable inputs. Advertising to revenue, remuneration to profit, and provisions to revenue are all weak or judgement driven relationships with poor predictive power.' },
  { q:'For which assertion is a substantive analytical procedure over interest expense on a term loan MOST persuasive?', o:['Completeness and accuracy of the interest charge, given known principal, rate, and repayment schedule','Rights and obligations over the underlying borrowing','Existence of the lender as a legal entity','Classification of the loan between current and non-current'], c:0, why:'Recomputing expected interest from principal, rate, and tenure is a strong test of whether the recorded charge is complete and accurate. Rights, existence of counterparties, and current versus non-current split need documentary examination rather than analytics.' },
  { q:'An auditor plans to rely solely on substantive analytical procedures for a material revenue stream assessed as having a significant risk. Under the standards this is:', o:['Acceptable if the expectation is highly precise','Acceptable if management provides a written representation about revenue','Acceptable only if internal audit has already tested the stream','Not acceptable, because for a significant risk the auditor must perform substantive procedures that include tests of details'], c:3, why:'Where a significant risk is identified, substantive procedures responsive to that risk must include tests of details, so analytics alone are insufficient. Precision of the expectation does not remove that requirement.' },
  { q:'The MOST important reason an auditor disaggregates data by month when performing analytics over cost of sales is that:', o:['Monthly data is always more reliable than annual data','Offsetting misstatements across periods are less likely to be concealed','It reduces the need to test the reliability of the source data','Monthly data automatically satisfies the requirement for tests of details'], c:1, why:'Annual aggregation lets overstatements in one period offset understatements in another, so monthly analysis narrows the window in which errors can hide. Disaggregation does not make data inherently more reliable, and reliability testing is still required.' },
  { q:'Which of the following would MOST undermine the effectiveness of a trend analysis of repairs and maintenance expense?', o:['A stable manufacturing base with no capacity change during the year','Consistent vendor arrangements year on year','A material capitalisation policy change during the current year','Repairs expense being 3 percent of revenue in both years'], c:2, why:'A change in the capitalisation threshold breaks the comparability of the trend, because amounts previously expensed may now sit in fixed assets. The other options describe conditions of stability, which make trend analysis more, not less, effective.' },
  { q:'SA 520 requires analytical procedures to be performed near the end of the audit in order to:', o:['Replace the need for a final review of the financial statements by the engagement partner','Confirm that all journal entries have been tested','Recalculate materiality for the following year audit','Assist in forming an overall conclusion on whether the financial statements are consistent with the auditor understanding of the entity'], c:3, why:'Closing analytics support the overall conclusion by testing whether the statements as a whole align with the auditor understanding of the entity. They are additional to, not a substitute for, the partner review and other required procedures.' },
  { q:'An auditor computes expected depreciation as opening gross block times the average rate and finds a difference of 9 percent. The MOST likely legitimate cause to investigate first is:', o:['A change in the useful life estimate or significant additions and disposals during the year','A misstatement in trade payables','An error in the revenue cut-off','An understatement of the deferred tax liability'], c:0, why:'A simple opening balance model ignores mid year additions, disposals, and revisions to useful lives, all of which shift the depreciation charge. The other items sit in unrelated cycles and would not explain a depreciation variance.' },
  { q:'When using industry data as the basis for an expectation, the principal limitation is that:', o:['Industry data is never publicly available in India','Industry data cannot be used for risk assessment purposes','The entity accounting policies, product mix, and scale may differ from the industry composite, reducing comparability','Use of industry data converts the procedure into a test of controls'], c:2, why:'Composite industry figures blend entities with different policies, mixes, and scale, so differences may reflect these rather than misstatement. That limits precision but does not bar the data from being used as a risk assessment input.' },
  { q:'The auditor sets the acceptable difference for a substantive analytical procedure over rental income at 25 percent of performance materiality rather than 100 percent. This choice reflects:', o:['A desire to reduce audit effort','Recognition that a lower threshold is needed where higher assurance is sought from the procedure and to allow for aggregation with other misstatements','A requirement of SA 320 that all thresholds be one quarter of performance materiality','An assessment that the risk of material misstatement is low'], c:1, why:'A tighter threshold is set when more assurance is being drawn from the procedure and to leave room for aggregating undetected misstatements elsewhere. A tighter threshold increases rather than reduces audit effort, and no standard prescribes a fixed fraction.' },
  { q:'Which is a valid reason to perform an analytical procedure as a risk assessment procedure even though it will provide no substantive assurance?', o:['It may identify unusual transactions, events, amounts, or ratios that indicate risks of material misstatement','It satisfies the requirement to obtain sufficient appropriate evidence over material balances','It reduces the required sample size for tests of details automatically','It allows the auditor to omit understanding of internal control'], c:0, why:'Risk assessment analytics are required precisely to flag unusual items and relationships that point to risks needing response. They do not themselves constitute substantive evidence, nor do they displace the required understanding of internal control.' },
  { q:'An entity records a 30 percent revenue rise while receivables days increase from 45 to 96 and operating cash flow declines. The MOST appropriate auditor response is to:', o:['Accept the movement as normal for a growth phase','Rely on management representation that all revenue is genuine','Increase materiality to reflect the higher revenue base','Treat the pattern as an indicator of possible revenue overstatement or collectability issues and design specific responsive procedures'], c:3, why:'Revenue growing far faster than cash collection is a classic fraud and cut-off indicator that calls for targeted procedures on occurrence and recoverability. Raising materiality or relying on a representation would reduce rather than increase the response to a heightened risk.' }
];
MCQ_BANK['documentation'] = [
  { q:'The experienced auditor test in SA 230 requires documentation sufficient to enable an experienced auditor with no previous connection with the audit to understand:', o:['Every conversation held with management during the audit','The commercial terms of the audit engagement and the fee basis','The nature, timing and extent of procedures performed, the results and evidence obtained, and significant matters and conclusions reached','The internal quality control policies of the audit firm'], c:2, why:'The test focuses on the audit work itself, its results, and the significant judgements and conclusions drawn. Fee arrangements and firm level quality control policies are not what the experienced auditor test addresses.' },
  { q:'Under SA 230 the assembly of the final audit file should be completed on a timely basis after the date of the auditor report, ordinarily not more than:', o:['30 days','45 days','60 days','90 days'], c:2, why:'SA 230 indicates that an appropriate time limit for assembling the final audit file is ordinarily not more than 60 days after the date of the auditor report. The 60 day period is the assembly deadline and is distinct from the minimum retention period.' },
  { q:'The retention period for audit engagement documentation under the relevant quality control requirements is ordinarily no shorter than:', o:['7 years from the date of the auditor report or the group auditor report, whichever is later','5 years from the date of the auditor report','10 years from the balance sheet date','3 years from completion of file assembly'], c:0, why:'Retention should ordinarily be no shorter than seven years from the date of the auditor report, or the group auditor report where later. Confusing this with the sixty day assembly period is a frequent error.' },
  { q:'After the date of the auditor report but before file assembly is complete, the auditor deletes superseded draft workpapers. This is:', o:['Prohibited in all cases, as no document may be removed after the report date','Permissible, as assembly is administrative and may include deleting superseded drafts, if no new evidence or conclusions are created','Permissible only with written approval of those charged with governance','Permissible only if the deletion is disclosed in the auditor report'], c:1, why:'During the assembly period the auditor may perform administrative tasks such as deleting superseded drafts and sorting papers, because these do not change audit conclusions. What is prohibited is deleting or discarding documentation of substance before the retention period ends.' },
  { q:'The auditor performs a new procedure after the date of the auditor report in response to a query from a regulator. SA 230 requires documentation of:', o:['Only the new procedure performed','The name of the regulator and the fee charged for the additional work','A revised auditor report reflecting the additional work','The reasons for the change, when and by whom it was made and reviewed, and the additional procedures and conclusions reached'], c:3, why:'When documentation is added after the report date, SA 230 requires recording the reasons, the who and when of the change and its review, and the additional procedures and conclusions. Merely filing the new procedure without this trail defeats the audit trail requirement.' },
  { q:'Which statement about written representations under SA 580 is CORRECT?', o:['Written representations are sufficient appropriate audit evidence about the matters they cover','Written representations are audit evidence but do not by themselves provide sufficient appropriate evidence about any of the matters they deal with','Written representations replace the need to test managements estimates','Written representations may be dated any time within the assembly period'], c:1, why:'SA 580 is explicit that representations are evidence but never sufficient on their own for the matters they address. They also cannot substitute for other evidence the auditor could reasonably expect to be available.' },
  { q:'Under SA 580, written representations should be dated:', o:['As near as practicable to, but not after, the date of the auditor report','On the balance sheet date','Within 60 days after the auditor report date','On the date the financial statements were approved by the shareholders'], c:0, why:'The representations must cover all periods referred to in the report and be dated as near as practicable to but not after the date of the auditor report. Dating them after the report would leave the intervening period uncovered.' },
  { q:'Management refuses to provide the written representation regarding its responsibility for the preparation of the financial statements. The auditor should:', o:['Issue a qualified opinion and note the refusal in the basis paragraph','Obtain an oral representation instead and document it','Withdraw the audit report already issued','Disclaim an opinion on the financial statements, as the reliability of other representations is called into question'], c:3, why:'Refusal of the fundamental representations about managements responsibilities undermines the reliability of all representations, so SA 580 requires a disclaimer. A qualification would understate the effect on the audit as a whole.' },
  { q:'An audit team documents that no exceptions were noted in a control test but does not record which items were tested. Under SA 230 the primary deficiency is that:', o:['The conclusion is not supported by identification of the specific items tested, so the work cannot be reperformed or evaluated','No exceptions is not a valid audit conclusion','The documentation should have been signed by the client','The workpaper lacks a materiality reference'], c:0, why:'SA 230 requires recording the identifying characteristics of the items tested so the work is traceable and re-performable. Without them an experienced auditor cannot evaluate whether the conclusion is supported.' },
  { q:'Which of the following would ordinarily NOT need to be retained in the audit documentation?', o:['Significant matters discussed with management and when and with whom they were discussed','The basis for the auditor conclusion on the reasonableness of an accounting estimate','Superseded drafts of workpapers and duplicate copies of documents replaced by corrected versions','Documentation of discussions on significant matters with those charged with governance'], c:2, why:'Superseded drafts and duplicates replaced by corrected versions may be removed during assembly since they do not evidence the final conclusions. The other items are precisely the significant matters SA 230 requires to be documented and retained.' },
  { q:'The auditor concludes that an accounting estimate is reasonable but the documentation records only the final number agreed with management. This fails SA 230 because it does not record:', o:['The audit fee attributable to the estimate','The prior year comparative amount','The names of all engagement team members','The professional judgements made and the basis for the conclusion reached'], c:3, why:'Where significant professional judgement is exercised, SA 230 requires documentation of the judgement and its basis so the reasoning is auditable. Recording only the agreed figure leaves the judgement invisible.' },
  { q:'A representation from management about the completeness of related party relationships and transactions is required because:', o:['It removes the auditor responsibility to search for undisclosed relationships','Management is the source of knowledge about such relationships, but the representation supplements rather than replaces audit procedures','SA 550 permits reliance solely on representations for related parties','The Companies Act 2013 requires the auditor to obtain it in place of testing'], c:1, why:'Management holds the primary knowledge of related parties, so a representation is required, but it complements procedures such as reviewing registers, minutes and confirmations. Treating it as a substitute would leave undisclosed relationships undetected.' },
  { q:'If management provides a written representation that the auditor concludes is not reliable, SA 580 requires the auditor to:', o:['Accept the representation but reduce reliance on it','Request a second representation signed by those charged with governance','Take appropriate actions, including determining the effect on the opinion and whether other representations and evidence are affected','Report the matter to the Registrar of Companies immediately'], c:2, why:'Doubt about integrity or reliability of a representation casts doubt on other representations and evidence generally, and may require modification of the opinion. Simply obtaining a second signature does not address the underlying reliability concern.' },
  { q:'SA 230 requires documentation of discussions of significant matters. The record should include:', o:['The nature of the significant matters discussed, and when and with whom they were discussed','Only the conclusion reached','A verbatim transcript of the discussion','The commercial impact on the client of the matter discussed'], c:0, why:'The standard calls for the nature of the matters, and the timing and participants of the discussion, so the audit trail is complete. A verbatim transcript is neither required nor practical.' },
  { q:'Which document is LEAST likely to be considered audit documentation under SA 230?', o:['Checklists and analyses prepared by the audit team','Abstracts of significant contracts obtained by the team','Letters of confirmation received from third parties','The entity accounting records and source documents themselves'], c:3, why:'The entity accounting records and underlying source documents are audit evidence held by the client, not the auditor documentation, though copies or abstracts placed on file become documentation. The other three are classic examples of working papers.' },
  { q:'Where the auditor departs from a relevant requirement of an SA, SA 230 requires documentation of:', o:['The departure only, since alternative procedures are a matter of judgement','How the alternative audit procedures performed achieved the aim of that requirement, and the reasons for the departure','Approval from the Institute for the departure','A modification of the auditor report describing the departure'], c:1, why:'The documentation must show the reasons for departure and how the alternative procedures met the objective of the requirement. No external approval is needed, and a departure handled this way does not by itself trigger a report modification.' },
  { q:'A written representation about managements intention to hold an investment to maturity is MOST usefully corroborated by:', o:['A second representation from the audit committee','A confirmation of the market value from the broker','Evidence of past practice, board minutes, cash flow forecasts, and the entity ability to hold the investment','The engagement partner professional judgement alone'], c:2, why:'Intent representations require corroboration through history of similar holdings, documented board decisions, and the financial ability to hold. Market value confirmation addresses measurement, not intention.' },
  { q:'The auditor documents the identifying characteristics of items tested for a purchase order sample. An acceptable identifying characteristic would be:', o:['All purchase orders in the sample','A representative selection of purchase orders','Approximately sixty purchase orders selected from the year','Purchase order numbers PO 4501 to PO 4560 raised between 1 April and 30 June'], c:3, why:'Identifying characteristics must let another auditor locate the same items, which specific document numbers and dates achieve. Vague descriptions such as representative or approximately sixty give no way to reperform the test.' }
];
MCQ_BANK['revenue'] = [
  { q:'Under Ind AS 115, a promised good or service is distinct only if:', o:['It is sold separately by the entity at some point in the year','The customer can benefit from it on its own or with readily available resources, AND it is separately identifiable from other promises in the contract','It has a stand-alone selling price that is observable','The entity can identify a separate cost centre for it'], c:1, why:'Both the capable of being distinct test and the distinct within the context of the contract test must be met. Observable stand-alone selling price is relevant to allocation, not to whether the promise is distinct.' },
  { q:'An entity sells equipment and provides complex installation that significantly customises the equipment. Under Ind AS 115 the likely conclusion is:', o:['A single performance obligation, because the goods and installation are inputs to a combined output and are not separately identifiable','Two performance obligations, since installation could be performed by others','Two performance obligations, since the equipment has an observable stand-alone price','Revenue should be deferred until the warranty period expires'], c:0, why:'Significant customisation means the entity is providing a combined output, so the promises are not separately identifiable within the contract. That a third party could theoretically install does not override the integration test.' },
  { q:'The constraint on variable consideration requires an entity to include variable amounts only to the extent that:', o:['The amount is more likely than not to be received','The variable element is less than 10 percent of the transaction price','The customer has confirmed the amount in writing','It is highly probable that a significant reversal of cumulative revenue recognised will not occur when the uncertainty is resolved'], c:3, why:'Ind AS 115 uses the highly probable no significant reversal threshold, which is a higher hurdle than more likely than not. There is no percentage safe harbour for variable consideration.' },
  { q:'Which factor MOST indicates the entity is a principal rather than an agent?', o:['The entity has discretion in establishing the price for the specified good','The entity receives a commission expressed as a percentage of the sale','The entity controls the specified good before it is transferred to the customer','The entity name appears on the customer invoice'], c:2, why:'Control of the specified good before transfer is the overarching principle, with price discretion and inventory risk serving only as indicators supporting it. Invoice branding and commission form are presentation features that do not determine the conclusion.' },
  { q:'A performance obligation is satisfied over time if the entity performance creates an asset with no alternative use AND:', o:['The customer pays in instalments','The entity has an enforceable right to payment for performance completed to date','The contract term exceeds twelve months','The entity uses the percentage of completion method in its costing system'], c:1, why:'The no alternative use criterion must be paired with an enforceable right to payment for performance completed to date, including a reasonable profit margin. Instalment payments and contract length are not criteria in the standard.' },
  { q:'An entity recognises revenue but its right to consideration is conditional on completing a further milestone. The amount should be presented as:', o:['A contract asset, because the right to consideration is conditioned on something other than the passage of time','A trade receivable, since the revenue has been recognised','Deferred revenue','Other current assets with no further disclosure'], c:0, why:'A receivable arises only when the right to consideration is unconditional, needing nothing beyond passage of time. Where a further performance condition exists, the balance is a contract asset and carries different disclosure and impairment considerations.' },
  { q:'A contract includes a significant financing component when:', o:['Any payment is deferred beyond thirty days','The contract price exceeds the cash selling price by any amount','The customer pays in a foreign currency','The timing of payments provides the customer or the entity with a significant benefit of financing the transfer of goods or services'], c:3, why:'The test is whether the payment timing provides a significant financing benefit to either party, assessed against the cash selling price. A practical expedient allows the component to be ignored where the period between transfer and payment is one year or less.' },
  { q:'An entity grants a customer a right to return goods within 30 days. Under Ind AS 115 the entity should:', o:['Recognise full revenue and disclose the return right as a contingent liability','Defer all revenue until the return period lapses','Recognise revenue only for amounts not expected to be returned, recognise a refund liability, and recognise an asset for the right to recover goods','Treat the return right as a separate performance obligation'], c:2, why:'Return rights are variable consideration, so revenue excludes expected returns and a refund liability plus a return asset are recognised. A right of return is expressly not a separate performance obligation under the standard.' },
  { q:'Consideration payable to a customer that is not in exchange for a distinct good or service should be:', o:['Accounted for as a reduction of the transaction price','Recognised as a selling expense as incurred','Capitalised as a contract cost and amortised','Recognised as a separate performance obligation'], c:0, why:'Payments to a customer reduce the transaction price unless they buy a distinct good or service at fair value. Classifying such payments as marketing expense inflates both revenue and expenses.' },
  { q:'Which allocation basis does Ind AS 115 require for the transaction price across multiple performance obligations?', o:['Relative cost of each obligation','Relative stand-alone selling prices, estimated where not directly observable','Equal allocation across obligations','The amounts stated in the contract in all cases'], c:1, why:'Allocation follows relative stand-alone selling prices, estimated using approaches such as adjusted market assessment, expected cost plus margin, or residual where permitted. Contractual stated prices are used only where they represent stand-alone selling prices.' },
  { q:'An audit team is testing revenue cut-off for goods shipped FOB destination. The MOST relevant evidence around the year end is:', o:['Sales invoices dated in the last week of the year','The sales ledger control account reconciliation','Purchase orders received before year end','Proof of delivery documents evidencing the date the customer obtained control'], c:3, why:'With FOB destination terms, control transfers on delivery, so delivery evidence determines the correct period. Invoice dates are set by the entity and can be manipulated, which is why they are the weaker choice.' },
  { q:'Incremental costs of obtaining a contract, such as a sales commission payable only on winning the contract, should be:', o:['Expensed as incurred in all cases','Netted against revenue','Recognised as an asset if the entity expects to recover them, with a practical expedient to expense if the amortisation period is one year or less','Recognised as a contract liability'], c:2, why:'Ind AS 115 requires capitalisation of recoverable incremental acquisition costs, with an expedient permitting immediate expense where the amortisation period would not exceed one year. Salaries payable regardless of contract success are not incremental and are expensed.' },
  { q:'An entity sells a machine with a two year assurance type warranty required by law and an optional extended warranty. The correct treatment is:', o:['Both warranties are separate performance obligations','The assurance warranty is accounted for under Ind AS 37 as a provision, and the extended warranty is a separate performance obligation','Both are provisions under Ind AS 37','Neither is recognised until a claim arises'], c:1, why:'Assurance warranties that merely confirm the product meets agreed specifications are provisions, while service type warranties sold separately are performance obligations with allocated revenue. Treating the assurance warranty as a performance obligation would improperly defer revenue.' },
  { q:'For a bill and hold arrangement, revenue can be recognised only if, in addition to the customer having requested the arrangement, the:', o:['Goods are identified as belonging to the customer, ready for physical transfer, and cannot be used or redirected by the entity','Invoice has been raised and payment received in advance','Goods are insured by the entity','Customer has provided a written purchase order'], c:0, why:'Ind AS 115 sets specific criteria including a substantive reason for the arrangement, identification of the goods as the customer property, readiness for transfer, and inability of the entity to redirect them. Invoicing and payment alone do not establish transfer of control.' },
  { q:'Which measure of progress would ordinarily be INAPPROPRIATE for a service contract where the entity efforts are expended evenly?', o:['Time elapsed as a proportion of total contract period','Costs incurred relative to total expected costs','Surveys of performance completed to date','Units of a uncustomised standard product delivered where delivery is uneven and unrelated to effort'], c:3, why:'A units delivered measure would distort revenue where deliveries do not track the pattern of effort under an evenly expended service contract. Time elapsed, cost to cost, and surveys of work performed all track the transfer of the service more faithfully.' },
  { q:'Under the expected value method for estimating variable consideration, the entity should:', o:['Use the single most likely outcome','Use the maximum possible amount','Use the probability weighted sum of possible consideration amounts, which suits contracts with a large number of similar characteristics','Use the amount stated in the contract regardless of probability'], c:2, why:'The expected value method is the probability weighted approach and fits populations of many similar contracts, such as volume rebates. The most likely amount method is the alternative and suits contracts with only two possible outcomes.' },
  { q:'An auditor identifies that side letters granting extended return rights were not provided to the finance team. The primary revenue audit risk is:', o:['Overstatement of revenue because the full contract terms alter the transaction price and transfer of control','Understatement of trade payables','Misclassification between current and non-current assets','Understatement of the deferred tax asset'], c:0, why:'Undisclosed side letters change the substance of the arrangement and typically mean revenue was recognised too early or at too high an amount. This is a recognised fraud risk area, which is why searching for side agreements is a standard revenue procedure.' },
  { q:'A contract liability arises when:', o:['The entity has an unconditional right to consideration','The entity has received consideration, or has an unconditional right to an amount of consideration, before transferring the good or service','The customer disputes an invoice','The entity has performed but not yet invoiced'], c:1, why:'A contract liability reflects the obligation to transfer goods or services for consideration already received or unconditionally due. Performance ahead of invoicing produces a contract asset, which is the opposite position.' }
];
MCQ_BANK['leases'] = [
  { q:'Under Ind AS 116, a contract contains a lease only if it conveys the right to control the use of an identified asset. Control requires the customer to have:', o:['Legal title to the asset for the contract term','An option to purchase the asset at the end of the term','Physical possession of the asset at all times','Both the right to obtain substantially all the economic benefits from use and the right to direct the use of the asset'], c:3, why:'Control is defined by the combination of obtaining substantially all economic benefits and directing how and for what purpose the asset is used. Title, possession, and purchase options are not the defining tests.' },
  { q:'A supplier has a substantive substitution right over the asset throughout the period of use. The consequence under Ind AS 116 is:', o:['The asset is identified but the lease is classified as short-term','There is no identified asset, so the contract does not contain a lease','The customer must still recognise a right-of-use asset at fair value','The contract is automatically a service concession arrangement'], c:1, why:'A substantive substitution right, meaning the supplier has the practical ability to substitute and would benefit economically from doing so, means no identified asset and therefore no lease. A right that is only exercisable on malfunction or repair is not substantive.' },
  { q:'The lease liability at commencement is measured at the present value of lease payments not yet paid, discounted using:', o:['The lessee incremental borrowing rate in all cases','The risk free government security rate','The interest rate implicit in the lease if that rate can be readily determined, otherwise the lessee incremental borrowing rate','The lessee weighted average cost of capital'], c:2, why:'Ind AS 116 requires the implicit rate where readily determinable, falling back to the incremental borrowing rate. Lessees commonly cannot determine the implicit rate because they do not know the unguaranteed residual value, which is why the IBR is used in practice.' },
  { q:'Which of the following is NOT included in the initial measurement of the right-of-use asset?', o:['Variable lease payments linked to future sales that are not based on an index or rate','Lease payments made at or before the commencement date, less lease incentives received','An estimate of dismantling and restoration costs the lessee is obligated to incur','Initial direct costs incurred by the lessee'], c:0, why:'Variable payments linked to sales or usage are excluded from both the liability and the asset and are expensed as incurred. Payments varying with an index or rate are included, measured using the index at commencement.' },
  { q:'The low value exemption in Ind AS 116 is applied:', o:['By reference to the lessee materiality level','Only if the lessee also applies the short-term exemption to all its leases','Only to leases with a term under twelve months','On an asset by asset basis, judged by the value of the underlying asset when new, regardless of the size of the lessee'], c:3, why:'Low value is assessed on the absolute value of the underlying asset when new and is applied lease by lease, independent of the lessee size or materiality. The exemption is not available if the lessee subleases or expects to sublease the asset.' },
  { q:'The short-term lease exemption is unavailable where:', o:['The lease term is exactly twelve months with no options','The lease contains a purchase option that the lessee is reasonably certain to exercise','The lessor is a related party','The asset is a motor vehicle'], c:1, why:'A lease containing a purchase option cannot be a short-term lease under Ind AS 116, regardless of its term. A twelve month lease with no purchase option does qualify, and the exemption is an election by class of underlying asset.' },
  { q:'A lease modification that increases the scope by adding the right to use an additional asset, with consideration increased by an amount commensurate with the stand-alone price for that increase, is accounted for as:', o:['A remeasurement of the existing lease liability using a revised discount rate','A termination of the original lease and recognition of a new lease','A separate lease','An immediate gain or loss in profit or loss'], c:2, why:'Both conditions being met, increased scope and commensurate price increase, requires the modification to be treated as a separate lease. Where the price increase is not commensurate, the existing liability is remeasured using a revised discount rate instead.' },
  { q:'A lease modification decreases the scope of the lease. The lessee should:', o:['Decrease the right-of-use asset to reflect the partial termination and recognise a gain or loss for the difference in profit or loss','Adjust the right-of-use asset only, with no gain or loss','Recognise the entire reduction in the lease liability as deferred income','Treat the reduction as a separate lease'], c:0, why:'A scope decrease requires proportionate reduction of the right-of-use asset with any difference against the remeasured liability recognised in profit or loss. Deferring the effect misstates both the asset and the period result.' },
  { q:'Under Ind AS 116, a lessor classifies a lease as a finance lease when:', o:['The lease term covers more than 75 percent of the asset economic life','It transfers substantially all the risks and rewards incidental to ownership of the underlying asset','The present value of lease payments exceeds 90 percent of fair value','Legal title passes at the end of the lease in all cases'], c:1, why:'Classification rests on whether substantially all risks and rewards of ownership transfer, assessed using indicators rather than bright lines. The 75 percent and 90 percent figures are US style bright lines and are not thresholds in Ind AS 116.' },
  { q:'A lessee remeasures the lease liability using a REVISED discount rate when:', o:['Payments change due to a change in a market rental rate on a rent review','The lessee credit rating improves','The consumer price index used for escalation changes','There is a change in the lease term or in the assessment of a purchase option'], c:3, why:'Changes in lease term or purchase option assessment require an unchanged cash flow pattern to be rediscounted at a revised rate. Index or rate driven payment changes are remeasured using the original discount rate, which is the common trap.' },
  { q:'A ten year property lease has a market rent review after five years. At commencement the lessee should:', o:['Include payments based on the rent in effect at commencement, remeasuring when the review changes the cash flows','Include estimated future market rent increases in the lease payments','Treat the entire lease as a variable lease and expense the payments','Recognise a provision for the expected rent increase'], c:0, why:'Market rent reviews are not based on an index or rate in the sense of a formula driven adjustment, so the lessee uses the rent in effect and remeasures when the change takes effect. Forecasting rent increases into the initial liability is not permitted.' },
  { q:'Which audit procedure is MOST effective in addressing the completeness of the lease population under Ind AS 116?', o:['Recomputing the discount unwind on leases already in the register','Confirming lease terms with lessors already listed in the register','Scanning rent, hire and service expense accounts and reviewing legal and board minutes for arrangements not in the lease register','Agreeing the right-of-use asset opening balance to the prior year audited figure'], c:2, why:'Completeness risk lies with arrangements never entered in the register, so procedures must look outside it, such as scanning expense accounts and contract approvals. Testing items already in the register addresses accuracy but cannot detect omissions.' },
  { q:'A sale and leaseback where the transfer does NOT qualify as a sale under Ind AS 115 should be accounted for by the seller-lessee as:', o:['Derecognition of the asset and recognition of a right-of-use asset','Recognition of a right-of-use asset at fair value with a gain in other comprehensive income','Recognition of a full gain on sale and an operating lease expense','Continued recognition of the transferred asset and recognition of a financial liability for the proceeds'], c:3, why:'If control does not transfer, no sale has occurred, so the asset stays on the balance sheet and the proceeds are a financial liability under Ind AS 109. Recognising a gain would be recognising profit on a financing transaction.' },
  { q:'The lease term under Ind AS 116 comprises the non-cancellable period plus:', o:['All optional renewal periods available under the contract','Optional renewal periods where exercise is reasonably certain, and termination option periods where the lessee is reasonably certain not to terminate','Any period the lessee has historically occupied similar premises','Renewal periods only where the lessor cannot refuse'], c:1, why:'Only options the lessee is reasonably certain to exercise, and termination options it is reasonably certain not to exercise, extend the lease term. Including all available options regardless of intent overstates both the asset and the liability.' },
  { q:'A manufacturer dealer lessor enters a finance lease. At commencement it recognises:', o:['Selling profit or loss consistent with an outright sale, plus finance income over the lease term','Only finance income spread over the lease term','The asset at cost with depreciation over its useful life','A right-of-use asset and lease liability'], c:0, why:'Manufacturer or dealer lessors recognise selling profit or loss at commencement, calculated using a market rate of interest, and then finance income over the term. Deferring all profit into finance income would misstate both revenue and margin.' },
  { q:'Which characteristic would MOST support the conclusion that the customer directs the use of an identified asset?', o:['The supplier operates and maintains the asset under its own protocols with no customer input on output','The asset is physically located at the supplier premises','The customer decides the output produced, when it is produced, and how much, within the scope of its rights','The customer pays a fixed monthly fee'], c:2, why:'Deciding the how and for what purpose of use during the period of use is the core of directing use. Location of the asset and the payment structure are not determinative, and supplier controlled operation with predetermined output points away from a lease.' },
  { q:'A lessee elects the short-term exemption for a class of office equipment leases. It must:', o:['Recognise a right-of-use asset but no liability','Capitalise the payments and amortise over the useful life of the asset','Recognise a liability but no right-of-use asset','Recognise the lease payments as an expense on a straight-line basis or another systematic basis, and disclose the election and the related expense'], c:3, why:'The exemption results in straight-line recognition of the payments as expense, with specific disclosure of the election and expense amount. Partial recognition of only an asset or only a liability is not an option under the standard.' },
  { q:'In auditing lease data, which input would ordinarily be the HIGHEST risk of material misstatement in the lease liability?', o:['The monthly fixed rent stated in the contract','The incremental borrowing rate applied and the lease term including option assessments','The commencement date shown on the handover certificate','The currency of the contract'], c:1, why:'The discount rate and the lease term involve significant estimation and judgement and small changes materially shift the liability. Contractual rent and handover dates are objectively verifiable from documents and carry far less estimation risk.' }
];
MCQ_BANK['fininst'] = [
  { q:'Under Ind AS 109, a financial asset is measured at amortised cost only if:', o:['The business model is to hold to collect contractual cash flows AND the cash flows are solely payments of principal and interest','It is a debt instrument quoted in an active market','Management designates it as such at initial recognition','It has a fixed maturity of more than one year'], c:0, why:'Both the hold to collect business model and the SPPI test must be met for amortised cost. Quotation in an active market and maturity length are irrelevant to classification, and there is no free designation into amortised cost.' },
  { q:'A loan contains a term allowing the borrower to prepay at an amount that includes reasonable compensation for early termination. This term:', o:['Automatically fails the SPPI test, forcing FVTPL','Requires bifurcation of the prepayment feature as an embedded derivative','Requires the loan to be classified as FVOCI','Does not by itself fail SPPI, since reasonable additional compensation for early termination is consistent with a basic lending arrangement'], c:3, why:'Ind AS 109 accepts prepayment features where the amount substantially represents unpaid principal, interest and reasonable early termination compensation. Embedded derivatives are not bifurcated from financial asset hosts in any case, which is a key change from the old standard.' },
  { q:'An equity investment not held for trading is designated at fair value through other comprehensive income. On disposal:', o:['The cumulative gain in OCI is reclassified to profit or loss','Only dividends received are recognised in profit or loss on disposal','The cumulative gain remains in equity and is not recycled to profit or loss, although it may be transferred within equity','The entity must restate prior periods'], c:2, why:'For the equity FVOCI election there is no recycling of amounts to profit or loss on disposal, which distinguishes it from the debt FVOCI category. Dividends on such equity investments are recognised in profit or loss when the right to receive is established.' },
  { q:'A portfolio of debt instruments is managed with the objective of both collecting contractual cash flows and selling, and the cash flows are SPPI. The correct classification is:', o:['Amortised cost','FVOCI with recycling of cumulative gains and losses to profit or loss on derecognition','FVTPL','Equity FVOCI without recycling'], c:1, why:'The hold to collect and sell business model with SPPI cash flows produces debt FVOCI, where amounts accumulated in OCI are recycled on derecognition. Interest, impairment and foreign exchange for such assets still go through profit or loss.' },
  { q:'Under the general expected credit loss model, an instrument moves from Stage 1 to Stage 2 when:', o:['There has been a significant increase in credit risk since initial recognition','The borrower has defaulted','The instrument has been outstanding for more than twelve months','The exposure exceeds the entity internal single borrower limit'], c:0, why:'Stage 2 is triggered by a significant increase in credit risk since initial recognition, at which point lifetime ECL is measured but interest is still computed on gross carrying amount. Actual credit impairment moves the asset to Stage 3, where interest is computed on the net carrying amount.' },
  { q:'For a Stage 3 credit impaired financial asset, interest revenue is calculated by applying the effective interest rate to:', o:['The gross carrying amount before loss allowance','The original contractual amount of the loan','The amortised cost, being the gross carrying amount net of the loss allowance','The fair value of the collateral held'], c:2, why:'Once an asset is credit impaired, interest is recognised on the net amortised cost after deducting the allowance. Applying the rate to the gross amount is correct only for Stage 1 and Stage 2 assets.' },
  { q:'The simplified approach under Ind AS 109 for trade receivables without a significant financing component requires:', o:['Twelve month expected credit losses at all times','Fair value measurement of the receivable at each reporting date','Losses to be recognised only when objective evidence of impairment exists','Lifetime expected credit losses to be recognised from initial recognition, with no stage assessment'], c:3, why:'The simplified approach mandates lifetime ECL from day one and removes the need to track significant increases in credit risk. Recognising losses only on objective evidence is the superseded incurred loss approach.' },
  { q:'Ind AS 109 requires that the rebuttable presumption of a significant increase in credit risk arises when contractual payments are more than:', o:['15 days past due','30 days past due','60 days past due','90 days past due'], c:1, why:'The rebuttable presumption for a significant increase in credit risk is 30 days past due, whereas 90 days past due is the rebuttable presumption for default. Confusing the two thresholds causes assets to be staged incorrectly.' },
  { q:'An expected credit loss measurement under Ind AS 109 must:', o:['Reflect the single most likely outcome','Be an unbiased probability weighted amount reflecting the time value of money and reasonable and supportable forward looking information','Ignore forward looking information to avoid speculation','Use only historical loss rates from the last three years'], c:1, why:'ECL is a probability weighted, discounted estimate that incorporates reasonable and supportable forward looking information available without undue cost or effort. Using a single best case outcome or purely historical rates fails the measurement objective.' },
  { q:'An entity transfers receivables to a bank but retains a guarantee for the first 20 percent of credit losses and continues to collect from customers. Most likely the entity:', o:['Has neither transferred nor retained substantially all risks and rewards, so the control test applies and continuing involvement accounting is likely','Derecognises the receivables in full, as legal title has passed','Recognises a gain on sale for the full carrying amount','Reclassifies the receivables to FVTPL'], c:0, why:'Where risks and rewards are neither substantially transferred nor retained, the control test applies and retained servicing plus a first loss guarantee typically means continuing involvement. Legal transfer of title alone does not achieve derecognition under Ind AS 109.' },
  { q:'Reclassification of financial assets under Ind AS 109 is permitted:', o:['Whenever management changes its intention for an individual instrument','Only with approval of those charged with governance','At each reporting date for any category','Only on a change in the business model for managing financial assets, expected to be infrequent, applied prospectively'], c:3, why:'Reclassification is driven solely by a change in business model, is expected to be very infrequent, and is applied prospectively. Equity instruments and assets designated at FVTPL under the fair value option can never be reclassified.' },
  { q:'For a cash flow hedge, the effective portion of the gain or loss on the hedging instrument is:', o:['Recognised in profit or loss immediately','Adjusted against the carrying amount of the hedged item in all cases','Recognised in other comprehensive income and accumulated in the cash flow hedge reserve','Deferred as a contract asset'], c:2, why:'The effective portion goes to OCI in the cash flow hedge reserve, with any ineffective portion recognised immediately in profit or loss. Adjusting the hedged item carrying amount is the fair value hedge mechanic, not the cash flow hedge mechanic.' },
  { q:'Under Ind AS 109, hedge accounting requires an economic relationship between hedged item and hedging instrument, the effect of credit risk not dominating value changes, and:', o:['A hedge ratio consistent with the quantity actually used to hedge, as required by risk management strategy','A quantitative effectiveness result within the 80 to 125 percent range','Retrospective effectiveness testing at each reporting date','Formal approval from the audit committee'], c:0, why:'Ind AS 109 replaced the bright line 80 to 125 percent test with a principles based hedge ratio requirement linked to actual risk management. Retrospective bright line testing is no longer a condition for hedge accounting.' },
  { q:'A financial liability is measured at FVTPL and the entity elects to present changes attributable to its own credit risk in OCI. Those amounts:', o:['Are recycled to profit or loss when the liability is settled','Are added to the carrying amount of the liability','Must be reversed if the credit spread narrows','Are not subsequently transferred to profit or loss, though they may be transferred within equity'], c:3, why:'Own credit risk gains and losses presented in OCI are never recycled to profit or loss, avoiding the counterintuitive result of booking profit as credit quality deteriorates. Transfers within equity are permitted.' },
  { q:'Which cost treatment is correct at initial recognition under Ind AS 109?', o:['Transaction costs are added to the fair value of assets measured at FVTPL','Costs on FVTPL assets are recognised immediately in profit or loss, while for other categories they adjust the initial carrying amount','Transaction costs are always capitalised regardless of category','Transaction costs are recognised in other comprehensive income'], c:1, why:'For FVTPL instruments transaction costs are expensed immediately, while for amortised cost and FVOCI they are included in the initial measurement and amortised through the effective interest rate. Treating them uniformly misstates both the carrying value and interest income.' },
  { q:'A trade receivable is sold at a deep discount to a factor without recourse, and the entity has no continuing involvement. The correct treatment is:', o:['Retain the receivable and recognise a liability','Reclassify the receivable to FVOCI','Derecognise the receivable and recognise the difference between the carrying amount and the consideration received in profit or loss','Recognise the discount as a reduction of revenue under Ind AS 115'], c:2, why:'Where substantially all risks and rewards have transferred with no continuing involvement, the asset is derecognised and the loss on sale hits profit or loss. The discount is a financing cost of the factoring arrangement, not an adjustment to the original transaction price.' },
  { q:'When auditing an ECL model, which element is ordinarily the HIGHEST estimation uncertainty?', o:['The forward looking macroeconomic scenarios, their weights, and the probability of default inputs','The gross carrying amount of the loan book taken from the ledger','The contractual interest rate on each loan','The number of loan accounts in the portfolio'], c:0, why:'Macro scenario selection, scenario weighting and PD estimation involve significant management judgement and drive the loss allowance materially. Ledger balances, contractual rates and account counts are objectively verifiable data with low estimation uncertainty.' },
  { q:'A debt instrument classified at FVOCI is impaired. The loss allowance is:', o:['Deducted from the carrying amount of the asset on the balance sheet','Recognised only on derecognition of the asset','Ignored, because fair value already reflects credit risk','Recognised in profit or loss with a corresponding entry in other comprehensive income, since the asset remains carried at fair value'], c:3, why:'For debt FVOCI the asset stays at fair value on the balance sheet, so the ECL charge goes to profit or loss with the offset in OCI rather than reducing the carrying amount. Assuming fair value alone handles credit risk would leave the impairment charge missing from profit or loss.' }
];
