MCQ_BANK['situations'] = [
  { q:'On 28 May the CFO says the board meeting has moved to 30 May and asks the team to sign on 29 May, with three confirmations and the inventory rollforward still incomplete. BEST response?', o:['Sign on 29 May and finish the open confirmations within the assembly window','Sign with an emphasis of matter paragraph on the incomplete confirmations','Explain the report date cannot precede the evidence and propose a new date','Issue a qualified opinion for scope limitation to meet the board deadline'], c:2, why:'The report date must not be earlier than the date sufficient appropriate evidence was obtained, and the assembly window covers administrative assembly only, not fresh evidence gathering. Qualifying is premature while alternative procedures remain possible.' },
  { q:'Management refuses to let you send a balance confirmation to a large debtor, saying the relationship is delicate. The balance is Rs 4 crore out of Rs 22 crore receivables. What should the auditor do FIRST?', o:['Accept the refusal and move to testing subsequent receipts and dispatch notes','Inquire into the reasons for the refusal and weigh the fraud risk implications','Treat it as a scope limitation and qualify the opinion on receivables now','Ask the client to obtain the signed confirmation and pass it to the team'], c:1, why:'SA 505 requires the auditor to inquire into the reasons for a management refusal and evaluate the implications for fraud risk before deciding on alternative procedures. Client obtained confirmations lack the required auditor control over the process.' },
  { q:'Vouching consultancy expenses reveals Rs 90 lakh paid to a firm where a director spouse is a partner. It is absent from the related party note and management calls it immaterial and at arm length. BEST response?', o:['Accept the arm length representation and record the discussion in the file','Report the payment directly to the Registrar of Companies as an offence','Report it as a key audit matter and proceed with the remaining audit work','Test it against the related party definition and inform the audit committee'], c:3, why:'Related party disclosure is triggered by the relationship rather than by the size of the amount, so completeness of the related party listing must be tested and the matter communicated to those charged with governance. A representation on arm length pricing is not sufficient appropriate evidence.' },
  { q:'Analytics show 34 manual journals posted by the finance controller after cut-off, all round-sum credits to revenue reversed next period. Management calls them provisioning corrections. BEST response?', o:['Extend journal testing, examine the support and revise the fraud risk','Obtain a written representation from the controller explaining the entries','Report the controller to the audit committee before any further testing','Review only entries above performance materiality to protect the budget'], c:0, why:'Round-sum post cut-off entries reversed in the next period are a classic management override indicator, and SA 240 requires extended journal testing and reassessment of fraud risk. A written representation is not audit evidence and escalation before any factual basis is premature.' },
  { q:'Two days before signing you learn the client largest customer, giving 46 percent of revenue, has terminated its contract and the working capital loan matures in four months with no sanction for renewal. BEST course?', o:['Disclose it in the notes as a subsequent event and sign an unmodified opinion','Withdraw from the engagement because the going concern basis is now doubtful','Obtain a twelve month cash flow assessment and evaluate the management plans','Issue an adverse opinion because the going concern basis has clearly failed'], c:2, why:'SA 570 requires evaluation of managements assessment covering at least twelve months from the balance sheet date, with an unmodified opinion plus a material uncertainty section where disclosure is adequate. An adverse opinion applies only if the going concern basis itself is inappropriate.' },
  { q:'Accumulated uncorrected misstatements total Rs 46 lakh against overall materiality of Rs 50 lakh. All are judgemental provision estimates that reduce expense. BEST audit response?', o:['Conclude they are immaterial because the total sits below overall materiality','Weigh the one directional bias, seek correction and report the items to TCWG','Reduce materiality to Rs 40 lakh so that a qualification becomes necessary','Net them against unrecorded items in the other direction to reduce the total'], c:1, why:'SA 450 requires evaluation of qualitative aspects, and consistent one directional bias in estimates can indicate a lack of neutrality even when the arithmetic total falls below materiality. Retrospectively adjusting materiality to engineer an outcome is not acceptable.' },
  { q:'Eleven days after the audit report date but before issuance, the auditor learns a fire destroyed inventory of Rs 7 crore that existed at year end, the fire having occurred after year end. BEST response?', o:['Do nothing, since no procedures are required after the audit report date','Recall and reissue the report under the original date with disclosure added','Raise the matter at the annual general meeting without telling management','Discuss with management and issue a new or dual dated report once amended'], c:3, why:'SA 560 requires discussion with management for facts becoming known after the report date, and a new or amended report if the financial statements are amended. Keeping the original date would falsely imply the evidence covered the later event.' },
  { q:'You believe a Rs 1.2 crore capitalised development cost fails the recognition criteria. Your engagement manager disagrees and instructs you to clear the workpaper. What should you do?', o:['Document your view and escalate under the difference of opinion process','Clear the workpaper, since the manager is senior and owns the conclusion','Send the manager an email recording your disagreement and then sign off','Take the matter directly to the client audit committee for a final ruling'], c:0, why:'SQC 1 and SA 220 require a documented process for resolving differences of professional opinion, with the matter concluded before the report is released. An informal email does not discharge that requirement and going to the client bypasses the firm improperly.' },
  { q:'A long standing client whose fee is 18 percent of total firm revenue hints the audit will be re-tendered if this year is difficult. BEST safeguard focused response?', o:['Reduce scope in low risk areas so the fee stays within the agreed budget','Treat the fee pressure as commercial reality, since no rule is breached','Evaluate the self interest threat and apply an engagement quality review','Resign at once, because fee dependence always impairs auditor independence'], c:2, why:'Undue fee dependence creates self interest and intimidation threats that must be evaluated and addressed through safeguards such as an independent quality review or consultation. Cutting scope to protect a fee is a direct impairment and resignation is a last resort.' },
  { q:'A junior client accounts assistant has raised vendor invoices to a shell firm totalling Rs 11 lakh. The CFO says he will handle it privately and asks the auditor not to escalate. BEST action?', o:['Accept the CFO assurance, since the amount is well below overall materiality','Communicate it to those charged with governance and test for wider failure','Report the matter to the police directly, since fraud is a criminal offence','Add an emphasis of matter paragraph on the fraud and do no further work'], c:1, why:'SA 240 requires timely communication of employee fraud to those charged with governance irrespective of amount, and consideration of whether it signals broader control failure. Agreeing to suppress the matter compromises the auditor responsibility.' },
  { q:'Company X has turnover of Rs 300 crore. The team identifies suspected fraud by senior management of Rs 1.4 crore. Under the Companies Act 2013, what is the correct reporting route?', o:['Report only to the audit committee, since the amount is below Rs 5 crore','Mention it in the auditor report, as Government reporting covers listed firms','Report the matter to the ICAI disciplinary directorate for further action','Report to the Central Government after the board intimation and reply process'], c:3, why:'Section 143(12) read with Rule 13 requires reporting suspected fraud of Rs 1 crore or more to the Central Government after seeking the board or audit committee reply, with smaller amounts reported to the board or audit committee. The threshold is amount based, not listing based.' },
  { q:'During physical verification you observe the store keeper counting only the aisles the auditor pointed to, using count sheets pre-printed with book quantities. BEST immediate response?', o:['Perform independent two way test counts and assess the count reliability','Accept the count, since physical verification is a management responsibility','Qualify the opinion on inventory at once for unreliable count procedures','Rely on the perpetual records, since they agree with all the count sheets'], c:0, why:'Pre-printed book quantities create anchoring bias and directed counting undermines the exercise, so independent counts from floor to sheet and sheet to floor are needed. Agreement of sheets to perpetual records proves nothing when the sheets were populated from those records.' },
  { q:'The group CFO offers your team a fully paid weekend at a resort to thank them after a difficult audit. Your manager calls it customary hospitality. BEST response?', o:['Accept now, since the report is signed and independence no longer applies','Accept but disclose the trip in the annual firm independence declaration','Decline, since hospitality above trivial value creates unmanaged threats','Accept only the amount the firm would have spent on team travel anyway'], c:2, why:'Gifts and hospitality of other than trivial and inconsequential value create threats that no safeguard can eliminate, so refusal is the only correct response. Signing the report does not end the obligation because the relationship continues into the next period.' },
  { q:'The client changed the useful life of plant from 15 to 22 years in the final quarter, lifting profit by Rs 3.6 crore and just meeting a debt covenant. BEST response?', o:['Accept it as a change in accounting estimate applied wholly prospectively','Evaluate the technical basis and whether the covenant timing shows bias','Treat it as a prior period error and restate all comparative figures','Report it as a key audit matter without any further audit procedures'], c:1, why:'A change in estimate is valid only where supported by objective evidence, and late timing combined with a covenant benefit is a strong indicator of management bias requiring evaluation under SA 540. Accepting it automatically skips that required evaluation.' },
  { q:'A prospective client asks your firm to be statutory auditor while an affiliate of the firm already maintains its accounting records and prepares its financial statements. BEST response?', o:['Accept, provided entirely different personnel perform the two services','Accept but disclose the bookkeeping arrangement clearly in the report','Accept if the client audit committee formally approves the arrangement','Decline, since keeping the books of an audit client is a barred service'], c:3, why:'Maintaining the books of account of an audit client creates a self review threat that no safeguard cures, and Section 144 of the Companies Act also prohibits it for companies. Separate personnel or audit committee approval cannot override a prohibition.' },
  { q:'You are the audit senior. Two days before the deadline you realise a sampling error meant only 12 of the required 40 revenue items were tested, and results are already summarised. BEST action?', o:['Extend the sample now, tell the manager and re-evaluate before sign off','Record a revised judgement on sample size and conclude on the items tested','Complete the remaining 28 items after signing during the assembly period','Project the error rate from the 12 items over the population and conclude'], c:0, why:'The conclusion cannot be supported unless the planned sample is completed, and immediate escalation lets the team correct it before the report date. Documenting a post hoc change in judgement to cover the error misrepresents the workpaper.' },
  { q:'Management gives you a legal confirmation but instructs the lawyer not to comment on a pending tax matter of Rs 9 crore that you learnt of from board minutes. BEST response?', o:['Rely on the board minutes and record the contingency amount as disclosed','Lower the assessed litigation risk, since the matter is now already known','Treat it as an imposed scope limitation and inform the audit committee','Obtain a management representation covering all litigation and conclude'], c:2, why:'Preventing the auditor from communicating with legal counsel on a known matter is an imposed limitation on scope requiring TCWG communication and possible modification of the opinion. Board minutes do not provide the legal assessment of outcome and quantum.' },
  { q:'In a first year audit the opening inventory of Rs 18 crore was audited by the predecessor, whose file is unavailable, and the client bars any opening balance procedures. Effect on the report?', o:['No effect, since opening balances remain with the predecessor auditor','Possible qualification or disclaimer on the profit and loss statement','An adverse opinion on the financial statements considered as a whole','An unmodified opinion with an other matter paragraph on the predecessor'], c:1, why:'SA 510 makes the incoming auditor responsible for evidence that opening balances do not materially misstate the current period, and inability to verify opening inventory affects the reported result. Naming a predecessor does not discharge that responsibility.' }
];

MCQ_BANK['excel'] = [
  { q:'You must fetch a vendor name using vendor code, but the code column sits to the RIGHT of the name column in the master. Best single approach in Excel 2016 without restructuring the data?', o:['VLOOKUP with a negative column index number to look leftward','INDEX on the name column with MATCH on the vendor code column','HLOOKUP with the range lookup argument set to FALSE for exact','VLOOKUP after sorting the master ascending by the vendor code'], c:1, why:'VLOOKUP can only return values to the right of the lookup column and a negative index simply errors, whereas INDEX with MATCH lets the return column sit anywhere. Sorting does not change the direction limitation.' },
  { q:'A formula in D2 reads =B2*$F$1 and is copied to D3 and to E2. What happens to the $F$1 reference?', o:['It stays $F$1 in both copies, since column and row are locked','It becomes $F$2 in D3 and $G$1 in E2 once the formula is copied','It becomes $F$2 in D3 but stays $F$1 in the copy made to E2','It becomes $G$1 in E2 but stays $F$1 in the copy made to D3'], c:0, why:'A dollar before the column letter locks the column and a dollar before the row number locks the row, making $F$1 fully absolute so it never shifts on copy. Only the relative B2 portion adjusts.' },
  { q:'You need the total of the Amount column where Branch equals Pune AND the Date falls in Q3. Which is the correct function choice?', o:['SUMIF with the two criteria separated by a comma in one call','DSUM with a criteria range, the only multi condition sum tool','SUMIFS, where the sum range comes first, then criteria pairs','SUMPRODUCT, the only function able to take two conditions here'], c:2, why:'SUMIFS supports multiple criteria and uniquely takes the sum range as its FIRST argument, unlike SUMIF where the sum range comes last. SUMIF accepts only one condition and SUMPRODUCT, while workable, is not the intended tool.' },
  { q:'XLOOKUP is available in your version of Excel. Which statement about it is accurate?', o:['XLOOKUP defaults to approximate match in the same way VLOOKUP does','XLOOKUP cannot search a list upward from the bottom of a range','XLOOKUP needs the lookup array and return array to be adjacent','XLOOKUP defaults to exact match and takes an if not found value'], c:3, why:'XLOOKUP defaults to exact match, unlike VLOOKUP whose fourth argument defaults to approximate, and its if_not_found argument removes the need to wrap it in IFERROR. It also supports reverse search and non adjacent arrays.' },
  { q:'A debtors ageing pivot was built on a 60000 row extract. The client sends 3000 extra rows appended below and the pivot still shows old totals after Refresh. Most likely cause?', o:['The pivot cache is corrupt, so the workbook must be rebuilt now','The source is a fixed range, so appended rows fall outside it','Pivot tables cannot handle populations larger than 60000 rows','Refresh updates only calculated fields and not the underlying data'], c:1, why:'A pivot built on a fixed cell range never extends to appended rows, so converting the source to an Excel Table or dynamic named range fixes it permanently. Refresh does rebuild from source, so the definition of the source is the problem.' },
  { q:'What is the key difference between Remove Duplicates and the UNIQUE function when deduplicating a customer list in a workpaper?', o:['Remove Duplicates is case sensitive while UNIQUE is not at all','UNIQUE works on one column only while Remove Duplicates handles many','Remove Duplicates deletes source rows while UNIQUE spills a result','There is no functional difference beyond the Excel version used'], c:2, why:'Remove Duplicates is destructive and irreversible once saved, which is a serious problem for audit evidence, while UNIQUE returns a live array and preserves the auditable population. Both are case insensitive and both can operate across multiple columns.' },
  { q:'A bank statement download shows dates as text like 05/04/2026 in DD/MM/YYYY and SUMIFS by month returns zero. Which conversion approach is most reliable?', o:['Use Text to Columns with the column data format set to Date DMY','Format the cells as Date using the Format Cells dialog box now','Apply the VALUE function directly to each of the text entries','Widen the column so that Excel recognises the entries as real dates'], c:0, why:'Formatting cells only changes display and does not convert text into a date serial, while Text to Columns with an explicit DMY setting parses correctly and prevents day and month being swapped. VALUE follows the system locale and can silently misread DD/MM as MM/DD.' },
  { q:'Which use of IFERROR in an audit workpaper is a legitimate review point of concern?', o:['Wrapping a VLOOKUP so unmatched items show blank not an error','Using IFERROR on a division to suppress a divide by zero error','Using IFERROR on a presentation tab rather than in the workings','Wrapping a whole reconciliation so any error returns a zero'], c:3, why:'Suppressing every error to zero hides genuine broken references and makes a reconciliation appear to tie when it does not, defeating the control purpose of the schedule. Targeted use for expected non matches or zero denominators is acceptable if disclosed.' },
  { q:'You are reconciling a client sales ledger to a warehouse despatch listing, each about 40000 rows, matched on invoice number. Which technique isolates ALL differences?', o:['A single VLOOKUP from the sales ledger into the despatch listing file','Look up both ways, review non matches and compare matched values','Sort both listings by amount and compare the two sets visually','Use conditional formatting to highlight duplicates across both'], c:1, why:'A one directional lookup finds items missing from the second list but silently misses items present only in that second list, so a two way match is essential. Matched keys can still carry different values, making the amount comparison a necessary third step.' },
  { q:'To detect missing invoice numbers in a sequence like INV-2025-00001 upward, which approach is MOST reliable?', o:['Sort ascending and scan visually for any break in the number series','Use COUNTIF and compare the total with the client stated count','Extract the number, sort it and flag gaps against the prior row','Run Remove Duplicates and check whether the row count falls off'], c:2, why:'Comparing consecutive extracted values mathematically catches every gap, including a single missing number, and also flags duplicates as a zero difference. A total count comparison can agree coincidentally when a gap is offset by a duplicate.' },
  { q:'A senior reviewing your depreciation workpaper objects that the rate of 6.33 percent is typed directly into every formula. Why is this the strongest objection?', o:['It cannot be traced to source and cannot be updated in one place','Typed constants slow Excel recalculation across the whole workbook','Percentages must always be entered as decimals inside formulas','Hardcoded values do not print correctly in a finalised workpaper'], c:0, why:'A hardcoded constant is invisible to a reviewer tracing precedents, needs editing in many cells if it changes and severs the link to the underlying source evidence. Objections about speed or printing are irrelevant to review quality.' },
  { q:'Which combination gives the most meaningful integrity control over a shared audit schedule?', o:['Password protect the file so that only the preparer can open it','Save the file as a PDF after every change has been made to it','Hide the formula sheet so that reviewers see only the outputs','Lock the formula cells, leave inputs open and add a check row'], c:3, why:'Cell level protection stops accidental overwriting of logic while still permitting data entry, and a self checking control total gives immediate visible assurance the schedule ties. Hiding sheets or converting to PDF removes reviewability instead of adding control.' },
  { q:'COUNTIFS is used as =COUNTIFS(B:B,>1000000,C:C,Approved) and the count differs from a manual filter count. Which is the most likely legitimate cause?', o:['COUNTIFS always excludes the first row of the specified range','COUNTIFS skips numbers stored as text that the filter still shows','COUNTIFS cannot handle more than one criterion in a single call','Filters count the hidden rows in the total whereas COUNTIFS does not'], c:1, why:'Numeric criteria in COUNTIFS do not match values stored as text, understating the count against what is visible in a filter. COUNTIFS does include hidden rows, so the hidden row explanation is the wrong way round.' },
  { q:'For a monetary unit sampling selection from a 25000 line revenue population, which Excel approach is most defensible in the workpaper?', o:['Use RAND to pick rows and record only the selected line numbers here','Sort descending by value and take items from the top until coverage is fair','Build a cumulative column, set the interval and log the random start','Use the Data Analysis Toolpak random generator on its default settings'], c:2, why:'MUS needs a cumulative value column, a stated sampling interval and a reproducible random start, with the derivation documented so a reviewer can re-perform the selection. RAND is volatile and recalculates, destroying reproducibility unless values are pasted and documented.' },
  { q:'Your ageing pivot summarises the Amount field as Count instead of Sum for some months. What is the most likely cause in the underlying data?', o:['The Amount column holds blanks or text, so it is not numeric','The pivot has too many rows for Excel to sum the values reliably','Pivot tables default to Count for any field formatted as currency','The Amount column is formatted as Accounting and not as Number'], c:0, why:'Excel defaults a pivot value field to Count whenever the source column contains any non numeric entry such as text or a stray label. Number formatting has no influence on the default aggregation.' },
  { q:'Which statement about VLOOKUP with the fourth argument omitted is correct and most dangerous in audit work?', o:['It matches exactly and returns not available when nothing matches','It returns a zero value whenever no matching value can be found','It sorts the lookup table automatically before matching the value','It defaults to approximate match and can return a wrong value'], c:3, why:'Omitting the range lookup argument makes VLOOKUP approximate, and on unsorted data it returns a plausible neighbouring value with no error signal at all. A silent wrong answer in a workpaper is far more damaging than a visible error.' },
  { q:'You must compare two trial balances whose account codes differ in format, one text with leading zeros and one numeric. What is the safest first step?', o:['Delete the leading zeros from the text version so both agree','Build a documented helper key on both sides using TEXT or TRIM','Use an approximate match lookup so that near matches are captured','Change the numeric column to text through cell formatting only'], c:1, why:'A documented helper key preserves both original populations while making the join reliable, keeping the evidence auditable. Stripping leading zeros destroys the original code and cell formatting alone does not change the underlying value type.' },
  { q:'A pivot table shows total sales of Rs 84.2 crore while the underlying SUM shows Rs 86.9 crore. Which check is most likely to explain the difference?', o:['Check whether the value field needs currency formatting applied','Check whether the source data spans more than one worksheet tab','Check for a filter or slicer and whether the source range is short','Check whether the pivot uses Average, which understates a total'], c:2, why:'An applied filter or slicer and a source range stopping short of the last data row are the two usual reasons a pivot total falls below the raw sum. Formatting cannot change totals, and an Average would give a wildly different figure rather than a small shortfall.' }
];

MCQ_BANK['articleship'] = [
  { q:'A Big 4 panel asks you to tell them about a statutory audit you handled during articleship. Which opening is strongest?', o:['I worked on many statutory audits in manufacturing and services','I was in a large team under a very experienced partner on big clients','I performed statutory audits and prepared all the documentation','I owned revenue and receivables on a listed Rs 900 crore auto maker'], c:3, why:'Naming sector, scale and the area you personally owned lets the panel calibrate your exposure at once and gives them something concrete to probe. Broad claims of variety signal that no single engagement can be discussed in depth.' },
  { q:'When a panel asks you to quantify your articleship role, which quantification is MOST credible for an article assistant?', o:['I audited a listed manufacturer with turnover of about Rs 2000 crore','I saved the client Rs 4 crore in tax through my planning suggestions','I tested 120 revenue samples covering Rs 310 crore of Rs 480 crore','I handled 40 clients across the three years of my articleship term'], c:2, why:'Quantifying your own scope and the balance you covered is verifiable and shows exactly where you sat in the engagement. Entity turnover and client counts measure firm exposure, and a large savings claim exceeds what an article can plausibly own.' },
  { q:'What is a Big 4 panel PRIMARILY testing when it asks a detailed follow up about the sampling method you used on an engagement?', o:['Whether you did the work and can say why that method fitted','Whether you can recite the SA 530 definitions from your memory','Whether the firm applied the correct methodology on that audit','Whether you recall the exact sample size used two years ago'], c:0, why:'Probing on method is an authenticity test that separates someone who performed and understood the work from someone who watched it happen. Definitions are easy to memorise and firm methodology is not what the candidate is being assessed on.' },
  { q:'You are asked about leading a team during articleship, but you never held a formal team leader role. Best approach?', o:['Claim you led the engagement team, as seniors were rarely on site','Describe guiding two juniors on a workstream and fixing quality','Say articles are never given leadership, so you have no example','Use a college committee role, since it is a stronger instance'], c:1, why:'Leadership is assessed as observable behaviour such as allocating, reviewing and correcting work, so a small genuine instance beats a title. Declining wastes the question and overclaiming collapses under one follow up.' },
  { q:'A panel asks about the biggest mistake you made during your articleship. Which response is strongest?', o:['I missed a deadline because the client delayed the data to us','I cannot recall a mistake, since I was careful with all my work','I trusted a client and later found the underlying data was wrong','I mis-footed a lease schedule by Rs 12 lakh, so I added checks'], c:3, why:'A strong answer owns a real technical error, states the consequence and shows the concrete method change that stopped it recurring. Blaming the client or claiming no mistakes reads as deflection.' },
  { q:'You are bound by confidentiality and cannot name a client. How should you describe the engagement to the panel?', o:['Describe it as a listed NBFC with a loan book near Rs 1200 crore','Name the client, since the interview discussion is itself confidential','Decline to discuss the engagement and offer a different topic','Use a fictional client name so the story flows more naturally'], c:0, why:'Sector, scale and scope give the panel everything they need while demonstrating professional judgement on confidentiality. Naming the client is an ethics failure panels notice, and refusing entirely surrenders the substance.' },
  { q:'Which way of describing engagement scale is MOST likely to survive a panel probe?', o:['It was one of the biggest clients in our entire Mumbai office','It was a very complex audit with a large number of risk areas','Revenue near Rs 600 crore, 4 plants, and I covered two of them','We had a team of 15 people, so you can judge the size from that'], c:2, why:'Concrete operational figures tied to what you personally covered can be defended under questioning. Relative statements about size or complexity give the panel nothing checkable and invite a probe you cannot answer.' },
  { q:'A panel asks how your articleship prepares you for a Big 4 statutory audit role. Which answer links best?', o:['I am hard working and I adapt quickly to any new environment','I owned full audit cycles and did Ind AS conversion at two clients','My firm followed the same auditing standards that the Big 4 firms use','I have wanted to join a Big 4 firm right from my foundation days'], c:1, why:'The strongest link names the transferable capability and the relevant technical exposure, then maps both to the specific role. Generic traits and statements of ambition demonstrate no role fit.' },
  { q:'You worked mostly on tax and internal audit but are interviewing for statutory audit. Best framing?', o:['Say statutory audit is easier, so the transition will be simple','Play down the tax work and speak only about the few statutory audits','Say that all CA work is essentially the same at the entry level','Map controls testing to controls reliance and be honest on depth'], c:3, why:'Panels respect an honest mapping of transferable skills, and controls testing genuinely underpins the controls reliance approach in statutory audit. Concealing the profile fails the moment the resume timeline is examined.' },
  { q:'During a probe the panel says your description of a consolidation you worked on sounds beyond an article scope. Best response?', o:['Clarify that you did the eliminations and intercompany work','Insist that you handled the entire consolidation on your own','Move the discussion across to a different engagement entirely','Say the firm gave its articles unusually high responsibility'], c:0, why:'Narrowing immediately to the exact task performed and acknowledging the review layer restores credibility and shows self awareness. Doubling down after a challenge is the fastest route to rejection.' },
  { q:'Which structure works best when answering a technical articleship question such as how did you audit revenue?', o:['List every procedure in the audit programme in order performed','Describe the client business at length before naming procedures','State the risk, the procedures, the finding and the resolution','Quote the relevant paragraphs of the auditing standard involved'], c:2, why:'A risk to procedure to finding to resolution flow shows you understand why procedures exist rather than merely that they exist. Reciting a programme signals mechanical execution without judgement.' },
  { q:'A panel asks which area of audit you are weakest in. What is the strongest reply?', o:['I have no weak area, since my articleship covered everything','Consolidation; I have since worked through Ind AS 110 myself','Client handling, because I am naturally quite introverted here','Anything to do with taxation, which is why I applied to audit'], c:1, why:'Naming a genuine technical gap with specific self remediation shows honesty and initiative without harming role fit. Claiming no weakness signals low self awareness and naming a core requirement such as client handling damages the candidacy.' },
  { q:'You are asked what you would do differently if you could repeat your articleship. Best answer?', o:['I would have joined a Big 4 firm right at the very outset instead','I would change nothing, since my articleship was near ideal','I would have taken fewer leaves so that I could learn more','I would have taken a full year of listed statutory audit work'], c:3, why:'Naming a deliberate structural choice with reasoning demonstrates reflective judgement about how professional skill develops. Saying you would have picked a different firm criticises your own experience and adds no insight.' },
  { q:'The panel asks about a time you disagreed with a client finance head during articleship. Which example is strongest?', o:['A Rs 30 lakh provision where you escalated with your workings','An audit fee dispute that the partner later settled with the client','A case where you gave in at once to keep the relationship smooth','A case where you argued hard and the client complained about you'], c:0, why:'The best example shows a technical position, proper escalation within the firm and a documented basis for the outcome. Fee disputes are not an article matter, and both capitulating and escalating into conflict fail the judgement test.' },
  { q:'Your articleship was at a small firm with mostly proprietorship and small private company clients. How should you frame this?', o:['Stress that small firm articles work much harder than Big 4 articles','Apologise for the limited exposure and point to your exam marks','Highlight full ownership of audits and drafting the statements','Overstate the client sizes so that the profile reads stronger'], c:2, why:'Small firm articleship genuinely produces breadth and end to end ownership that large firm articles often lack, which is a real differentiator when stated concretely. Digs at Big 4 articles are risky in a Big 4 interview and misstating client size is disqualifying.' },
  { q:'When a panel asks how many hours you typically worked during articleship, which answer is best?', o:['Around 14 to 16 hours every day right through the three years','About 9 hours normally and 12 to 14 hours from March to May','I never tracked hours, I simply finished the work that came','As many hours as it took, since I am fully committed to work'], c:1, why:'A differentiated answer covering normal and peak periods is realistic and shows awareness of the audit cycle. Round the clock claims read as posturing and untracked hours suggest poor work management.' },
  { q:'You are explaining a technical issue you resolved when you realise halfway through that you have the accounting treatment wrong. Best move?', o:['Carry on confidently, since the panel may well not spot the error','Say you have forgotten the details and move to another example','Blame the client accountant for creating the confusion at that time','Stop, state the correct treatment, explain why and carry on'], c:3, why:'Self correcting in real time demonstrates the technical honesty and scepticism panels look for and turns a negative into evidence of judgement. Panels usually notice, and continuing with a wrong treatment is far more damaging.' },
  { q:'A panel asks what you contributed beyond your assigned work during articleship. Which answer is strongest?', o:['I always finished my work on time and never needed a reminder','I helped the juniors whenever they came to me asking for guidance','I built an Ind AS 116 lease workbook reused on 5 client files','I attended every internal training session that the firm ran'], c:2, why:'A reusable deliverable adopted by others is measurable evidence of initiative with a stated benefit. Punctuality, informal help and training attendance are baseline expectations rather than contributions.' }
];

MCQ_BANK['behavioral'] = [
  { q:'Which is the most common failure when candidates use the STAR structure in a CA interview?', o:['Spending too long on the Result portion of the whole answer','Overrunning on Situation and Task and compressing the rest','Using STAR on behavioral questions instead of technical ones','Mentioning the wider team within the Action section of STAR'], c:1, why:'Panels assess what you personally did and what changed, so Action and Result must carry the weight of the answer. Extended scene setting consumes the time budget and leaves the assessable content unsaid.' },
  { q:'For tell me about yourself in a Big 4 audit interview, which structure is strongest?', o:['A chronological story running from schooling to the present','A summary of your family background and your personal values','A list of the academic scores and rankings you have achieved','Present role, two or three audit proof points, then why now'], c:3, why:'A present to proof to purpose structure delivers relevant evidence in about ninety seconds and lands on why you are in the room. A chronological narrative buries the relevant material and rarely reaches the reason for applying.' },
  { q:'Which weakness answer is most credible to a Big 4 audit panel?', o:['I am a perfectionist and spend too long checking my own work','I take on too much work because I find it hard to say no to people','My review memos ran long, so my senior now marks up two a month','I get impatient with colleagues who work more slowly than I do'], c:2, why:'A credible weakness names a specific professional skill gap, the concrete corrective action and the outcome. Perfectionism and inability to say no are recognised as disguised strengths, and impatience with colleagues signals a teamwork risk.' },
  { q:'You are asked how you handled a conflict with a senior. Which answer reflects best professional practice?', o:['Set out your workings, consult the technical desk and accept it','Raise it with the partner directly, since the senior was wrong','Avoid the confrontation and follow the senior, as rank matters','Record the disagreement by email so that you stay protected later'], c:0, why:'The best answer shows a reasoned position, use of the proper consultation channel and acceptance of a documented resolution, which mirrors how differences of opinion are meant to be handled. Skipping the senior, silent compliance and defensive emailing all show poor judgement.' },
  { q:'For the question why our firm rather than the other Big 4, which answer is strongest?', o:['Your firm has the strongest brand and reputation in the market today','Your BFSI practice here matches my NBFC articleship background','Your firm clearly leads the market in the sector I want to join','Your firm offers better pay and work life balance than others'], c:1, why:'Specific researched reasons tied to your own profile prove genuine interest and cannot be recycled for another firm. Brand, market position and pay apply equally to all four and signal no preparation.' },
  { q:'The interviewer asks your salary expectation in the first round. What is the best handling?', o:['Give a precise number at once so that you appear more confident','Decline to discuss compensation at this stage of the process','Ask for 40 percent above your stipend as a negotiating anchor','Ask for the band and, if pressed, give a researched pay range'], c:3, why:'Redirecting once and then offering a researched range with reasoning keeps you in the process without anchoring low or pricing yourself out. Flat refusal reads as evasive and an arbitrary anchor invites a challenge you cannot justify.' },
  { q:'Which question asked BY the candidate at the end of a Big 4 audit interview is strongest?', o:['What is the appraisal cycle and when do promotions usually happen','What are the typical working hours during the busy audit season','How does the team allocate listed group work to new associates','Does the firm sponsor further qualifications such as CPA or DISA'], c:2, why:'A question about how work and exposure are allocated shows you are thinking about developing as an auditor and yields genuinely useful information. The others concern what you receive and are better raised once an offer exists.' },
  { q:'What most reliably makes an interview answer sound rehearsed rather than authentic?', o:['Polished generalities with no numbers, names or hesitation','Using the STAR structure to organise every answer you give','Pausing for a couple of seconds before you start to answer','Referring to the same engagement more than once in the interview'], c:0, why:'Authenticity comes from concrete detail such as figures, process names and the small friction of recalling a real event, all of which memorised answers lack. Structure and brief pauses improve delivery rather than harming it.' },
  { q:'Asked how you handle stress during a peak statutory season, which answer is strongest?', o:['I do not really feel stress, since I enjoy working under pressure','I listed deliverables weekly and flagged data delays in 48 hours','I manage it by working longer hours until the backlog is cleared','I rely on my team to share the load when I start falling behind'], c:1, why:'A specific system covering prioritisation, early escalation and sustainability shows learned coping behaviour rather than endurance. Denying stress lacks credibility and longer hours alone is the response firms are trying to move away from.' },
  { q:'Which behaviour most damages a candidate in a panel interview even when the technical content is correct?', o:['Speaking slightly faster than your usual conversational pace throughout','Resting your hands on the table for the whole of your answer','Asking for one question to be repeated during the interview','Addressing the whole answer to the partner and ignoring others'], c:3, why:'Ignoring panel members signals poor stakeholder awareness, and those members write assessments too, so the cost is immediate. Minor pace changes and a single clarification request are normal and not scored against you.' },
  { q:'You are asked about a time you failed to meet a deadline. Which structure gives the strongest answer?', o:['Explain why the deadline was unrealistic right from the start','Pick a case where you met the date after obtaining an extension','State the miss, its impact, your part in it and the fix made','Use a failure from college so that judgement is not questioned'], c:2, why:'Owning the miss, its impact and the systemic fix demonstrates the accountability the question is designed to test. Reframing a success as a failure or blaming the deadline avoids the question and panels see it instantly.' },
  { q:'Asked about your greatest strength for an audit role, which answer performs best?', o:['Scepticism: I traced 4 credit notes to Rs 22 lakh of discounts','I am very detail oriented and I am extremely hard working too','I am good with people and build client relationships very easily','I have excellent knowledge of the applicable accounting standards'], c:0, why:'Naming an audit relevant trait and proving it immediately with a specific engagement outcome makes the claim verifiable. Detail orientation and hard work are asserted by nearly every candidate and carry no discriminating value.' },
  { q:'What is the best approach when you genuinely do not know the answer to a technical question in a combined HR and technical round?', o:['Attempt a confident guess, since silence looks worse to a panel','Say you do not know, give your framework and how to confirm it','Say the topic never arose in articleship, so it was not taught','Redirect at once to a topic that you happen to know thoroughly'], c:1, why:'Showing the reasoning route and the verification step demonstrates what a firm needs from a junior facing unfamiliar issues daily. Guessing risks a wrong assertion made confidently, which is a worse signal in audit than not knowing.' },
  { q:'How should a candidate best handle a question about a six month gap between qualifying and applying?', o:['Avoid mentioning the gap and hope that nobody will notice it','Say you were freelancing in that time, even though you were not','Say the job market was poor, so no real opportunities existed','State the reason, say what you did with the time and move on'], c:3, why:'A brief factual explanation with evidence of productive use removes the concern within seconds and shows composure. Concealment fails once the timeline is examined and a fabricated engagement is a serious integrity risk.' },
  { q:'Which statement about answer length in Big 4 interviews is most accurate?', o:['Longer answers show deeper knowledge and panels prefer them','Keep every answer under 20 seconds so that you sound crisp','Aim for 60 to 120 seconds with a clear landing, then stop','Length is irrelevant provided the content is technically right'], c:2, why:'A tight answer with a defined ending invites the follow up questions where candidates actually differentiate themselves. Rambling dilutes the strongest point and very short answers deny the panel enough material to assess.' },
  { q:'You are asked where you see yourself in five years. Which answer is strongest for a Big 4 audit role?', o:['Progress to assistant manager with a sector focus, built here','Running my own practice within three years, using this as a step','I have not thought that far, I want to focus on the present','Moving to industry as a financial controller after two years'], c:0, why:'A path that develops within the firm and names a concrete milestone answers the underlying retention concern honestly. Announcing a plan to leave for practice or industry gives the panel a direct reason to reject.' },
  { q:'During the interview a partner challenges your answer aggressively and says your reasoning is wrong. Best response?', o:['Withdraw your position at once and simply agree with the partner','Ask which part he disputes, restate the basis and adjust if so','Hold the position firmly regardless, to show your conviction','Say your firm always applied this, so it must be the right view'], c:1, why:'Stress questions test whether you can defend a view on its basis and revise it on evidence rather than on hierarchy, which is core to audit judgement. Instant capitulation and rigid defence both fail to engage with the substance.' },
  { q:'Which preparation step most improves performance in a Big 4 behavioral round?', o:['Memorising model answers to the twenty most common questions','Reading the firm annual report cover to cover before the round','Practising a firm handshake and a confident seated position','Preparing 6 to 8 real engagement stories with figures in them'], c:3, why:'A bank of genuine detailed stories flexes across leadership, conflict, failure and initiative questions and always sounds authentic because it is real. Memorised answers collapse when a question is phrased unexpectedly.' }
];

MCQ_BANK['resume'] = [
  { q:'A Big 4 panel typically probes a CA fresher resume most aggressively on which element?', o:['The declaration and personal details block at the very end','The list of hobbies and outside interests that is included','The articleship claims, the only verifiable capability data','The formatting, spacing and font consistency of the document'], c:2, why:'Articleship claims are the only part of a fresher resume describing work actually performed, so panels test them for depth and authenticity. Personal details and hobbies rarely attract more than a passing question.' },
  { q:'Which articleship bullet is quantified in the way a Big 4 audit panel finds most useful?', o:['Audited revenue of a Rs 480 crore maker, testing 120 samples','Handled statutory audit of large manufacturing group companies','Responsible for various audit assignments as the firm required','Gained excellent exposure to auditing and financial reporting'], c:0, why:'Stating the balance size, the volume of work performed and the outcome you delivered gives the panel a defensible fact base to probe. Adjectives such as large and excellent convey nothing measurable.' },
  { q:'You cleared CA Final in the second attempt with an exemption in Financial Reporting. How should this appear on the resume?', o:['State only the qualification and year, omitting the exemption','State cleared in the second attempt, in order to look candid','List exemptions from every group and level, foundation upward','Show the qualification, month, year, marks and the exemption'], c:3, why:'A resume presents achievements factually, and attempt history is disclosed only where an application form specifically requires it, so volunteering it needlessly weakens the document. Listing every exemption from foundation onward dilutes the meaningful ones.' },
  { q:'For a fresher CA applying to Big 4 statutory audit, which section order is strongest?', o:['Personal details, hobbies, education, articleship and then skills','Summary, education, articleship, skills, then personal details','Articleship, hobbies, personal details and finally education','Achievements, hobbies, articleship and then education last'], c:1, why:'Qualification and articleship carry the decision weight for a fresher and must sit in the top half of page one, with personal details closing the document. Placing hobbies or personal details early wastes the highest attention area.' },
  { q:'Which set of resume keywords is most relevant for a statutory audit role in India?', o:['Tally, MS Office, hard working, team player, quick learner','GST returns, TDS filing, ROC compliance, income tax assessment','Ind AS, CARO 2020, SA 315, ICFR testing, listed entity audit','Budgeting, MIS reporting, variance analysis and cost control'], c:2, why:'Reporting framework, auditing standard and controls testing terms map directly to statutory audit work and are what screeners search for. Compliance and management accounting keywords point at a different role and soft skill adjectives are ignored.' },
  { q:'Which is the most serious red flag on a CA fresher resume from a Big 4 audit recruiter perspective?', o:['A claim to have independently finalised a listed audit report','A resume that runs to two pages rather than to a single page','Listing only three articleship clients rather than about ten','Including a professional summary that runs to four full lines'], c:0, why:'Claiming authority an article assistant cannot legally or practically hold destroys the credibility of every other claim on the page. Page count, client count and summary length are formatting preferences, not integrity concerns.' },
  { q:'How should a candidate describe an articleship firm that is small and not widely known?', o:['Describe it as an associate of a large international network','Give only the firm name with no surrounding context at all','Say the firm matches a Big 4 firm in terms of work quality','Give the name plus a line such as a 6 partner firm in Pune'], c:3, why:'A one line factual descriptor gives the panel the context needed to calibrate your exposure without inflating anything. Misstating a network affiliation is easily verified and is a disqualifying integrity issue.' },
  { q:'Which claim on a CA fresher resume must you be most prepared to defend in depth?', o:['Fluent in English and Hindi, with working knowledge of Marathi','Proficient in advanced Excel including Power Query analytics','Interested in reading, cricket and long distance running too','Completed the ICAI orientation and information technology course'], c:1, why:'A technical proficiency claim invites a detailed or live question, and failing to explain how you used Power Query on an engagement undermines your credibility. Languages, hobbies and mandatory ICAI programmes are rarely tested.' },
  { q:'How should a resume aimed at internal audit differ from one aimed at statutory audit?', o:['There is no real difference at all, since both are audit roles','The internal audit version should chiefly emphasise tax exposure','Internal leads with control matrices, statutory with Ind AS','The statutory version should emphasise cost savings delivered'], c:2, why:'Internal audit is assessed on process, control design and value adding recommendations while statutory audit is assessed on assertions, framework knowledge and reporting. Cost savings are an internal audit output and not a statutory auditor deliverable.' },
  { q:'You have a 14 month gap during CA Final preparation. What is the best resume handling?', o:['Show accurate dates and note full time CA Final preparation','Extend the articleship end date so the timeline looks whole','Leave dates off education so that the gap becomes invisible','Add an unpaid internship that you did not actually undertake'], c:0, why:'Accurate dates with a one line factual explanation removes the ambiguity that causes screeners to reject and shows nothing is being concealed. Altering or removing dates is caught at background verification and ends the candidacy.' },
  { q:'Which achievement statement is strongest on a CA fresher resume?', o:['Received appreciation from the partners for consistently good work','Always completed the assignments ahead of the agreed deadline','Recognised by several clients for conduct and diligence shown','Awarded best article of the year among 45 in the 2025 cycle'], c:3, why:'A named award with the comparison pool and the year is verifiable and genuinely differentiating. Unattributed appreciation and general reliability claims cannot be checked and nearly every candidate makes them.' },
  { q:'A recruiter spends roughly 20 to 30 seconds on the first pass of a resume. What follows from this for a CA fresher?', o:['Use a larger font size so that more content is read in time','Put status, firm and two or three quantified facts up front','Add colour and graphics so that the resume attracts attention','Write a detailed objective paragraph about your career goals'], c:1, why:'The top third of page one is what actually gets read on a first pass, so decision relevant facts must sit there. Graphics can break applicant tracking parsing and a long objective consumes prime space without conveying evidence.' },
  { q:'What is the best way to present client exposure when you worked on 12 engagements during articleship?', o:['List all 12 clients with their full names and their turnover figures','List only the single largest client so the impact is maximised','Detail 3 or 4 engagements by sector, scale and your own scope','List the clients by initials to show volume yet stay confidential'], c:2, why:'Depth on a few representative engagements plus a summarising line shows breadth and substance while respecting confidentiality. A full list of names and financials creates a confidentiality problem and says nothing about your role.' },
  { q:'How should Excel and data analytics skills be presented on a CA fresher resume?', o:['Advanced Excel: INDEX MATCH, SUMIFS and pivots, used on 5 audits','Excel: Expert, presented alongside a five star rating graphic','Well versed in MS Office including Word, Excel and PowerPoint','Working knowledge of computers and of accounting software here'], c:0, why:'Naming specific functions plus where they were actually used turns an unverifiable claim into evidence a panel can probe productively. Star ratings and generic MS Office lines carry no information about actual capability.' },
  { q:'Which statement about photographs and personal details on a CA resume in India is most accurate?', o:['A photograph is mandatory for every Big 4 application made in India','All personal details including family background help connect','Personal details should be omitted, following global practice','Date of birth, address and contact are usual; omit caste details'], c:3, why:'Indian resumes conventionally carry basic identifiers and contact details, while marital status, caste, religion and family occupation are irrelevant to selection and better omitted. Photographs are optional and rarely required by Big 4 processes.' },
  { q:'Your resume says exposure to Ind AS 115 implementation. What is the most likely follow up and how should you prepare?', o:['Nothing at all, since panels ignore the phrase exposure to Ind AS','Be ready to walk the five step model as applied at your client','Be ready to recite the full text of the standard from memory','Be ready to compare Ind AS 115 with US GAAP in some fine detail'], c:1, why:'Panels test a standard claim by asking how you applied it on a real engagement, so the client specific judgement is the answer that holds up. Recitation without application is exactly what exposes a padded resume.' },
  { q:'Which resume phrasing best avoids overclaiming while still showing substantive involvement?', o:['Finalised the consolidated statements of a six entity group','Assisted with the audit of the consolidated financial statements','Prepared eliminations across 6 entities, reviewed by the manager','Handled the whole group consolidation exercise independently myself'], c:2, why:'Naming the exact deliverable you produced while acknowledging the review layer is accurate and substantive, giving the panel real content to explore. Assisted with is too vague to score and finalised or independently overstates an article role.' },
  { q:'You are applying to Big 4 audit but your articleship was 70 percent direct tax. Best resume strategy?', o:['Keep the tax work but lead with the audit engagements in detail','Remove all the tax work so the profile reads as pure audit','Present the tax work in audit terms so it reads as audit work','Apply to the tax practice altogether instead of the audit practice'], c:0, why:'Honest reordering with richer detail on the audit work reshapes emphasis without misstatement, and tax knowledge genuinely supports auditing current tax, deferred tax and contingencies. Deleting real experience creates an unexplained gap and relabelling tax as audit is misrepresentation.' }
];

function areaAccent(area){ return ACCENTS[CAT_BY_ID[area.cat].accent]; }
function areaMeta(area){
  const saved=(store.areas&&store.areas[area.id])||{};
  return Object.assign({},area,{
    title:(saved.title||area.title).trim(),
    blurb:(saved.blurb||area.blurb).trim(),
    icon:(saved.icon||area.icon).trim()
  });
}

function load(){
  try {
    const raw = JSON.parse(localStorage.getItem(KEY)) || {};
    return { q: raw.q || {}, custom: raw.custom || {}, areas: raw.areas || {}, order: raw.order || {}, attach: raw.attach || {}, trash: raw.trash || [], mcq: raw.mcq || {}, theme: raw.theme || 'dark' };
  } catch { return { q:{}, custom:{}, areas:{}, order:{}, attach:{}, trash:[], mcq:{}, theme:'dark' }; }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(store)); scheduleSync(); }
function qs(id){ return store.q[id] || (store.q[id] = {}); }

/* All questions incl. custom, for a given area */
function areaQuestions(area){
  const custom = (store.custom[area.id] || []).map(c => ({...c, _custom:true}));
  return [...area.questions, ...custom];
}
/* Apply the user's saved drag order (unknown/new ids keep default order, appended) */
function orderedAreaQuestions(area){
  const list = areaQuestions(area);
  const ord = store.order && store.order[area.id];
  if (!ord || !ord.length) return list;
  const map = Object.fromEntries(list.map(q => [q.id, q]));
  const result = ord.filter(id => map[id]).map(id => map[id]);
  const seen = new Set(ord);
  list.forEach(q => { if (!seen.has(q.id)) result.push(q); });
  return result;
}
function allQuestions(){
  let list = [];
  AREAS.forEach(a => areaQuestions(a).forEach(q => list.push({area:a, q})));
  return list;
}
function getText(q, field){ // field 'q' or 'a'
  const st = store.q[q.id] || {};
  if (field === 'q') return st.qOverride != null ? st.qOverride : q.q;
  if (field === 'a') return st.aOverride != null ? st.aOverride : q.a;
}

/* Metrics */
function metrics(list){
  let total=0, done=0, flag=0;
  list.forEach(({q}) => { total++; const s = store.q[q.id]||{}; if(s.done) done++; if(s.flag) flag++; });
  return { total, done, flag, todo: total-done, pct: total? Math.round(done/total*100):0 };
}

/* ============================================================

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function attrEsc(s){ return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
/* Just escape — newlines/spacing are preserved by `whitespace-pre-wrap` on the container,
   so pasted paragraphs, blank lines and indentation render exactly as entered. */
function fmt(s){ return esc(s); }
const RICH_PREFIX='<!--mb4-rich:v1-->';
const RICH_TAGS=new Set(['P','BR','DIV','STRONG','B','EM','I','U','S','H2','H3','UL','OL','LI','BLOCKQUOTE','A','TABLE','THEAD','TBODY','TFOOT','TR','TH','TD','SPAN','MARK','SUB','SUP','IMG']);
function isRichAnswer(s){ return typeof s==='string' && s.startsWith(RICH_PREFIX); }
function richBody(s){ return isRichAnswer(s) ? s.slice(RICH_PREFIX.length) : ''; }
function plainToRichHTML(s){ return esc(s).replace(/\r\n?/g,'\n').replace(/\n/g,'<br>'); }
function looksLikeMarkdown(s){
  const text=String(s||'');
  return /\*\*[^*\n]+\*\*|__[^_\n]+__|(?:^|\n)#{1,3}\s|(?:^|\n)\s*[-*]\s+|(?:^|\n)\s*\d+[.)]\s+/.test(text);
}
function markdownInlineHTML(text){
  let s=esc(text);
  s=s.replace(/\*\*([^*\n]+?)\*\*/g,'<strong>$1</strong>').replace(/__([^_\n]+?)__/g,'<strong>$1</strong>');
  s=s.replace(/(^|[\s(])\*([^*\n]+?)\*(?=$|[\s).,;:!?])/g,'$1<em>$2</em>');
  return s.replace(/\*\*/g,'').replace(/__/g,'');
}
function markdownToRichHTML(text){
  const raw=String(text||'').replace(/\r\n?/g,'\n').trim();
  if(!raw) return '';
  const wholeTable=markdownTableHTML(raw); if(wholeTable) return sanitizeRichHTML(wholeTable);
  const out=[]; let listType=null;
  const closeList=()=>{ if(listType){ out.push(`</${listType}>`); listType=null; } };
  raw.split('\n').forEach(line=>{
    const trimmed=line.trim();
    if(!trimmed){ closeList(); return; }
    const bullet=trimmed.match(/^[-*]\s+(.+)$/), numbered=trimmed.match(/^\d+[.)]\s+(.+)$/);
    if(bullet||numbered){
      const type=bullet?'ul':'ol'; if(listType!==type){ closeList(); listType=type; out.push(`<${type}>`); }
      out.push(`<li>${markdownInlineHTML((bullet||numbered)[1])}</li>`); return;
    }
    closeList();
    const heading=trimmed.match(/^(#{1,3})\s+(.+)$/);
    if(heading){ out.push(`<${heading[1].length===1?'h2':'h3'}>${markdownInlineHTML(heading[2])}</${heading[1].length===1?'h2':'h3'}>`); return; }
    const quote=trimmed.match(/^>\s?(.+)$/);
    if(quote){ out.push(`<blockquote>${markdownInlineHTML(quote[1])}</blockquote>`); return; }
    out.push(`<p>${markdownInlineHTML(trimmed)}</p>`);
  });
  closeList();
  return sanitizeRichHTML(out.join(''));
}
function aiRichAnswer(text){ return RICH_PREFIX+markdownToRichHTML(text); }
function aiPlainText(text){ return answerPlainText(aiRichAnswer(text)); }
function convertMarkdownMarkers(root){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[]; while(walker.nextNode()) if(/\*\*[^*\n]+\*\*|__[^_\n]+__/.test(walker.currentNode.nodeValue||'')) nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    const temp=document.createElement('span'); temp.innerHTML=markdownInlineHTML(node.nodeValue||'');
    node.replaceWith(...temp.childNodes);
  });
}
function safeRichColor(value){
  const v=String(value||'').trim().toLowerCase();
  if(/^#[0-9a-f]{3,8}$/.test(v) || /^rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}(?:\s*,\s*(?:0|1|0?\.\d+))?\s*\)$/.test(v)) return v;
  return ['black','white','red','orange','yellow','green','blue','purple','gray','grey','transparent'].includes(v) ? v : '';
}
function safeRichSize(value){
  const v=String(value||'').trim().toLowerCase();
  return ['0.78rem','0.88rem','1rem','1.15rem','1.35rem','1.6rem'].includes(v) ? v : '';
}
function sanitizeRichHTML(html){
  const tpl=document.createElement('template');
  tpl.innerHTML=String(html||'');
  tpl.content.querySelectorAll('script,style,iframe,object,embed,form,input,button,textarea,select,meta,link,svg,canvas,video,audio').forEach(el=>el.remove());
  [...tpl.content.querySelectorAll('*')].forEach(el=>{
    if(!tpl.content.contains(el)) return;
    const tag=el.tagName;
    if(!RICH_TAGS.has(tag)){ el.replaceWith(...el.childNodes); return; }
    const href=tag==='A' ? (el.getAttribute('href')||'').trim() : '';
    const imageId=tag==='IMG' ? (el.getAttribute('data-mb4-image')||'').trim() : '';
    const imageAlt=tag==='IMG' ? (el.getAttribute('alt')||'Snapshot').slice(0,160) : '';
    const colspan=(tag==='TD'||tag==='TH') ? el.getAttribute('colspan') : null;
    const rowspan=(tag==='TD'||tag==='TH') ? el.getAttribute('rowspan') : null;
    const color=safeRichColor(el.style&&el.style.color);
    const background=safeRichColor(el.style&&(el.style.backgroundColor||el.style.background));
    const fontSize=safeRichSize(el.style&&el.style.fontSize);
    [...el.attributes].forEach(a=>el.removeAttribute(a.name));
    if(tag==='A' && /^(https?:|mailto:)/i.test(href)){
      el.setAttribute('href',href); el.setAttribute('target','_blank'); el.setAttribute('rel','noopener noreferrer');
    }
    if((tag==='TD'||tag==='TH') && /^\d{1,2}$/.test(colspan||'') && +colspan<=20) el.setAttribute('colspan',colspan);
    if((tag==='TD'||tag==='TH') && /^\d{1,2}$/.test(rowspan||'') && +rowspan<=50) el.setAttribute('rowspan',rowspan);
    if(color) el.style.color=color;
    if(background) el.style.backgroundColor=background;
    if(fontSize) el.style.fontSize=fontSize;
    if(tag==='IMG'){
      if(!/^att-\d+-\d+$/.test(imageId)){ el.remove(); return; }
      el.setAttribute('data-mb4-image',imageId);
      el.setAttribute('alt',imageAlt||'Snapshot');
      el.setAttribute('loading','lazy');
    }
  });
  const walker=document.createTreeWalker(tpl.content,NodeFilter.SHOW_COMMENT);
  const comments=[]; while(walker.nextNode()) comments.push(walker.currentNode);
  comments.forEach(n=>n.remove());
  return tpl.innerHTML.trim();
}
function richHTMLWithImages(html){
  const box=document.createElement('div'); box.innerHTML=sanitizeRichHTML(html);
  convertMarkdownMarkers(box);
  box.querySelectorAll('img[data-mb4-image]').forEach(img=>{ img.src=fileViewUrl(img.getAttribute('data-mb4-image')); });
  return box.innerHTML;
}
function answerToEditorHTML(s){ return isRichAnswer(s) ? richHTMLWithImages(richBody(s)) : (looksLikeMarkdown(s)?markdownToRichHTML(s):plainToRichHTML(s)); }
function fmtAnswer(s){ return isRichAnswer(s) ? richHTMLWithImages(richBody(s)) : (looksLikeMarkdown(s)?markdownToRichHTML(s):fmt(s)); }
function answerPlainText(s){
  if(!isRichAnswer(s) && !looksLikeMarkdown(s)) return String(s==null?'':s);
  const box=document.createElement('div'); box.innerHTML=isRichAnswer(s)?sanitizeRichHTML(richBody(s)):markdownToRichHTML(s);
  convertMarkdownMarkers(box);
  box.querySelectorAll('br').forEach(el=>el.replaceWith('\n'));
  box.querySelectorAll('td,th').forEach(el=>el.append('\t'));
  box.querySelectorAll('tr,p,div,h2,h3,li,blockquote').forEach(el=>el.append('\n'));
  return (box.textContent||'').replace(/\t+\n/g,'\n').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
function markdownTableHTML(text){
  const lines=String(text||'').trim().split(/\r?\n/).filter(line=>line.trim());
  if(lines.length<2) return '';
  const cells=line=>line.trim().replace(/^\||\|$/g,'').split('|').map(v=>v.trim());
  const divider=cells(lines[1]);
  if(divider.length<2 || !divider.every(v=>/^:?-{3,}:?$/.test(v))) return '';
  const rows=lines.map(cells); const width=rows[0].length;
  if(width<2 || rows.slice(2).some(r=>r.length!==width)) return '';
  return `<table><thead><tr>${rows[0].map(v=>`<th>${esc(v)}</th>`).join('')}</tr></thead><tbody>${rows.slice(2).map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

/* ============================================================
   CLOUD SYNC (Netlify Functions + Blobs) + ATTACHMENTS
   Single SHARED workspace — no sync code. Everyone with the link reads and

const ACCOUNT_URL='/.netlify/functions/account';

/* ---- lightweight private analytics (no third party, no cookies) ---- */
function visitorId(){
  try{
    let v=localStorage.getItem('mb4_vid');
    if(!v){ v=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2)); localStorage.setItem('mb4_vid',v); }
    return v;
  }catch(_){ return ''; }
}
function campaignRef(){
  try{
    const m=/[?&]ref=([A-Za-z0-9_.-]{1,40})/.exec(location.search||'');
    if(m){ sessionStorage.setItem('mb4_src', m[1]); return m[1]; }
    return sessionStorage.getItem('mb4_src')||'';
  }catch(_){ return ''; }
}
function track(event, extra){
  try{
    const body=Object.assign({event, vid:visitorId(), ref:campaignRef()}, extra||{});
    const blob=new Blob([JSON.stringify(body)],{type:'application/json'});
    if(navigator.sendBeacon){ navigator.sendBeacon(STATS_URL, blob); }
    else { fetch(STATS_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),keepalive:true}).catch(()=>{}); }
  }catch(_){ }
}
const FILES_URL='/.netlify/functions/files';
const PORTAL_URL='/.netlify/functions/portal';

const AUTH_KEY='mb4_auth';

const SYNC_ON = location.protocol==='http:' || location.protocol==='https:';

/* ---- auth state (access code = member; passphrase = admin) ---- */
let auth={ token:null, role:'none', name:null, email:null, expiresAt:null };

/* ---- sync status pill ---- */
function setSyncStatus(state){
  const el=document.getElementById('syncStatus'); if(!el) return;
  const map={ saved:['Synced','text-emerald-500'], syncing:['Syncing…','text-amber-500'], offline:['Offline','text-rose-500'], local:['Local','text-slate-400'] };
  const [txt,cls]=map[state]||map.local;

  const dot=document.getElementById('syncDot'); if(dot) dot.className='h-2 w-2 rounded-full '+cls.replace('text-','bg-');

/* ---- content (admin-owned) + personal state (per-user) split ---- */
function buildContent(){
  const q={};
  for(const id in store.q){ const v=store.q[id]||{}; const c={}; if(v.qOverride!=null)c.qOverride=v.qOverride; if(v.aOverride!=null)c.aOverride=v.aOverride; if(Array.isArray(v.examples))c.examples=v.examples; if(Object.keys(c).length)q[id]=c; }
  return { q, custom:store.custom||{}, areas:store.areas||{}, order:store.order||{}, attach:store.attach||{}, trash:store.trash||[] };
}
function buildPstate(){
  const q={};
  for(const id in store.q){ const v=store.q[id]||{}; const p={}; if(v.flag)p.flag=true; if(v.done)p.done=true; if(v.note)p.note=v.note; if(Object.keys(p).length)q[id]=p; }
  return { q, mcq: store.mcq || {} };
}
function scheduleSync(){ if(!SYNC_ON||!signedIn()) return; clearTimeout(_syncTimer); _syncTimer=setTimeout(pushNow,1000); }
function pushNow(){
  if(!SYNC_ON||!signedIn()) return Promise.resolve();
  const cp=JSON.stringify(buildContent()), pp=JSON.stringify(buildPstate());
  const jobs=[];
  if(isAdmin() && cp!==_lastContent){ _lastContent=cp; jobs.push(fetch(CONTENT_URL,{method:'POST',headers:{'content-type':'application/json','x-auth':auth.token},body:JSON.stringify({content:JSON.parse(cp)})}).then(r=>{ if(!r.ok) throw 0; })); }
  if(pp!==_lastPstate){ _lastPstate=pp; jobs.push(fetch(PSTATE_URL,{method:'POST',headers:{'content-type':'application/json','x-auth':auth.token},body:JSON.stringify({pstate:JSON.parse(pp)})}).then(r=>{ if(!r.ok) throw 0; })); }
  if(!jobs.length) return Promise.resolve();
  setSyncStatus('syncing');
  return Promise.all(jobs).then(()=>setSyncStatus('saved')).catch(()=>{ _lastContent=null; _lastPstate=null; setSyncStatus('offline'); });
}
function applyCloud(content, ps, mcq){
  content=content||{q:{},custom:{},areas:{},order:{},attach:{},trash:[]};
  ps=ps||{};
  store.q={};
  store.mcq=mcq||{};
  for(const id in (content.q||{})) store.q[id]=Object.assign({}, content.q[id]);
  for(const id in ps){ store.q[id]=Object.assign(store.q[id]||{}, ps[id]); }
  store.custom=content.custom||{}; store.areas=content.areas||{}; store.order=content.order||{}; store.attach=content.attach||{}; store.trash=content.trash||[];
  _lastContent=JSON.stringify(buildContent()); _lastPstate=JSON.stringify(buildPstate());
  localStorage.setItem(KEY, JSON.stringify(store));
}
function loadFromCloud(){
  if(!SYNC_ON||!signedIn()) return Promise.resolve();
  setSyncStatus('syncing');
  return Promise.all([
    fetch(CONTENT_URL,{headers:{'x-auth':auth.token}}).then(r=>r.json()).catch(()=>null),
    fetch(PSTATE_URL,{headers:{'x-auth':auth.token}}).then(r=>r.json()).catch(()=>null)
  ]).then(([c,p])=>{
    applyCloud(c&&c.content, p&&p.pstate&&p.pstate.q, p&&p.pstate&&p.pstate.mcq);
    setSyncStatus('saved'); refresh();
  }).catch(()=>setSyncStatus('offline'));
}

/* ---- attachment file ops (cloud) ---- */
function fileViewUrl(id,dl){ return FILES_URL+'?auth='+encodeURIComponent(auth.token||'')+'&id='+encodeURIComponent(id)+(dl?'&dl=1':''); }
function attListFor(slot){ return (store.attach&&store.attach[slot])||[]; }
function attachTo(slot,qid,file){
  const id='att-'+Date.now()+'-'+Math.round(Math.random()*1e9);

    .then(()=>{ const meta={id,name:file.name,type,size:file.size}; if(!store.attach) store.attach={}; (store.attach[slot]||(store.attach[slot]=[])).push(meta); save(); return meta; });

function removeAttach(id,slot){

  const it=arr.find(a=>a.id===id);

/* ---- minimal ZIP (store method) for bulk download / backup ---- */
function _crc32(u8){
  if(!_crc32.t){ const t=[]; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } _crc32.t=t; }
  const t=_crc32.t; let crc=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) crc=t[(crc^u8[i])&0xFF]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
const _u16=n=>[n&0xFF,(n>>>8)&0xFF];
const _u32=n=>[n&0xFF,(n>>>8)&0xFF,(n>>>16)&0xFF,(n>>>24)&0xFF];
function makeZip(files){ // files: [{name, data:Uint8Array}]
  const enc=new TextEncoder(); const chunks=[]; const central=[]; let offset=0;
  const push=arr=>{ const u=arr instanceof Uint8Array?arr:new Uint8Array(arr); chunks.push(u); offset+=u.length; };
  for(const f of files){
    const nameBytes=enc.encode(f.name); const crc=_crc32(f.data); const size=f.data.length; const localOffset=offset;
    push([].concat(_u32(0x04034b50),_u16(20),_u16(0x0800),_u16(0),_u16(0),_u16(0),_u32(crc),_u32(size),_u32(size),_u16(nameBytes.length),_u16(0)));
    push(nameBytes); push(f.data);
    central.push({nameBytes,crc,size,localOffset});
  }
  const cdStart=offset;
  for(const c of central){
    push([].concat(_u32(0x02014b50),_u16(20),_u16(20),_u16(0x0800),_u16(0),_u16(0),_u16(0),_u32(c.crc),_u32(c.size),_u32(c.size),_u16(c.nameBytes.length),_u16(0),_u16(0),_u16(0),_u16(0),_u32(0),_u32(c.localOffset)));
    push(c.nameBytes);
  }
  push([].concat(_u32(0x06054b50),_u16(0),_u16(0),_u16(central.length),_u16(central.length),_u32(offset-cdStart),_u32(cdStart),_u16(0)));
  return new Blob(chunks,{type:'application/zip'});
}

/* ---- Text-to-speech: listen to Q&A (prefers an Indian male English voice) ---- */
let _voices=[], speakingId=null, _ttsKeep=null;
function _loadVoices(){ try{ _voices=window.speechSynthesis.getVoices()||[]; }catch(e){ _voices=[]; } }
if('speechSynthesis' in window){ _loadVoices(); try{ window.speechSynthesis.onvoiceschanged=_loadVoices; }catch(e){} }
function pickVoice(){
  if(!_voices.length) _loadVoices();
  const v=_voices; if(!v.length) return null;
  const f=fn=>v.find(fn);
  return f(x=>/en[-_]IN/i.test(x.lang)&&/male|ravi|prabhat|hemant|madhur/i.test(x.name))
    || f(x=>/ravi|prabhat|hemant/i.test(x.name))
    || f(x=>/en[-_]IN/i.test(x.lang))
    || f(x=>/india/i.test(x.name))
    || f(x=>/^en/i.test(x.lang)&&/male/i.test(x.name))
    || f(x=>/^en[-_](gb|us|au)/i.test(x.lang))
    || f(x=>/^en/i.test(x.lang))
    || v[0];
}
function stopSpeech(){ try{ window.speechSynthesis.cancel(); }catch(e){} speakingId=null; if(_ttsKeep){clearInterval(_ttsKeep);_ttsKeep=null;} updateSpeakButtons(); }
function speakText(id, text){
  if(!('speechSynthesis' in window)){ alert('Sorry, this browser does not support reading text aloud.'); return; }
  const synth=window.speechSynthesis;
  if(speakingId===id){ stopSpeech(); return; }   // toggle off
  synth.cancel();
  const voice=pickVoice();
  const sentences=(text.replace(/\s+/g,' ').match(/[^.!?]+[.!?]+|\S[^.!?]*$/g)||[text]);
  const chunks=[]; let buf='';
  sentences.forEach(c=>{ if((buf+' '+c).length>210){ if(buf) chunks.push(buf.trim()); buf=c; } else buf=buf?buf+' '+c:c; });
  if(buf.trim()) chunks.push(buf.trim());
  speakingId=id;
  chunks.forEach((c,i)=>{ const u=new SpeechSynthesisUtterance(c); if(voice){ u.voice=voice; u.lang=voice.lang; } u.rate=0.97; u.pitch=1;
    if(i===chunks.length-1) u.onend=()=>{ if(speakingId===id) stopSpeech(); };
    u.onerror=()=>{}; synth.speak(u);
  });
  if(_ttsKeep) clearInterval(_ttsKeep);
  _ttsKeep=setInterval(()=>{ if(!synth.speaking){ clearInterval(_ttsKeep); _ttsKeep=null; return; } try{ synth.resume(); }catch(e){} }, 9000);
  updateSpeakButtons();
}
function updateSpeakButtons(){
  document.querySelectorAll('[data-action="speak"]').forEach(b=>{ const on=b.dataset.id===speakingId; b.classList.toggle('text-rose-500',on); b.classList.toggle('bg-rose-500/10',on); b.title=on?'Stop':'Listen'; });
}

  const trash=(store.trash||[]).slice().sort((a,b)=>(b.deletedAt||0)-(a.deletedAt||0));
  if(!trash.length) return '';
  const rows=trash.map(t=>{

  }).join('');
  return `<div class="mt-6">
