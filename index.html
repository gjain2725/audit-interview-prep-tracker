/* ============================================================
   CHANGE HISTORY (versioned snapshots · restore/undo)
   ============================================================ */
function relTime(ts){ if(!ts) return ''; const s=Math.max(0,Math.round((Date.now()-ts)/1000)); if(s<60)return s+'s ago'; const m=Math.round(s/60); if(m<60)return m+'m ago'; const h=Math.round(m/60); if(h<24)return h+'h ago'; return Math.round(h/24)+'d ago'; }
function absTime(ts){ try{ return new Date(ts).toLocaleString(); }catch(e){ return ''; } }
function statLabel(s){ if(!s) return ''; const p=[]; if(s.edits)p.push(s.edits+' edited'); if(s.flags)p.push(s.flags+' flagged'); if(s.done)p.push(s.done+' done'); if(s.notes)p.push(s.notes+' noted'); p.push((s.files||0)+' file'+((s.files===1)?'':'s')); if(s.trash)p.push(s.trash+' trashed'); return p.join(' · '); }

function renderHistory(){
  const app=document.getElementById('app');
  app.innerHTML=`
    <a href="#/" class="inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 dark:text-slate-400 hover:text-brand-500 mb-4 transition">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg> Back to areas
    </a>
    <div class="fade rounded-2xl p-5 sm:p-6 mb-5 bg-white/75 dark:bg-white/[.04] glass border border-slate-200/70 dark:border-white/10 shadow-sm">
      <div class="flex items-start gap-4">
        <span class="h-14 w-14 grid place-items-center rounded-2xl bg-violet-500/10 ring-1 ring-violet-400/25 text-2xl shrink-0">🕑</span>
        <div class="flex-1 min-w-0">
          <h1 class="font-display text-xl sm:text-2xl font-extrabold tracking-tight">Change History</h1>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Every save is snapshotted. Restore any version to undo changes — restoring is itself undoable, and files come back too.</p>
        </div>
      </div>
    </div>
    <div id="histList" class="space-y-2"><div class="text-center py-10 text-slate-400">Loading history…</div></div>
  `;
  if(!SYNC_ON){ document.getElementById('histList').innerHTML='<div class="text-center py-10 text-slate-400">History needs the online site.</div>'; return; }
  fetch('/.netlify/functions/history?code='+encodeURIComponent(syncCode)).then(r=>r.json()).then(d=>{
    const versions=(d&&d.versions)||[];
    const el=document.getElementById('histList'); if(!el) return;
    if(!versions.length){ el.innerHTML='<div class="text-center py-10 text-slate-400"><p class="text-3xl mb-2">🕑</p><p class="font-semibold">No history yet.</p><p class="text-sm">Make a change and it will be versioned here.</p></div>'; return; }
    el.innerHTML=versions.map((v,i)=>`
      <div class="flex items-center gap-3 p-3.5 rounded-xl border ${i===0?'border-violet-400/40 bg-violet-500/5':'border-slate-200/70 dark:border-white/10 bg-white/60 dark:bg-white/[.03]'} glass">
        <span class="h-9 w-9 grid place-items-center rounded-lg bg-violet-500/10 text-violet-500 shrink-0 text-sm font-bold">${i===0?'●':versions.length-i}</span>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold">${relTime(v.ts)} ${i===0?'<span class="text-[10px] px-1.5 py-0.5 rounded-full bg-violet-500/15 text-violet-600 dark:text-violet-300 font-bold ml-1">CURRENT</span>':''}</p>
          <p class="text-[11px] text-slate-400 truncate">${absTime(v.ts)} · ${esc(statLabel(v.s))}</p>
        </div>
        ${i===0?'':`<button data-action="hist-restore" data-ts="${v.ts}" class="px-3 py-2 rounded-lg text-xs font-semibold border border-violet-400/40 text-violet-600 dark:text-violet-300 bg-violet-500/5 shrink-0">↩ Restore</button>`}
      </div>`).join('');
  }).catch(()=>{ const el=document.getElementById('histList'); if(el) el.innerHTML='<div class="text-center py-10 text-rose-400">Could not load history — check your connection.</div>'; });
}
function restoreVersion(ts){
  if(!confirm('Restore your tracker to this version?\n\nYour current state is saved as a new version first, so you can undo this restore too.')) return;
  setSyncStatus('syncing');
  fetch('/.netlify/functions/history?code='+encodeURIComponent(syncCode)+'&ts='+encodeURIComponent(ts)).then(r=>r.json()).then(snap=>{
    if(!snap||!snap.data){ alert('Could not load that version.'); setSyncStatus('offline'); return; }
    adopt(snap.data); _lastPayload=null;
    pushNow().then(()=>{ setSyncStatus('saved'); location.hash='#/'; refresh(); alert('Restored to '+absTime(ts)+' ✓'); });
  }).catch(()=>{ alert('Restore failed — check your connection.'); setSyncStatus('offline'); });
}

/* wire the shared file picker + manual refresh button */
(function(){
  const fi=document.getElementById('fileInput');
  fi.addEventListener('change',()=>{
    const files=[...fi.files]; if(!files.length){ return; }
    setSyncStatus('syncing');
    if(fileMode==='replace'){
      const targets=replaceTargets.slice(); replaceTargets=[]; fileMode='attach';
      const n=Math.min(files.length, targets.length);
      Promise.all(targets.slice(0,n).map((t,i)=>replaceAttach(t.id,t.slot,files[i])))
        .then(()=>{ fi.value=''; fi.multiple=true; refresh(); pushNow(); })
        .catch(()=>{ alert('Replace failed. Check your connection and try again.'); fi.value=''; fi.multiple=true; refresh(); });
      return;
    }
    if(!pendingSlot){ fi.value=''; return; }
    Promise.all(files.map(f=>attachTo(pendingSlot,pendingQid,f)))
      .then(()=>{ fi.value=''; refresh(); pushNow(); })
      .catch(()=>{ alert('Sorry, uploading the attachment failed. Check your connection and try again.'); fi.value=''; refresh(); });
  });
  // "Sync" button now just pulls the latest shared data on demand
  const sb=document.getElementById('syncBtn'); if(sb) sb.addEventListener('click',()=>{ if(SYNC_ON) pullAndMerge(true); });
})();

   ROUTER
   ============================================================ */
function router(){
  const hash = location.hash || '#/';
  const m = hash.match(/^#\/a\/([\w-]+)/);
  if(hash!=='#/admin'&&adminLiveTimer){ clearInterval(adminLiveTimer); adminLiveTimer=null; }
  track('land');
  if (m) track('view_area');
  else if (hash === '#/request') track('view_request');
  window.scrollTo({top:0});
  stopSpeech();   // stop any audio when navigating
  renderHeaderControls();
  if (!authed()){
    // Everyone must have an account. Free accounts (role 'free') may browse the
    // free tier; true guests are sent to the gate to sign up or log in.
    if (hash === '#/request') { renderRequest(); return; }
    if (auth.role === 'free'){
      if (hash === '#/questions') { renderQuestions(); return; }
      if (m && AREA_BY_ID[m[1]]) { renderArea(AREA_BY_ID[m[1]]); return; }
      if (hash === '#/' || hash === '') { renderQuestions(); return; }
    }
    renderGate();
    return;
  }
  if (hash === '#/request') { renderRequest(); }
  else if (hash === '#/admin') { renderAdmin(); }
  else if (hash === '#/referrals') { if(isAdmin()){ renderReferrals(); } else { location.hash='#/'; renderHome(); } }
  else if (hash === '#/leads') { if(isAdmin()){ renderLeads(); } else { location.hash='#/'; renderHome(); } }
  else if (hash === '#/stats') { if(isAdmin()){ renderStats(); } else { location.hash='#/'; renderHome(); } }
  else if (hash === '#/profile') { renderProfile(); }
  else if (hash === '#/subscription') { renderSubscription(); }
  else if (hash === '#/mock-interview') { renderMockInterview(); }
  else if (hash === '#/estimator') { renderSalaryEstimator(); }
  else if (hash === '#/ats-scanner') { renderAtsScanner(); }
  else if (hash === '#/flashcards') { renderFlashcards(); }
  else if (hash === '#/round-checklist') { renderRoundChecklist(); }
  else if (hash === '#/pdf-generator') { renderPdfGenerator(); }
  else if (hash === '#/interviews') { renderInterviews(); }
  else if (hash === '#/queries') { renderQueries(); }
  else if (hash === '#/announcements') { renderAnnouncements(); }
  else if (hash === '#/notifications') { renderNotifications(); }
  else if (hash === '#/questions') { renderQuestions(); }
  else if (hash === '#/vault') { if(isAdmin()){ vaultSel=new Set(); renderVault(); } else { location.hash='#/'; renderHome(); } }
  else if (m && AREA_BY_ID[m[1]]) renderArea(AREA_BY_ID[m[1]]);
  else renderHome();
}
window.addEventListener('hashchange', router);

function initGoogleAuth(attempt=0){
  const container=document.getElementById('googleBtnContainer');
  if(!container) return;
  if(window.google && google.accounts && google.accounts.id){
    try {
      container.innerHTML='';
      google.accounts.id.initialize({
        client_id: "415640736608-v21kq5d32csvtqovptdcg1l4ckdjesjt.apps.googleusercontent.com",
        callback: handleGoogleLogin
      });
      google.accounts.id.renderButton(container, {
        theme: "dark",
        size: "large",
        width: "320",
        text: "signin_with",
        shape: "pill"
      });
      const status=document.getElementById('googleBtnStatus');
      if(status) status.remove();
    } catch(e){ console.error('GSI Init Error:', e); }
    return;
  }
  if(attempt<20) setTimeout(()=>initGoogleAuth(attempt+1),250);
  else {
    const status=document.getElementById('googleBtnStatus');
    if(status) status.textContent='Google sign-in could not load. Please use your access code.';
  }
}

function triggerGoogleSignIn(){
  if(window.google && google.accounts && google.accounts.id){
    google.accounts.id.prompt();
  } else {
    showLoginErr('Google Identity Services script is loading or blocked. Please use Access Code or try again in a moment.');
  }
}

function handleGoogleLogin(response){
  if(!response || !response.credential) return;
  const btn=document.getElementById('loginSubmitBtn');
  if(btn){ btn.disabled=true; }
  acct('google-login',{ credential: response.credential, device: getDeviceId() }).then(r=>{
    if(!r || !r.ok){
      if(r && r.error === 'unregistered'){
        showLoginErr(`Google email (${r.email}) is not registered yet. Click "Get Access" below to request an account.`);
      } else {
        showLoginErr((r && r.error) || 'Google Sign-In failed.');
      }
      if(btn){ btn.disabled=false; }
      return;
    }
    auth={ token: r.token, role: r.role, name: r.name, email: r.email||null, expiresAt: r.expiresAt||null, needsPhone: !!r.needsPhone };
    saveAuth();
    if(r.role==='free') track('free_signup'); else track('login');
    renderHeaderControls();
    if(r.role==='admin'){ location.hash='#/admin'; }
    else if(r.role==='free'){ location.hash='#/questions'; }
    else { location.hash='#/'; }
    router(); loadFromCloud();
    // Phone is asked later, after the person has actually got value (see MCQ results).
  }).catch(()=>{
    showLoginErr('Network error during Google login — please try again.');
    if(btn){ btn.disabled=false; }
  });
}

function doFreeSignup(btn){
  const name=(document.getElementById('fsName').value||'').trim();
  const email=(document.getElementById('fsEmail').value||'').trim();
  const phone=(document.getElementById('fsPhone').value||'').trim();
  const msg=document.getElementById('fsMsg');
  const set=(t,c)=>{ if(msg){ msg.textContent=t; msg.className='text-[11px] text-center '+(c||'text-slate-400'); } };
  if(!name||!email||!phone){ set('Please fill your name, email and WhatsApp number.','text-rose-400'); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ set('Please enter a valid email address.','text-rose-400'); return; }
  if(phone.replace(/\D/g,'').length<10){ set('Please enter a valid 10-digit phone number.','text-rose-400'); return; }
  btn.disabled=true; const orig=btn.textContent; btn.textContent='Creating…'; set('');
  acct('free-signup',{name,email,phone,source:'form',ref:campaignRef()}).then(r=>{
    if(r&&r.ok){
      auth={ token:r.token, role:r.role, name:r.name, email:r.email||null, expiresAt:r.expiresAt||null };
      saveAuth(); track(r.role==='free'?'free_signup':'login');
      renderHeaderControls();
      location.hash = r.role==='member' ? '#/' : '#/questions';
      router(); loadFromCloud();
    } else {
      set((r&&r.error)||'Could not create your account.','text-rose-400');
      btn.disabled=false; btn.textContent=orig;
    }
  }).catch(()=>{ set('Network error — please try again.','text-rose-400'); btn.disabled=false; btn.textContent=orig; });
}

}

function portalRequest(action, options={}){
  const method=options.method||'GET';
  const headers=Object.assign({}, auth.token?{'x-auth':auth.token}:{}, options.headers||{});
  const url=PORTAL_URL+'?action='+encodeURIComponent(action)+(options.query||'');
  return fetch(url,{method,headers,body:options.body}).then(async r=>{
    const data=await r.json().catch(()=>({error:'Unexpected server response.'}));
    if(!r.ok) throw new Error(data.error||'Request failed.');
    return data;
  });
}

  const chosen=profile&&AVATAR_CHOICES.includes(profile.avatarChoice)?profile.avatarChoice:'';

function refreshHeaderAvatar(){
  const text=document.getElementById('headerAvatarText'), img=document.getElementById('headerAvatarImg');
  if(!text||!img) return;
  const requestId=++headerAvatarRequest;
  if(!authed()){
    if(headerAvatarObjectUrl){URL.revokeObjectURL(headerAvatarObjectUrl);headerAvatarObjectUrl=null;}
    setHeaderAvatarFallback(null); return;
  }
  const token=auth.token;
  fetch(PORTAL_URL+'?action=avatar&v='+Date.now(),{headers:{'x-auth':token},cache:'no-store'}).then(r=>{
    if(!r.ok) throw new Error('no avatar');
    return r.blob();
  }).then(blob=>{
    if(auth.token!==token||requestId!==headerAvatarRequest) return;
    if(headerAvatarObjectUrl) URL.revokeObjectURL(headerAvatarObjectUrl);
    headerAvatarObjectUrl=URL.createObjectURL(blob);
    img.src=headerAvatarObjectUrl; img.classList.remove('hidden'); text.textContent='';
  }).catch(()=>{
    if(auth.token!==token||requestId!==headerAvatarRequest) return;
    const cached=portalCache&&portalCache.profile;
    if(cached){ setHeaderAvatarFallback(cached); return; }
    portalRequest('me').then(d=>{ if(auth.token===token&&requestId===headerAvatarRequest) setHeaderAvatarFallback(d.profile||{}); }).catch(()=>{ if(requestId===headerAvatarRequest) setHeaderAvatarFallback({fullName:auth.name}); });
  });
}

}

function uploadProfileAvatar(){
  const input=document.getElementById('profileAvatarInput'); if(!input) return;
  input.value=''; input.click();
  input.onchange=()=>{
    const file=input.files&&input.files[0]; if(!file) return;
    if(file.size>2*1024*1024){ alert('Please choose an image under 2 MB.'); return; }
    portalRequest('avatar',{method:'POST',headers:{'content-type':file.type},body:file}).then(()=>{ loadOwnAvatar(); refreshHeaderAvatar(); }).catch(err=>alert(err.message));
  };

function removeProfileAvatar(){
  if(!confirm('Remove your profile picture?')) return;

function progressNudge(){
  const m=metrics(allQuestions());
  if(!m.total) return null;
  if(m.pct>=100) return { icon:'🎉', title:'You have completed every question!', detail:'100% done — keep revisiting your 🚩 flagged questions so nothing goes cold before the real panel.', tone:'bg-emerald-500/10 text-emerald-600 dark:text-emerald-300' };
  if(m.pct>=75) return { icon:'🔥', title:`So close — you're at ${m.pct}%`, detail:`Only ${m.todo} question${m.todo===1?'':'s'} left. Finish the set today and walk into interviews fully prepared.`, tone:'bg-amber-500/10 text-amber-600 dark:text-amber-300' };
  if(m.pct>=40) return { icon:'💪', title:`Keep the momentum — ${m.pct}% done`, detail:`${m.todo} questions still to go. A little every day adds up fast — don't lose the streak now.`, tone:'bg-amber-500/10 text-amber-600 dark:text-amber-300' };
  if(m.pct>0) return { icon:'⏳', title:`Only ${m.pct}% complete so far`, detail:`${m.todo} of ${m.total} questions are still untouched. Block 30 minutes today and start closing the gap.`, tone:'bg-rose-500/10 text-rose-600 dark:text-rose-300' };
  return { icon:'🚀', title:"You haven't started yet", detail:`${m.total} questions are waiting for you. Pick an area on the home page and tick off your first one right now.`, tone:'bg-rose-500/10 text-rose-600 dark:text-rose-300' };
}
function drawNotifications(){
  const interviews=(portalCache&&portalCache.interviews)||[];
  const now=Date.now();
  const followUps=interviews.filter(x=>x.followUpDate && !['rejected','accepted','declined'].includes(x.status))
    .map(x=>({...x, due:Date.parse(x.followUpDate)}))
    .filter(x=>!isNaN(x.due))
    .sort((a,b)=>a.due-b.due);
  const nudge=progressNudge();
  const cards=[];
  followUps.forEach(x=>{
    const overdue=x.due<now-86400000;
    const dueSoon=!overdue && x.due<=now+3*86400000;
    if(!overdue && !dueSoon) return;
    cards.push(`<div class="rounded-2xl p-4 bg-white/75 dark:bg-white/[.04] border ${overdue?'border-rose-400/40':'border-amber-400/30'} shadow-sm">
      <div class="flex items-start gap-3">

        </div>
        <a href="#/interviews" class="text-xs font-semibold ${overdue?'text-rose-500':'text-amber-500'} shrink-0">Open →</a>
      </div>
    </div>`);
  });
  if(nudge){
    cards.push(`<div class="rounded-2xl p-4 bg-white/75 dark:bg-white/[.04] border border-slate-200/70 dark:border-white/10 shadow-sm">
      <div class="flex items-start gap-3">
        <div class="h-11 w-11 grid place-items-center rounded-xl ${nudge.tone} text-xl shrink-0">${nudge.icon}</div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-bold">${esc(nudge.title)}</p>

        </div>
        <a href="#/" class="text-xs font-semibold text-brand-500 shrink-0">Practice →</a>
      </div>
    </div>`);
  }
  const app=document.getElementById('app');
  app.innerHTML=`<a href="#/" class="inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-brand-500 mb-4">← Back to tracker</a>
    <div class="fade rounded-2xl p-5 sm:p-6 mb-5 bg-white/75 dark:bg-white/[.04] glass border border-slate-200/70 dark:border-white/10 shadow-sm">
      <h1 class="font-display text-2xl font-extrabold">🔔 <span class="gradient-text">Notifications</span></h1>
      <p class="text-sm text-slate-500 mt-1">Follow-up reminders and nudges to keep your preparation on track.</p>
    </div>
    <div class="space-y-3">${cards.length?cards.join(''):'<div class="text-center py-12 rounded-2xl border border-dashed border-slate-300 dark:border-white/15 text-slate-400"><p class="text-4xl mb-2">✅</p><p class="font-semibold">Nothing needs your attention right now.</p></div>'}</div>`;
}

function exportCandidateData(){
  const headers=['Name','Email','Mobile','City','State','PIN','CA status','CA attempt','Qualification year','Experience','Current employer','Target role','Preferred firms','Preferred locations','Marketing consent','Readiness %','Questions completed','Flagged questions','Last progress sync','Interview company','Interview role','Interview date','Round','Status','Follow-up date','Employer email','Confidence','Questions asked','Feedback','Next step'];
  const rows=[];
  adminPortalRecords.forEach(record=>{
    const p=record.profile||{}, interviews=(record.interviews&&record.interviews.length)?record.interviews:[{}];
    const progress=candidateProgress(record);
    interviews.forEach(item=>rows.push([
      p.fullName,p.email,p.mobile,p.city,p.state,p.pinCode,p.caStatus,p.caAttempt,p.qualificationYear,
      p.experienceYears,p.currentEmployer,p.targetRole,p.preferredFirms,p.preferredLocations,
      p.marketingConsent?'Yes':'No',progress.pct,progress.done,progress.flagged,progress.updatedAt||'',
      item.company,item.role,item.interviewDate,item.round,
      statusLabel(item.status||''),item.followUpDate,item.employerEmail,item.confidenceRating,
      item.questionsAsked,item.feedback,item.nextStep
    ]));
  });
  const cell=value=>`"${String(value==null?'':value).replace(/"/g,'""')}"`;
  const csv=[headers,...rows].map(row=>row.map(cell).join(',')).join('\r\n');
  downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'mission-big4-candidate-data-'+new Date().toISOString().slice(0,10)+'.csv');
}
function candidateProgress(record){
  const state=(record&&record.progress&&record.progress.q)||{};
  const questions=allQuestions();
  const validIds=new Set(questions.map(item=>item.q.id));
  let done=0, flagged=0, notes=0;
  for(const [id,value] of Object.entries(state)){
    if(!validIds.has(id)) continue;
    if(value.done) done++;
    if(value.flag) flagged++;
    if(value.hasNote) notes++;
  }
  const total=questions.length;
  const areas=AREAS.map(area=>{
    const ids=areaQuestions(area).map(q=>q.id);
    const areaDone=ids.filter(id=>state[id]&&state[id].done).length;
    const meta=areaMeta(area);
    return {id:area.id,title:meta.title,icon:meta.icon,done:areaDone,total:ids.length,pct:ids.length?Math.round(areaDone*100/ids.length):0};
  });
  return {done,total,flagged,notes,pct:total?Math.round(done*100/total):0,updatedAt:record&&record.progress&&record.progress.updatedAt,areas};
}
function fmtLastActive(iso){
  if(!iso) return 'No recent sync recorded';
  const time=Date.parse(iso); if(!time) return 'No recent sync recorded';
  const mins=Math.max(0,Math.round((Date.now()-time)/60000));
  if(mins<2) return 'Just now';
  if(mins<60) return mins+' min ago';
  const hours=Math.round(mins/60); if(hours<24) return hours+' hr ago';
  const days=Math.round(hours/24); if(days<7) return days+' day'+(days===1?'':'s')+' ago';
  return fmtExpiry(iso);
}

function leadsToCsv(){

  const csv=[head.map(esc2).join(','), ...rows.map(r=>r.map(esc2).join(','))].join('\r\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');

  a.download='missionbig4-leads-'+new Date().toISOString().slice(0,10)+'.csv';

function startMockSpeech(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Voice recognition is not supported in this browser. Please type your answer.'); return; }
  const rec = new SR();
  rec.lang = 'en-IN';
  const inp = document.getElementById('mockAnswerInput');
  rec.onstart = () => { if(inp) inp.placeholder = 'Listening to your speech… Speak clearly now.'; };
  rec.onresult = (e) => {
    const text = Array.from(e.results).map(r => r[0].transcript).join(' ');
    if(inp) inp.value = text;
  };
  rec.start();
}

function evaluateMockAnswer(qid){
  const inp = document.getElementById('mockAnswerInput');
  const btn = document.getElementById('evaluateMockBtn');
  const box = document.getElementById('mockFeedbackBox');
  const txt = document.getElementById('mockFeedbackText');
  const badge = document.getElementById('mockScoreBadge');
  const answer = (inp ? inp.value : '').trim();
  if(!answer){ alert('Please speak or type your answer first.'); return; }
  const questionItem=findBaseQ(qid);
  if(!questionItem){ if(txt) txt.textContent='This question could not be loaded. Please try the next question.'; return; }
  const question=getText(questionItem,'q');
  const referenceAnswer=answerPlainText(getText(questionItem,'a'));

  if(btn){ btn.disabled = true; btn.textContent = 'Evaluating…'; }
  if(box) box.classList.remove('hidden');
  if(txt) txt.textContent = 'Analyzing technical accuracy, accounting standards, and audit assertions…';

  fetch('/.netlify/functions/chat',{
    method:'POST',
    headers:{'content-type':'application/json','x-auth':auth.token},
    body:JSON.stringify({task:'grade',question,candidateAnswer:answer,referenceAnswer})
  }).then(r=>r.json()).then(d=>{
    if(d.error || d.score==null) throw new Error(d.error||'No score was returned.');
    if(badge) badge.textContent = `Technical Score: ${d.score}/10`;
    if(txt) txt.innerHTML = `<span class="block"><b class="text-emerald-300">What worked:</b> ${esc(d.strengths)}</span><span class="block mt-2"><b class="text-amber-300">How to improve:</b> ${esc(d.improvements)}</span>`;
    if(btn){ btn.disabled=false; btn.textContent='Try Next Question →'; btn.onclick=()=>renderMockInterview(); }
  }).catch(err=>{
    if(txt) txt.textContent=(err&&err.message)||'Could not evaluate the answer right now. Please try again.';
    if(badge) badge.textContent='Not scored';
    if(btn){ btn.disabled=false; btn.textContent='Evaluate with AI →'; }
  });
}

function calculateSalary(e){
  e.preventDefault();
  const status = document.getElementById('estStatus').value;
  const attempt = document.getElementById('estAttempt').value;
  const firm = document.getElementById('estFirm').value;
  const exp = document.getElementById('estExp').value;

  let role = 'Audit Associate / Advanced Analyst';
  let low = 4.5;
  let high = 7.0;

  if (status === 'qualified') {
    if (exp === '0') {
      role = attempt === '1' ? 'Audit Senior / Consultant' : 'Audit Associate / Senior Associate';
      low = attempt === '1' ? 11.5 : 9.5;
      high = attempt === '1' ? 13.5 : 11.5;
    } else if (exp === '1') {
      role = 'Audit Senior Associate';
      low = 12.0; high = 15.0;
    } else {
      role = 'Assistant Manager — Audit & Assurance';
      low = 16.0; high = 21.0;
    }
  } else if(status === 'finalist'){
    role='Audit Associate / Advanced Analyst';
    low=6.5; high=9.0;
  }

  const firmAdjustment=firm==='big4'?0.8:firm==='mid'?0.3:0;
  low+=firmAdjustment; high+=firmAdjustment;
  const ctc=`₹${low.toFixed(1)} L - ₹${high.toFixed(1)} L / year`;
  document.getElementById('resRole').textContent = role;
  document.getElementById('resCtc').textContent = ctc;
  document.getElementById('resFactors').textContent =
    `Estimate uses CA status, attempts, post-qualification experience and ${firm==='big4'?'Big 4 / Top 10':firm==='mid'?'mid-size':'small-firm'} articleship background. It is guidance, not an offer guarantee.`;
  document.getElementById('estimatorResult').classList.remove('hidden');
}

function scanResumeAts(){
  const text = (document.getElementById('resumeInputText').value || '').toLowerCase();
  if(!text){ alert('Please paste your resume text first.'); return; }

  const keywords = ['statutory audit', 'ind as 115', 'ind as 116', 'caro 2020', 'ifc testing', 'substantive testing', 'ecl', 'walkthroughs', 'journal entry testing', 'materiality', 'sa 240', 'sa 500', 'sa 700'];
  const found = keywords.filter(k => text.includes(k));
  const missing = keywords.filter(k => !text.includes(k));
  const score = Math.round((found.length / keywords.length) * 100);

  document.getElementById('atsScoreBadge').textContent = `Coverage: ${score}%`;
  document.getElementById('detectedKeywords').innerHTML = found.map(k => `<span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">✓ ${k}</span>`).join('') || '<span class="text-xs text-slate-500">None detected</span>';
  document.getElementById('missingKeywords').innerHTML = missing.map(k => `<span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30">+ ${k}</span>`).join('');
  document.getElementById('atsResultBox').classList.remove('hidden');
}

const areaFilter = {}; // areaId -> {status:'all'|'flag'|'done'|'todo', search:''}
/* ============================================================
   MCQ TEST ENGINE (per area) — additive; never edits the Q&A bank
   ============================================================ */
let mcqRun = null;   // { areaId, order:[idx...], pos, answers:{qIdx:chosen} }

function mcqStat(areaId){ return (store.mcq && store.mcq[areaId]) || {}; }
function mcqRecord(areaId, pct, correct, total){
  store.mcq = store.mcq || {};
  const prev = store.mcq[areaId] || {};
  store.mcq[areaId] = {
    best: Math.max(prev.best || 0, pct), last: pct,
    correct, total, attempts: (prev.attempts || 0) + 1, at: new Date().toISOString()
  };
  save();
}
function mcqShuffle(n){
  const a = Array.from({length:n}, (_,i)=>i);
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function mcqScoreOf(run, bank){
  let correct=0; for(const k in run.answers){ if(bank[k] && run.answers[k]===bank[k].c) correct++; }
  return correct;
}

function mcqSectionHTML(area){
  const bank = mcqsFor(area.id);

  }

  const run = (mcqRun && mcqRun.areaId===area.id) ? mcqRun : null;

  // ---- idle / summary ----
  if(!run){
    const badge = st.best!=null ? `<span class="px-2.5 py-1 rounded-lg text-xs font-bold ${st.best>=70?'bg-emerald-500/15 text-emerald-600 dark:text-emerald-300':'bg-amber-500/15 text-amber-600 dark:text-amber-300'}">Best ${st.best}%</span>` : '';

  const pctDone = Math.round(run.pos/run.order.length*100);

  return `<div class="rounded-2xl p-5 sm:p-6 bg-white/75 dark:bg-white/[.04] glass border border-slate-200/70 dark:border-white/10 shadow-sm">
    <div class="flex items-center justify-between gap-3 mb-3">

      <button data-action="mcq-exit" data-area="${area.id}" class="text-xs font-semibold text-slate-400 hover:text-rose-500">✕ Exit</button>

    <div class="h-1.5 rounded-full bg-slate-200/80 dark:bg-white/10 overflow-hidden mb-4">

        ${run.pos+1 >= run.order.length ? 'See my score →' : 'Next question →'}
      </button>
    </div>`:''}
  </div>`;
}

/* Examples: user override (array) wins; else fall back to the base single example.
   Each example carries a stable id so attachments stay linked across edits/reorders. */
function getExamples(q){
  const st = store.q[q.id] || {};
  let arr;
  if (Array.isArray(st.examples)) arr = st.examples;
  else if (q.ex) arr = [{ label:'💡 Example', text:q.ex }];
  else arr = [];
  return arr.map((ex,idx)=>({ id: ex.id || (q.id+'-ex'+idx), label: ex.label, text: ex.text }));
}
function findBaseQ(id){
  for(const ar of AREAS){ const q=ar.questions.find(x=>x.id===id); if(q) return q; }
  for(const areaId in (store.custom||{})){ const c=(store.custom[areaId]||[]).find(x=>x.id===id); if(c) return c; }
  return null;
}
function isEdited(id){
  const s = store.q[id];
  return !!(s && (s.qOverride!=null || s.aOverride!=null || Array.isArray(s.examples)));
}

/* One question card */
function practiceScoreClass(score){
  if(score>=8) return 'border-emerald-400/30 bg-emerald-500/5';
  if(score>=5) return 'border-amber-400/30 bg-amber-500/5';
  return 'border-rose-400/30 bg-rose-500/5';
}
let practiceRecognition=null, practiceRecordingId=null;
function togglePracticeMic(id, btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert("Voice input isn't supported in this browser. Please type your answer instead, or try Chrome or Edge."); return; }
  const ta=document.querySelector(`[data-practice="${id}"]`); if(!ta) return;
  if(practiceRecognition && practiceRecordingId===id){ practiceRecognition.stop(); return; }
  if(practiceRecognition){ practiceRecognition.stop(); }
  const recog=new SR();
  recog.lang='en-IN'; recog.continuous=true; recog.interimResults=true;
  let finalText = ta.value ? ta.value.trim()+' ' : '';
  practiceRecognition=recog; practiceRecordingId=id;
  btn.classList.add('text-rose-500','bg-rose-500/10'); btn.title='Stop recording';
  recog.onresult=(e)=>{
    let interim='';
    for(let idx=e.resultIndex; idx<e.results.length; idx++){
      const transcript=e.results[idx][0].transcript;
      if(e.results[idx].isFinal) finalText += transcript + ' ';
      else interim += transcript;
    }
    ta.value=(finalText+interim).trim();
  };
  recog.onerror=()=>{};
  recog.onend=()=>{
    practiceRecognition=null; practiceRecordingId=null;
    btn.classList.remove('text-rose-500','bg-rose-500/10'); btn.title='Speak your answer';
    const st=qs(id); st.practiceAnswer=ta.value; save();
  };
  recog.start();
}
function submitPracticeAnswer(id, btn){
  const ta=document.querySelector(`[data-practice="${id}"]`);
  const candidateAnswer=(ta?ta.value:'').trim();
  const msg=document.getElementById('practiceMsg-'+id);
  if(!candidateAnswer){ if(ta) ta.focus(); if(msg){ msg.textContent='Please write or speak your answer first.'; msg.className='text-xs text-rose-500'; } return; }
  const base=findBaseQ(id); if(!base) return;
  const question=getText(base,'q'), referenceAnswer=answerPlainText(getText(base,'a'));
  btn.disabled=true; const orig=btn.innerHTML; btn.innerHTML='Checking… <span class="inline-block animate-spin">◌</span>';
  if(msg){ msg.textContent=''; msg.className='text-xs text-slate-400'; }
  fetch('/.netlify/functions/chat',{method:'POST',headers:{'content-type':'application/json','x-auth':auth.token},body:JSON.stringify({task:'grade',question,candidateAnswer,referenceAnswer})})
    .then(r=>r.json()).then(d=>{
      btn.disabled=false; btn.innerHTML=orig;
      if(d.error || d.score==null){ if(msg){ msg.textContent=d.error||'Could not check your answer — please try again.'; msg.className='text-xs text-rose-500'; } return; }
      const st=qs(id);
      st.practiceAnswer=candidateAnswer; st.practiceScore=d.score; st.practiceStrengths=d.strengths; st.practiceImprovements=d.improvements; st.practiceGradedAt=new Date().toISOString();
      save(); refresh();
    }).catch(()=>{ btn.disabled=false; btn.innerHTML=orig; if(msg){ msg.textContent='Network error — please try again.'; msg.className='text-xs text-rose-500'; } });
}

const app = document.getElementById('app');
function richEditorByTarget(target){ return document.getElementById(target); }
function captureRichSelection(target){
  const editor=richEditorByTarget(target), sel=window.getSelection();
  if(!editor||!sel||!sel.rangeCount) return;
  const range=sel.getRangeAt(0);
  if(editor.contains(range.commonAncestorContainer)) editor._richRange=range.cloneRange();
}
function restoreRichSelection(editor){
  if(!editor) return;
  editor.focus();
  if(editor._richRange){
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(editor._richRange);
  }
}
function wrapRichSelection(editor,tag,styleName,styleValue,href){
  const sel=window.getSelection(); if(!sel||!sel.rangeCount) return false;
  const range=sel.getRangeAt(0);
  if(range.collapsed||!editor.contains(range.commonAncestorContainer)) return false;
  const wrap=document.createElement(tag);
  if(styleName) wrap.style[styleName]=styleValue;
  if(href){ wrap.href=href; wrap.target='_blank'; wrap.rel='noopener noreferrer'; }
  try{
    wrap.appendChild(range.extractContents()); range.insertNode(wrap);
    range.selectNodeContents(wrap); sel.removeAllRanges(); sel.addRange(range);
    return true;
  }catch(_){ return false; }
}
function runRichCommand(target,cmd,value){
  const editor=richEditorByTarget(target); if(!editor) return;
  restoreRichSelection(editor);
  let applied=false;
  try{ applied=document.execCommand(cmd,false,value||null); }catch(_){}
  if(!applied){
    const tags={bold:'strong',italic:'em',underline:'u'};
    if(tags[cmd]) wrapRichSelection(editor,tags[cmd]);
    else if(cmd==='foreColor') wrapRichSelection(editor,'span','color',value);
    else if(cmd==='hiliteColor') wrapRichSelection(editor,'span','backgroundColor',value);
    else if(cmd==='createLink') wrapRichSelection(editor,'a',null,null,value);
  }
  captureRichSelection(target);
}
function insertRichHTML(target,html){
  const editor=richEditorByTarget(target); if(!editor) return;
  restoreRichSelection(editor);
  try{ document.execCommand('insertHTML',false,sanitizeRichHTML(html)); }catch(_){}
  captureRichSelection(target);
}
function applyRichStyle(target,styleName,value){
  const editor=richEditorByTarget(target); if(!editor||!value) return;
  restoreRichSelection(editor);
  if(!wrapRichSelection(editor,'span',styleName,value)){
    const sel=window.getSelection(); if(!sel||!sel.rangeCount) return;
    const range=sel.getRangeAt(0); if(!editor.contains(range.commonAncestorContainer)) return;
    const span=document.createElement('span'); span.style[styleName]=value; span.append('\u200B');
    range.insertNode(span); range.setStart(span.firstChild,1); range.collapse(true); sel.removeAllRanges(); sel.addRange(range);
  }
  captureRichSelection(target);
}
const INLINE_IMAGE_TYPES=new Set(['image/png','image/jpeg','image/webp','image/gif']);
let pendingRichImageTarget=null;
function normalizeInlineImageFile(file){
  if(file.name) return file;
  const ext=file.type==='image/jpeg'?'jpg':file.type.split('/')[1]||'png';
  return new File([file],`snapshot-${Date.now()}.${ext}`,{type:file.type||'image/png'});
}
async function optimizeInlineImage(file){
  file=normalizeInlineImageFile(file);
  if(!INLINE_IMAGE_TYPES.has(file.type)) throw new Error('Please choose a PNG, JPG, WEBP or GIF image.');
  if(file.size>15*1024*1024) throw new Error('That image is too large. Please use an image below 15 MB.');
  if(file.type==='image/gif'){
    if(file.size>5*1024*1024) throw new Error('Animated GIFs must be below 5 MB.');
    return file;
  }
  let bitmap;
  try{ bitmap=await createImageBitmap(file); }catch(_){ return file; }
  const scale=Math.min(1,1800/Math.max(bitmap.width,bitmap.height));
  if(scale===1 && file.size<=4.5*1024*1024){ bitmap.close(); return file; }
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(bitmap.width*scale)); canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height); bitmap.close();
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.88));
  if(!blob) throw new Error('Could not prepare that image.');
  if(blob.size>5*1024*1024) throw new Error('The optimized image is still too large. Please crop it and try again.');
  const base=file.name.replace(/\.[^.]+$/,'')||'snapshot';
  return new File([blob],base+'.webp',{type:'image/webp'});
}
function insertPendingRichImage(target,file){
  const editor=richEditorByTarget(target); if(!editor) return;
  file=normalizeInlineImageFile(file);
  if(!INLINE_IMAGE_TYPES.has(file.type)){ alert('Please choose a PNG, JPG, WEBP or GIF image.'); return; }
  if(file.size>15*1024*1024){ alert('That image is too large. Please use an image below 15 MB.'); return; }
  const key='pending-'+Date.now()+'-'+Math.round(Math.random()*1e9);
  const objectUrl=URL.createObjectURL(file);
  if(!editor._pendingImages) editor._pendingImages=new Map();
  editor._pendingImages.set(key,{file,objectUrl});
  restoreRichSelection(editor);
  const img=document.createElement('img'); img.src=objectUrl; img.alt=file.name||'Snapshot'; img.setAttribute('data-mb4-pending',key);
  const sel=window.getSelection();
  if(sel&&sel.rangeCount&&editor.contains(sel.getRangeAt(0).commonAncestorContainer)){
    const range=sel.getRangeAt(0); range.deleteContents(); range.insertNode(img); range.setStartAfter(img); range.collapse(true); sel.removeAllRanges(); sel.addRange(range);
  }else editor.appendChild(img);
  captureRichSelection(target);
}
function discardPendingRichImages(editor){
  if(!editor||!editor._pendingImages) return;
  editor._pendingImages.forEach(v=>URL.revokeObjectURL(v.objectUrl));
  editor._pendingImages.clear();
}
async function savePendingRichImages(editor,qid){
  if(!editor||!editor._pendingImages||!editor._pendingImages.size) return;
  for(const [key,item] of [...editor._pendingImages]){
    const img=editor.querySelector(`img[data-mb4-pending="${key}"]`);
    if(!img){ URL.revokeObjectURL(item.objectUrl); editor._pendingImages.delete(key); continue; }
    const prepared=await optimizeInlineImage(item.file);
    const meta=await attachTo(qid+'::a',qid,prepared);
    img.removeAttribute('data-mb4-pending'); img.setAttribute('data-mb4-image',meta.id); img.alt=meta.name; img.src=fileViewUrl(meta.id);
    URL.revokeObjectURL(item.objectUrl); editor._pendingImages.delete(key);
  }
}
function cleanRichEditorHTML(editor){ return sanitizeRichHTML((editor.innerHTML||'').replace(/\u200B/g,'')); }

document.addEventListener('selectionchange',()=>{
  const sel=window.getSelection(); if(!sel||!sel.rangeCount) return;
  let node=sel.anchorNode; if(node&&node.nodeType!==1) node=node.parentElement;
  const editor=node&&node.closest ? node.closest('.rich-editor') : null;
  if(editor) editor._richRange=sel.getRangeAt(0).cloneRange();
});
app.addEventListener('change',e=>{
  const el=e.target;
  if(el.hasAttribute('data-rich-format')){ runRichCommand(el.dataset.target,'formatBlock',el.value); el.value='P'; }
  if(el.hasAttribute('data-rich-size')){ if(el.value) applyRichStyle(el.dataset.target,'fontSize',el.value); el.value=''; }
  if(el.hasAttribute('data-rich-color')) runRichCommand(el.dataset.target,el.getAttribute('data-rich-color'),el.value);
});
app.addEventListener('paste',e=>{
  const editor=e.target.closest&&e.target.closest('.rich-editor'); if(!editor) return;
  const clip=e.clipboardData; if(!clip) return;
  const imageItem=[...(clip.items||[])].find(item=>item.kind==='file'&&INLINE_IMAGE_TYPES.has(item.type));
  if(imageItem){
    const file=imageItem.getAsFile(); if(!file) return;
    e.preventDefault(); insertPendingRichImage(editor.id,file); return;
  }
  const html=clip.getData('text/html'), text=clip.getData('text/plain');
  const hasFormula=/\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]/.test(text);
  const incoming=hasFormula ? plainToRichHTML(text) : (html ? sanitizeRichHTML(html) : (markdownTableHTML(text)||plainToRichHTML(text)));
  e.preventDefault();
  try{ document.execCommand('insertHTML',false,incoming); }catch(_){}
});
document.getElementById('richImageInput').addEventListener('change',e=>{
  const file=e.target.files&&e.target.files[0];
  if(file&&pendingRichImageTarget) insertPendingRichImage(pendingRichImageTarget,file);
  e.target.value=''; pendingRichImageTarget=null;
});

  if (act==='attach'){ fileMode='attach'; pendingSlot=btn.dataset.slot; pendingQid=btn.dataset.qid; const fi=document.getElementById('fileInput'); fi.multiple=true; fi.value=''; fi.click(); return; }
  if (act==='del-att'){ removeAttach(btn.dataset.id, btn.dataset.slot).then(()=>{ refresh(); pushNow(); }); return; }
  if (act==='view-att'){ openAttachment(btn.dataset.id, btn.dataset.type, btn.dataset.name); return; }
  // ---- vault ----
  if (act==='vault-sel'){ const id=btn.dataset.id; if(vaultSel.has(id)) vaultSel.delete(id); else vaultSel.add(id); renderVault(); return; }
  if (act==='vault-selall'){ const shown=allAttachments().filter(f=>!vaultSearch||(f.name+' '+f.areaTitle+' '+f.qTitle).toLowerCase().includes(vaultSearch)); const allOn=shown.length>0&&shown.every(f=>vaultSel.has(f.id)); if(allOn) shown.forEach(f=>vaultSel.delete(f.id)); else shown.forEach(f=>vaultSel.add(f.id)); renderVault(); return; }
  if (act==='vault-dl'){ vaultDownloadSelected(); return; }
  if (act==='vault-del'){ vaultDeleteSelected(); return; }
  if (act==='vault-rep'){ vaultReplaceSelected(); return; }
  if (act==='vault-backup'){ vaultBackupAll(); return; }
  if (act==='vault-view'){ openAttachment(btn.dataset.id, btn.dataset.type, btn.dataset.name); return; }
  if (act==='vault-dl1'){ const f=allAttachments().find(x=>x.id===btn.dataset.id); if(f){ const a=document.createElement('a'); a.href=fileViewUrl(f.id,true); a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); } return; }
  if (act==='vault-rep1'){ replaceTargets=[{id:btn.dataset.id, slot:btn.dataset.slot}]; fileMode='replace'; const fi=document.getElementById('fileInput'); fi.multiple=false; fi.value=''; fi.click(); return; }
  if (act==='vault-del1'){ if(confirm('Move this file to Trash? You can restore it from the Trash below or from History.')){ removeAttach(btn.dataset.id, btn.dataset.slot).then(()=>{ vaultSel.delete(btn.dataset.id); pushNow(); renderVault(); }); } return; }
  // ---- trash + history ----
  if (act==='trash-restore'){ restoreTrash(btn.dataset.id); pushNow(); renderVault(); return; }
  if (act==='trash-purge'){ if(confirm('Permanently delete this file? This cannot be undone and it will no longer be retrievable.')){ purgeTrash(btn.dataset.id).then(()=>{ pushNow(); renderVault(); }); } return; }
  if (act==='hist-restore'){ restoreVersion(btn.dataset.ts); return; }
  if (act==='download-pdf'){ downloadPdf(); return; }
  if (act==='speak'){ speakQA(id); return; }
  if (act==='bulk-draft'){ bulkDraftArea(btn.dataset.area); return; }
  if (act==='ai-refine-quick'){
    const base=findBaseQ(id); if(!base) return;
    const instruction=prompt('How should the AI change this answer?\n\nExamples: "make it shorter", "add a numeric example", "more on cut-off", "simpler language", "sound more confident"');
    if(!instruction || !instruction.trim()) return;
    const orig=btn.innerHTML; btn.innerHTML='✨ …';
    const exs=getExamples(base); const example=exs[0]?exs[0].text:'';
    fetch('/.netlify/functions/chat',{method:'POST',headers:{'content-type':'application/json','x-auth':auth.token},body:JSON.stringify({task:'refine',question:getText(base,'q'),answer:answerPlainText(getText(base,'a')),example,instruction})})
      .then(r=>r.json()).then(d=>{
        btn.innerHTML=orig;
        if(d.error || !d.answer){ alert('Refine failed: '+(d.error||'no result')); return; }
        const st=qs(id); st.aOverride=aiRichAnswer(d.answer);
        if(d.example){ const cleanExample=aiPlainText(d.example); const cur=getExamples(base).map(e=>({id:e.id,label:e.label,text:e.text})); if(cur[0]){ cur[0].text=cleanExample; } else { cur.push({id:id+'-ex'+Date.now(),label:'💡 Example',text:cleanExample}); } st.examples=cur; }
        st._open=true; save(); refresh();
      }).catch(()=>{ btn.innerHTML=orig; alert('Refine failed — check your connection.'); });
    return;
  }
  if (act==='delete-custom'){
    const ar=btn.dataset.area;
    if (confirm('Delete this custom question?')){
      store.custom[ar] = (store.custom[ar]||[]).filter(c=>c.id!==id);
      delete store.q[id]; save(); renderArea(AREA_BY_ID[ar]);
    }
    return;
  }
});

/* ============================================================
   DRAG-TO-REORDER (within an area)
   ============================================================ */
let dragId = null;
function currentAreaId(){ const m=(location.hash||'').match(/^#\/a\/([\w-]+)/); return m?m[1]:null; }
function clearDropIndicators(){ document.querySelectorAll('.drop-before,.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after')); }

/* Pressing the grip arms the card for native drag; a plain click disarms it. */
app.addEventListener('mousedown', e => {
  const h = e.target.closest('[data-drag-handle]');
  if (!h || h.dataset.disabled) return;
  const card = h.closest('.q-card'); if (card) card.setAttribute('draggable','true');
});
app.addEventListener('mouseup', () => {
  document.querySelectorAll('.q-card[draggable="true"]').forEach(c=>c.removeAttribute('draggable'));
});
app.addEventListener('dragstart', e => {
  const card = e.target.closest('.q-card');
  if (!card || card.getAttribute('draggable')!=='true') { return; }
  dragId = card.dataset.qid;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragId); } catch(_){}
  requestAnimationFrame(()=>card.classList.add('dragging'));
});
app.addEventListener('dragover', e => {
  if (!dragId) return;
  const card = e.target.closest('.q-card'); if (!card) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  clearDropIndicators();
  if (card.dataset.qid === dragId) return;
  const r = card.getBoundingClientRect();
  card.classList.add((e.clientY - r.top) > r.height/2 ? 'drop-after' : 'drop-before');
});
app.addEventListener('drop', e => {
  if (!dragId) return;
  const card = e.target.closest('.q-card'); if (!card) return;
  e.preventDefault();
  const targetId = card.dataset.qid;
  const r = card.getBoundingClientRect();
  const after = (e.clientY - r.top) > r.height/2;
  const dropped = dragId; dragId = null; clearDropIndicators();
  if (targetId !== dropped) commitReorder(dropped, targetId, after);
});
app.addEventListener('dragend', () => {
  dragId = null; clearDropIndicators();
  document.querySelectorAll('.q-card').forEach(c=>{ c.classList.remove('dragging'); c.removeAttribute('draggable'); });
});

function commitReorder(dropId, targetId, after){
  const areaId = currentAreaId(); if (!areaId) return;
  const area = AREA_BY_ID[areaId];
  const ids = orderedAreaQuestions(area).map(q=>q.id);
  const from = ids.indexOf(dropId); if (from<0) return;
  ids.splice(from,1);
  let ti = ids.indexOf(targetId);
  if (ti<0) ti = ids.length-1;
  ids.splice(after ? ti+1 : ti, 0, dropId);
  if (!store.order) store.order = {};
  store.order[areaId] = ids;
  save();
  renderArea(area);
}

  };
  document.getElementById('addQ').focus();
}

/* ============================================================
   AI TUTOR CHATBOT (Gemini via /.netlify/functions/chat)
   ============================================================ */
(function(){
  const CHAT_KEY='mb4_chat';
  const fab=document.getElementById('chatFab');
  const panel=document.getElementById('chatPanel');
  const msgsEl=document.getElementById('chatMsgs');
  const input=document.getElementById('chatInput');
  const sendBtn=document.getElementById('chatSend');
  if(!fab||!panel) return;
  let chat=[]; let busy=false;
  try{ chat=JSON.parse(localStorage.getItem(CHAT_KEY))||[]; }catch(e){ chat=[]; }

  const SUGGEST=[
    'Explain Ind AS 115 in 30 seconds',
    'Auditor responsibilities for fraud (SA 240)?',
    'How do I answer "tell me about yourself"?',
    'Difference: TOC vs substantive procedures?'
  ];

  function chatEsc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmtBot(t){
    // light markdown: **bold**, `code`, and dash bullets; preserve line breaks
    let h=chatEsc(t);
    h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code class="px-1 rounded bg-black/10 dark:bg-white/10">$1</code>');
    return h;
  }
  function bubble(role,html,extra){
    if(role==='user') return `<div class="flex justify-end"><div class="max-w-[85%] rounded-2xl rounded-br-sm bg-brand-500 text-white px-3.5 py-2 text-sm whitespace-pre-wrap">${html}</div></div>`;
    return `<div class="flex justify-start"><div class="max-w-[90%] rounded-2xl rounded-bl-sm bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 px-3.5 py-2 text-sm text-slate-700 dark:text-slate-200 whitespace-pre-wrap leading-relaxed">${html}${extra||''}</div></div>`;
  }
  function render(){
    if(!chat.length){
      msgsEl.innerHTML=`<div class="text-center pt-4 pb-2">
        <div class="text-4xl mb-2">🤖</div>
        <p class="font-display font-bold text-slate-700 dark:text-slate-200">Hi! I'm your Audit Buddy.</p>
        <p class="text-xs text-slate-400 mt-1 mb-3">Ask me anything about audit, Ind AS, standards, or interview answers.</p>
        <div class="flex flex-col gap-1.5">${SUGGEST.map(s=>`<button data-suggest="${chatEsc(s)}" class="text-left text-xs px-3 py-2 rounded-lg bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 hover:border-brand-400 transition">${chatEsc(s)}</button>`).join('')}</div>
      </div>`;
      msgsEl.querySelectorAll('[data-suggest]').forEach(b=>b.addEventListener('click',()=>{ input.value=b.dataset.suggest; send(); }));
      return;
    }
    msgsEl.innerHTML=chat.map(m=>bubble(m.role, m.role==='user'?chatEsc(m.text):fmtBot(m.text))).join('')
      + (busy?`<div class="flex justify-start"><div class="rounded-2xl rounded-bl-sm bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 px-4 py-3"><span class="inline-flex gap-1"><span class="h-2 w-2 rounded-full bg-slate-400 animate-bounce"></span><span class="h-2 w-2 rounded-full bg-slate-400 animate-bounce" style="animation-delay:.15s"></span><span class="h-2 w-2 rounded-full bg-slate-400 animate-bounce" style="animation-delay:.3s"></span></span></div></div>`:'');
    msgsEl.scrollTop=msgsEl.scrollHeight;
  }
  function save(){ try{ localStorage.setItem(CHAT_KEY, JSON.stringify(chat.slice(-40))); }catch(e){} }

  function send(){
    const text=(input.value||'').trim();
    if(!text||busy) return;
    chat.push({role:'user', text}); input.value=''; input.style.height='auto';
    busy=true; render(); save();
    fetch('/.netlify/functions/chat',{method:'POST',headers:{'content-type':'application/json','x-auth':auth.token},body:JSON.stringify({messages:chat})})
      .then(r=>r.json())
      .then(d=>{ busy=false; chat.push({role:'model', text:(d&&d.reply)||"Sorry, I didn't catch that."}); render(); save(); })
      .catch(()=>{ busy=false; chat.push({role:'model', text:"I couldn't reach the server — check your connection and try again."}); render(); save(); });
  }

  function open(){ panel.classList.remove('hidden'); panel.classList.add('flex'); fab.classList.add('hidden'); render(); setTimeout(()=>input.focus(),50); }
  function close(){ panel.classList.add('hidden'); panel.classList.remove('flex'); fab.classList.remove('hidden'); }
  fab.addEventListener('click',open);
  document.getElementById('chatClose').addEventListener('click',close);
  document.getElementById('chatClear').addEventListener('click',()=>{ chat=[]; save(); render(); });
  sendBtn.addEventListener('click',send);
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
  input.addEventListener('input',()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,112)+'px'; });
})();

/* ============================================================
   INIT
   ============================================================ */
if(!store.attach) store.attach={};
applyTheme();
renderHeaderControls();
if(SYNC_ON && auth.token){
  // verify the stored session, then load content + personal state
  acct('me').then(m=>{
    if(!m || m.role==='none'){ auth={token:null,role:'none',name:null,email:null,expiresAt:null}; saveAuth(); renderHeaderControls(); router(); return; }
    auth.role=m.role; auth.name=m.name; auth.email=m.email||null; auth.expiresAt=m.expiresAt||null; saveAuth();
    renderHeaderControls(); router(); loadFromCloud();
  }).catch(()=>{ router(); });   // offline → render from local cache
} else {
  router();                      // show login gate (or public buy-access page)
}
// near-live: pull the latest whenever the tab regains focus (logged-in users)
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && authed() && !_syncTimer) loadFromCloud();
});
</script>
