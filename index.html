MCQ_BANK['caro'] = [
  { q:'A private limited company that is not a subsidiary or holding of a public company has paid-up capital plus reserves of Rs 90 lakh, total borrowings from banks of Rs 90 lakh at all points during the year, and total revenue of Rs 9 crore. Is CARO 2020 applicable?', o:['Yes, because revenue exceeds Rs 5 crore','Yes, because borrowings exceed Rs 50 lakh','No, all three exemption conditions for a private company are satisfied','No, but only because the company is not a subsidiary of a public company'], c:2, why:'The private company exemption requires paid-up capital plus reserves not exceeding Rs 1 crore, borrowings not exceeding Rs 1 crore at any point in the year, and revenue not exceeding Rs 10 crore. All three limits are met here, so CARO does not apply. Revenue of Rs 9 crore is below the Rs 10 crore ceiling, not the Rs 5 crore figure used elsewhere.' },
  { q:'Which of the following companies remains within the scope of CARO 2020?', o:['A banking company as defined in the Banking Regulation Act 1949','A One Person Company','A Section 8 company','An unlisted public company with paid-up capital of Rs 40 lakh and borrowings of Rs 2 crore'], c:3, why:'CARO 2020 expressly excludes banking companies, insurance companies, Section 8 companies, One Person Companies and small companies. An unlisted public company is covered regardless of size because the private company thresholds do not apply to it.' },
  { q:'Under CARO 2020 clause 3(i)(c), the auditor must comment on title deeds of immovable property not held in the name of the company. Which item is outside the scope of this comment?', o:['A factory building disclosed under property, plant and equipment','Immovable property held as investment property','Immovable property held as stock-in-trade by a real estate company','Land shown as right-of-use asset where the company is the lessee under a registered lease with the lessor'], c:3, why:'The clause covers immovable property whose title deeds are not in the company name, but expressly excludes properties where the company is the lessee and the lease agreement is duly executed in favour of the lessee. Investment property and stock-in-trade immovable property are within scope.' },
  { q:'CARO 2020 clause 3(ii)(a) requires reporting on physical verification of inventory. The discrepancy threshold that triggers specific reporting is:', o:['Discrepancies of 5 percent or more for each class of inventory','Discrepancies of 10 percent or more in the aggregate for each class of inventory','Discrepancies of 10 percent or more of total inventory value taken as a whole','Any discrepancy that is material to the financial statements as a whole'], c:1, why:'The clause requires the auditor to report whether discrepancies of 10 percent or more in the aggregate for each class of inventory were noticed and how they were dealt with in the books. The test is applied class by class, not on total inventory.' },
  { q:'A company has been sanctioned working capital limits of Rs 6 crore in aggregate from a consortium of banks on the security of current assets. Under CARO 2020 clause 3(ii)(b), the auditor must:', o:['State only whether the limits were fully utilised during the year','State whether the quarterly returns filed with the banks agree with the books of account and report discrepancies','Report only if the sanctioned limit exceeds Rs 10 crore','Report only where the security is a floating charge over current assets'], c:1, why:'Clause 3(ii)(b) applies where working capital limits in excess of Rs 5 crore in aggregate have been sanctioned on the security of current assets, and requires comment on whether quarterly returns or statements filed with banks agree with the books. Rs 6 crore crosses the Rs 5 crore trigger.' },
  { q:'Under CARO 2020 clause 3(iii), which of the following is NOT a reporting requirement in respect of loans granted?', o:['Whether the terms and conditions of the grant are prejudicial to the interests of the company','Whether repayment schedules have been stipulated and repayments are regular','The aggregate market value of collateral security obtained for each loan','Whether any loan granted has fallen overdue for more than ninety days'], c:2, why:'Clause 3(iii) requires comment on prejudicial terms, stipulation and regularity of repayment schedules, amounts overdue for more than ninety days, and loans renewed or extended to settle overdues. It does not require disclosure of the market value of collateral.' },
  { q:'Clause 3(iii)(f) of CARO 2020 requires the auditor to report loans or advances in the nature of loans granted:', o:['To any related party as defined in Section 2(76)','That are repayable on demand or without specifying any terms or period of repayment','Exceeding Rs 5 crore to any single borrower','That carry an interest rate below the prevailing bank rate'], c:1, why:'Clause 3(iii)(f) targets loans repayable on demand or granted without specifying any terms or period of repayment, with a separate disclosure of the aggregate amount and percentage to promoters and related parties. A low interest rate is dealt with under the prejudicial terms comment.' },
  { q:'CARO 2020 clause 3(iv) deals with compliance in respect of loans, investments, guarantees and security. The relevant sections are:', o:['Sections 179 and 180 of the Companies Act 2013','Sections 185 and 186 of the Companies Act 2013','Sections 188 and 189 of the Companies Act 2013','Sections 73 to 76 of the Companies Act 2013'], c:1, why:'Clause 3(iv) requires reporting on compliance with Sections 185 and 186, dealing with loans to directors and loans, investments, guarantees and security by a company. Sections 73 to 76 relate to deposits and are covered by clause 3(v).' },
  { q:'A company accepted amounts from members that are deemed deposits under the Companies Act 2013 without complying with the deposit rules. No order has been passed by any authority. Under CARO 2020 clause 3(v), the auditor should:', o:['Report the non-compliance with the directives of the Reserve Bank of India and the provisions of Sections 73 to 76 and the rules made thereunder','Report only if the Company Law Board or NCLT has passed an order','Omit comment because deemed deposits are outside the clause','Report only the aggregate amount without commenting on compliance'], c:0, why:'Clause 3(v) covers deposits and amounts deemed to be deposits, and requires comment on whether the RBI directives and Sections 73 to 76 with the rules have been complied with. The clause also asks whether any order has been passed, but the absence of an order does not excuse reporting the underlying non-compliance.' },
  { q:'Under CARO 2020 clause 3(vi) on cost records, the auditor is required to report whether:', o:['The prescribed accounts and records have been made and maintained, without carrying out a detailed examination of them','The cost records have been audited by a cost auditor and the report has been filed','The cost records reconcile line by line with the financial statements','The company has appointed a cost accountant in whole time employment'], c:0, why:'Clause 3(vi) requires the auditor to state whether the accounts and records prescribed under Section 148(1) have been made and maintained, and expressly notes that a detailed examination of such records is not required. Filing of a cost audit report is a separate compliance matter.' },
  { q:'Under CARO 2020 clause 3(vii)(b), statutory dues not deposited on account of a dispute must be reported. The correct treatment is:', o:['Disclose amounts, the period to which the amount relates and the forum where the dispute is pending','Disclose amounts and the forum where the dispute is pending, excluding dues stayed by a court where no demand exists','Disclose only the aggregate disputed amount for each statute','Disclose only where the disputed amount exceeds ten percent of profit before tax'], c:0, why:'Clause 3(vii)(b) requires reporting the amounts involved, the period to which the amount relates and the forum where the dispute is pending, in respect of dues not deposited on account of any dispute. There is no materiality threshold built into the clause.' },
  { q:'A company failed to repay a term loan instalment of Rs 2 crore to a bank on the due date and it remained unpaid at year end. It also defaulted on payment to a debenture holder. Under CARO 2020 clause 3(ix)(a), the auditor must report:', o:['Only the default to the bank, since debenture holders are not lenders','Only the aggregate default without lender-wise detail','The period and amount of default separately, in respect of each lender including debenture holders','Nothing, if the bank granted a moratorium after the balance sheet date'], c:2, why:'Clause 3(ix)(a) requires the auditor to report the period and amount of default in repayment of loans or other borrowings or in the payment of interest, lender-wise, and the definition of lender covers debenture holders. A post balance sheet moratorium does not erase a default existing during the year.' },
  { q:'Under CARO 2020 clause 3(ix)(d), the auditor reports whether funds raised on short term basis have been utilised for long term purposes. If such utilisation is found, the auditor must:', o:['Issue a qualified opinion on the financial statements','Report the matter only if it causes a going concern doubt','Report the fact together with the nature and amount involved','Report only if the amount exceeds Rs 1 crore'], c:2, why:'Clause 3(ix)(d) requires reporting the fact along with the nature and amount involved where short term funds have been used for long term purposes. The CARO comment is a separate statement and does not by itself modify the opinion on the financial statements.' },
  { q:'CARO 2020 clause 3(xi)(a) requires reporting on fraud. The correct scope is:', o:['Fraud by the company or any fraud on the company, whether noticed or reported during the year, with the nature and amount involved','Only fraud by officers or employees of the company','Only fraud involving amounts exceeding Rs 1 crore reported to the Central Government','Only fraud that has been established by a court or tribunal'], c:0, why:'Clause 3(xi)(a) covers any fraud by the company or any fraud on the company that has been noticed or reported during the year, and requires the nature and the amount involved to be indicated. It is not restricted to officers and employees or to the Section 143(12) reporting threshold.' },
  { q:'Under CARO 2020 clause 3(xi)(c), the auditor must state whether whistle-blower complaints received during the year have been considered. The clause applies to complaints:', o:['Received only from employees of the company','Only complaints subsequently substantiated by the audit committee','Only where the company is required to establish a vigil mechanism under Section 177(9)','Received during the year, if any, whether or not the company was required to have a vigil mechanism'], c:3, why:'Clause 3(xi)(c) asks whether the auditor has considered whistle-blower complaints received during the year by the company, if any. It is not conditioned on the company being required to maintain a vigil mechanism, nor on the complaint being substantiated.' },
  { q:'CARO 2020 clause 3(xiv) requires comment on internal audit. The correct requirement is:', o:['Whether an internal audit system commensurate with size and nature of business exists, and whether internal audit reports were considered','Whether the internal auditor is a chartered accountant in practice','Whether the internal audit function has been outsourced to an independent firm','Whether internal audit covered every branch of the company during the year'], c:0, why:'Clause 3(xiv) has two limbs, the existence of an internal audit system commensurate with size and nature of business, and whether the reports of the internal auditors for the period under audit were considered by the statutory auditor. The qualification and independence of the internal auditor are not the subject of this clause.' },
  { q:'CARO 2020 clause 3(xviii) deals with resignation of the statutory auditor during the year. The incoming auditor must state:', o:['The reasons stated in the resignation letter verbatim','Whether the outgoing auditor filed Form ADT-3 within thirty days','Whether the auditor has taken into consideration the issues, objections or concerns raised by the outgoing auditor','Whether the resignation was approved by the audit committee'], c:2, why:'Clause 3(xviii) requires the auditor to state whether there has been any resignation of the statutory auditors during the year and if so, whether the auditor has taken into consideration the issues, objections or concerns raised by the outgoing auditors. Form ADT-3 filing is the outgoing auditor obligation and not the subject of this comment.' },
  { q:'A company has an unspent amount relating to an ongoing CSR project. Under CARO 2020 clause 3(xx)(b), the auditor reports whether the amount has been transferred to:', o:['A Fund specified in Schedule VII within six months of the end of the financial year','A Fund specified in Schedule VII within thirty days from the end of the financial year','The general reserve of the company within the financial year','A special account within thirty days from the end of the financial year, in compliance with Section 135(6)'], c:3, why:'For ongoing projects, Section 135(6) requires the unspent amount to be transferred to an Unspent Corporate Social Responsibility Account within thirty days of the end of the financial year. The six month transfer to a Schedule VII Fund applies to unspent amounts other than those relating to ongoing projects and is covered by clause 3(xx)(a).' }
];
MCQ_BANK['schedule3'] = [
  { q:'Under Division II of Schedule III, a liability is classified as current when, among other conditions:', o:['It is due to be settled within twelve months after the reporting period, regardless of any right to defer','The company does not have an unconditional right to defer settlement for at least twelve months after the reporting period','It is expected to be settled within the normal operating cycle only','It arises from a transaction with a related party'], c:1, why:'A liability is current if it is expected to be settled in the normal operating cycle, is held primarily for trading, is due within twelve months, or the company does not have the right at the end of the reporting period to defer settlement for at least twelve months after the reporting period. The absence of an unconditional deferral right is the decisive test.' },
  { q:'A five year term loan became payable on demand due to a covenant breach before the reporting date. The lender agreed not to demand payment, but only after the reporting date. Under Division II read with Ind AS 1, the loan is:', o:['Non-current, because the waiver was obtained before approval of the financial statements','Current, because the right to defer settlement did not exist at the end of the reporting period','Non-current, because the original tenure exceeds twelve months','Split between current and non-current in the ratio of the original repayment schedule'], c:1, why:'Classification depends on the position at the end of the reporting period. Because the right to defer settlement for at least twelve months did not exist at that date, the loan is current, and the post reporting date waiver is a non-adjusting event requiring disclosure only.' },
  { q:'The trade receivables ageing schedule under Division II of Schedule III uses which buckets?', o:['Less than 6 months, 6 months to 1 year, 1 to 2 years, 2 to 3 years, more than 3 years','Less than 1 year, 1 to 2 years, 2 to 3 years, more than 3 years','Not due, less than 6 months, 6 months to 1 year, 1 to 2 years, 2 to 3 years, more than 3 years','Less than 3 months, 3 to 6 months, 6 months to 1 year, more than 1 year'], c:2, why:'The prescribed format shows outstanding for the following periods from the due date of payment, with columns for less than 6 months, 6 months to 1 year, 1 to 2 years, 2 to 3 years and more than 3 years, and a separate line for amounts not due. Ageing runs from the due date, not the invoice date.' },
  { q:'In the trade receivables ageing schedule, the rows to be presented separately include:', o:['Undisputed and disputed receivables, each split into considered good and considered doubtful','Secured and unsecured receivables only','Receivables from related parties and others only','Receivables measured at amortised cost and those at fair value'], c:0, why:'The format requires separate rows for undisputed trade receivables considered good, undisputed considered doubtful, disputed considered good and disputed considered doubtful. Related party split is a separate disclosure and not the basis of the ageing rows.' },
  { q:'Under Division II of Schedule III, the ageing schedule for capital work-in-progress must be given with the buckets:', o:['Less than 6 months, 6 months to 1 year, 1 to 2 years, more than 2 years','Less than 1 year, 1 to 2 years, 2 to 3 years, more than 3 years','Not due, less than 1 year, 1 to 3 years, more than 3 years','Less than 1 year, 1 to 3 years, 3 to 5 years, more than 5 years'], c:1, why:'The CWIP ageing schedule uses amount in CWIP for a period of less than 1 year, 1 to 2 years, 2 to 3 years and more than 3 years, split between projects in progress and projects temporarily suspended. The same buckets apply to intangible assets under development.' },
  { q:'For capital work-in-progress projects whose completion is overdue or which have exceeded their cost compared to the original plan, Division II of Schedule III requires:', o:['A separate note giving the reasons for the overrun only','A project-wise completion schedule with amounts bucketed as less than 1 year, 1 to 2 years, 2 to 3 years and more than 3 years','Immediate impairment of the excess cost','Disclosure only if the project cost exceeds ten percent of gross block'], c:1, why:'Where completion is overdue or cost has exceeded the original plan, a separate completion schedule is required project-wise showing the amounts expected to be spent, bucketed as less than 1 year, 1 to 2 years, 2 to 3 years and more than 3 years. There is no ten percent trigger and no automatic impairment.' },
  { q:'The promoter shareholding disclosure under Division II of Schedule III requires, for each promoter:', o:['Number of shares and percentage of total shares only','Shares held at the year end and percentage change during the year','Shares held at the year end, percentage of total shares and percentage change during the year','Shares held at the beginning of the year and any pledge created'], c:2, why:'The prescribed table for shares held by promoters at the end of the year shows promoter name, number of shares, percentage of total shares and percentage change during the year, with comparatives for the previous year. Pledge details are not part of this table.' },
  { q:'Where title deeds of immovable property are not held in the name of the company, Division II of Schedule III requires disclosure of all of the following EXCEPT:', o:['Description of item of property and gross carrying value','Title deeds held in the name of, and whether that person is a promoter, director or their relative or employee','The period held and the reason for not being held in the name of the company','The stamp duty and registration charges that would be payable on transfer'], c:3, why:'The prescribed table covers the description and gross carrying value, the name in which the title deed is held, whether that holder is a promoter, director or relative or employee of a promoter or director, the period held and the reason for not being in the company name. Prospective stamp duty is not a required disclosure.' },
  { q:'Which of the following ratios is NOT among those specifically required to be disclosed under Division II of Schedule III?', o:['Debt-Equity Ratio','Trade Receivables Turnover Ratio','Interest Coverage Ratio','Price-Earnings Ratio'], c:3, why:'The prescribed list includes current ratio, debt-equity, debt service coverage, return on equity, inventory turnover, trade receivables turnover, trade payables turnover, net capital turnover, net profit ratio, return on capital employed and return on investment. Price-earnings is a market ratio and is not part of the list.' },
  { q:'When disclosing the required ratios under Division II of Schedule III, the company must:', o:['Disclose the ratio for the current year only','Disclose the ratio and explain any change of 25 percent or more compared with the preceding year','Disclose the ratio and explain any change of 10 percent or more compared with the preceding year','Disclose the ratio and reconcile it to the industry average'], c:1, why:'The instruction requires disclosure of the numerator and denominator along with explanation of items included, and an explanation is required where there is a change of 25 percent or more as compared to the preceding year. A 10 percent threshold is not prescribed.' },
  { q:'Regarding relationship with struck-off companies, Division II of Schedule III requires disclosure of:', o:['Name of the struck off company, nature of transactions, balance outstanding and relationship with the struck off company','Only investments held in companies struck off under Section 248','Only balances outstanding exceeding Rs 1 lakh','Only transactions with companies struck off during the reporting period'], c:0, why:'The disclosure covers transactions with companies struck off under Section 248 of the Companies Act 2013 or Section 560 of the Companies Act 1956, giving the name, nature of transactions such as investments, receivables, payables or shares held, the balance outstanding and the relationship with the struck off company. There is no monetary threshold.' },
  { q:'Where a company has borrowings from banks or financial institutions on the security of current assets, Division II of Schedule III requires disclosure of:', o:['Whether quarterly statements filed agree with the books, and if not, a summary reconciliation and reasons for material discrepancies','Only the sanctioned limit and the amount utilised at year end','Only where sanctioned limits exceed Rs 5 crore in aggregate','Only where the security is a first charge over current assets'], c:0, why:'The disclosure requires a statement of whether the quarterly returns or statements of current assets filed with banks or financial institutions are in agreement with the books, and where not, a summary reconciliation and reasons for material discrepancies. Unlike the CARO clause, the Schedule III disclosure has no Rs 5 crore trigger.' },
  { q:'A company has total income of Rs 120 crore. Under Division II of Schedule III, the rounding off in the financial statements:', o:['Must be to the nearest lakhs, millions or crores, or decimals thereof, and applied uniformly','Is optional and if adopted must be to the nearest hundreds, thousands, lakhs, millions or crores','Must be to the nearest crores only','Is not permitted where total income exceeds Rs 100 crore'], c:0, why:'Where total income is Rs 100 crore or more, rounding off must be to the nearest lakhs, millions or crores, or decimals thereof. Where total income is less than Rs 100 crore, rounding to the nearest hundreds, thousands, lakhs or millions is allowed. Rounding must be used uniformly in the financial statements.' },
  { q:'Under Division II of Schedule III, the basis for deciding the rounding off option is:', o:['Turnover from operations','Total assets','Total income','Paid-up share capital'], c:2, why:'The rounding off instruction in Division II is keyed to total income, with the Rs 100 crore mark separating the two permitted sets of options. Earlier formats used turnover, which makes that the most tempting distractor.' },
  { q:'Under Division II of Schedule III, security deposits given by a company are presented as:', o:['Trade receivables, since they arise in the normal course of business','Loans, in every case','Other financial assets, classified as current or non-current based on the expected period of recovery','Other non-current assets, in every case'], c:2, why:'Security deposits are financial assets that do not meet the definition of trade receivables or loans, so they are presented under other financial assets, split into current and non-current based on when recovery is expected. Classifying them uniformly as non-current ignores the current or non-current test.' },
  { q:'Under Division II of Schedule III, which of the following is presented on the face of the balance sheet rather than only in the notes?', o:['Ageing of trade payables','Reconciliation of the number of shares outstanding at the beginning and end of the year','Names of shareholders holding more than 5 percent of shares','Current tax liabilities (net)'], c:3, why:'Current tax liabilities (net) is a prescribed line item on the face of the balance sheet under current liabilities. Ageing schedules, the 5 percent shareholder list and the share reconciliation are all note disclosures.' },
  { q:'In the statement of profit and loss under Division II of Schedule III, other comprehensive income must be presented:', o:['As a single total after profit for the period','Only in the statement of changes in equity','Within other income above profit before tax','Split into items that will not be reclassified to profit or loss and items that will be reclassified to profit or loss, with related income tax'], c:3, why:'Division II requires other comprehensive income to be split into two groups, items that will not be reclassified to profit or loss and items that will be reclassified to profit or loss, each with the related income tax effect. Presenting a single undivided total does not meet the format.' },
  { q:'Under Division II of Schedule III, revenue from operations must be disclosed separately showing:', o:['Only sale of products and sale of services','Revenue by geographical segment','Gross revenue and excise duty deducted therefrom','Sale of products, sale of services and other operating revenues'], c:3, why:'Revenue from operations is disclosed separately as sale of products including excise duty, sale of services and other operating revenues. Geographical segment disclosure is required by Ind AS 108 and is not part of the Schedule III face format.' }
];
MCQ_BANK['report'] = [
  { q:'An auditor concludes that inventory is materially misstated by Rs 8 crore against profit before tax of Rs 60 crore, and the misstatement is confined to that one balance. The appropriate opinion is:', o:['Qualified opinion, because the effect is material but not pervasive','Adverse opinion, because the amount is significant','Disclaimer of opinion, because management refuses to adjust','Unmodified opinion with an Emphasis of Matter paragraph'], c:0, why:'Under SA 705 a qualified opinion is given when misstatements are material but not pervasive to the financial statements. A confined misstatement in one balance is not pervasive, and an Emphasis of Matter can never substitute for a required modification.' },
  { q:'An auditor is unable to obtain sufficient appropriate audit evidence about a subsidiary that represents 70 percent of consolidated net assets and 80 percent of consolidated revenue. The appropriate report is:', o:['Qualified opinion, since the limitation relates to one component','Adverse opinion, since the amounts involved are large','Disclaimer of opinion, since the possible effects are both material and pervasive','Unmodified opinion with an Other Matter paragraph referring to the component auditor'], c:2, why:'Under SA 705 an inability to obtain evidence whose possible effects are material and pervasive results in a disclaimer of opinion. An adverse opinion applies to detected misstatements, not to a scope limitation, and the size of the component here makes the effect pervasive.' },
  { q:'Under SA 705, pervasive effects are those that, in the auditor judgement:', o:['Exceed the overall materiality level by a factor of three or more','Are not confined to specific elements, or if so confined represent a substantial proportion, or relate to fundamental disclosures','Relate to any item disclosed as a Key Audit Matter','Arise from management failure to maintain adequate books of account'], c:1, why:'SA 705 defines pervasive through three situations, effects that are not confined to specific elements, effects that if confined represent or could represent a substantial proportion of the financial statements, and in relation to disclosures those that are fundamental to users understanding. There is no arithmetic multiple of materiality.' },
  { q:'Under SA 701, communication of Key Audit Matters in the auditor report is mandatory for:', o:['All companies subject to audit under the Companies Act 2013','Audits of complete sets of general purpose financial statements of listed entities, and where otherwise required by law or agreed','Only companies whose paid-up capital exceeds Rs 10 crore','Only where the auditor issues a modified opinion'], c:1, why:'SA 701 applies to audits of complete sets of general purpose financial statements of listed entities and where the auditor otherwise decides or is required by law or regulation to communicate Key Audit Matters. It is not driven by capital size, and KAM reporting is independent of whether the opinion is modified.' },
  { q:'An auditor issues a disclaimer of opinion on the financial statements of a listed company. In relation to Key Audit Matters, the auditor should:', o:['Report all Key Audit Matters as usual','Not communicate Key Audit Matters, unless required by law or regulation','Report only those Key Audit Matters that gave rise to the disclaimer','Convert all Key Audit Matters into Emphasis of Matter paragraphs'], c:1, why:'SA 705 states that when the auditor disclaims an opinion, the report must not include a Key Audit Matters section unless the auditor is required by law or regulation to do so, because doing so would suggest the statements are more credible than the disclaimer implies.' },
  { q:'A matter that gives rise to a qualified opinion is, by definition:', o:['Always also reported separately as a Key Audit Matter with full description','A Key Audit Matter, but it is described in the Basis for Qualified Opinion section and not repeated in the KAM section','Never a Key Audit Matter','Reported as an Emphasis of Matter instead'], c:1, why:'SA 701 explains that a matter giving rise to a modified opinion is by its nature a key audit matter, but it is not described in the Key Audit Matters section. The report describes it in the Basis for Modification section and the KAM section refers to it.' },
  { q:'The distinguishing feature of an Emphasis of Matter paragraph under SA 706 is that it refers to a matter:', o:['Appropriately presented or disclosed in the financial statements and fundamental to users understanding','Not presented or disclosed in the financial statements but relevant to users understanding of the audit','That the auditor was unable to audit','That will be included in the next year Key Audit Matters section'], c:0, why:'An Emphasis of Matter paragraph draws attention to a matter appropriately presented or disclosed in the financial statements that in the auditor judgement is of such importance that it is fundamental to users understanding. A matter not disclosed in the financial statements but relevant to the audit is dealt with in an Other Matter paragraph.' },
  { q:'The financial statements of a company for the current year were audited by the present auditor, and the prior year figures were audited by a predecessor auditor whose report is not being reissued. Under SA 710 read with SA 706, the auditor should:', o:['Include an Emphasis of Matter paragraph describing the predecessor audit','Modify the current year opinion because the prior figures were not audited by the auditor','Include an Other Matter paragraph stating that the prior period statements were audited by another auditor, with the type of opinion and its date','Make no reference, since corresponding figures are not the auditor responsibility'], c:2, why:'Where corresponding figures were audited by a predecessor auditor and that report is not reissued, SA 710 requires an Other Matter paragraph stating that the prior period financial statements were audited by a predecessor auditor, the type of opinion expressed and the date of that report. Emphasis of Matter relates to matters within the financial statements themselves.' },
  { q:'Where a material uncertainty related to going concern exists and is adequately disclosed in the financial statements, SA 570 requires the auditor to:', o:['Issue a qualified opinion and a separate paragraph','Include the matter as an Emphasis of Matter paragraph','Express an unmodified opinion and include a separate section headed Material Uncertainty Related to Going Concern','Disclaim the opinion because future outcomes are uncertain'], c:2, why:'When the use of the going concern basis is appropriate and a material uncertainty exists that is adequately disclosed, the auditor expresses an unmodified opinion and includes a separate section under the heading Material Uncertainty Related to Going Concern. Since the revision of SA 570 this is a dedicated section, not an Emphasis of Matter paragraph.' },
  { q:'Management prepares the financial statements on a going concern basis, but the auditor concludes that the entity will be liquidated and the going concern basis is inappropriate. The auditor should:', o:['Express an adverse opinion','Express a qualified opinion with a Material Uncertainty section','Disclaim the opinion','Express an unmodified opinion with an Emphasis of Matter'], c:0, why:'If the financial statements have been prepared on a going concern basis but in the auditor judgement that basis is inappropriate, SA 570 requires an adverse opinion, because the basis of preparation itself pervades the entire financial statements.' },
  { q:'A material uncertainty related to going concern exists but management refuses to make adequate disclosure of it in the financial statements. The auditor should:', o:['Include the disclosure in the auditor report and express an unmodified opinion','Withdraw from the engagement in all cases','Express a qualified or adverse opinion as appropriate, and state in the Basis for Modification that a material uncertainty exists','Include a Material Uncertainty Related to Going Concern section with an unmodified opinion'], c:2, why:'Where disclosure of a material uncertainty is inadequate, SA 570 requires a qualified or adverse opinion depending on materiality and pervasiveness, and the Basis for Qualified or Adverse Opinion section must state that a material uncertainty exists that may cast significant doubt on the entity ability to continue as a going concern.' },
  { q:'Under Section 143(3) of the Companies Act 2013, the auditor report must state, among other matters, whether:', o:['The company has complied with all applicable tax laws','The company has maintained an adequate cash flow forecast','The internal audit function is adequate','Any director is disqualified from being appointed as a director under Section 164(2)'], c:3, why:'Section 143(3) requires reporting on whether any director is disqualified from being appointed as a director under Section 164(2), along with matters such as adequacy of books of account, agreement of financial statements with the books, compliance with accounting standards and adequacy of internal financial controls with reference to financial statements. Tax compliance generally is not a Section 143(3) matter.' },
  { q:'Under Section 143(12) read with the rules, an auditor who has reason to believe an offence of fraud involving an amount of Rs 2 crore or more is being or has been committed against the company by officers or employees must:', o:['Report to the Central Government, after first reporting to the Board or audit committee seeking their reply within forty five days','Report directly to the Central Government within two days of knowledge, without informing the Board','Report to the audit committee only','Report in the auditor report under CARO and take no further action'], c:0, why:'The auditor must first report the matter to the Board or audit committee within two days of knowledge seeking their reply or observations within forty five days, and then forward the report, reply and comments to the Central Government within fifteen days of receipt of the reply. Frauds below Rs 1 crore are reported to the audit committee or Board instead.' },
  { q:'An identified or suspected fraud involving an amount below the Section 143(12) reporting threshold must be:', o:['Reported to the Central Government in Form ADT-4 in any case','Ignored if it is not material to the financial statements','Reported only in the CARO statement','Reported to the audit committee or Board, and disclosed in the Board report'], c:3, why:'Where the fraud involves an amount less than the prescribed threshold, the auditor reports the matter to the audit committee or the Board, specifying the nature of the fraud, the approximate amount and the parties involved, and the details are disclosed in the Board report. Form ADT-4 is used only for Central Government reporting above the threshold.' },
  { q:'Under SA 700, the Auditor Responsibilities for the Audit of the Financial Statements section must state that the auditor:', o:['Guarantees that the financial statements are free from fraud','Provides limited assurance in accordance with Standards on Auditing','Obtains absolute assurance in respect of error but reasonable assurance in respect of fraud','Obtains reasonable assurance about whether the financial statements as a whole are free from material misstatement, whether due to fraud or error'], c:3, why:'SA 700 requires the report to state that the objectives are to obtain reasonable assurance about whether the financial statements as a whole are free from material misstatement, whether due to fraud or error, and that reasonable assurance is a high level of assurance but is not a guarantee. Absolute assurance is never provided.' },
  { q:'Under SA 700 the ordering of report sections is prescribed. The correct sequence at the start of the auditor report is:', o:['Basis for Opinion, Opinion, Key Audit Matters','Opinion, Key Audit Matters, Basis for Opinion','Key Audit Matters, Opinion, Basis for Opinion','Opinion, Basis for Opinion, Key Audit Matters'], c:3, why:'SA 700 requires the Opinion section to be placed first, followed immediately by the Basis for Opinion section, and where applicable the Key Audit Matters section follows. Placing the basis before the opinion reverses the required order.' },
  { q:'The Basis for Opinion section under SA 700 must include a statement that the auditor:', o:['Is independent of the entity in accordance with the Code of Ethics and has fulfilled other ethical responsibilities','Has verified one hundred percent of the transactions of the entity','Accepts no responsibility to any third party relying on the report','Has relied entirely on the representations of management'], c:0, why:'SA 700 requires the Basis for Opinion section to state that the audit was conducted in accordance with Standards on Auditing, refer to the auditor responsibilities section, include a statement of independence in accordance with the relevant ethical requirements, and state whether the evidence obtained is sufficient and appropriate.' },
  { q:'The auditor issued a qualified opinion in the prior year on a matter that remains unresolved and continues to affect the current year figures. Under SA 710, in the current year report the auditor should:', o:['Express an unmodified opinion since the qualification related to the prior period','Repeat the prior year report as an annexure','Include only an Other Matter paragraph referring to the prior year qualification','Modify the current year opinion and refer in the Basis for Modification to both the current period figures and the corresponding figures'], c:3, why:'Under SA 710 for corresponding figures, if the matter giving rise to the prior period modification is unresolved, the auditor modifies the current period opinion and the Basis for Modification refers to both the current period figures and the corresponding figures where the matter affects their comparability.' }
];
MCQ_BANK['limitedreview'] = [
  { q:'The assurance obtained in a review of interim financial information under SRE 2410 is:', o:['Reasonable assurance, expressed positively','Limited assurance, expressed in the negative form','Absolute assurance on the interim figures only','No assurance, since the engagement is an agreed-upon procedures engagement'], c:1, why:'A review engagement provides limited assurance and the conclusion is expressed in negative form, stating that nothing has come to the auditor attention that causes the auditor to believe the interim financial information is not prepared in accordance with the applicable framework. Reasonable assurance and positive expression belong to an audit.' },
  { q:'Under SRE 2410, the procedures in a review of interim financial information ordinarily consist of:', o:['Tests of controls and substantive tests of details','Inquiry, primarily of persons responsible for financial and accounting matters, and analytical and other review procedures','Physical verification of inventory and external confirmations of receivables','Full substantive procedures at a reduced sample size'], c:1, why:'SRE 2410 describes review procedures as ordinarily limited to making inquiries, primarily of persons responsible for financial and accounting matters, and applying analytical and other review procedures. Tests of controls, confirmations and physical verification are audit procedures and are not ordinarily performed.' },
  { q:'Under SRE 2410, the practitioner performing the review of interim financial information is presumed to:', o:['Be a different firm from the statutory auditor to ensure independence','Be the auditor of the entity annual financial statements','Be appointed by the audit committee for each quarter separately','Have no prior knowledge of the entity, so as to remain objective'], c:1, why:'SRE 2410 deals with a review of interim financial information performed by the independent auditor of the entity, and the standard assumes the reviewer has an understanding of the entity and its internal control obtained through the annual audit. A reviewer without such knowledge would follow a different standard.' },
  { q:'During a limited review, the auditor becomes aware of a matter that causes belief that a material misstatement exists. The auditor should:', o:['Immediately issue a disclaimer of conclusion','Make additional inquiries or perform other procedures to enable a conclusion to be expressed','Convert the engagement into a statutory audit','Report the matter directly to SEBI before completing the review'], c:1, why:'SRE 2410 requires that if a matter comes to the auditor attention that causes belief that the interim financial information may be materially misstated, the auditor should make additional inquiries or perform other procedures sufficient to enable the expression of a conclusion. Escalation of procedures precedes any modification of the conclusion.' },
  { q:'Under SEBI LODR Regulation 33, a listed entity must submit quarterly and year-to-date standalone financial results within:', o:['30 days from the end of the quarter','45 days from the end of the quarter, other than the last quarter','60 days from the end of the quarter','45 days from the end of every quarter including the last quarter'], c:1, why:'Quarterly and year-to-date results must be submitted within forty five days of the end of each quarter other than the last quarter. For the last quarter and the year, audited annual results are submitted within sixty days from the end of the financial year.' },
  { q:'A listed entity submits audited annual financial results for the financial year. Under SEBI LODR Regulation 33, the timeline is:', o:['Within 60 days from the end of the financial year','Within 45 days from the end of the financial year','Within 90 days from the end of the financial year','Within 30 days from the date of the annual general meeting'], c:0, why:'Audited results for the full financial year must be submitted within sixty days from the end of the financial year, together with the audit report and a declaration on unmodified opinion where applicable. The forty five day timeline applies to the quarterly results other than the last quarter.' },
  { q:'A listed entity chooses to submit audited financial results for the last quarter instead of unaudited results with a limited review report. Under SEBI LODR this is:', o:['Permitted, and in that case the entity may submit audited results for the last quarter along with the annual audited results','Not permitted, since the last quarter results must always be reviewed','Permitted only with prior approval of the stock exchange','Permitted only for entities with a market capitalisation above a prescribed threshold'], c:0, why:'The regulation allows a listed entity to submit unaudited results for the last quarter with a limited review report, or alternatively to submit audited results for the last quarter along with the annual audited results. There is no exchange approval or market capitalisation condition.' },
  { q:'Where a listed entity has subsidiaries, SEBI LODR requires the limited review or audit of quarterly consolidated results to cover subsidiaries that account for:', o:['At least 60 percent each of consolidated revenue, assets and profits','All subsidiaries without exception','At least 80 percent each of consolidated revenue, assets and profits','Only subsidiaries that are themselves listed'], c:2, why:'The limited review or audit reports submitted on a consolidated basis must cover those subsidiaries that in aggregate account for at least eighty percent of each of consolidated revenue, assets and profits respectively. Sixty percent is a near-miss figure not used in the regulation.' },
  { q:'If a listed entity submits unaudited quarterly financial results, SEBI LODR requires that they be accompanied by:', o:['A limited review report from the statutory auditor','A certificate from the chief financial officer only','A management representation letter filed with the exchange','An audit report from a firm of the entity choosing'], c:0, why:'Unaudited quarterly and year-to-date results must be accompanied by a limited review report from the statutory auditor of the listed entity. A CFO certification is a separate requirement and cannot substitute for the review report.' },
  { q:'The conclusion in an unmodified limited review report under SRE 2410 states that:', o:['The interim financial information gives a true and fair view in accordance with the applicable framework','The interim financial information is free from material misstatement','Nothing has come to our attention causing us to believe the interim information is not prepared, in all material respects, per the framework','In our opinion, the interim financial information is fairly presented in all material respects'], c:2, why:'The negative form of conclusion is the defining feature of a review report. A statement that the information gives a true and fair view or is fairly presented is the positive expression used in an audit opinion and would overstate the assurance obtained.' },
  { q:'During a limited review the auditor concludes that a material misstatement exists in the interim financial information, but the effect is not pervasive. The appropriate report is:', o:['A qualified conclusion, with a paragraph describing the matter placed before the conclusion paragraph','An adverse conclusion','A disclaimer of conclusion','An unmodified conclusion with an Emphasis of Matter paragraph'], c:0, why:'SRE 2410 requires a qualified conclusion where a material misstatement exists whose effect is not pervasive, with the matter described in a paragraph preceding the conclusion. An adverse conclusion is reserved for effects that are material and pervasive.' },
  { q:'In a limited review, the auditor is unable to complete the review because management imposes a scope limitation whose possible effects are material and pervasive. The auditor should:', o:['Issue a qualified conclusion','Issue an adverse conclusion','Not provide a conclusion, and communicate the matter to those charged with governance and consider whether a report is appropriate','Convert the review to an audit and issue an audit opinion'], c:2, why:'SRE 2410 provides that when management imposes a limitation that prevents the auditor from completing the review, the auditor should not provide a conclusion and should communicate in writing to those charged with governance the reason why the review cannot be completed, considering whether issuing a report remains appropriate.' },
  { q:'A key difference between a limited review and an audit of interim financial information is that in a review the auditor:', o:['Is not required to be independent of the entity','Does not obtain an understanding of the entity and its environment','Is not required to test the operating effectiveness of internal controls or corroborate inquiries with external confirmations','Is not required to consider events after the interim date'], c:2, why:'A review does not ordinarily involve testing operating effectiveness of controls, external confirmations, physical inspection or observation, which is why only limited assurance results. Independence, an understanding of the entity and consideration of subsequent events remain necessary in a review.' },
  { q:'Under SRE 2410, if the auditor identifies a matter causing doubt about whether a material adjustment is needed for the interim information to be in accordance with the framework, and management refuses to adjust, the auditor should:', o:['Withdraw immediately in every case','Report only in the annual audit report','Modify the conclusion and, where appropriate, communicate with those charged with governance and consider whether to withdraw or resign','Issue an unmodified conclusion with an explanatory paragraph'], c:2, why:'Where management does not correct a matter that would make the interim information materially misstated, the auditor modifies the conclusion, communicates the matter to those charged with governance and if the matter is not resolved considers whether to withdraw from the engagement or resign from the appointment as auditor.' },
  { q:'Under SEBI LODR, the requirement to obtain a limited review report on quarterly results applies to:', o:['Only entities in the top 500 by market capitalisation','Only entities that have subsidiaries','Only entities whose paid-up capital exceeds Rs 10 crore','All listed entities with listed specified securities submitting unaudited quarterly results'], c:3, why:'Regulation 33 applies to listed entities with specified securities and requires that unaudited quarterly and year-to-date results be subjected to a limited review by the statutory auditor. It is not confined to any market capitalisation ranking or capital size.' },
  { q:'A limited review report on quarterly results is issued by:', o:['Any chartered accountant in practice appointed by the board','A peer reviewed firm other than the statutory auditor','The internal auditor, since the review is not an audit','The statutory auditor of the listed entity, or in the case of certain public sector entities an auditor as specified by the regulation'], c:3, why:'SEBI LODR requires the limited review to be carried out by the statutory auditor of the listed entity, with a specific accommodation for certain public sector entities where the auditor may be appointed in the prescribed manner. Engaging a different firm or the internal auditor would not satisfy the regulation.' },
  { q:'Materiality in planning and performing a review of interim financial information under SRE 2410 is determined:', o:['At a lower level than for the annual audit, since interim periods are shorter','Only after the review procedures have been completed','At the same absolute amount as the annual audit materiality in all cases','In relation to the interim financial information, recognising there is a greater risk that misstatements go undetected in a review'], c:3, why:'The auditor determines materiality in relation to the interim financial information being reviewed, applying professional judgement while recognising that because review procedures are less extensive there is a greater risk that misstatements will not be detected. Materiality is set during planning, not afterwards.' },
  { q:'Under SEBI LODR, where a limited review or audit report on financial results contains a modification, the listed entity must:', o:['Withhold the results until the modification is resolved','Restate the previous four quarters of results','Obtain a second opinion from another auditor before filing','Disclose the impact of the modification and submit a statement on the impact along with the results'], c:3, why:'The regulation requires a listed entity to disclose the cumulative impact of audit qualifications or modifications and file a statement on impact of audit qualifications along with the annual audited results. Results cannot be withheld beyond the prescribed timeline on account of a modification.' }
];
