function startMockSpeech(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Voice recognition is not supported in this browser. Please type your answer.'); return; }
  const rec = new SR();
  rec.lang = 'en-IN';
  const inp = document.getElementById('mockAnswerInput');
  rec.onstart = () => { if(inp) inp.placeholder = 'Listening to your speech… Speak clearly now.'; };
  rec.onresult = (e) => {
    const text = Array.from(e.results).map(r => r[0].transcript).join(' ');
    if(inp) inp.value = text;
  };
  rec.start();
}

function evaluateMockAnswer(qid){
  const inp = document.getElementById('mockAnswerInput');
  const btn = document.getElementById('evaluateMockBtn');
  const box = document.getElementById('mockFeedbackBox');
  const txt = document.getElementById('mockFeedbackText');
  const badge = document.getElementById('mockScoreBadge');
  const answer = (inp ? inp.value : '').trim();
  if(!answer){ alert('Please speak or type your answer first.'); return; }
  const questionItem=findBaseQ(qid);
  if(!questionItem){ if(txt) txt.textContent='This question could not be loaded. Please try the next question.'; return; }
  const question=getText(questionItem,'q');
  const referenceAnswer=answerPlainText(getText(questionItem,'a'));

  if(btn){ btn.disabled = true; btn.textContent = 'Evaluating…'; }
  if(box) box.classList.remove('hidden');
  if(txt) txt.textContent = 'Analyzing technical accuracy, accounting standards, and audit assertions…';

  fetch('/.netlify/functions/chat',{
    method:'POST',
    headers:{'content-type':'application/json','x-auth':auth.token},
    body:JSON.stringify({task:'grade',question,candidateAnswer:answer,referenceAnswer})
  }).then(r=>r.json()).then(d=>{
    if(d.error || d.score==null) throw new Error(d.error||'No score was returned.');
    if(badge) badge.textContent = `Technical Score: ${d.score}/10`;
    if(txt) txt.innerHTML = `<span class="block"><b class="text-emerald-300">What worked:</b> ${esc(d.strengths)}</span><span class="block mt-2"><b class="text-amber-300">How to improve:</b> ${esc(d.improvements)}</span>`;
    if(btn){ btn.disabled=false; btn.textContent='Try Next Question →'; btn.onclick=()=>renderMockInterview(); }
  }).catch(err=>{
    if(txt) txt.textContent=(err&&err.message)||'Could not evaluate the answer right now. Please try again.';
    if(badge) badge.textContent='Not scored';
    if(btn){ btn.disabled=false; btn.textContent='Evaluate with AI →'; }
  });
}

function calculateSalary(e){
  e.preventDefault();
  const status = document.getElementById('estStatus').value;
  const attempt = document.getElementById('estAttempt').value;
  const firm = document.getElementById('estFirm').value;
  const exp = document.getElementById('estExp').value;

  let role = 'Audit Associate / Advanced Analyst';
  let low = 4.5;
  let high = 7.0;

  if (status === 'qualified') {
    if (exp === '0') {
      role = attempt === '1' ? 'Audit Senior / Consultant' : 'Audit Associate / Senior Associate';
      low = attempt === '1' ? 11.5 : 9.5;
      high = attempt === '1' ? 13.5 : 11.5;
    } else if (exp === '1') {
      role = 'Audit Senior Associate';
      low = 12.0; high = 15.0;
    } else {
      role = 'Assistant Manager — Audit & Assurance';
      low = 16.0; high = 21.0;
    }
  } else if(status === 'finalist'){
    role='Audit Associate / Advanced Analyst';
    low=6.5; high=9.0;
  }

  const firmAdjustment=firm==='big4'?0.8:firm==='mid'?0.3:0;
  low+=firmAdjustment; high+=firmAdjustment;
  const ctc=`₹${low.toFixed(1)} L - ₹${high.toFixed(1)} L / year`;

   ============================================================ */
const areaFilter = {}; // areaId -> {status:'all'|'flag'|'done'|'todo', search:''}
/* ============================================================
   MCQ TEST ENGINE (per area) — additive; never edits the Q&A bank
   ============================================================ */
let mcqRun = null;   // { areaId, order:[idx...], pos, answers:{qIdx:chosen} }

function mcqStat(areaId){ return (store.mcq && store.mcq[areaId]) || {}; }
function mcqRecord(areaId, pct, correct, total){
  store.mcq = store.mcq || {};
  const prev = store.mcq[areaId] || {};
  store.mcq[areaId] = {
    best: Math.max(prev.best || 0, pct), last: pct,
    correct, total, attempts: (prev.attempts || 0) + 1, at: new Date().toISOString()
  };
  save();
}
function mcqShuffle(n){
  const a = Array.from({length:n}, (_,i)=>i);
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function mcqScoreOf(run, bank){
  let correct=0; for(const k in run.answers){ if(bank[k] && run.answers[k]===bank[k].c) correct++; }
  return correct;
}

function mcqSectionHTML(area){
  const bank = mcqsFor(area.id);
  const a = areaAccent(area);
  if(!bank.length){
    return `<div class="rounded-2xl p-5 bg-white/60 dark:bg-white/[.03] glass border border-dashed border-slate-300 dark:border-white/10 text-center">

      <p class="text-sm font-semibold text-slate-500 dark:text-slate-400">MCQ test for this area is coming soon.</p>
    </div>`;
  }
  const st = mcqStat(area.id);
  const run = (mcqRun && mcqRun.areaId===area.id) ? mcqRun : null;

  // ---- idle / summary ----
  if(!run){
    const badge = st.best!=null ? `<span class="px-2.5 py-1 rounded-lg text-xs font-bold ${st.best>=70?'bg-emerald-500/15 text-emerald-600 dark:text-emerald-300':'bg-amber-500/15 text-amber-600 dark:text-amber-300'}">Best ${st.best}%</span>` : '';
    return `<div class="rounded-2xl p-5 sm:p-6 bg-gradient-to-br from-white/80 to-white/50 dark:from-white/[.06] dark:to-white/[.02] glass border border-slate-200/70 dark:border-white/10 shadow-sm">
      <div class="flex items-start justify-between gap-3 flex-wrap">
        <div>
          <h2 class="font-display text-lg font-extrabold flex items-center gap-2">🧠 MCQ Test <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-rose-500/15 text-rose-500">Hard</span></h2>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${bank.length} tough multiple-choice questions on ${esc(areaMeta(area).title)}. Instant feedback with a short explanation for every answer.</p>

        </div>
        ${badge}
      </div>
      <button data-action="mcq-start" data-area="${area.id}" class="mt-4 w-full sm:w-auto px-5 py-3 rounded-xl text-sm font-bold bg-gradient-to-r ${a.grad} text-white shadow hover:opacity-95 transition">
        ${st.attempts?'🔁 Retake test':'▶ Start test'} <span class="opacity-80">· ${bank.length} Qs</span>
      </button>
    </div>`;
  }

  // ---- results ----
  if(run.pos >= run.order.length){
    const correct = mcqScoreOf(run, bank);
    const total = run.order.length;
    const pct = Math.round(correct/total*100);
    const good = pct>=70;
    const review = run.order.map((qi,n)=>{
      const m = bank[qi]; const chosen = run.answers[qi];
      const ok = chosen===m.c;
      return `<div class="rounded-xl p-3.5 border ${ok?'border-emerald-400/30 bg-emerald-500/[.06]':'border-rose-400/30 bg-rose-500/[.06]'}">
        <p class="text-[13px] font-semibold flex gap-2"><span>${ok?'✅':'❌'}</span><span>${n+1}. ${esc(m.q)}</span></p>

        ${ok?'':`<p class="text-[12px] mt-0.5 ml-6 text-emerald-600 dark:text-emerald-300">Correct: ${esc(m.o[m.c])}</p>`}

      </div>`;
    }).join('');
    return `<div class="rounded-2xl p-5 sm:p-6 bg-white/75 dark:bg-white/[.04] glass border border-slate-200/70 dark:border-white/10 shadow-sm">
      <div class="text-center py-3">
        <p class="text-4xl mb-1">${good?'🎉':'📚'}</p>
        <p class="font-display text-3xl font-black ${good?'text-emerald-500':'text-amber-500'}">${pct}%</p>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${correct} of ${total} correct${good?' — interview ready on this area.':' — revise the misses below and retake.'}</p>
        <button data-action="mcq-start" data-area="${area.id}" class="mt-4 px-5 py-2.5 rounded-xl text-sm font-bold bg-gradient-to-r ${a.grad} text-white shadow">🔁 Retake</button>

      </div>
      <div class="mt-5 space-y-2.5">${review}</div>
    </div>`;
  }

  // ---- running ----
  const qi = run.order[run.pos];
  const m = bank[qi];
  const chosen = run.answers[qi];
  const answered = chosen != null;
  const pctDone = Math.round(run.pos/run.order.length*100);
  const perm = (run.perms && run.perms[qi]) || [0,1,2,3];
  const opts = perm.map((orig,disp)=>{
    const txt = m.o[orig];

      if(orig===m.c){ cls='border-emerald-400/60 bg-emerald-500/10'; mark='<span class="h-6 w-6 shrink-0 grid place-items-center rounded-lg bg-emerald-500 text-white text-[11px] font-bold">✓</span>'; }
      else if(orig===chosen){ cls='border-rose-400/60 bg-rose-500/10'; mark='<span class="h-6 w-6 shrink-0 grid place-items-center rounded-lg bg-rose-500 text-white text-[11px] font-bold">✕</span>'; }
      else { cls='border-slate-200/60 dark:border-white/5 opacity-60'; }

    return `<button ${answered?'disabled':''} data-action="mcq-answer" data-area="${area.id}" data-opt="${orig}"

      ${mark}<span class="flex-1">${esc(txt)}</span></button>`;
  }).join('');

  return `<div class="rounded-2xl p-5 sm:p-6 bg-white/75 dark:bg-white/[.04] glass border border-slate-200/70 dark:border-white/10 shadow-sm">
    <div class="flex items-center justify-between gap-3 mb-3">
      <p class="text-xs font-bold text-slate-500 dark:text-slate-400">Question ${run.pos+1} of ${run.order.length}</p>
      <button data-action="mcq-exit" data-area="${area.id}" class="text-xs font-semibold text-slate-400 hover:text-rose-500">✕ Exit</button>
    </div>
    <div class="h-1.5 rounded-full bg-slate-200/80 dark:bg-white/10 overflow-hidden mb-4">
      <div class="h-full rounded-full bg-gradient-to-r ${a.bar} transition-all duration-300" style="width:${pctDone}%"></div>
    </div>
    <p class="text-[15px] font-semibold leading-snug mb-4">${esc(m.q)}</p>
    <div class="space-y-2.5">${opts}</div>
    ${answered?`<div class="mt-4 rounded-xl p-3.5 bg-slate-50 dark:bg-white/[.04] border border-slate-200/70 dark:border-white/10">
      <p class="text-[13px] ${chosen===m.c?'text-emerald-600 dark:text-emerald-300':'text-rose-500'} font-bold mb-1">${chosen===m.c?'✅ Correct':'❌ Not quite'}</p>
      <p class="text-[13px] text-slate-600 dark:text-slate-300 leading-relaxed"><b>Why:</b> ${esc(m.why)}</p>
      <button data-action="mcq-next" data-area="${area.id}" class="mt-3 w-full sm:w-auto px-5 py-2.5 rounded-xl text-sm font-bold bg-gradient-to-r ${a.grad} text-white shadow">
        ${run.pos+1 >= run.order.length ? 'See my score →' : 'Next question →'}
      </button>
    </div>`:''}
  </div>`;
}

/* Examples: user override (array) wins; else fall back to the base single example.
   Each example carries a stable id so attachments stay linked across edits/reorders. */
function getExamples(q){
  const st = store.q[q.id] || {};
  let arr;
  if (Array.isArray(st.examples)) arr = st.examples;
  else if (q.ex) arr = [{ label:'💡 Example', text:q.ex }];
  else arr = [];
  return arr.map((ex,idx)=>({ id: ex.id || (q.id+'-ex'+idx), label: ex.label, text: ex.text }));
}
function findBaseQ(id){
  for(const ar of AREAS){ const q=ar.questions.find(x=>x.id===id); if(q) return q; }
  for(const areaId in (store.custom||{})){ const c=(store.custom[areaId]||[]).find(x=>x.id===id); if(c) return c; }
  return null;
}
function isEdited(id){
  const s = store.q[id];
  return !!(s && (s.qOverride!=null || s.aOverride!=null || Array.isArray(s.examples)));
}
/* One editable example row inside the editor */

function practiceScoreClass(score){
  if(score>=8) return 'border-emerald-400/30 bg-emerald-500/5';
  if(score>=5) return 'border-amber-400/30 bg-amber-500/5';
  return 'border-rose-400/30 bg-rose-500/5';
}
let practiceRecognition=null, practiceRecordingId=null;
function togglePracticeMic(id, btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert("Voice input isn't supported in this browser. Please type your answer instead, or try Chrome or Edge."); return; }
  const ta=document.querySelector(`[data-practice="${id}"]`); if(!ta) return;
  if(practiceRecognition && practiceRecordingId===id){ practiceRecognition.stop(); return; }
  if(practiceRecognition){ practiceRecognition.stop(); }
  const recog=new SR();
  recog.lang='en-IN'; recog.continuous=true; recog.interimResults=true;
  let finalText = ta.value ? ta.value.trim()+' ' : '';
  practiceRecognition=recog; practiceRecordingId=id;
  btn.classList.add('text-rose-500','bg-rose-500/10'); btn.title='Stop recording';
  recog.onresult=(e)=>{
    let interim='';
    for(let idx=e.resultIndex; idx<e.results.length; idx++){
      const transcript=e.results[idx][0].transcript;
      if(e.results[idx].isFinal) finalText += transcript + ' ';
      else interim += transcript;
    }
    ta.value=(finalText+interim).trim();
  };
  recog.onerror=()=>{};
  recog.onend=()=>{
    practiceRecognition=null; practiceRecordingId=null;
    btn.classList.remove('text-rose-500','bg-rose-500/10'); btn.title='Speak your answer';
    const st=qs(id); st.practiceAnswer=ta.value; save();
  };
  recog.start();
}
function submitPracticeAnswer(id, btn){
  const ta=document.querySelector(`[data-practice="${id}"]`);
  const candidateAnswer=(ta?ta.value:'').trim();
  const msg=document.getElementById('practiceMsg-'+id);
  if(!candidateAnswer){ if(ta) ta.focus(); if(msg){ msg.textContent='Please write or speak your answer first.'; msg.className='text-xs text-rose-500'; } return; }
  const base=findBaseQ(id); if(!base) return;
  const question=getText(base,'q'), referenceAnswer=answerPlainText(getText(base,'a'));
  btn.disabled=true; const orig=btn.innerHTML; btn.innerHTML='Checking… <span class="inline-block animate-spin">◌</span>';
  if(msg){ msg.textContent=''; msg.className='text-xs text-slate-400'; }
  fetch('/.netlify/functions/chat',{method:'POST',headers:{'content-type':'application/json','x-auth':auth.token},body:JSON.stringify({task:'grade',question,candidateAnswer,referenceAnswer})})
    .then(r=>r.json()).then(d=>{
      btn.disabled=false; btn.innerHTML=orig;
      if(d.error || d.score==null){ if(msg){ msg.textContent=d.error||'Could not check your answer — please try again.'; msg.className='text-xs text-rose-500'; } return; }
      const st=qs(id);
      st.practiceAnswer=candidateAnswer; st.practiceScore=d.score; st.practiceStrengths=d.strengths; st.practiceImprovements=d.improvements; st.practiceGradedAt=new Date().toISOString();
      save(); refresh();
    }).catch(()=>{ btn.disabled=false; btn.innerHTML=orig; if(msg){ msg.textContent='Network error — please try again.'; msg.className='text-xs text-rose-500'; } });
}

const app = document.getElementById('app');
function richEditorByTarget(target){ return document.getElementById(target); }
function captureRichSelection(target){
  const editor=richEditorByTarget(target), sel=window.getSelection();
  if(!editor||!sel||!sel.rangeCount) return;
  const range=sel.getRangeAt(0);
  if(editor.contains(range.commonAncestorContainer)) editor._richRange=range.cloneRange();
}
function restoreRichSelection(editor){
  if(!editor) return;
  editor.focus();
  if(editor._richRange){
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(editor._richRange);
  }
}
function wrapRichSelection(editor,tag,styleName,styleValue,href){
  const sel=window.getSelection(); if(!sel||!sel.rangeCount) return false;
  const range=sel.getRangeAt(0);
  if(range.collapsed||!editor.contains(range.commonAncestorContainer)) return false;
  const wrap=document.createElement(tag);
  if(styleName) wrap.style[styleName]=styleValue;
  if(href){ wrap.href=href; wrap.target='_blank'; wrap.rel='noopener noreferrer'; }
  try{
    wrap.appendChild(range.extractContents()); range.insertNode(wrap);
    range.selectNodeContents(wrap); sel.removeAllRanges(); sel.addRange(range);
    return true;
  }catch(_){ return false; }
}
function runRichCommand(target,cmd,value){
  const editor=richEditorByTarget(target); if(!editor) return;
  restoreRichSelection(editor);
  let applied=false;
  try{ applied=document.execCommand(cmd,false,value||null); }catch(_){}
  if(!applied){
    const tags={bold:'strong',italic:'em',underline:'u'};
    if(tags[cmd]) wrapRichSelection(editor,tags[cmd]);
    else if(cmd==='foreColor') wrapRichSelection(editor,'span','color',value);
    else if(cmd==='hiliteColor') wrapRichSelection(editor,'span','backgroundColor',value);
    else if(cmd==='createLink') wrapRichSelection(editor,'a',null,null,value);
  }
  captureRichSelection(target);
}
function insertRichHTML(target,html){
  const editor=richEditorByTarget(target); if(!editor) return;
  restoreRichSelection(editor);
  try{ document.execCommand('insertHTML',false,sanitizeRichHTML(html)); }catch(_){}
  captureRichSelection(target);
}
function applyRichStyle(target,styleName,value){
  const editor=richEditorByTarget(target); if(!editor||!value) return;
  restoreRichSelection(editor);
  if(!wrapRichSelection(editor,'span',styleName,value)){
    const sel=window.getSelection(); if(!sel||!sel.rangeCount) return;
    const range=sel.getRangeAt(0); if(!editor.contains(range.commonAncestorContainer)) return;
    const span=document.createElement('span'); span.style[styleName]=value; span.append('\u200B');
    range.insertNode(span); range.setStart(span.firstChild,1); range.collapse(true); sel.removeAllRanges(); sel.addRange(range);
  }
  captureRichSelection(target);
}
const INLINE_IMAGE_TYPES=new Set(['image/png','image/jpeg','image/webp','image/gif']);
let pendingRichImageTarget=null;
function normalizeInlineImageFile(file){
  if(file.name) return file;
  const ext=file.type==='image/jpeg'?'jpg':file.type.split('/')[1]||'png';
  return new File([file],`snapshot-${Date.now()}.${ext}`,{type:file.type||'image/png'});
}
async function optimizeInlineImage(file){
  file=normalizeInlineImageFile(file);
  if(!INLINE_IMAGE_TYPES.has(file.type)) throw new Error('Please choose a PNG, JPG, WEBP or GIF image.');
  if(file.size>15*1024*1024) throw new Error('That image is too large. Please use an image below 15 MB.');
  if(file.type==='image/gif'){
    if(file.size>5*1024*1024) throw new Error('Animated GIFs must be below 5 MB.');
    return file;
  }
  let bitmap;
  try{ bitmap=await createImageBitmap(file); }catch(_){ return file; }
  const scale=Math.min(1,1800/Math.max(bitmap.width,bitmap.height));
  if(scale===1 && file.size<=4.5*1024*1024){ bitmap.close(); return file; }
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(bitmap.width*scale)); canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height); bitmap.close();
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.88));
  if(!blob) throw new Error('Could not prepare that image.');
  if(blob.size>5*1024*1024) throw new Error('The optimized image is still too large. Please crop it and try again.');
  const base=file.name.replace(/\.[^.]+$/,'')||'snapshot';
  return new File([blob],base+'.webp',{type:'image/webp'});
}
function insertPendingRichImage(target,file){
  const editor=richEditorByTarget(target); if(!editor) return;
  file=normalizeInlineImageFile(file);
  if(!INLINE_IMAGE_TYPES.has(file.type)){ alert('Please choose a PNG, JPG, WEBP or GIF image.'); return; }
  if(file.size>15*1024*1024){ alert('That image is too large. Please use an image below 15 MB.'); return; }
  const key='pending-'+Date.now()+'-'+Math.round(Math.random()*1e9);

        const st=qs(id); st.aOverride=aiRichAnswer(d.answer);
        if(d.example){ const cleanExample=aiPlainText(d.example); const cur=getExamples(base).map(e=>({id:e.id,label:e.label,text:e.text})); if(cur[0]){ cur[0].text=cleanExample; } else { cur.push({id:id+'-ex'+Date.now(),label:'💡 Example',text:cleanExample}); } st.examples=cur; }
        st._open=true; save(); refresh();
      }).catch(()=>{ btn.innerHTML=orig; alert('Refine failed — check your connection.'); });
    return;
  }
  if (act==='delete-custom'){
    const ar=btn.dataset.area;
    if (confirm('Delete this custom question?')){
      store.custom[ar] = (store.custom[ar]||[]).filter(c=>c.id!==id);
      delete store.q[id]; save(); renderArea(AREA_BY_ID[ar]);
    }
    return;
  }
});

function refresh(){
  const hash = location.hash||'#/';
  if(hash==='#/admin'){ renderAdmin(); setHeaderProgress(); return; }
  if(hash==='#/profile'){ renderProfile(); setHeaderProgress(); return; }
  if(hash==='#/interviews'){ renderInterviews(); setHeaderProgress(); return; }
  if(hash==='#/queries'){ renderQueries(); setHeaderProgress(); return; }
  if(hash==='#/announcements'){ renderAnnouncements(); setHeaderProgress(); return; }
  if(hash==='#/notifications'){ renderNotifications(); setHeaderProgress(); return; }
  if(hash==='#/questions'){ renderQuestions(); setHeaderProgress(); return; }
  if(hash==='#/vault'){ renderVault(); setHeaderProgress(); return; }   // keep vault selection
  if(hash==='#/history'){ renderHistory(); setHeaderProgress(); return; }

  if (m && AREA_BY_ID[m[1]]) renderArea(AREA_BY_ID[m[1]]); else renderHome();
  setHeaderProgress();
}

/* ============================================================
   DRAG-TO-REORDER (within an area)
   ============================================================ */
let dragId = null;
function currentAreaId(){ const m=(location.hash||'').match(/^#\/a\/([\w-]+)/); return m?m[1]:null; }
function clearDropIndicators(){ document.querySelectorAll('.drop-before,.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after')); }

/* Pressing the grip arms the card for native drag; a plain click disarms it. */
app.addEventListener('mousedown', e => {
  const h = e.target.closest('[data-drag-handle]');
  if (!h || h.dataset.disabled) return;
  const card = h.closest('.q-card'); if (card) card.setAttribute('draggable','true');
});
app.addEventListener('mouseup', () => {
  document.querySelectorAll('.q-card[draggable="true"]').forEach(c=>c.removeAttribute('draggable'));
});
app.addEventListener('dragstart', e => {
  const card = e.target.closest('.q-card');
  if (!card || card.getAttribute('draggable')!=='true') { return; }
  dragId = card.dataset.qid;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragId); } catch(_){}
  requestAnimationFrame(()=>card.classList.add('dragging'));
});
app.addEventListener('dragover', e => {
  if (!dragId) return;
  const card = e.target.closest('.q-card'); if (!card) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  clearDropIndicators();
  if (card.dataset.qid === dragId) return;
  const r = card.getBoundingClientRect();
  card.classList.add((e.clientY - r.top) > r.height/2 ? 'drop-after' : 'drop-before');
});
app.addEventListener('drop', e => {
  if (!dragId) return;
  const card = e.target.closest('.q-card'); if (!card) return;
  e.preventDefault();
  const targetId = card.dataset.qid;
  const r = card.getBoundingClientRect();
  const after = (e.clientY - r.top) > r.height/2;
  const dropped = dragId; dragId = null; clearDropIndicators();
  if (targetId !== dropped) commitReorder(dropped, targetId, after);
});
app.addEventListener('dragend', () => {
  dragId = null; clearDropIndicators();
  document.querySelectorAll('.q-card').forEach(c=>{ c.classList.remove('dragging'); c.removeAttribute('draggable'); });
});

function commitReorder(dropId, targetId, after){
  const areaId = currentAreaId(); if (!areaId) return;
  const area = AREA_BY_ID[areaId];
  const ids = orderedAreaQuestions(area).map(q=>q.id);
  const from = ids.indexOf(dropId); if (from<0) return;
  ids.splice(from,1);
  let ti = ids.indexOf(targetId);
  if (ti<0) ti = ids.length-1;
  ids.splice(after ? ti+1 : ti, 0, dropId);
  if (!store.order) store.order = {};
  store.order[areaId] = ids;
  save();
  renderArea(area);
}

    const change={};
    if(title!==area.title) change.title=title;

  const wrap = document.createElement('div');
  wrap.id='addModal';
  wrap.className='fixed inset-0 z-50 grid place-items-center p-4 bg-black/50 backdrop-blur-sm';

      <button id="addCancel" class="px-4 py-2 rounded-lg text-sm font-semibold border border-slate-200 dark:border-white/10">Cancel</button>

  };
  document.getElementById('addQ').focus();
}

/* ============================================================
   AI TUTOR CHATBOT (Gemini via /.netlify/functions/chat)
   ============================================================ */
(function(){
  const CHAT_KEY='mb4_chat';
  const fab=document.getElementById('chatFab');
  const panel=document.getElementById('chatPanel');
  const msgsEl=document.getElementById('chatMsgs');
  const input=document.getElementById('chatInput');
  const sendBtn=document.getElementById('chatSend');
  if(!fab||!panel) return;
  let chat=[]; let busy=false;
  try{ chat=JSON.parse(localStorage.getItem(CHAT_KEY))||[]; }catch(e){ chat=[]; }

  const SUGGEST=[
    'Explain Ind AS 115 in 30 seconds',
    'Auditor responsibilities for fraud (SA 240)?',
    'How do I answer "tell me about yourself"?',
    'Difference: TOC vs substantive procedures?'
  ];

  function chatEsc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmtBot(t){
    // light markdown: **bold**, `code`, and dash bullets; preserve line breaks
    let h=chatEsc(t);
    h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code class="px-1 rounded bg-black/10 dark:bg-white/10">$1</code>');
    return h;
  }
  function bubble(role,html,extra){
    if(role==='user') return `<div class="flex justify-end"><div class="max-w-[85%] rounded-2xl rounded-br-sm bg-brand-500 text-white px-3.5 py-2 text-sm whitespace-pre-wrap">${html}</div></div>`;
    return `<div class="flex justify-start"><div class="max-w-[90%] rounded-2xl rounded-bl-sm bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 px-3.5 py-2 text-sm text-slate-700 dark:text-slate-200 whitespace-pre-wrap leading-relaxed">${html}${extra||''}</div></div>`;
  }
  function render(){
    if(!chat.length){
      msgsEl.innerHTML=`<div class="text-center pt-4 pb-2">
        <div class="text-4xl mb-2">🤖</div>
        <p class="font-display font-bold text-slate-700 dark:text-slate-200">Hi! I'm your Audit Buddy.</p>
        <p class="text-xs text-slate-400 mt-1 mb-3">Ask me anything about audit, Ind AS, standards, or interview answers.</p>
        <div class="flex flex-col gap-1.5">${SUGGEST.map(s=>`<button data-suggest="${chatEsc(s)}" class="text-left text-xs px-3 py-2 rounded-lg bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 hover:border-brand-400 transition">${chatEsc(s)}</button>`).join('')}</div>
      </div>`;
      msgsEl.querySelectorAll('[data-suggest]').forEach(b=>b.addEventListener('click',()=>{ input.value=b.dataset.suggest; send(); }));
      return;
    }
    msgsEl.innerHTML=chat.map(m=>bubble(m.role, m.role==='user'?chatEsc(m.text):fmtBot(m.text))).join('')
      + (busy?`<div class="flex justify-start"><div class="rounded-2xl rounded-bl-sm bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 px-4 py-3"><span class="inline-flex gap-1"><span class="h-2 w-2 rounded-full bg-slate-400 animate-bounce"></span><span class="h-2 w-2 rounded-full bg-slate-400 animate-bounce" style="animation-delay:.15s"></span><span class="h-2 w-2 rounded-full bg-slate-400 animate-bounce" style="animation-delay:.3s"></span></span></div></div>`:'');
    msgsEl.scrollTop=msgsEl.scrollHeight;
  }
  function save(){ try{ localStorage.setItem(CHAT_KEY, JSON.stringify(chat.slice(-40))); }catch(e){} }

  function send(){
    const text=(input.value||'').trim();
    if(!text||busy) return;
    chat.push({role:'user', text}); input.value=''; input.style.height='auto';
    busy=true; render(); save();
    fetch('/.netlify/functions/chat',{method:'POST',headers:{'content-type':'application/json','x-auth':auth.token},body:JSON.stringify({messages:chat})})
      .then(r=>r.json())
      .then(d=>{ busy=false; chat.push({role:'model', text:(d&&d.reply)||"Sorry, I didn't catch that."}); render(); save(); })
      .catch(()=>{ busy=false; chat.push({role:'model', text:"I couldn't reach the server — check your connection and try again."}); render(); save(); });
  }

  function open(){ panel.classList.remove('hidden'); panel.classList.add('flex'); fab.classList.add('hidden'); render(); setTimeout(()=>input.focus(),50); }
  function close(){ panel.classList.add('hidden'); panel.classList.remove('flex'); fab.classList.remove('hidden'); }
  fab.addEventListener('click',open);
  document.getElementById('chatClose').addEventListener('click',close);
  document.getElementById('chatClear').addEventListener('click',()=>{ chat=[]; save(); render(); });
  sendBtn.addEventListener('click',send);
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
  input.addEventListener('input',()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,112)+'px'; });
})();

/* ============================================================
   INIT
   ============================================================ */
if(!store.attach) store.attach={};
applyTheme();
renderHeaderControls();
if(SYNC_ON && auth.token){
  // verify the stored session, then load content + personal state
  acct('me').then(m=>{
    if(!m || m.role==='none'){ auth={token:null,role:'none',name:null,email:null,expiresAt:null}; saveAuth(); renderHeaderControls(); router(); return; }
    auth.role=m.role; auth.name=m.name; auth.email=m.email||null; auth.expiresAt=m.expiresAt||null; saveAuth();
    renderHeaderControls(); router(); loadFromCloud();
  }).catch(()=>{ router(); });   // offline → render from local cache
} else {
  router();                      // show login gate (or public buy-access page)
}
// near-live: pull the latest whenever the tab regains focus (logged-in users)
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && authed() && !_syncTimer) loadFromCloud();
});
</script>
