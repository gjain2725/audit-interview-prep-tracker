MCQ_BANK['materiality'] = [
  { q:'A team sets overall materiality at 50 lakh and performance materiality at 35 lakh, and now must fix the clearly trivial threshold. Which statement best reflects SA 320 and SA 450?', o:['It must be a fixed 5 percent of performance materiality on every engagement','It equals the smallest misstatement the planned procedures are capable of detecting','It is the amount below which misstatements are clearly inconsequential individually and in aggregate, judged by the auditor','It is set so that accumulated trivial items can never exceed performance materiality'], c:2, why:'Clearly trivial is a judgement about items inconsequential individually and in aggregate by any criteria of size, nature or circumstances; percentage rules of thumb are conventions, not requirements.' },
  { q:'Which best explains why performance materiality is set below overall materiality?', o:['To allow a margin so that undetected plus uncorrected misstatements stay below overall materiality','To reduce sampling risk to zero for the classes of transactions selected','Because SA 320 fixes performance materiality at exactly 75 percent of overall materiality','To give the auditor a basis for deciding which misstatements are clearly trivial'], c:0, why:'Performance materiality creates headroom for misstatements the auditor does not detect and those left uncorrected; no fixed percentage is mandated and it is not the clearly trivial threshold.' },
  { q:'An entity is a loss making start up with volatile profits but stable growing revenue and a large asset base. Using profit before tax as the benchmark would be inappropriate mainly because:', o:['SA 320 prohibits profit before tax whenever a loss is reported','Revenue is the mandated benchmark for entities in the growth stage','Total assets must be used whenever assets exceed revenue','A volatile near break even profit produces an unstable amount that is not representative of user needs'], c:3, why:'SA 320 asks for a benchmark that is stable and relevant to users; near break even profit swings wildly, but no standard bans profit or mandates revenue or assets.' },
  { q:'Materiality for particular classes of transactions, account balances or disclosures is set when:', o:['The engagement partner prefers a lower threshold for all high risk areas as firm policy','Misstatements below overall materiality in those specific items could still influence user decisions','The client requests separate reporting thresholds for related party disclosures','A component auditor has adopted a lower materiality than the group auditor'], c:1, why:'SA 320 triggers a separate lower materiality only where users would be influenced by smaller misstatements in that area, such as related party transactions or directors remuneration.' },
  { q:'Halfway through the audit the auditor learns that actual results will fall far short of the forecast used to compute planning materiality. Under SA 320 the auditor must:', o:['Continue with the original amount to preserve comparability of the working papers','Revise the amount only if the change exceeds 10 percent of the original figure','Revise materiality and reconsider whether performance materiality and the planned procedures remain appropriate','Revise only at completion when evaluating the uncorrected misstatements'], c:2, why:'Revision is required when information emerges that would have led to a different amount initially, and planned procedures must then be reconsidered; there is no 10 percent trigger.' },
  { q:'Which uncorrected misstatement is most likely to be judged material despite being far below overall materiality?', o:['A misstatement that turns a small reported profit into a loss and affects incentive compensation','An understatement of the accrual for stationery expense','A reclassification between two expense heads within the statement of profit and loss','An overstatement of a debt that is already fully provided'], c:0, why:'SA 450 requires qualitative evaluation, and a misstatement that flips profit to loss or affects covenants and bonuses is material by nature; the others lack that significance.' },
  { q:'Under SA 450 the auditor must communicate uncorrected misstatements to those charged with governance and also:', o:['Automatically modify the opinion when they exceed performance materiality','Withdraw from the engagement if management refuses to correct them','Aggregate them with clearly trivial items before comparing with overall materiality','Obtain a written representation on whether their effects are immaterial individually and in aggregate'], c:3, why:'SA 450 requires a written representation with a summary of the uncorrected items attached; clearly trivial items are excluded from accumulation and exceeding performance materiality is not itself an opinion trigger.' },
  { q:'A misstatement of 12 lakh caused by a control failure in the purchase cycle is identified when overall materiality is 60 lakh, and management corrects it. Under SA 450 the auditor should:', o:['Treat the matter as closed once the correcting entry is posted','Consider whether other misstatements exist in that population and whether the audit strategy needs revision','Increase overall materiality to reflect the corrected figures','Report the matter under section 143 12 as a suspected fraud'], c:1, why:'SA 450 requires the auditor to consider whether an identified misstatement indicates that others exist and whether the approach must change; correction alone does not answer that, and a control failure is not automatically fraud.' },
  { q:'Which statement about projected misstatement from audit sampling is correct in the SA 450 evaluation?', o:['Only factual misstatements are accumulated because projections are merely estimates','Projected amounts are compared with performance materiality and never with overall materiality','Projected misstatements are accumulated with factual and judgemental ones in the aggregate evaluation','Management may clear a projected misstatement by correcting only the sampled items'], c:2, why:'SA 450 recognises factual, judgemental and projected misstatements and requires all three in the aggregate assessment; corrections must address the population, not just the sample.' },
  { q:'A group auditor sets group materiality at 2 crore. For a component contributing 30 percent of consolidated revenue, component materiality should be:', o:['Lower than group materiality so that aggregate undetected misstatement across components stays below it','Exactly 30 percent of group materiality to mirror the revenue share','Equal to group materiality because the group financial statements are the reporting entity','Determined solely from the component standalone financial statements'], c:0, why:'Component materiality must sit below group materiality to allow for aggregation across components; a mechanical revenue share or a standalone only basis ignores that aggregation risk.' },
  { q:'Which best describes the interaction between materiality and audit risk?', o:['They vary directly, so a higher materiality means a higher assessed audit risk','Materiality is fixed after audit risk is assessed and cannot influence it','Materiality affects only the evaluation stage and not the planning of procedures','They are inversely related, so a lower materiality generally calls for more extensive procedures'], c:3, why:'A lower materiality means smaller misstatements matter, so detection risk must be lowered through more extensive or effective work; materiality is set at planning and drives nature, timing and extent.' },
  { q:'A company has revenue of 100 crore, profit before tax of 40 lakh after one off director bonuses, and net assets of 60 crore. The most defensible benchmark choice is:', o:['Profit before tax, because profit is the primary indicator for all commercial entities','Normalised profit before tax adjusted for the one off bonus, or another stable benchmark','Total revenue at 5 percent, because revenue is the largest reported figure','Net assets, because equity holders are always the primary users'], c:1, why:'SA 320 permits normalising a benchmark for unusual one off items or selecting a more stable measure; using a distorted profit or simply picking the largest number is not reasoned selection.' },
  { q:'Which is NOT an appropriate reason to set performance materiality at a lower percentage of overall materiality?', o:['A history of numerous misstatements identified in prior audits','A first year audit with limited accumulated knowledge of the entity','A wish to limit the extent of testing and hold down the audit fee','Significant deficiencies identified in the control environment'], c:2, why:'Performance materiality is lowered where the risk of undetected misstatement is higher, such as prior errors, first year audits or weak controls; commercial fee pressure is never a valid basis.' },
  { q:'When misstatements identified during the audit are corrected by management, the auditor under SA 450 should still:', o:['Communicate them where relevant and request correction of all non trivial misstatements identified','Disregard them completely once the correcting entries are posted','Report them to the Registrar of Companies as accounting irregularities','Add them back when comparing the aggregate with overall materiality'], c:0, why:'SA 450 requires timely communication and a request to correct all accumulated misstatements; corrected items leave the uncorrected aggregate but the pattern may still signal control weaknesses.' },
  { q:'Which situation best illustrates a judgemental misstatement under SA 450?', o:['A sales invoice posted twice because of a keying error','A shortfall extrapolated from a sample of inventory count differences','An expense recorded in the wrong period due to a cut off failure','A difference between the management expected credit loss and the amount the auditor considers reasonable'], c:3, why:'Judgemental misstatements arise from differences over estimates or policy selection; duplicated invoices and cut off errors are factual and extrapolated shortfalls are projected.' },
  { q:'In assessing the aggregate effect of uncorrected misstatements the auditor also considers prior period items because:', o:['SA 450 requires every prior period misstatement to be corrected in the current year','Carried forward misstatements can reverse into current results and can accumulate in closing balances','Comparatives must be restated whenever an uncorrected misstatement existed','Prior period misstatements become immaterial once the previous report is issued'], c:1, why:'Uncorrected items carried forward can reverse into the current period and build up in balances, so the auditor weighs the effect on both current results and period end balances.' },
  { q:'Materiality of 2.5 crore is derived from revenue of 500 crore and is challenged by the engagement quality reviewer. The strongest defence is:', o:['The client agreed to the amount in the engagement letter','The same percentage was applied in the prior year audit','Revenue is the most relevant and stable measure for this entity and the percentage falls within accepted ranges','It produces an efficient sample size for testing the revenue population'], c:2, why:'The justification must rest on relevance to users, stability of the benchmark and an appropriate percentage; client agreement, precedent and sampling efficiency are not valid grounds.' },
  { q:'The aggregate of uncorrected misstatements is 48 lakh against overall materiality of 50 lakh. The most appropriate response is to:', o:['Reassess materiality and recognise that undetected plus uncorrected misstatements may together exceed it','Issue an unmodified opinion because the aggregate remains below overall materiality','Qualify the opinion automatically because the aggregate is close to materiality','Raise overall materiality to 60 lakh so that adequate headroom exists'], c:0, why:'SA 450 requires the auditor to consider that when the aggregate approaches materiality, undetected misstatements may push the total past it, so more work or correction is needed; raising materiality to accommodate errors is unacceptable.' }
];

MCQ_BANK['risk'] = [
  { q:'Which statement about the audit risk model is most accurate?', o:['Audit risk equals inherent risk plus control risk minus detection risk','Detection risk is assessed by the auditor based on the entity control environment','Control risk is reduced by performing more extensive substantive procedures','RMM combines inherent and control risk, and detection risk is set inversely to keep audit risk acceptably low'], c:3, why:'Inherent and control risk exist independently of the audit and together form RMM; the auditor manages only detection risk through nature, timing and extent of procedures.' },
  { q:'An auditor assesses control risk as low for the revenue cycle but performs no tests of controls. Under SA 330 the consequence is that:', o:['Control risk must be treated as at maximum for those assertions because no evidence supports reliance','Detection risk may be set higher on the strength of the low control risk assessment','Prior year control testing may be relied on indefinitely','Substantive analytical procedures alone become sufficient for revenue'], c:0, why:'Reduced substantive work is permitted only where tests of controls evidence operating effectiveness; without such testing the assurance must be obtained substantively.' },
  { q:'Which characteristic would NOT by itself indicate a significant risk under SA 315?', o:['A high degree of subjectivity in the measurement of an accounting estimate','A significant non routine related party transaction outside the normal course of business','A large volume of routine sales processed through a well controlled automated system','Accounting complexity combined with recent changes in the reporting requirements'], c:2, why:'Routine high volume transactions subject to systematic processing sit lower on the inherent risk spectrum; significant risks stem from subjectivity, complexity, uncertainty, change or susceptibility to bias and fraud.' },
  { q:'Where the auditor plans a wholly substantive approach to a significant risk, SA 330 requires that:', o:['Substantive analytical procedures alone suffice if the relationship is highly predictable','Controls must nevertheless be tested in every reporting period','The procedures must include tests of details','The procedures may be performed at interim with no roll forward work'], c:2, why:'SA 330 states that a substantive only approach to a significant risk must include tests of details, and substantive procedures for significant risks are directed to the period end rather than interim alone.' },
  { q:'Risks of material misstatement at the financial statement level are best addressed by:', o:['Increasing sample sizes for the specific account balances affected','Testing the operating effectiveness of application controls in each cycle','Obtaining additional written representations from management','Overall responses such as heightened scepticism, more experienced staff, use of experts and unpredictability'], c:3, why:'FS level risks are pervasive and relate to the control environment and management integrity, so SA 330 calls for overall responses; sampling and application control testing address assertion level risks.' },
  { q:'The control environment is weak but the auditor identifies a well designed reconciliation control over trade payables. The most appropriate conclusion is:', o:['A weak environment may undermine specific controls, so the auditor must consider whether the control can operate effectively','The specific control can be relied on without regard to the wider environment','Control risk must be assessed at maximum for the entire audit','ITGC testing becomes unnecessary because the control is manual'], c:0, why:'The control environment underpins the other components, so pervasive weaknesses cast doubt on specific controls; this does not mechanically force maximum control risk everywhere.' },
  { q:'The SA 315 requirement to understand internal control relevant to the audit obliges the auditor to:', o:['Test the operating effectiveness of all controls within the five components','Rely on the management process narratives as documentation of the controls','Evaluate the design of relevant controls and determine implementation, using more than inquiry alone','Assess control risk below maximum for every significant account balance'], c:2, why:'Design and implementation must be evaluated by combining inquiry with observation, inspection or tracing a transaction; operating effectiveness testing is a separate SA 330 decision.' },
  { q:'Building unpredictability into the selection of audit procedures is required mainly because:', o:['SA 330 requires the audit team to be rotated every three years','Management aware of the usual procedures may be better placed to conceal fraudulent reporting','It reduces the inherent risk attaching to the affected accounts','It serves as a substitute for the mandatory testing of journal entries'], c:1, why:'Predictable audit patterns make concealment easier, so SA 240 and SA 330 require an element of unpredictability; it does not change inherent risk and never replaces journal entry testing.' },
  { q:'Where controls tested in a prior audit are unchanged, SA 330 permits reliance on that earlier testing subject to which limit?', o:['Reliance for up to five years without any retesting','Reliance indefinitely if management confirms no change has occurred','Reliance only where the control is automated and ITGCs are effective','Retesting at least once in every third audit, with controls addressing a significant risk tested every period'], c:3, why:'The rotation limit is three years for unchanged controls with a portion tested each period, but controls mitigating a significant risk must be tested in the current period.' },
  { q:'Which item would most likely be assessed as a significant risk requiring specific audit attention?', o:['Depreciation computed by a fixed asset module using standard rates','Allocation of consideration in a multi element contract involving substantial judgement','Payment of statutory dues computed from the payroll master data','Recording of routine utility expenses supported by vendor invoices'], c:1, why:'Significant risks involve high subjectivity, complexity or judgement, which multi element allocation clearly does; the other items are systematic, routine and objectively supported.' },
  { q:'Why does the distinction between inherent risk and control risk matter in practice?', o:['Inherent risk can be reduced by the auditor whereas control risk cannot','Only control risk has any effect on the determination of sample sizes','Separating them shows where the exposure originates and drives different audit responses','Inherent risk arises only at the financial statement level and control risk only at the assertion level'], c:2, why:'Neither can be changed by the auditor, but separating them clarifies whether the exposure comes from the nature of the item or from control failure; both can arise at either level.' },
  { q:'Before relying on a substantive analytical procedure over payroll expense, SA 520 and SA 330 require the auditor to:', o:['Evaluate data reliability and suitability for the assertion and fix the acceptable difference in advance','Set the tolerable difference after comparing the expectation with the recorded amount','Perform the procedure only where control risk is assessed at maximum','Restrict the procedure to account balances below performance materiality'], c:0, why:'Reliability of the data, suitability for the assertion, precision of the expectation and a predetermined acceptable difference are the preconditions; setting the threshold afterwards defeats the test.' },
  { q:'Which statement about risk assessment procedures under SA 315 is correct?', o:['They alone provide sufficient appropriate audit evidence for the opinion','Analytical procedures may not be used as risk assessment procedures','Observation and inspection are prohibited as risk assessment procedures','They do not by themselves provide sufficient appropriate evidence and must be supplemented by further procedures'], c:3, why:'SA 315 is explicit that risk assessment procedures provide the basis for identifying risks but not sufficient evidence for the opinion; inquiry, analytics, observation and inspection are all valid.' },
  { q:'A company implements a new ERP three months before year end. The most appropriate audit response is to:', o:['Rely on the legacy system control testing for the whole year as the processes are similar','Assess control risk as low because the new ERP contains embedded automated controls','Test controls separately for the pre and post implementation periods and address data conversion risk','Restrict all testing to the post implementation period only'], c:2, why:'Controls differ across the two periods so each must be tested in its own period, and migration creates completeness and accuracy risk over converted balances; embedded controls are not effective merely by existing.' },
  { q:'SA 330 requires substantive procedures irrespective of the assessed risk of material misstatement for:', o:['Every account balance exceeding performance materiality','Only those assertions where controls were not tested','Only accounts affected by an identified significant risk','Each material class of transactions, account balance and disclosure'], c:3, why:'The standard mandates substantive procedures for every material class, balance and disclosure regardless of assessed RMM, because controls alone cannot give complete assurance.' },
  { q:'Performing substantive procedures at an interim date increases which risk, and what response does SA 330 require?', o:['The risk that misstatements arising in the remaining period go undetected, requiring procedures covering that period','Inherent risk, requiring full reperformance of the interim work at the year end','Control risk, requiring controls to be tested only at year end','Sampling risk, requiring the sample size to be doubled'], c:0, why:'Interim testing leaves the intervening period uncovered, so substantive procedures or a combination with control testing must cover the remaining period; full reperformance is not required.' },
  { q:'Which is the best example of an assertion level response to the risk of management override of controls?', o:['Assigning an engagement partner with greater industry experience','Increasing the frequency of engagement team discussions','Testing journal entries and adjustments, especially non standard entries near period end','Obtaining a management representation letter covering override'], c:2, why:'Journal entry testing focused on unusual and period end entries is the specific procedure SA 240 requires for override; team composition and discussions are overall responses and a representation is not evidence.' },
  { q:'Inventory valuation at a plant is assessed as high risk because of slow moving stock. The most responsive procedure is to:', o:['Attend the physical count and observe the count procedures','Confirm inventory held by third parties on behalf of the entity','Test the cut off of goods received notes around the year end','Review the ageing, test net realisable value against later selling prices and challenge the provisioning basis'], c:3, why:'Ageing, NRV testing and challenge of the provision address valuation directly; count attendance and confirmations address existence and rights while cut off addresses completeness and occurrence.' }
];

MCQ_BANK['controls'] = [
  { q:'Which pairing of a COSO component with an example is accurate?', o:['Control activities and audit committee oversight of financial reporting','Risk assessment and segregation of duties in the cash receipts process','Monitoring activities and internal audit evaluation of controls with reporting of deficiencies','Information and communication and the entity code of conduct'], c:2, why:'Ongoing and separate evaluations such as internal audit reviews are monitoring; audit committee oversight and the code of conduct sit in the control environment and segregation of duties is a control activity.' },
  { q:'A walkthrough is performed primarily in order to:', o:['Confirm understanding of the transaction flow and evaluate design and implementation of controls','Conclude on the operating effectiveness of a control across the whole reporting period','Provide a statistically valid sample of the operations of the control','Discharge the SA 330 requirement for tests of controls'], c:0, why:'A walkthrough of one or a few transactions establishes understanding, design and implementation; a single instance cannot support an operating effectiveness conclusion or form a valid sample.' },
  { q:'A control is well designed but the person performing it has no authority to enforce the follow up action. In an IFC evaluation this is best classified as:', o:['A design deficiency, because as designed the objective would not be met even if operated properly','An operating effectiveness deficiency and nothing more','Not a deficiency provided the control appears in the process narrative','A compensating control matter requiring no separate evaluation'], c:0, why:'A design deficiency exists where a control is missing or is not designed such that the objective is met even when operated as intended, which covers a performer lacking the necessary authority or competence.' },
  { q:'Which best distinguishes a significant deficiency from a material weakness in IFC reporting?', o:['A significant deficiency is a control gap while a material weakness is a misstatement that actually occurred','A significant deficiency appears in the auditor report while a material weakness goes only to management','A material weakness applies only to listed companies','A material weakness means a reasonable possibility exists that material misstatement will not be prevented or detected timely'], c:3, why:'The distinction is severity measured by likelihood and magnitude of potential misstatement, not by whether an error occurred; a material weakness drives an adverse IFC opinion.' },
  { q:'Reporting on internal financial controls under section 143 3 i of the Companies Act 2013 is NOT required for:', o:['A listed public company','A public company with paid up capital of 100 crore','An unlisted public company with bank borrowings of 60 crore','A private company meeting the notified exemption conditions on turnover, borrowings and shareholders'], c:3, why:'The exemption notification relieves certain private companies including one person and small companies and those within turnover and borrowing limits; all public companies remain covered.' },
  { q:'Which of the following is a general IT control rather than an application control?', o:['A three way match between purchase order, goods receipt note and invoice','Restriction of privileged database access with periodic review of the ERP user access list','A system edit check rejecting negative quantities on entry','Automatic sequential numbering of sales invoices'], c:1, why:'ITGCs cover access to programs and data, program change, development and computer operations; matching logic, edit checks and sequencing are application controls inside a business process.' },
  { q:'ITGCs over program change management are found to be ineffective. For an automated three way match control this means:', o:['The automated control can still be relied on because a walkthrough showed it working','ITGC failures affect only user access and never processing logic','Reliance is undermined because the auditor cannot conclude the logic was unchanged throughout the period','An adverse IFC opinion follows automatically'], c:2, why:'Automated controls depend on ITGCs for consistent operation across the period, so a change management failure means point in time testing may not represent the full period; severity still needs separate evaluation.' },
  { q:'Which combination of duties held by one person creates the highest risk of undetected misappropriation of cash?', o:['Recording sales invoices and preparing the receivables ageing report','Approving purchase orders and preparing the annual budget','Preparing bank reconciliations and filing statutory returns','Receiving customer cheques, posting receipts to ledgers and authorising write offs'], c:3, why:'Custody of receipts combined with recording and write off authority allows lapping to be concealed by writing off the shortfall; the other pairings do not combine asset custody with the ability to hide a loss.' },
  { q:'The extent of testing of a manual control that operates daily is influenced most by:', o:['The absolute materiality of the related account balance','The frequency of operation, expected and tolerable deviation rates and the assurance required','The number of employees working in the accounting department','The monetary value of the largest transaction processed'], c:1, why:'Attribute sampling for controls is driven by frequency and deviation rates and the assurance sought; monetary value drives substantive sampling rather than tests of controls.' },
  { q:'One deviation is found in forty tested instances of an authorisation control. The most appropriate initial response is to:', o:['Conclude the control is ineffective and abandon reliance at once','Extend the sample by exactly forty further items in every case','Treat it as acceptable because one in forty is within a normal tolerable rate','Investigate the cause and nature, judge whether it is systematic or isolated, and decide on further testing'], c:3, why:'SA 530 requires investigation of the nature and cause of every deviation and consideration of its effect; neither automatic rejection nor mechanical extension nor dismissal is appropriate first.' },
  { q:'Which statement about the auditor responsibility under section 143 3 i is most accurate?', o:['The auditor designs and implements the internal financial controls of the company','The IFC conclusion is expressed as negative assurance','The auditor opines on adequacy and operating effectiveness with reference to financial statements, while management maintains the controls','The conclusion extends to all operational and compliance controls of the entity'], c:2, why:'Clause i requires a reasonable assurance opinion on adequacy and operating effectiveness with reference to the financial statements; establishing and maintaining controls remains a management and board responsibility.' },
  { q:'Entity level controls that are sufficiently precise may:', o:['Replace the need for any transaction level control testing across the audit','Be evaluated for design only and never for operating effectiveness','Be ignored wherever process level controls are documented','Reduce but not always eliminate transaction level testing, depending on their precision at the assertion level'], c:3, why:'A highly precise management review can reduce process level testing, but most entity level controls are indirect and support the environment rather than addressing specific assertions.' },
  { q:'The essential difference between a test of controls and a test of details is that:', o:['A test of controls evidences whether the control operated, while a test of details evidences the monetary correctness of an amount','A test of controls always uses a larger sample than a test of details','A test of details can be performed only at the year end','A test of controls is mandated by statute for all companies'], c:0, why:'Tests of controls target the operation of the control and are evaluated by deviation rates, whereas tests of details target recorded amounts and are evaluated in monetary terms.' },
  { q:'Dual purpose testing means:', o:['Testing two different controls using a single sample of documents','Testing the same controls at both interim and at the year end','Designing a test so one sample evidences both control operation and monetary correctness','Having two auditors independently reperform the same procedure'], c:2, why:'A dual purpose test combines a test of controls with a test of details on the same items, though the auditor must confirm the sample size satisfies both attribute and monetary objectives.' },
  { q:'Which would most likely constitute a material weakness in IFC for a manufacturing company?', o:['A two day delay in preparing one monthly bank reconciliation','Absence of a written petty cash policy below a small limit','Occasional lack of a second signature on low value purchase requisitions','An ineffective revenue recording control leaving reasonable possibility of undetected material misstatement'], c:3, why:'Material weakness turns on a reasonable possibility that material misstatement is not prevented or detected, which the revenue control failure meets; the others are minor deficiencies.' },
  { q:'Management remediates a control deficiency two months before the year end. The auditor should:', o:['Conclude IFC are effective because the new control operates at the reporting date','Assess whether the remediated control ran long enough to evidence effectiveness and consider the earlier deficiency','Disregard the earlier deficiency because the IFC opinion is an as at date opinion','Issue a disclaimer of opinion on internal financial controls'], c:1, why:'The IFC opinion is as at the balance sheet date but a sufficient period of operation is needed to test the new control, and the earlier failure may have caused misstatements requiring substantive work.' },
  { q:'Which gives the strongest evidence of the operating effectiveness of a management review control over the expected credit loss model?', o:['Inspecting the reviewer signature on the printed model output','Inquiring of the reviewer about the process that was followed','Examining review documentation for criteria, investigation thresholds and resolution of items identified','Confirming that the model was run before the sign off date'], c:2, why:'Management review controls are effective only if their precision is demonstrable, so evidence of criteria, thresholds and outlier resolution is required; a signature or inquiry does not establish precision.' },
  { q:'A company outsources payroll processing to a service organisation. Under SA 402 the auditor should:', o:['Understand the services and controls and obtain a type 2 report or test at the service organisation before relying on controls','Assume the service organisation controls are effective because it is independently managed','Test only the user entity controls and disregard the service organisation','Require the client to bring payroll processing back in house'], c:0, why:'SA 402 requires understanding the nature of the services and relevant controls; a type 1 report covers design and implementation only, so reliance on operating effectiveness needs a type 2 report or direct testing.' }
];

MCQ_BANK['fraud'] = [
  { q:'The three elements of the fraud triangle described in SA 240 are:', o:['Motive, means and materiality','Collusion, concealment and override','Incentive or pressure, opportunity, and attitude or rationalisation','Deficiency, deviation and misstatement'], c:2, why:'SA 240 describes incentive or pressure, a perceived opportunity arising from weak controls or the ability to override them, and an attitude or rationalisation that lets the person justify the act.' },
  { q:'Which statement about the presumption of fraud risk in revenue recognition under SA 240 is correct?', o:['It is a rebuttable presumption and the reasons for rebutting it must be documented','It is irrebuttable and must be treated as a significant risk in every audit','It applies only to listed entities','It applies only where total revenue exceeds overall materiality'], c:0, why:'SA 240 requires the auditor to presume fraud risk in revenue recognition and evaluate which types of revenue give rise to it; the presumption may be rebutted only with documented reasons.' },
  { q:'The primary distinction between fraudulent financial reporting and misappropriation of assets is that:', o:['Fraudulent financial reporting is committed only by employees','Misappropriation always results in a material misstatement of the financial statements','Fraudulent financial reporting never involves concealment of any kind','Fraudulent reporting intentionally misstates the financial statements to deceive users, while misappropriation is theft, often concealed'], c:3, why:'Fraudulent reporting is usually by management to deceive users about performance, whereas misappropriation is typically by employees and hidden by false records even where amounts are immaterial.' },
  { q:'Which approach to selecting journal entries is most responsive to management override risk under SA 240?', o:['Entries to unusual accounts, at period end, by unexpected users, in round sums or lacking descriptions','A random sample drawn from all entries posted during the year','Only entries with a value above overall materiality','Only entries that were reviewed and approved by the chief financial officer'], c:0, why:'SA 240 directs selection on characteristics indicating inappropriate entries because override typically uses unusual, late, unsupported or round sum entries that random or value based selection would miss.' },
  { q:'Which best describes the auditor responsibility for fraud under SA 240?', o:['To detect every fraud in the entity regardless of amount','To certify that no fraud has occurred during the financial year','To act as a forensic investigator whenever a fraud risk factor is identified','To obtain reasonable assurance the statements are free of material misstatement from fraud or error, prevention resting with management'], c:3, why:'The auditor gives reasonable and not absolute assurance and the risk of not detecting fraud is higher than for error because of concealment and collusion; prevention and detection rest primarily with management and those charged with governance.' },
  { q:'Under section 143 12 read with the rules, an auditor with reason to believe a fraud of one crore or above has been committed by officers or employees must:', o:['Report directly to the Registrar of Companies within thirty days','Report to the Board or Audit Committee within two days, seek a reply in forty five days, then report to the Central Government within fifteen days','Deal with the matter only through the CARO reporting in the audit report','Report the matter to the Serious Fraud Investigation Office immediately'], c:1, why:'The prescribed route is a two day report to the Board or Audit Committee, a forty five day window for their reply, and onward reporting to the Central Government within fifteen days of receiving or not receiving that reply.' },
  { q:'For a suspected fraud below the threshold specified under section 143 12, the auditor is required to:', o:['Take no action because the amount falls below the statutory limit','Report to the Central Government in the same manner as larger frauds','Report to the Audit Committee or Board within the specified time, with particulars disclosed in the Board report','Qualify the audit opinion in every such case'], c:2, why:'Frauds below the specified threshold are reported to the Audit Committee or Board rather than to the Central Government, and the rules require prescribed particulars in the Board report.' },
  { q:'The most important reason SA 240 mandates an engagement team discussion about fraud is to:', o:['Allocate the audit work efficiently among the team members','Document compliance with the firm quality control policies','Agree the materiality levels applicable to fraud sensitive accounts','Exchange ideas on how and where the statements may be susceptible to fraud and how management could conceal it'], c:3, why:'The discussion is a brainstorming requirement centred on susceptibility to fraud and on how management might override controls, reinforcing scepticism; efficiency and materiality are separate planning matters.' },
  { q:'A fraud risk factor was identified but the auditor concluded no material misstatement arose. SA 240 documentation then requires:', o:['No documentation because the conclusion was clean','Identified and assessed fraud risks, the responses, the fraud related communications, and any reasons for rebutting the revenue presumption','Only a brief note in the completion memorandum','Retention of evidence only where the risk factor related to revenue'], c:1, why:'SA 240 sets specific documentation requirements covering risks, responses, communications and rebuttal reasoning irrespective of the eventual conclusion reached.' },
  { q:'Which circumstance most strongly indicates an incentive or pressure fraud risk factor for fraudulent financial reporting?', o:['A high volume of manual journal entries in the general ledger','Segregation of duties weaknesses in the stores department','Management pay largely contingent on aggressive profit targets with a debt covenant breach looming','Absence of any internal audit function within the entity'], c:2, why:'Pay tied to aggressive targets combined with covenant pressure is a classic incentive factor; manual entries, weak segregation and no internal audit are opportunity factors instead.' },
  { q:'If the auditor identifies a fraud involving senior management, SA 240 requires communication:', o:['Timely to those charged with governance, together with consideration of any duty to report to a regulator','Only to the level of management immediately above those involved','Only through the written representation letter obtained at completion','Only after the audit report has been signed and issued'], c:0, why:'Fraud involving management, employees with significant control roles, or fraud causing material misstatement must be reported to those charged with governance on a timely basis, and statutory duties under section 143 12 must also be weighed.' },
  { q:'Management override of controls is treated as a risk present in every entity primarily because:', o:['All managements are presumed to lack integrity until proven otherwise','Automated controls can never be overridden by anyone','Segregation of duties is impossible to achieve in smaller entities','Management is uniquely placed to manipulate records and override controls that otherwise appear effective'], c:3, why:'SA 240 treats override as an unpredictable risk in all entities because of the position management occupies, without presuming dishonesty, and requires specific procedures regardless of the view taken on integrity.' },
  { q:'Which procedure specifically addresses the risk of management bias in accounting estimates as required by SA 240?', o:['A retrospective review of prior period estimates against actual outcomes, alongside review of estimates for bias indicators','Recalculating depreciation using the rates recorded in the fixed asset register','Obtaining bank confirmations for all operating accounts','Verifying the mathematical accuracy of the trial balance'], c:0, why:'SA 240 requires a retrospective review of the judgements and assumptions behind prior period estimates to detect a pattern of bias; the other procedures address quite different assertions.' },
  { q:'Unusual or unexplained relationships noted while performing analytical procedures near the end of the audit should be:', o:['Ignored where the related accounts were already tested substantively','Reported directly to the Central Government without further work','Evaluated to determine whether they indicate a previously unrecognised risk of fraud','Resolved by obtaining a written representation from management'], c:2, why:'SA 240 requires evaluation of whether late stage analytical procedures reveal a previously unrecognised fraud risk; a representation is not sufficient evidence to resolve such an indicator.' },
  { q:'The auditor concludes that a material misstatement from fraud makes continuing the engagement impossible. The most appropriate course under SA 240 is to:', o:['Resign at once without any further communication to anyone','Issue an unmodified opinion with an emphasis of matter paragraph','Continue the audit while restricting the scope of the remaining work','Determine professional and legal duties, communicate with governance and regulators and consider withdrawal where permitted'], c:3, why:'SA 240 requires determining professional and legal responsibilities, communicating with those charged with governance and any regulator, and where withdrawal is possible discussing and reporting the reasons; statutory duties survive resignation.' },
  { q:'Which is the clearest example of an opportunity fraud risk factor rather than an attitude or rationalisation?', o:['Management repeatedly justifying aggressive accounting on grounds of immateriality','Domination by a single individual without compensating oversight, plus unusual related party dealings','A known history of securities law violations by members of management','Management showing excessive interest in maintaining the share price'], c:1, why:'Domination by one person without effective oversight combined with unusual related party transactions creates the opportunity to commit and conceal fraud; the others describe attitudes, rationalisations or incentives.' },
  { q:'The auditor identifies a misstatement that may indicate fraud although the amount is immaterial. SA 240 requires the auditor to:', o:['Disregard it because it falls below the materiality threshold','Deal with it through CARO reporting alone','Adjust the financial statements without performing further procedures','Evaluate its implications for the audit, particularly the reliability of representations, as fraud is rarely isolated'], c:3, why:'SA 240 states fraud is seldom an isolated occurrence, so even an immaterial indicator requires reassessment of risks, the reliability of evidence and representations, and possibly the whole approach.' },
  { q:'Written representations obtained under SA 240 include management acknowledgement that:', o:['The financial statements contain no fraud of any amount whatsoever','It is responsible for controls to prevent and detect fraud, and disclosure of known, suspected and alleged fraud','The auditor bears responsibility for detecting fraud in the entity','The entity has never been the subject of any regulatory inquiry'], c:1, why:'SA 240 requires representations covering responsibility for controls, the results of the management fraud risk assessment and disclosure of known, suspected or alleged fraud; absolute assurance that no fraud exists cannot be given.' }
];

MCQ_BANK['assertions'] = [
  { q:'Selecting items from the goods received note file and tracing them into the purchase ledger directly addresses which assertion?', o:['Occurrence of recorded purchases','Existence of inventory at the reporting date','Completeness of purchases and the related liabilities','Rights and obligations over inventory on hand'], c:2, why:'Testing from source documents into the accounting records tests completeness because the risk is omission; tracing in the reverse direction from ledger to document would test occurrence.' },
  { q:'The direction of testing best suited to detecting overstatement of trade receivables is:', o:['Selecting from customer despatch records and tracing into the sales ledger','Selecting recorded balances and vouching to despatch documents and subsequent collections','Reviewing the ageing report for balances older than six months','Recomputing the interest charged on overdue balances'], c:1, why:'Overstatement is found by starting with recorded amounts and seeking support, which tests existence and occurrence; starting from source documents tests completeness and detects understatement.' },
  { q:'Which set of assertions applies to account balances at the period end under SA 315?', o:['Occurrence, completeness, accuracy, cut off and classification','Presentation, disclosure, aggregation and disaggregation','Occurrence and rights, completeness, classification and understandability','Existence, rights and obligations, completeness, accuracy valuation and allocation, and classification'], c:3, why:'Balance assertions centre on existence, rights and obligations, completeness and accuracy valuation and allocation; occurrence and cut off belong to classes of transactions.' },
  { q:'An auditor traces despatch notes dated in the first week after year end to the sales register to confirm they were excluded from current year sales. This primarily addresses:', o:['Cut off for revenue and the occurrence of recorded sales','Valuation of the related trade receivables','Rights and obligations over the goods despatched','Classification of sales between reportable segments'], c:0, why:'Testing post year end despatches for inclusion in the current year targets cut off and would reveal revenue booked before control transferred, an occurrence failure.' },
  { q:'The rights and obligations assertion for inventory is best tested by:', o:['Attending the physical count and observing the count procedures','Testing the standard cost roll and the absorption of variances','Examining supplier agreements and consignment arrangements over goods on the premises','Reviewing the ageing profile of slow moving inventory lines'], c:2, why:'Consignment stock and goods on approval sit on the premises without being owned, so contractual review addresses rights; counting tests existence, costing tests valuation and ageing tests net realisable value.' },
  { q:'Which of the following is a presentation assertion rather than one relating to transactions or balances?', o:['Cut off of transactions around the reporting date','Existence of the recorded assets','Accuracy of recorded amounts','Classification and understandability, including appropriate aggregation and clear description'], c:3, why:'Presentation assertions cover occurrence and rights of disclosed matters, completeness of disclosure, classification and understandability, and accuracy and valuation of disclosures.' },
  { q:'External confirmation of a bank balance provides the strongest evidence for which combination of assertions?', o:['Completeness and valuation of cash balances','Cut off and classification of banking transactions','Existence and rights and obligations, with limited evidence on completeness','Accuracy valuation and allocation to the exclusion of all others'], c:2, why:'A bank confirmation evidences the existence of the confirmed balance and the entity right to it, but not completeness, because undisclosed accounts would never be circularised.' },
  { q:'For a construction contract measured on a percentage of completion basis, the assertion most at risk is:', o:['Accuracy valuation and allocation, given judgement over progress and estimated total costs','Existence of the related contract receivables','Classification between current and non current items','Rights and obligations over the recognised contract asset'], c:0, why:'Revenue and contract asset amounts depend on estimated total costs and measured progress, so subjective valuation drives the risk while the other assertions are comparatively mechanical.' },
  { q:'Reviewing payments made in the two months after year end to see whether the related liability was recorded at the reporting date primarily addresses:', o:['Existence of the recorded trade payables','Classification of the related expenses','Cut off of inventory receipts alone','Completeness of liabilities, since unrecorded liabilities are the principal payables risk'], c:3, why:'The subsequent payments search finds obligations that existed at the reporting date but were never recorded; payables carry an understatement rather than an overstatement risk.' },
  { q:'Which procedure best addresses the completeness assertion for provisions against legal claims?', o:['Recomputing the provision using the management assumptions','Obtaining lawyer confirmations, reviewing board minutes and scrutinising legal expense accounts','Comparing the closing provision with the prior year balance','Confirming that settled claims were paid after the year end'], c:1, why:'Completeness requires a search for matters management may not have disclosed, which lawyer confirmations, minutes and legal expense scrutiny provide; recomputation only tests what is already recorded.' },
  { q:'The accuracy assertion for a class of transactions means that:', o:['All transactions that should have been recorded have been recorded','Recorded transactions have occurred and pertain to the entity','Amounts and other data relating to recorded transactions have been recorded appropriately','Transactions have been recorded in the correct accounting period'], c:2, why:'Accuracy concerns whether amounts and related data were recorded appropriately; the other options define completeness, occurrence and cut off respectively.' },
  { q:'An auditor selects items from the fixed asset register and locates them physically on the factory floor. This tests:', o:['Existence of the recorded assets','Completeness of the fixed asset register','Valuation of the assets carried in the register','Rights and obligations over assets held on lease'], c:0, why:'Moving from the register to the floor confirms recorded assets exist; the reverse direction, from assets on the floor to the register, would test completeness.' },
  { q:'A company offsets trade receivables and trade payables for the same counterparty without a legally enforceable right of set off. Which assertion is violated?', o:['Existence of the trade receivables','Completeness of the trade payables','Classification and presentation, and the accuracy of the amounts presented','Cut off of the underlying transactions'], c:2, why:'Both balances exist and are complete in the underlying records; the defect is improper offsetting, a presentation and classification failure that distorts the amounts on the face of the balance sheet.' },
  { q:'Recalculating the expected credit loss allowance using entity default history and forward looking adjustments primarily supports:', o:['Existence of the trade receivables','Rights and obligations over the receivables','Completeness of the recorded receivables','Accuracy valuation and allocation of the receivables'], c:3, why:'The allowance affects the carrying amount, so the procedure tests valuation and allocation; existence, ownership and completeness of the gross balances need different procedures.' },
  { q:'For revenue, the occurrence assertion is most at risk where:', o:['Bill and hold arrangements or channel stuffing near year end inflate sales without transfer of control','Sales flow through a well controlled platform with automatic despatch matching','Sales returns are processed shortly after the reporting date','Discounts are applied inconsistently between customers'], c:0, why:'Bill and hold and channel stuffing record revenue where control has not transferred, so the transactions did not properly occur; inconsistent discounts affect accuracy and later returns affect estimates.' },
  { q:'Which mapping of a procedure to an assertion is INCORRECT?', o:['Observing the inventory count maps to existence','Inspecting title deeds maps to rights and obligations','Testing sales in the week before and after year end maps to cut off','Testing the ageing of trade receivables maps to completeness'], c:3, why:'Ageing analysis supports valuation through the assessment of recoverability rather than completeness; the other three mappings are correct.' },
  { q:'To obtain evidence that all employee benefit liabilities have been recorded, the most effective procedure is to:', o:['Vouch a sample of recorded accruals back to payroll records','Confirm outstanding balances directly with individual employees','Reconcile headcount and payroll data to the accrual and compare with statutory returns and actuarial reports','Recompute the gratuity provision using the prior year amount as the basis'], c:2, why:'Completeness needs an independent source capable of revealing omissions, which headcount, statutory filings and actuarial reports supply; vouching recorded items cannot detect what was never recorded.' },
  { q:'Which statement about the relationship between assertions and audit procedures is most accurate?', o:['Each audit procedure provides evidence about exactly one assertion','A procedure may evidence several assertions, but evidence on one never compensates for absence of work on another','Substantive analytical procedures address all assertions to an equal degree','Tests of controls give direct evidence of the monetary accuracy of every assertion'], c:1, why:'Inspecting a sales invoice can evidence occurrence and accuracy together, yet strong existence evidence never substitutes for missing completeness work; controls testing evidences the control, not the amount.' }
];
