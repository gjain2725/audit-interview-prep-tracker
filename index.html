MCQ_BANK['ppe'] = [
  { q:'A company imports a machine. Costs incurred: purchase price Rs 80 lakh, non-refundable import duty Rs 6 lakh, refundable GST Rs 14 lakh, site preparation Rs 3 lakh, staff training on the new machine Rs 2 lakh, and initial operating losses Rs 5 lakh. What is the capitalised cost under Ind AS 16?', o:['Rs 89 lakh','Rs 91 lakh','Rs 96 lakh','Rs 103 lakh'], c:0, why:'Purchase price 80 plus non-refundable duty 6 plus site preparation 3 equals Rs 89 lakh. Refundable GST is recoverable, while training costs and initial operating losses are expressly excluded from cost by Ind AS 16.' },
  { q:'An aircraft costing Rs 500 crore requires a major engine overhaul every 4 years. Management can identify the overhaul element at Rs 60 crore within the purchase price. Under Ind AS 16 componentisation, how should this be treated?', o:['Depreciate Rs 60 crore over 4 years and the balance over aircraft life','Capitalise the overhaul element only in year 4 when the work is done','Expense the overhaul when incurred and depreciate Rs 500 crore fully','Provide for the future overhaul cost rateably over the 4 year cycle'], c:0, why:'Ind AS 16 requires each part with a cost significant to the total and a different useful life to be depreciated separately, so the overhaul component runs over 4 years. Ind AS 37 prohibits provisioning for future repair costs because there is no present obligation.' },
  { q:'A company adopts the revaluation model for a class of buildings. One building has a revaluation surplus of Rs 20 lakh in equity from an earlier year. A fresh valuation shows a decrease of Rs 32 lakh. How is the decrease recognised?', o:['Rs 32 lakh charged entirely to profit or loss as an impairment','Rs 32 lakh charged entirely to other comprehensive income','Rs 20 lakh to other comprehensive income and Rs 12 lakh to profit','Rs 12 lakh to other comprehensive income and Rs 20 lakh to profit'], c:2, why:'A revaluation decrease is debited to OCI only to the extent of the existing credit balance in the revaluation surplus for that same asset, being Rs 20 lakh, with the excess Rs 12 lakh going to profit or loss. The surplus of one asset cannot absorb the deficit of another.' },
  { q:'Under Schedule II to the Companies Act 2013, a company wishes to depreciate a plant over a useful life longer than the indicative life specified in Part C. Which statement is correct?', o:['Permitted only with the prior approval of the Central Government','Permitted if justified by technical advice and disclosed in the accounts','Permitted only for continuous process plants and immovable property','Prohibited, since the Schedule II lives are mandatory maximum lives'], c:1, why:'Schedule II permits a different useful life or residual value where justified by technical advice, subject to disclosure of the justification in the financial statements. The lives are indicative rather than an absolute ceiling for most companies.' },
  { q:'A qualifying asset is funded from general borrowings. Weighted average general borrowings are Rs 200 crore at a weighted average rate of 9 percent, and total borrowing cost incurred is Rs 18 crore. Average expenditure on the asset was Rs 50 crore. What is capitalised under Ind AS 23?', o:['Rs 18 crore','Rs 4.5 crore','Rs 9 crore','Nil for general borrowings'], c:1, why:'The capitalisation rate of 9 percent is applied to the average expenditure on the asset, giving Rs 4.5 crore, capped at total borrowing cost incurred. Applying the rate to total borrowings rather than to asset expenditure is the classic error.' },
  { q:'A decommissioning liability for a plant was initially measured at Rs 40 lakh using a discount rate of 8 percent. The risk-free rate later falls, increasing the liability by Rs 6 lakh. The asset is carried at cost. Under Appendix A to Ind AS 16 principles, the change is:', o:['Adjusted against retained earnings as a prior period item','Charged to profit or loss immediately as a finance cost','Added to the carrying amount of the related asset','Recognised in other comprehensive income as a deficit'], c:2, why:'For assets under the cost model, changes in an existing decommissioning liability from revised discount rates or estimated cash flows are added to or deducted from the cost of the related asset. Only the periodic unwinding of discount goes to profit or loss as a finance cost.' },
  { q:'Which of the following would NOT trigger suspension of borrowing cost capitalisation under Ind AS 23?', o:['An extended period in which construction is halted by a labour strike','A prolonged suspension while fresh regulatory approvals are negotiated','An extended stoppage caused by a shortfall in construction funding','A delay that is a necessary part of readying the asset, such as curing'], c:3, why:'Ind AS 23 does not require suspension for delays that are a necessary part of the process of readying the asset, such as curing or awaiting inventory maturation. Extended interruptions in active development for other reasons do require suspension.' },
  { q:'While auditing CWIP, the auditor notes a project capitalised for 3 years with no physical progress in the last 18 months. Which audit response is most appropriate?', o:['Test the balance for impairment under Ind AS 36 and check CWIP ageing','Insist that depreciation be charged on CWIP from the first spend date','Accept the balance since CWIP is not depreciated and carries no risk','Reclassify the whole balance to intangible assets under development'], c:0, why:'Prolonged inactivity is an impairment indicator, and Schedule III requires CWIP ageing plus separate disclosure for projects that are suspended or overdue against the original plan. Depreciation does not begin until the asset is available for use.' },
  { q:'A cash generating unit has a carrying amount of Rs 900 lakh including allocated goodwill of Rs 100 lakh. Value in use is Rs 700 lakh and fair value less costs of disposal is Rs 650 lakh. How is the impairment loss allocated?', o:['Rs 200 lakh allocated pro rata across all assets including goodwill','Rs 250 lakh, with Rs 100 lakh to goodwill and the balance pro rata','Rs 100 lakh to goodwill and Rs 100 lakh pro rata to other assets','Rs 200 lakh pro rata to the other assets, with goodwill left intact'], c:2, why:'Recoverable amount is the higher of value in use Rs 700 lakh and fair value less costs of disposal Rs 650 lakh, so the loss is Rs 200 lakh. Ind AS 36 requires goodwill to be written off first, then the residual allocated pro rata to other assets.' },
  { q:'Under Schedule II, when a company changes the useful life of an existing asset, the carrying amount as on the date of change is:', o:['Restated retrospectively through a prior period adjustment','Depreciated prospectively over the remaining revised useful life','Written off entirely against retained earnings in that year','Recognised as a revaluation adjustment in other comprehensive income'], c:1, why:'A change in useful life is a change in accounting estimate under Ind AS 8, applied prospectively over the remaining revised life. Retrospective restatement applies only to changes in accounting policy or errors.' },
  { q:'An entity exchanges a machine with carrying amount Rs 30 lakh and fair value Rs 38 lakh for a machine of similar function. The exchange lacks commercial substance. At what amount is the acquired machine recorded?', o:['Rs 38 lakh, being the fair value of the asset given up','Rs 30 lakh, being the carrying amount of the asset given up','The fair value of the asset received, if more clearly evident','Rs 34 lakh, the average of carrying amount and fair value'], c:1, why:'Ind AS 16 requires measurement at the carrying amount of the asset given up when the exchange lacks commercial substance or fair value is not reliably measurable, so no gain is recognised. Fair value measurement applies only where commercial substance exists.' },
  { q:'The auditor is verifying title deeds of immovable property. The company states that original deeds are with a bank as security for a term loan. The most appropriate procedure is:', o:['Visit the site, photograph the boundary walls and note the occupier','Accept the management representation letter as sufficient evidence of title','Rely on property tax receipts in the company name as proof of title','Confirm with the bank and inspect the charge registered with the ROC'], c:3, why:'Direct confirmation from the holder combined with inspection of the registered charge provides independent, external evidence of both existence and the encumbrance. Management representations and tax receipts are weak, internally generated or indirect evidence of legal title.' },
  { q:'Which cost is capitalisable as a directly attributable cost under Ind AS 16?', o:['Professional fees for installing and assembling the new machine','Costs of opening a new facility, including the inauguration ceremony','Administration and other general overheads of the finance team','Costs of relocating an existing asset to a more convenient site'], c:0, why:'Installation and assembly costs and related professional fees are directly attributable to bringing the asset to its location and condition for intended use. Ind AS 16 specifically lists opening costs, general overheads and relocation of existing assets as non-capitalisable.' },
  { q:'A company sells items produced while testing a new plant before it reaches the condition intended by management. Under the current Ind AS 16 requirement, the sale proceeds and the cost of those items are:', o:['Netted off against the cost of the plant as testing related costs','Recognised in profit or loss as revenue and cost of items produced','Credited to other comprehensive income until the plant is commissioned','Deferred and released to profit or loss across the plant useful life'], c:1, why:'Proceeds from selling items produced during the testing phase and their cost are recognised in profit or loss rather than deducted from the cost of the asset. The deduction approach reflects the older position that was subsequently amended.' },
  { q:'Under Schedule II, the useful life prescribed for general plant and machinery not covered by special provisions, used on a single shift basis, is:', o:['5 years','10 years','15 years','20 years for single shift use'], c:2, why:'Part C of Schedule II prescribes 15 years for general plant and machinery on a single shift basis, with extra depreciation for double and triple shift use. The 20 year and 10 year figures apply to other asset categories.' },
  { q:'A company classifies a building as held for sale on 1 October. Which statement about depreciation is correct?', o:['Charged at half rate for the remainder of the financial year','Reversed in full for the year in which classification occurs','Continues to be charged until the date of the actual sale','Ceases from the date of classification as held for sale'], c:3, why:'Once an asset meets the held for sale criteria under Ind AS 105, depreciation ceases from that date and the asset is measured at the lower of carrying amount and fair value less costs to sell. Continuing depreciation to the sale date is the common error.' },
  { q:'During physical verification of PPE, the auditor finds that management verifies all assets once every three years on a rotational basis. The auditor should:', o:['Assess whether the programme is reasonable and test this cycle results','Disclaim an opinion on PPE since no full annual count was performed','Perform a personal full count of all assets in place of management','Insist on a mandatory full verification of every asset every year'], c:0, why:'A phased programme covering all assets over a reasonable interval is acceptable, and CARO requires the auditor to report on whether the programme is reasonable and whether discrepancies were properly dealt with. The auditor tests management verification rather than replacing it.' },
  { q:'A revalued asset is derecognised on disposal. The revaluation surplus of Rs 15 lakh relating to it stands in equity. Under Ind AS 16 this surplus is:', o:['Retained permanently in the revaluation reserve as a capital reserve','Credited again to other comprehensive income on the disposal date','Recycled to profit or loss as part of the gain on the disposal','Transferred directly to retained earnings, bypassing profit or loss'], c:3, why:'Ind AS 16 allows transfer of the revaluation surplus to retained earnings on derecognition, but it is never recycled through profit or loss. Treating it as part of the disposal gain overstates reported profit.' }
];
MCQ_BANK['inventory'] = [
  { q:'A manufacturer has normal capacity of 50000 units and fixed production overheads of Rs 25 lakh. Actual production is 40000 units. Under Ind AS 2, the fixed overhead absorbed into inventory cost is:', o:['Rs 25 lakh, since all fixed overheads relate to production','Rs 20 lakh, with Rs 5 lakh expensed as unabsorbed overhead','Rs 31.25 lakh, grossed up to the actual production level','Nil, since fixed production overheads are always period costs'], c:1, why:'Fixed overhead is allocated at the normal capacity rate of Rs 50 per unit, giving Rs 20 lakh on 40000 units, and the unallocated Rs 5 lakh is expensed in the period. Absorbing the full amount would capitalise the cost of idle capacity.' },
  { q:'A trader holds 1000 units costing Rs 500 each. General selling price is Rs 520 with selling commission of 5 percent of selling price. A firm sales contract exists for 400 of those units at Rs 540. What is the total carrying amount under Ind AS 2?', o:['Rs 5,00,000','Rs 4,96,400','Rs 4,94,000 for the whole holding','Rs 5,13,000'], c:1, why:'For the 400 contracted units NRV is 540 less 27 equals 513 which exceeds cost, so they remain at Rs 500 each giving Rs 2,00,000. The other 600 units have NRV of 520 less 26 equals 494, below cost, giving Rs 2,96,400, so the total is Rs 4,96,400.' },
  { q:'Which of the following is included in the cost of inventories under Ind AS 2?', o:['Storage costs necessary before a further stage of production','Selling and distribution costs incurred in securing the order','General administrative overheads of the corporate office','Abnormal amounts of wasted material, labour and other cost'], c:0, why:'Storage costs are capitalised only where that storage is a necessary part of the production process, such as maturing goods. Abnormal waste, selling costs and general administration are expressly excluded by Ind AS 2.' },
  { q:'Under SA 501, if the auditor is unable to attend physical inventory counting due to unforeseen circumstances, the auditor should:', o:['Immediately issue a qualified opinion on the inventory balance figure','Count on an alternative date and test the intervening transactions','Rely on the management representation about inventory quantities','Accept the internal audit count without performing further work'], c:1, why:'SA 501 requires counting on an alternative date with procedures over intervening movements when attendance is impracticable due to unforeseen circumstances. Modification is required only if no alternative procedures can give sufficient appropriate evidence.' },
  { q:'A material portion of inventory is held by a third party warehouse. Under SA 501, the auditor primary response is to:', o:['Test only the purchase invoices for the goods sent to that warehouse','Take no action, since custody rests with the third party operator','Confirm quantities with the custodian, or attend the count there','Obtain a written representation from the directors on such stock'], c:2, why:'SA 501 requires direct confirmation from the custodian regarding quantities and condition, or attendance at a physical count at that location. Where doubts exist about the custodian integrity or objectivity, further procedures such as inspection or a service auditor report are needed.' },
  { q:'A company uses weighted average cost. Opening stock 200 units at Rs 90. Purchases: 300 units at Rs 100 then 500 units at Rs 110. Sales during the period: 700 units. Under the periodic weighted average method, the closing inventory value for 300 units is approximately:', o:['Rs 27,000','Rs 30,900','Rs 33,000 using the latest price','Rs 31,800'], c:1, why:'Total cost is 18000 plus 30000 plus 55000 equals Rs 1,03,000 for 1000 units, giving a weighted average of Rs 103 per unit and closing inventory of Rs 30,900. Using the latest purchase price of Rs 110 would be FIFO, not weighted average.' },
  { q:'Ind AS 2 prohibits which of the following cost formulas?', o:['Specific identification for items not ordinarily interchangeable','First in first out applied to interchangeable items','Weighted average cost computed on a periodic basis','Last in first out applied to interchangeable items'], c:3, why:'Ind AS 2 permits FIFO and weighted average, and requires specific identification for items that are not ordinarily interchangeable. LIFO is not permitted because it does not reflect a reliable representation of inventory flows.' },
  { q:'Raw materials held for production have a cost of Rs 10 lakh and a current replacement cost of Rs 8 lakh. The finished goods into which they will be incorporated are expected to be sold at or above cost. Under Ind AS 2 the raw materials should be:', o:['Carried at cost of Rs 10 lakh, without any write down','Carried at Rs 9 lakh, the average of cost and replacement','Written down to nil pending sale of the finished goods','Written down to Rs 8 lakh, the current replacement cost'], c:0, why:'Materials are not written down below cost if the finished products in which they will be incorporated are expected to be sold at or above cost. Replacement cost becomes a proxy for NRV only when a decline indicates that the finished goods will sell below cost.' },
  { q:'While testing inventory cut-off at a year end of 31 March, the auditor finds goods received on 29 March recorded as a purchase on 3 April, but the goods were included in the physical count. The effect on the financial statements before adjustment is:', o:['Only a disclosure issue, with no effect on reported amounts','Inventory and profit overstated, liabilities understated','Inventory understated, liabilities overstated, profit understated','No net effect, as inventory and purchases both change equally'], c:1, why:'The goods sit in closing inventory but the corresponding purchase and trade payable are omitted, so cost of sales is understated and profit and inventory are both overstated. The offsetting argument fails because only one side of the transaction was recorded.' },
  { q:'Which inventory analytic best identifies potential slow-moving or obsolete stock?', o:['Recomputing the standard cost per unit for the top ten items','Comparing the gross margin percentage with the prior year','Reviewing ageing by last movement date with turnover by SKU','Reconciling the inventory ledger to the general ledger control'], c:2, why:'Ageing by last movement date combined with SKU level turnover directly identifies items not consumed or sold, which is the substance of obsolescence risk. Gross margin comparison and ledger reconciliations address valuation trends and completeness, not item level slow movement.' },
  { q:'Under Ind AS 2, a write down of inventory to net realisable value in a prior period is reversed when NRV recovers. The reversal is:', o:['Recognised as revenue in the period in which NRV recovers','Prohibited once inventory has been written down to NRV','Credited to other comprehensive income as a revaluation reserve','Limited to the original write down and credited to the expense'], c:3, why:'Ind AS 2 requires reversal limited to the original write down, recognised as a reduction in the amount of inventories recognised as an expense. It never creates a gain above original cost nor is it presented as revenue.' },
  { q:'A company purchases inventory on deferred settlement terms with payment due after 12 months, at a price of Rs 55 lakh against a cash price of Rs 50 lakh. Under Ind AS 2, the Rs 5 lakh difference is:', o:['Recognised as interest expense over the financing period','Charged to inventory and released on sale within cost of sales','Treated as a trade discount, reducing the cost to Rs 45 lakh','Capitalised as part of the cost of the inventory purchased'], c:0, why:'Where an arrangement effectively contains a financing element, the difference between the purchase price for normal credit terms and the amount paid is recognised as interest expense over the period of financing. Capitalising it would overstate inventory cost.' },
  { q:'During attendance at a physical count, the auditor performs test counts. Which combination provides evidence over both existence and completeness?', o:['Selecting items on the floor and tracing them to the count sheets','Selecting items on the count sheets and tracing them to the floor','Selecting both from sheets to floor and from floor to sheets','Recounting the whole warehouse independently of the count team'], c:2, why:'Tracing from sheets to floor tests existence while tracing from floor to sheets tests completeness, so both directions are needed. A single direction leaves one assertion untested regardless of sample size.' },
  { q:'A construction of a customised item takes 14 months and is held as inventory. The entity is not permitted to capitalise borrowing costs into inventory when:', o:['The entity has specific borrowings for the production run','The production period for the item exceeds twelve months','The inventory needs a substantial period to get ready for its sale','The inventory is produced in large quantities and repetitively'], c:3, why:'Ind AS 23 excludes inventories manufactured or otherwise produced in large quantities on a repetitive basis from the definition of a qualifying asset. A one off customised item over a substantial period can qualify.' },
  { q:'Which statement about the cost of conversion under Ind AS 2 is correct?', o:['Variable overheads are allocated on actual use of facilities','Both fixed and variable overheads go on normal capacity always','Variable production overheads are allocated on normal capacity','Fixed production overheads are allocated on actual facility use'], c:0, why:'Ind AS 2 allocates variable production overheads on the basis of actual use of production facilities and fixed production overheads on normal capacity. Reversing the two bases is a common misconception.' },
  { q:'In periods of unusually high production, Ind AS 2 requires the fixed overhead allocation per unit to be:', o:['Charged wholly to profit or loss for that production period','Increased so that all fixed overheads are fully absorbed','Decreased so that inventories are not measured above cost','Kept at the normal capacity rate whatever the output level'], c:2, why:'The amount of fixed overhead allocated to each unit is decreased in periods of abnormally high production so that inventories are not measured above cost. The normal capacity rate is a ceiling not a fixed rate in such periods.' },
  { q:'The auditor identifies that management has recorded a general provision of 2 percent on all inventory described as an obsolescence reserve, without item level analysis. The most appropriate audit response is:', o:['Require the provision to be raised to 5 percent as a norm','Reclassify the provision as a contingent liability note','Accept it as a prudent and appropriately conservative estimate','Challenge it and require item level ageing and NRV evidence'], c:3, why:'Ind AS 2 requires write downs on an item by item basis using NRV evidence, so a blanket percentage lacks support and may create a smoothing reserve. General provisions are not a substitute for specific NRV assessment.' },
  { q:'Consumable spares that are expected to be used over more than one period and are directly linked to a specific item of plant should be:', o:['Recognised as property plant and equipment under Ind AS 16','Charged to profit or loss in the period they are purchased','Recognised as an intangible asset amortised over plant life','Classified as inventory under Ind AS 2 in every situation'], c:0, why:'Major spare parts and standby equipment qualify as PPE when the entity expects to use them during more than one period, particularly if usable only in connection with a specific asset. Routine spares consumed within a period remain inventory.' }
];
MCQ_BANK['receivables'] = [
  { q:'An auditor sends positive confirmations for trade receivables. The primary assertion addressed is:', o:['Existence of the balance and rights over the receivable','Valuation of the expected credit loss allowance recorded','Classification between current and non-current balances','Completeness of the receivables recorded in the ledger'], c:0, why:'External confirmation of a recorded balance corroborates that the debtor exists and acknowledges the amount, addressing existence and rights. Completeness is poorly served because unrecorded receivables would never be selected for confirmation.' },
  { q:'A debtor does not respond to a positive confirmation after two follow ups. Under SA 505, the most appropriate alternative procedure is:', o:['Send a negative confirmation and treat silence as agreement','Examine subsequent receipts, despatch documents and invoices','Obtain a written representation from management on the balance','Reduce the sample size and select a different debtor instead'], c:1, why:'SA 505 requires alternative procedures such as inspecting subsequent receipts, despatch documentation and invoices to obtain relevant reliable evidence. Substituting a negative confirmation or a management representation does not compensate for a non-response.' },
  { q:'Negative confirmations may be used as the sole substantive procedure only when all of the following conditions are met EXCEPT:', o:['The population has many small homogeneous account balances','A very low exception rate is expected in the population','The debtors are related parties under common control','Risk is assessed as low and the controls operate effectively'], c:2, why:'SA 505 permits sole reliance on negative confirmations where risk is low, the population consists of numerous small homogeneous balances, a low exception rate is expected and there is no reason to expect recipients to disregard requests. Related party status increases risk and makes negative confirmations inappropriate.' },
  { q:'A material receivable from a related party has been outstanding for 400 days with no repayment. Management asserts no credit loss because the group will support it. The auditor should:', o:['Require a 100 percent provision on every related party balance held','Confirm the balance and conclude if the confirmation agrees','Accept the assertion, as the group has always paid in the past','Obtain evidence of the ability and intention of the group to pay'], c:3, why:'A confirmation from a related party corroborates the amount but not recoverability, so evidence of the ability and intention to pay is essential alongside ECL measurement. Companies Act provisions on loans and related party transactions also require evaluation for such balances.' },
  { q:'Under Ind AS 109, the simplified approach for trade receivables without a significant financing component requires:', o:['Lifetime expected credit losses recognised from the start','Losses recognised only when the balance is 90 days overdue','Incurred loss measurement on objective evidence of default','Twelve month expected credit losses at initial recognition'], c:0, why:'The simplified approach requires a loss allowance measured at lifetime expected credit losses from initial recognition, without staging assessments. The 90 day trigger and incurred loss model reflect the superseded approach.' },
  { q:'Testing subsequent receipts to support the year end receivable balance is weakest as evidence when:', o:['The receipt comes soon after year end from an outside customer','The customer pays a lump sum on account, with no allocation','The payment is traced to the bank statement and sales ledger','The customer pays the exact amount of a pre year end invoice'], c:1, why:'An unallocated lump sum on account cannot be matched to the specific year end invoices, so it does not confirm that those particular invoices were valid and outstanding. Invoice specific remittance advices provide much stronger linkage.' },
  { q:'An auditor is concerned that revenue was recognised for goods despatched after year end. The most direct procedure is:', o:['Ageing the receivables ledger by the date of the sales invoice','Reconciling the receivables ledger to the control account','Matching invoices around the cut-off to despatch documents','Circularising the ten largest customers by closing balance'], c:2, why:'Two way matching of despatch documentation to invoices around the cut-off date directly tests whether the transfer of control occurred before or after year end. Ageing and ledger reconciliations do not test the timing of despatch.' },
  { q:'Management refuses to allow the auditor to send confirmations to three large debtors, citing an ongoing commercial negotiation. Under SA 505, the auditor should first:', o:['Send the confirmations anyway without informing the management','Accept the refusal and perform alternative procedures at once','Issue a qualified opinion immediately for a scope limitation','Inquire into the reasons and seek evidence of their validity'], c:3, why:'SA 505 requires inquiry into the reasons for refusal and evidence of their validity, evaluation of the implications for risk including fraud, and performance of alternative procedures. Only if the refusal is unreasonable or alternative procedures fail does the auditor communicate with those charged with governance and consider the opinion implications.' },
  { q:'A confirmation reply is received by fax from a debtor and shows agreement with the recorded balance. Under SA 505 the auditor should:', o:['Consider the reliability risk and verify the source directly','Treat it as an oral response that requires no further follow up','Accept it without further work because the balance agrees','Reject it outright, as only original signed letters count'], c:0, why:'SA 505 recognises that responses received electronically or by fax carry risks about source and authorisation, so the auditor takes steps to validate the source and integrity. Outright rejection is not required, but unquestioning acceptance is inappropriate.' },
  { q:'An ageing analysis shows a significant balance in the 0 to 30 day bucket for a customer who historically pays in 120 days. Investigation reveals the old invoices were credited and re-invoiced. This most likely indicates:', o:['A legitimate correction of pricing errors on old invoices','Ledger churning to disguise the true age of a doubtful debt','A change in the credit terms approved by the board of directors','A genuine improvement in the collection performance this year'], c:1, why:'Cancelling and reissuing invoices resets the ageing clock and hides the true age, understating the expected credit loss. Genuine pricing corrections would normally alter the amount rather than the whole invoice date profile for a slow payer.' },
  { q:'The auditor tests credit notes issued after the year end. The primary purpose is to:', o:['Verify the accuracy of the discount rate used in the ECL model','Confirm the existence of the customer named on the invoice','Identify revenue and receivables to be reversed at year end','Test the completeness of purchases recorded near the year end'], c:2, why:'Post year end credit notes relating to pre year end sales indicate that revenue and receivables were overstated at the balance sheet date. This is a cut-off and valuation procedure rather than an existence one.' },
  { q:'When designing a positive confirmation, requesting the debtor to provide the amount they believe is owed rather than confirming a stated amount:', o:['It raises the response rate and the reliability in equal measure','It is prohibited under SA 505 for trade receivable balances','It is used only in the design of negative confirmations','It lowers the response rate but improves reliability of replies'], c:3, why:'A blank form positive confirmation avoids the respondent simply signing an agreed figure, so the responses received are more reliable, but the extra effort typically lowers response rates. SA 505 permits both blank and stated amount forms.' },
  { q:'Which procedure best addresses the completeness assertion for trade receivables?', o:['Tracing despatches before year end into invoices and the ledger','Reviewing the ageing report for the oldest outstanding balances','Recalculating the expected credit loss allowance at the year end','Confirming a sample of balances drawn from the sales ledger'], c:0, why:'Tracing from despatch documentation forward to invoices and the ledger detects unrecorded sales, which is the essence of completeness. Confirmation and ageing both start from recorded balances and cannot reveal omissions.' },
  { q:'A debtor confirmation reply states that the amount was paid on 28 March, but the company records show the receipt on 4 April. This exception most likely reflects:', o:['A misstatement needing adjustment of the receivable balance','Cash in transit, to be traced to the bank reconciliation','Evidence of a ghost customer created to inflate the revenue','A breach of the simplified approach under Ind AS 109 rules'], c:1, why:'Cash in transit at the cut-off is a routine reconciling item that must be traced to the bank statement and the reconciliation to confirm it is genuine. It becomes a misstatement only if the receipt cannot be substantiated or was deliberately delayed.' },
  { q:'For a bill discounted with a bank with recourse, the correct treatment and audit focus is:', o:['Net the discounted bills off against the trade payables','Derecognise the receivable, as the risk has passed to the bank','Keep the receivable, record the borrowing and test recourse','Disclose it only as a contingent liability in the notes'], c:2, why:'Where the entity retains substantially all risks and rewards through recourse, derecognition criteria under Ind AS 109 are not met, so the receivable stays on the books with a corresponding liability. Treating it as an off balance sheet contingency understates both assets and borrowings.' },
  { q:'An auditor selects confirmations only from balances above Rs 25 lakh in a ledger where numerous smaller balances aggregate to a material amount. The main deficiency is:', o:['Positive confirmations may not be used for large balances','Sampling is not permitted for trade receivable balances','It breaches a requirement to confirm every open balance','The untested stratum may hold material aggregate error'], c:3, why:'Selecting only large items leaves the remaining population untested, and those balances can aggregate to a material misstatement. The auditor must apply sampling or other substantive procedures to the residual stratum.' },
  { q:'Control of confirmation requests under SA 505 requires that:', o:['The auditor selects, sends and receives the replies directly','Replies may be routed via the client accounts team for sorting','Management may decide which non-responses need to be chased','The client posts the requests while the auditor reviews the list'], c:0, why:'SA 505 requires the auditor to maintain control over the entire confirmation process, including sending requests and receiving replies directly. Client involvement in mailing or receiving replies destroys the independence that gives confirmations their evidential value.' },
  { q:'A company sells receivables without recourse to a factor at a discount, transferring substantially all risks and rewards. At year end the auditor should verify that:', o:['The receivables stay on the balance sheet with a factoring loan','The receivables are derecognised and the loss is recognised','The factoring discount is capitalised as a prepaid expense','The arrangement is disclosed only in the directors report'], c:1, why:'Where substantially all risks and rewards transfer, Ind AS 109 requires derecognition with the difference recognised in profit or loss. Retaining the asset would be correct only for recourse arrangements where risks are retained.' }
];
MCQ_BANK['cashbank'] = [
  { q:'A bank confirmation reveals a fixed deposit of Rs 5 crore marked as lien in favour of a guarantee issued for a subsidiary. In the financial statements this should be:', o:['Shown as restricted other bank balances, with the lien disclosed','Netted off against the guarantee obligation given for the subsidiary','Treated as an investment at fair value through profit or loss','Included within cash and cash equivalents without any comment'], c:0, why:'Deposits under lien are not available for general use and therefore fail the cash equivalents definition, requiring separate presentation and disclosure of the restriction. The related guarantee also needs assessment as a contingent liability or financial guarantee contract.' },
  { q:'While testing the bank reconciliation, the auditor notes cheques totalling Rs 90 lakh issued on 30 March but despatched to vendors only on 25 April. The most likely conclusion is:', o:['A normal outstanding cheque timing difference needing no adjustment','Window dressing understating cash and payables, requiring reversal','A teeming and lading fraud committed on the customer collections','Evidence of an unrecorded bank overdraft at the year end date'], c:1, why:'Cheques recorded as issued but not released to payees do not extinguish the liability, so both cash and trade payables are understated and the current ratio artificially improved. Genuine outstanding cheques are those actually despatched but not yet presented.' },
  { q:'Teeming and lading is best detected by:', o:['Reviewing the fixed deposit register for maturities during the year','Recomputing the bank reconciliation as at the year end date','Comparing receipt dates with banking and customer posting dates','Confirming the year end bank balance directly with each bank'], c:2, why:'Teeming and lading involves delaying the posting of receipts and covering earlier misappropriations with later collections, so lags between receipt, banking and customer posting are the tell-tale sign. A year end bank confirmation shows the total balance and would not reveal the misallocation between customers.' },
  { q:'A company holds a USD current account. At year end the balance is USD 200000, translated at the closing rate. Under Ind AS 21 the exchange difference on this monetary item is:', o:['Adjusted against the cost of the related non-monetary asset','Deferred in equity until the bank account is finally closed','Recognised in other comprehensive income as a translation item','Recognised in profit or loss for the period as it arises'], c:3, why:'Foreign currency bank balances are monetary items retranslated at the closing rate with differences taken to profit or loss. OCI treatment applies to net investment hedges or translation of a foreign operation, not to a routine bank account.' },
  { q:'The auditor obtains a bank confirmation covering balances but not other arrangements. The most significant gap is:', o:['No information on guarantees, liens, security and signatories','No confirmation of the interest rate on the savings account','Failure to obtain a duplicate passbook for the current account','Failure to check the arithmetical accuracy of the statements'], c:0, why:'A standard bank confirmation should also cover contingent liabilities such as guarantees and letters of credit, charges and liens, and signatory details, which are key to completeness of liabilities and disclosure. Balances alone leave off balance sheet exposures untested.' },
  { q:'During a surprise cash count on 5 April for a 31 March year end, the auditor should:', o:['Accept the counted balance as the year end cash on hand','Roll the count back using verified receipts and payments','Ignore the count, since it falls after the balance sheet date','Ask the cashier to reconstruct the 31 March cash position'], c:1, why:'A count after year end is reconciled backwards to the balance sheet date using tested intervening receipts and payments records. Treating the later count as the year end balance ignores all movements in the intervening period.' },
  { q:'Which item in a bank reconciliation warrants the highest audit scrutiny?', o:['Cheques despatched in the last week of March, presented 4 April','Bank charges debited on 31 March and recorded on 2 April','A deposit banked on 31 March but credited only on 20 April','Bank interest credited on 31 March and recorded on 1 April'], c:2, why:'A deposit in transit clearing nearly three weeks later is inconsistent with normal clearing cycles and may indicate a fictitious receipt or receipts recorded early to inflate cash. Small timing differences on charges, interest and recently despatched cheques are routine.' },
  { q:'A company has a bank overdraft of Rs 2 crore with Bank A and a positive balance of Rs 3 crore with Bank B, without a legal right of set-off. Presentation should be:', o:['Rs 2 crore netted from cash with the gross figures disclosed','Both balances presented within cash and cash equivalents','Net cash of Rs 1 crore presented under current assets','Rs 3 crore as cash and bank, Rs 2 crore as a borrowing'], c:3, why:'Offsetting under Ind AS 32 requires a legally enforceable right and intention to settle net, which is absent, so the balances are presented gross. The overdraft is a borrowing under Schedule III unless it forms an integral part of cash management for cash flow statement purposes.' },
  { q:'The strongest control over payments in a manufacturing company is:', o:['Three way matching, dual authorisation and segregated recording','A monthly review of the payment register by the processing clerk','Pre-signed blank cheques held in a locked drawer for urgencies','The accountant who records payments also prepares the cheques'], c:0, why:'Three way matching with dual authorisation and segregation of duties prevents both unauthorised and duplicate payments. Pre-signed cheques and self-review by the preparer are classic control deficiencies that enable misappropriation.' },
  { q:'A cash flow statement is being audited. A three month fixed deposit taken on 15 February and maturing on 15 May with an original maturity of 90 days, freely encashable, should be:', o:['Excluded from cash equivalents because it has a fixed maturity','Included, as original maturity is three months or less','Included only if it matures before the balance sheet date','Shown as an investing outflow at the date it was placed'], c:1, why:'Ind AS 7 treats short term highly liquid investments with an original maturity of three months or less from the date of acquisition as cash equivalents. The test runs from acquisition date, not from the balance sheet date.' },
  { q:'The auditor identifies that the same person receives cash, records it in the cash book and performs the bank reconciliation. The most appropriate audit response is:', o:['Test only the year end bank reconciliation in more depth','Offer to prepare the bank reconciliation for the client','Report the deficiency and expand substantive testing','Accept it, as a small company has compensating controls'], c:2, why:'Lack of segregation over the receipt, recording and reconciliation functions creates a serious misappropriation risk that must be communicated and responded to with expanded substantive work. Preparing the reconciliation for the client would impair independence by creating a self-review threat.' },
  { q:'Kiting, the manipulation of inter-bank transfers around the year end, is most effectively detected by:', o:['Recounting the petty cash float held at the head office','Reviewing the interest accrual on the fixed deposits held','Confirming each of the bank balances separately in writing','Preparing a bank transfer schedule around the year end'], c:3, why:'A bank transfer schedule reveals transfers recorded as received before being recorded as paid, or clearing dates straddling the year end, which is precisely how cash is double counted. Individual balance confirmations agree to books that already contain the manipulation.' },
  { q:'A company reports a large cash balance held at branches abroad in a country with strict exchange controls preventing remittance. The correct treatment is:', o:['Include it in cash, disclosing the restriction on its use','Provide fully against the balance as it is not recoverable','Reclassify the amount as an investment in the subsidiary','Exclude the amount from the balance sheet altogether'], c:0, why:'The cash still exists and is controlled by the entity, so it remains recognised, but Ind AS 7 requires disclosure of significant cash balances not available for use by the group. Full provisioning is inappropriate absent evidence of loss of control or impairment.' },
  { q:'Which procedure primarily addresses completeness of bank accounts rather than accuracy of balances?', o:['Recomputing the interest earned on the term deposit account','Reviewing account opening approvals and confirming all banks','Vouching the ten largest payments made during the period','Agreeing the statement balance to the year end reconciliation'], c:1, why:'Reviewing authorisations for account opening and confirming with all banks the entity dealt with during the year detects unrecorded accounts. Procedures starting from recorded accounts cannot identify accounts omitted from the ledger.' },
  { q:'Cheques on hand at year end that were received from customers on 31 March but banked on 2 April should be:', o:['Adjusted only where the amount is material to the current ratio','Excluded from cash and left in receivables until banked','Included in cash on hand, supported by the collection record','Recorded as accrued income until the cheques are cleared'], c:2, why:'Cheques received before the cut-off represent cash on hand and are properly reflected as such, with the customer balance cleared, provided the receipt is substantiated. The auditor tests the collection register and subsequent banking to confirm the receipt date.' },
  { q:'The auditor notes numerous round sum cash withdrawals described as site expenses with no supporting vouchers, aggregating Rs 40 lakh. The most appropriate response is:', o:['Propose a reclassification to miscellaneous site expenses','Reduce the sample size for testing of cash transactions','Accept the explanation, as site operations are cash based','Treat it as a fraud risk indicator and extend procedures'], c:3, why:'Unsupported round sum withdrawals are a classic indicator of misappropriation and require extended procedures and evaluation of the auditor statutory duty to report suspected fraud. Reclassification does not address the underlying occurrence and authorisation risk.' },
  { q:'A bank confirmation is returned directly to the auditor showing a balance Rs 12 lakh lower than the ledger, and the difference is claimed to be an unrecorded bank charge. The auditor should:', o:['Trace the charge and test whether similar items were omitted','Ask the bank to reissue the confirmation with the correction','Ignore it, as the amount is immaterial to the balance sheet','Post the entry without further work, as the bank is external'], c:0, why:'A single unrecorded item may indicate a systematic failure to record bank charges, so projection across the year and control evaluation is necessary. Recording the entry without investigating the cause misses the recurring misstatement.' },
  { q:'Under Schedule III, cheques and drafts on hand are presented within:', o:['Other current assets, alongside prepaid expenses and advances','Cash and cash equivalents, with balances and cash on hand','Other financial assets shown under the non-current heading','Trade receivables, until the instrument is actually realised'], c:1, why:'Schedule III presentation of cash and cash equivalents includes balances with banks, cheques and drafts on hand and cash on hand. Leaving them in receivables would misstate both captions once the instrument has been received.' }
];
MCQ_BANK['payroll'] = [
  { q:'The auditor performs a proof in total on payroll by taking prior year cost, adjusting for the average increment percentage and headcount movement, then comparing with actual. This is primarily:', o:['A substantive analytical procedure over the payroll cost','A test of details on the individual employee pay records','A walkthrough of the payroll processing cycle end to end','A test of controls over the authorisation of payroll runs'], c:0, why:'Building an independent expectation from headcount and rate data and comparing it with recorded cost is a substantive analytical procedure. Its effectiveness depends on the reliability of the underlying headcount and rate data used to build the expectation.' },
  { q:'Which procedure most directly detects ghost employees?', o:['Recalculating the gross to net pay for a sample of employees','Matching the payroll master to HR records and bank details','Agreeing the payroll register total to the general ledger','Reviewing the authorisation of overtime hours by managers'], c:1, why:'Ghost employees exist on the payroll but not in reality, so cross checking against independent HR records and looking for duplicate bank accounts targets that specific risk. Recalculation and ledger agreement confirm accuracy of amounts paid to names already on the register.' },
  { q:'Under Ind AS 19, the defined benefit gratuity obligation remeasurement comprising actuarial gains and losses is:', o:['Deferred under the corridor approach over the average life','Recognised in profit or loss within employee benefit cost','Recognised in other comprehensive income, never recycled','Recognised in other comprehensive income, recycled later'], c:2, why:'Ind AS 19 requires remeasurements to go to OCI without subsequent reclassification to profit or loss, while current and past service cost and net interest go to profit or loss. The corridor approach was eliminated.' },
  { q:'A leave encashment scheme allows accumulation and encashment on separation. Under Ind AS 19 this is classified and measured as:', o:['A defined benefit plan with the remeasurements taken to OCI','A termination benefit recognised only on separation date','A short term benefit measured on an undiscounted basis','An other long term benefit with remeasurements in profit'], c:3, why:'Accumulating compensated absences payable beyond twelve months are other long term employee benefits requiring actuarial valuation, but unlike defined benefit plans the remeasurements go to profit or loss. Undiscounted treatment applies only where settlement is expected wholly within twelve months.' },
  { q:'The auditor tests leavers. Which finding indicates the most serious control failure?', o:['An employee who resigned in November was paid till March','Notice recovery computed on basic pay rather than gross pay','Exit interview documents missing for two of the leavers','Full and final settlement made two weeks after the exit'], c:0, why:'Continued payment after separation is a direct misappropriation or a serious completeness failure in the leaver deactivation control, causing an overstated expense. Delayed settlements and missing interview forms are process weaknesses with far lower financial consequence.' },
  { q:'For statutory dues, the auditor finds employee provident fund contributions deducted in March were deposited in July. Under Ind AS and the Income Tax Act position for employee contributions, the deducted amount not deposited within the due date under the relevant statute is:', o:['Allowable in the year of payment, whatever the due date','Disallowed permanently, as the statutory date was missed','Allowable if deposited before the return filing due date','Not an audit matter, being purely a tax computation issue'], c:1, why:'Employee contributions deducted from salary are governed by the specific deposit due date under the relevant labour statute, and delayed deposit results in disallowance that is not cured by payment before the return filing date. This is a reportable matter under CARO on statutory dues and affects the tax provision.' },
  { q:'Which analytic best identifies payroll fraud through inflated overtime?', o:['Agreeing the salary register to the bank payment file','Comparing the total payroll cost with budget at company level','Comparing overtime hours with attendance and feasible hours','Recomputing provident fund on a sample of pay records'], c:2, why:'Testing overtime against attendance data and physical feasibility isolates the specific manipulation, since fabricated hours often exceed available hours in the period. Company level budget comparison is too aggregated to reveal individual departmental abuse.' },
  { q:'An auditor obtains the payroll bank transfer file and compares it to the payroll register. The number of credits exceeds the register headcount by four. This most likely indicates:', o:['An error in the provident fund rate applied to the wages','Correct handling of employees who are on unpaid leave','A rounding difference arising in the net pay computation','Unauthorised payments made outside the payroll system'], c:3, why:'Payments made without a corresponding payroll register entry point to unauthorised disbursements or ghost credits, an occurrence and authorisation failure. Rounding and rate errors change amounts, not the number of payment instructions.' },
  { q:'Under Ind AS 19, past service cost arising from a plan amendment is:', o:['Recognised in profit or loss at the plan amendment date','Spread over the remaining vesting period of the benefits','Recognised in other comprehensive income as a remeasurement','Recognised only when the amended benefits actually vest'], c:0, why:'Ind AS 19 requires immediate recognition of past service cost in profit or loss at the earlier of when the plan amendment or curtailment occurs and when related restructuring costs or termination benefits are recognised. Deferral over the vesting period reflects the superseded treatment.' },
  { q:'The auditor is testing the completeness of TDS on salaries. The most effective procedure is:', o:['Agreeing the TDS challans to the entries in the bank statements','Reconciling salary cost with the taxable pay in the TDS return','Recomputing the tax deducted for the highest paid employee','Reviewing the appointment letters issued to the new joiners'], c:1, why:'A reconciliation between the books salary cost and amounts reported in the statutory return identifies salary components on which tax was not deducted. Challan agreement only verifies that what was computed was paid, not that everything taxable was captured.' },
  { q:'A company grants a bonus that becomes payable only if the employee remains employed on 30 June following the year end. At 31 March, the correct treatment is:', o:['Recognise the bonus only when it is paid to staff in June','Recognise the whole bonus, ignoring the future service condition','Accrue for service rendered, allowing for expected forfeitures','Disclose it as a contingent liability with no amount accrued'], c:2, why:'Employee benefits are recognised as services are rendered, but a genuine future service condition affects whether an obligation exists at the reporting date and requires estimating expected forfeitures. Blanket full accrual or pure cash basis both misstate the liability.' },
  { q:'Which of the following is the strongest management control over payroll master data?', o:['Monthly reconciliation of payroll cost to budget by the payroll head','An annual review of the salary structures by the committee','The processor may add employees but must retain the form','HR authorises master changes and the log is reviewed outside'], c:3, why:'Independent authorisation combined with review of a system generated change log by someone outside payroll prevents and detects unauthorised master data changes. Self-authorisation by the processor and high level budget comparison do not address individual record manipulation.' },
  { q:'An actuarial valuation for gratuity uses a discount rate materially higher than yields on government securities of comparable maturity. The likely effect and audit response are:', o:['Liability understated; challenge the rate against bond yields','No effect, since the discount rate changes only the disclosure','Liability understated, but an actuary cannot be challenged','Liability overstated; accept the rate as prudently chosen'], c:0, why:'A higher discount rate reduces the present value of the obligation, so an unsupported rate understates the liability. SA 500 requires the auditor to evaluate the competence, capability and objectivity of a management expert and the appropriateness of the assumptions used.' },
  { q:'The auditor selects new joiners during the year and traces them to the payroll. This primarily tests:', o:['Occurrence of the payroll expense recorded in the period','Completeness and accuracy of pay for the new employees','Existence of the gratuity liability at the reporting date','Classification between direct labour and indirect labour'], c:1, why:'Tracing from HR appointment records forward to the payroll tests that all genuine employees are captured at correct rates and dates, which is completeness and accuracy. Testing occurrence would run in the opposite direction, from the payroll to HR evidence.' },
  { q:'A company capitalises payroll costs of an internal team into a self-constructed asset. The audit focus should be on:', o:['Whether the employees signed the daily attendance register','Whether salaries were paid through the correct bank account','Whether the time is directly attributable, per time records','Whether provident fund was computed on the capitalised pay'], c:2, why:'Only directly attributable employee benefit costs arising from construction may be capitalised under Ind AS 16, with general administrative overheads excluded. The critical evidence is reliable time allocation records supporting the attribution.' },
  { q:'The auditor recomputes ESI contributions and finds the company excluded contract labour engaged through an agency. The auditor should:', o:['Restate payroll cost to include the agency invoices as pay','Treat the exclusion purely as a disclosure matter in notes','Accept it, since the agency is the employer in every situation','Assess principal employer liability and CARO reporting on it'], c:3, why:'The principal employer can carry liability for statutory dues of contract labour where the contractor defaults, creating a potential provision or contingent liability. This also feeds the CARO reporting on undisputed statutory dues outstanding.' },
  { q:'Payroll cost as a percentage of revenue fell from 18 percent to 11 percent while headcount was stable. The most probable explanation warranting investigation is:', o:['Payroll understated by omitted accruals or capitalisation','The gratuity liability was remeasured through OCI this year','Employees received a large increment during the same year','Revenue and payroll cost grew at exactly the same rate'], c:0, why:'A fall of this size with stable headcount points to payroll cost being removed from the profit and loss through unrecorded accruals or improper capitalisation, which must be tested. Equal growth in both would leave the ratio unchanged and increments would push it up.' },
  { q:'In auditing a company that outsources payroll processing to a service organisation, the auditor should primarily:', o:['Rely on the client view that the service provider is sound','Obtain a type 2 report and assess complementary controls','Audit the financial statements of the service organisation','Ignore the provider, as the client retains responsibility'], c:1, why:'SA 402 permits use of a type 2 report covering design and operating effectiveness of relevant controls, along with evaluation of whether the complementary user entity controls assumed by the report are actually operating. Client assurances are not audit evidence about the service organisation controls.' }
];
MCQ_BANK['confirmations'] = [
  { q:'Under SA 505, an external confirmation is audit evidence obtained as:', o:['A direct written response to the auditor from a third party','Any externally originated document held by the client entity','An oral confirmation from a third party, documented by staff','A written response from management to an auditor inquiry note'], c:0, why:'SA 505 defines external confirmation as a direct written response to the auditor from a confirming party. Externally originated documents held by the client are external evidence but not external confirmations because they lack the direct route to the auditor.' },
  { q:'The auditor receives an oral response to a confirmation request. Under SA 505 the auditor should:', o:['Treat it as an external confirmation and document the call','Request a written response direct from the confirming party','Ask the client to obtain the written response on our behalf','Treat the request as a non-response needing no further work'], c:1, why:'An oral reply does not meet the definition of an external confirmation, so the auditor requests written confirmation directly from the party. Routing the request through the client would surrender control of the confirmation process.' },
  { q:'Management refuses to permit the auditor to send a confirmation request and the auditor concludes the refusal is unreasonable. The auditor should:', o:['Send the request to another confirming party of similar size','Perform alternative procedures and conclude without more work','Inform those charged with governance and reassess the risks','Resign from the engagement immediately without further work'], c:2, why:'SA 505 requires communication with those charged with governance, evaluation of the implications for risk assessment including fraud risk, and consideration of the effect on the auditor opinion where the refusal is unreasonable. Simply performing alternative procedures without these steps ignores the significance of the refusal itself.' },
  { q:'Which of the following most reduces the reliability of a confirmation response?', o:['The response arrives later than the date the auditor requested','The respondent used a blank form and not a stated amount','The reply comes by post on the letterhead of the debtor','The reply address matches the premises of the audit client'], c:3, why:'Evidence that the reply was intercepted or routed through the client casts doubt on the authenticity and source, undermining the fundamental premise of independence. Late receipt and the form of request affect timing and precision but not authenticity.' },
  { q:'For electronic confirmations obtained through a third party service provider, the auditor primary concern under SA 505 is:', o:['Risks to the integrity of the process and its security','Whether the client has approved the use of the platform','Whether the responses arrive within seven working days','The cost of the platform against postal confirmation'], c:0, why:'SA 505 notes that electronic responses involve risks about reliability because proof of origin and authority may be difficult to establish, so the auditor considers the security and control of the process. A secure controlled electronic environment can improve reliability compared with paper.' },
  { q:'A negative confirmation request asks the confirming party to respond:', o:['In every case, whether or not they agree with the amount','Only if they disagree with the information provided','Only if they agree with the information as provided','With the amount that they believe is actually owed'], c:1, why:'Negative confirmations require a reply only where the recipient disagrees, so silence provides only weak implicit evidence. The blank amount request describes a form of positive confirmation, not a negative one.' },
  { q:'The main limitation of negative confirmations as audit evidence is that:', o:['They require confirmation of the whole population','They cost more to operate than positive confirmations','Silence does not prove receipt or any verification','They may only be used for trade payable balances'], c:2, why:'Silence may simply mean the request was never received, never read or ignored, so it is not affirmative evidence of accuracy. This is why SA 505 restricts sole reliance on negative confirmations to narrow low risk circumstances.' },
  { q:'The auditor determines that responses to positive confirmation requests are necessary to obtain sufficient appropriate evidence, but no responses are received. In this case the auditor should:', o:['Reduce materiality and re-perform the confirmation requests','Accept a management representation as a substitute','Perform alternative procedures and treat it as resolved','Evaluate the implications for the audit and the opinion'], c:3, why:'SA 505 states that where the auditor has determined a response to a positive request is necessary, alternative procedures will not provide the evidence required, so the implications for the opinion must be evaluated. This is a narrower scenario than a routine non-response.' },
  { q:'An exception is identified in a confirmation reply. Under SA 505 the auditor should:', o:['Investigate whether it indicates a misstatement or fraud','Ignore it where it falls below the performance materiality','Ask the client to obtain a corrected confirmation reply','Treat it as a misstatement and propose an adjustment'], c:0, why:'Exceptions may reflect timing differences, measurement errors or misstatements, and some indicate fraud, so investigation of the cause is required. Automatic adjustment or dismissal by size both skip the evaluation of what the exception signifies.' },
  { q:'Which factor would make negative confirmations inappropriate even in a low risk population?', o:['A large number of small homogeneous account balances held','A belief that recipients will disregard the requests','A very low expected exception rate in the population','Receivable controls that are operating effectively'], c:1, why:'SA 505 requires that the auditor is not aware of circumstances causing recipients to disregard the requests, otherwise silence is meaningless. The other three items are conditions that support rather than preclude the use of negative confirmations.' },
  { q:'Confirming the terms of a complex sales agreement including side letters and rights of return is best achieved by:', o:['Obtaining a management representation on side agreements','Confirming only the outstanding balance with the customer','Confirming the terms with a person authorised to reply','Reviewing the copy of the agreement held by the client'], c:2, why:'SA 505 contemplates confirming terms of agreements and the absence of side agreements, and the request must go to an individual with knowledge and authority to respond. Client held documents cannot reveal undisclosed side letters, and representations alone are weak evidence for a significant risk.' },
  { q:'The auditor is concerned that the client may have influenced the confirmation responses. The most appropriate response is:', o:['Ask internal audit to send out the confirmation requests','Convert all outstanding requests to negative confirmations','Increase the sample size sent through the same postal process','Resend to verified addresses and telephone the respondents'], c:3, why:'Independent verification of addresses and direct contact with the confirming party addresses the risk that the client intercepted or fabricated responses. Increasing volume through a compromised process merely produces more unreliable evidence.' },
  { q:'Under SA 505, when the auditor uses external confirmation procedures, control over the requests includes all of the following EXCEPT:', o:['Letting management review replies before the auditor sees','Determining the information to be confirmed or requested','Selecting the appropriate confirming party to be asked','Designing requests with a reply address direct to the auditor'], c:0, why:'Management review of responses before they reach the auditor destroys the independence of the evidence and is contrary to the control requirement. The other three items are the explicit elements of auditor control over the confirmation process.' },
  { q:'For which balance would a confirmation to a party with whom the client records no balance still be highly valuable?', o:['A customer carrying a large recorded receivable balance','A major supplier whose recorded payable is nil or small','A bank whose balance has already been confirmed once','A related party operating under the same common control'], c:1, why:'Payables confirmations target understatement, so requesting a statement from a major supplier with a nil recorded balance is a strong completeness procedure. Confirming large recorded receivables addresses existence, which is the opposite direction of risk.' },
  { q:'A confirming party responds using a restrictive disclaimer stating the reply is given without any responsibility. Under SA 505, the auditor should:', o:['Ask the client to obtain a fresh version without the disclaimer','Reject the whole response as invalid audit evidence','Assess the effect on reliability and the need for more work','Accept it as fully reliable, as it came to us directly'], c:2, why:'Restrictive language does not automatically void a response, but the auditor must assess the effect on reliability and consider supplementary procedures. Neither outright rejection nor unqualified acceptance reflects the required professional judgement.' },
  { q:'The auditor selects a positive confirmation approach for receivables in a high risk area but the response rate is only 40 percent. The correct next step is:', o:['Send negative confirmations to all of the non-respondents','Extend the sample only if the replies showed exceptions','Conclude that the coverage of 40 percent is sufficient','Perform alternative procedures on every non-response'], c:3, why:'Every non-response must be addressed by alternative procedures such as subsequent receipts and shipping documentation, and the auditor then evaluates whether sufficient appropriate evidence exists overall. Substituting negative confirmations in a high risk area is inappropriate.' },
  { q:'Which statement about confirmation of bank balances is most accurate?', o:['It is strong evidence, but the reconciliation is still tested','Requests may be routed through the client treasury department','Negative confirmations are standard practice for bank balances','A bank confirmation removes the need to test the reconciliation'], c:0, why:'The bank confirms its own balance, but the difference between that balance and the ledger consists of reconciling items that carry their own misstatement and manipulation risk. Routing requests through the client and using negative confirmations for banks both undermine reliability.' },
  { q:'SA 505 requires the auditor to consider whether the results of the external confirmation procedures provide relevant and reliable evidence, or whether further evidence is necessary. If the auditor concludes the responses are not reliable, the auditor should:', o:['Use them, but disclose the limitation in the auditor report','Reassess the risks, including fraud, and revise procedures','Reduce the tolerable misstatement set for that population','Obtain a written representation confirming the balances'], c:1, why:'Unreliable responses may indicate a fraud risk factor, requiring reassessment of risks and modification of the nature, timing and extent of further procedures under SA 330. Using known unreliable evidence or substituting a management representation does not remedy the deficiency.' }
];
