MCQ_BANK['sampling'] = [
  { q:'An auditor selects every 40th voucher after a random start from a population of 8000 payment vouchers. Under SA 530 this selection is best described as:', o:['Systematic selection, which can be statistical where the start is random','Non-statistical selection, because judgement fixed the interval width','Monetary unit sampling, because a constant interval is being applied','Haphazard selection, because no selection probability is ever computed'], c:0, why:'Systematic selection with a random start gives each item a known chance of selection, so it qualifies for statistical sampling, provided the population has no structure that coincides with the sampling interval. MUS also uses an interval, but the interval runs over monetary units, not physical items.' },
  { q:'Which of the following is a consequence of sampling risk rather than non-sampling risk?', o:['The auditor applies an unsuitable audit procedure to the items selected','The auditor misses a misstatement in an item that was actually examined','The auditor concludes a control works when the true rate exceeds tolerable','A team member misreads a confirmation reply received from a trade customer'], c:2, why:'Sampling risk is the risk that the conclusion from the sample differs from the conclusion had the entire population been tested, which is exactly the risk of incorrectly accepting effective controls. Applying wrong procedures or missing a misstatement in an item actually examined are non-sampling risks and are not reduced by increasing sample size.' },
  { q:'In monetary unit sampling for a trade receivables balance, which population item is CERTAIN to be selected?', o:['Any item whose book value equals the population average book value','Any item carrying a negative or credit book value at the period end','Any item that was also selected in the prior year audit sample','Any item whose book value equals or exceeds the sampling interval used'], c:3, why:'In MUS each rupee is a sampling unit, so an item at least as large as the interval must contain at least one selected monetary unit and is picked with certainty. Negative balances are actually a known weakness of MUS and must be tested separately, not automatically included.' },
  { q:'An auditor sets tolerable misstatement at 60 percent of performance materiality for a substantive sample. Increasing tolerable misstatement while all else is unchanged will:', o:['Increase the sample size, since more precision is demanded','Decrease the sample size, since less precision is demanded','Leave sample size unchanged, but raise the sampling risk faced','Force the auditor to move from non-statistical to statistical sampling'], c:1, why:'Sample size varies inversely with tolerable misstatement, because a larger amount the auditor is willing to accept demands less precision. The tempting answer is that a bigger tolerance means more work, but the relationship is the opposite.' },
  { q:'SA 530 permits the auditor to treat a misstatement as an anomaly only when:', o:['It arose from a one-off cause and is demonstrably not representative','It falls below the performance materiality set for the engagement','Management has agreed to correct the misstatement in full before signing','It arose from a control deviation rather than a recording error'], c:0, why:'An anomaly requires a high degree of certainty, supported by additional procedures, that the item is demonstrably not representative of the population. Size and management correction are irrelevant to whether the cause could recur elsewhere in the population.' },
  { q:'Stratification of an accounts receivable population by balance size primarily achieves which of the following?', o:['Elimination of non-sampling risk within each of the strata formed','Conversion of a non-statistical approach into a statistical one','Removal of the need to project misstatements in the low value stratum','Reduction of variability within strata, allowing a smaller sample'], c:3, why:'Stratification groups items with similar characteristics so that variability within each stratum falls, which reduces the total sample size needed. Misstatements found in a stratum still have to be projected to that stratum, and stratification does nothing about non-sampling risk.' },
  { q:'An auditor tests 60 items from a population of 12000 purchase orders and finds 3 without required approval. The tolerable deviation rate is 5 percent. The most appropriate immediate conclusion is:', o:['The deviation rate of 5 percent equals tolerable, so the control is effective','The three exceptions are anomalies and should be excluded from the results','The rate of 5 percent leaves no allowance for sampling risk, so no reliance','The sample should be extended to 120 items and the two rates averaged'], c:2, why:'A sample deviation rate equal to the tolerable rate leaves no room for the allowance for sampling risk, so the upper deviation rate exceeds tolerable and reliance is not supported. Treating deviations as anomalies requires demonstrated non-representativeness, which is not established here.' },
  { q:'Which factor would MOST reduce the required sample size in a test of details of a large inventory balance?', o:['A rise in the assessed risk of material misstatement for the balance','A fall in the misstatement the auditor expects in the population','Stratifying the population into fewer and considerably wider strata','A rise in the number of items in the population from 50000 to 90000'], c:1, why:'Lower expected misstatement means less allowance is needed and sample size falls. Population size has almost no effect on sample size for large populations, which is a common misconception, and higher assessed risk increases sample size.' },
  { q:'After projecting the misstatement from a substantive sample, the projected misstatement is below performance materiality but close to it. Under SA 530 the auditor should:', o:['Conclude the population is not materially misstated because projection is lower','Reduce performance materiality so that the projection falls comfortably within it','Ask management to record the full projected misstatement as an audit adjustment','Consider that projection plus sampling risk may exceed tolerable, and extend'], c:3, why:'The evaluation must compare projected misstatement plus the allowance for sampling risk against tolerable misstatement, so a projection close to the threshold means the population may still be materially misstated. Lowering materiality after the fact to fit the result reverses the required logic.' },
  { q:'Which statement about projecting misstatements is correct under SA 530?', o:['Misstatements in items tested 100 percent are added in full, not projected','Anomalies are projected but carry a reduced weighting in the estimate','Misstatements in items tested in full are projected to the remainder','Only understatements are projected, since overstatements get corrected first'], c:0, why:'Items tested in full are not part of the sampled remainder, so misstatements in them are known misstatements added in full rather than projected. Projecting them would double count and overstate the estimated misstatement.' },
  { q:'An auditor plans a test of controls over authorisation of journal entries and expects zero deviations. Which change would MOST increase the sample size?', o:['Raising the tolerable deviation rate from 5 percent to 8 percent','Reducing the desired confidence level from 95 percent to 90 percent','Raising the expected deviation rate from 0 percent to 2 percent','Raising the population from 4000 to 9000 authorised journal entries'], c:2, why:'When the expected deviation rate moves closer to the tolerable rate, the required sample size rises sharply. Raising tolerable rate and lowering confidence both shrink the sample, and population size is largely irrelevant for large populations.' },
  { q:'Which approach does NOT constitute audit sampling as defined in SA 530?', o:['Selecting 45 items from 3000 invoices using random number tables','Selecting every item above a stated amount and testing only those','Selecting 30 items haphazardly, each item having a chance of selection','Selecting every 25th shipping document after a random starting point'], c:1, why:'Audit sampling requires all items in the population to have a chance of selection so a conclusion can be drawn about the whole population. Testing only items above a threshold is selective testing of specific items and provides no evidence about the untested remainder.' },
  { q:'A key limitation of monetary unit sampling that the auditor must address separately is:', o:['It cannot be used where the population exceeds 10000 separate items','It cannot be combined with stratification of the population at all','It requires the recorded amounts to follow a normal distribution','It is weak on understatement and skips zero and credit balances'], c:3, why:'MUS gives selection probability proportional to recorded amount, so items recorded at zero, omitted altogether, or with credit balances are effectively excluded, making it weak for understatement. Population size and distribution shape are not constraints on MUS.' },
  { q:'The auditor discovers that the receivables listing used to select a sample excluded a branch ledger. The correct response is:', o:['Treat the omission as an anomaly and continue with the existing sample','Project the sample misstatement rate onto the branch ledger balances','Treat the population as incomplete and reselect over the full listing','Increase the sample by the proportion the branch bears to the total'], c:2, why:'Sampling conclusions extend only to the population from which the sample was drawn, so an incomplete population invalidates the extrapolation. Simply scaling up the sample does not create evidence about a segment never eligible for selection.' },
  { q:'Which of the following best distinguishes statistical from non-statistical sampling under SA 530?', o:['Statistical sampling uses random selection and measures sampling risk','Statistical sampling always produces a smaller sample size than other methods','Statistical sampling removes the need for judgement in evaluating results','Non-statistical sampling does not permit projection of misstatements found'], c:0, why:'The defining features of statistical sampling are random selection and the use of probability theory to quantify sampling risk. Judgement is still required throughout, and non-statistical samples must also be projected to the population.' },
  { q:'When performing a test of controls, the auditor finds the control was not performed for a two week period during which the responsible officer was on leave. This is best treated as:', o:['An anomaly, since the absence of the officer was a one-off event','A deviation over that period, which may need separate evaluation','A non-sampling risk that calls for no further evaluation by the team','A scope limitation that requires a modified audit opinion in all cases'], c:1, why:'Where a control operated differently for an identifiable part of the period, that part is effectively a separate population and needs its own evaluation or alternative procedures. Labelling it an anomaly would wrongly ignore every transaction in the affected period.' },
  { q:'In evaluating a substantive sample, the auditor computes projected misstatement using the ratio method. This method is MOST appropriate when:', o:['Misstatement amounts bear no relation at all to the book values of items','Only a single misstatement has been found in the entire sample','The population is heavily stratified and has a certainty stratum','Misstatements are roughly proportional to the book values of items'], c:3, why:'The ratio approach scales the misstatement to book value, so it fits when errors are proportionate to size. Where errors are of similar absolute size regardless of item value, the difference method is the better estimator.' },
  { q:'The auditor increases the assessed risk of material misstatement for the existence of receivables. Assuming other substantive procedures are unchanged, the effect on the sample size for positive confirmations is:', o:['No change, since confirmation sample size depends only on the population size','A decrease, because higher risk shifts reliance towards analytical work','An increase, because lower acceptable detection risk demands more evidence','An increase, but only where the entity operates from several locations'], c:2, why:'Higher assessed risk means detection risk must be driven lower, which requires more evidence and therefore a larger sample. Higher risk does not justify shifting reliance onto analytics, which are less precise for existence at the item level.' }
];
MCQ_BANK['analytical'] = [
  { q:'Under SA 520, a substantive analytical procedure differs from an analytical procedure used in risk assessment principally because the substantive procedure:', o:['Must be carried out at the planning stage of every audit engagement','Must be documented in full within the overall audit strategy memorandum','Must be applied only to income statement balances and never to balance sheet items','Requires an expectation precise enough to detect a material misstatement'], c:3, why:'A substantive analytical procedure only gives assurance if the expectation is precise enough to detect a material misstatement. Risk assessment analytics may be broad and imprecise since their purpose is to identify areas of risk, not to obtain substantive evidence.' },
  { q:'Which situation makes a substantive analytical procedure MOST likely to be effective on its own?', o:['A high volume of predictable items such as rent from long fixed leases','A small number of complex construction contracts carrying variable claims','Provisions for litigation determined largely by management judgement','Related party transactions occurring at irregular and uneven intervals'], c:0, why:'Analytical procedures work best where relationships are stable, predictable, and driven by known factors such as fixed rents and known occupancy. Judgemental, low volume, or irregular balances lack the predictability needed to build a precise expectation.' },
  { q:'An auditor develops an expectation for payroll cost using headcount times average salary and finds a difference of 4 percent from the recorded amount. The threshold for investigation should be set:', o:['At performance materiality, since anything smaller than that is immaterial','By reference to the difference acceptable without further investigation','At the level of the largest individual payroll variance seen during the year','At 5 percent, which is the accepted rule of thumb for payroll analytics'], c:1, why:'SA 520 requires the auditor to determine an acceptable difference by reference to materiality and the assurance sought, not a fixed rule. Setting the threshold at full performance materiality would leave no allowance for aggregation with other misstatements.' },
  { q:'Which factor most directly improves the PRECISION of a substantive analytical procedure over revenue?', o:['Using annual totals for the whole year rather than monthly or weekly data','Using unaudited budgets prepared by management as the expectation','Building the expectation from revenue disaggregated by product and site','Comparing current year revenue only with prior year revenue in total'], c:2, why:'Disaggregation reduces the chance that offsetting movements hide a misstatement, so it sharply improves precision. Annual totals and simple prior year comparisons are the least precise, and unaudited budgets carry management bias unless their reliability is tested.' },
  { q:'The auditor uses data produced by the entity system as an input to a substantive analytical procedure. SA 520 requires the auditor to:', o:['Accept the data where general IT controls were tested in a prior year','Use the data only after the internal audit function has fully reviewed it','Obtain a written representation from management that the data is accurate','Evaluate data reliability by testing controls over it or the data itself'], c:3, why:'Reliability of the underlying data is a precondition for any assurance from the analytical procedure, and it must be established by testing controls or the data itself. A written representation is not a substitute for evidence, and prior year control testing does not carry forward automatically.' },
  { q:'A gross margin analysis shows margin has been stable at 32 percent for three years despite a documented 12 percent increase in input costs and no price increase. The auditor should conclude that:', o:['The absence of an expected fluctuation is itself a matter to investigate','The stability confirms firm cost control, so no further work is needed','The procedure has failed and every purchase must now be tested in detail','The margin should be recomputed using net rather than gross sales figures'], c:0, why:'SA 520 treats relationships that fail to fluctuate as expected in the same way as unexpected fluctuations, both signalling possible misstatement. Reading stability as automatically favourable is the classic error, as it can indicate manipulation of inventory or cost of sales.' },
  { q:'When an analytical procedure identifies a fluctuation inconsistent with other information, the auditor should FIRST:', o:['Propose an audit adjustment for the full amount of the difference found','Accept the management explanation where it is plausible for the business','Inquire of management and corroborate the responses with other evidence','Report the difference to those charged with governance as a deficiency'], c:2, why:'SA 520 requires inquiry of management followed by corroboration of the responses with other audit evidence. Accepting a plausible explanation without corroboration is precisely what the standard prohibits, because plausibility alone is not evidence.' },
  { q:'Which of the following is the BEST example of a plausible and predictable relationship suitable for substantive analytics?', o:['Advertising spend in one year against the revenue of the following year','Employee numbers and pay scales against payroll for a stable staff','Directors remuneration measured against the reported profit before tax','Legal provision balances measured against the growth rate of revenue'], c:1, why:'Payroll driven by known headcount and pay rates is a strong and stable relationship with verifiable inputs. Advertising to revenue, remuneration to profit, and provisions to revenue are all weak or judgement driven relationships with poor predictive power.' },
  { q:'For which assertion is a substantive analytical procedure over interest expense on a term loan MOST persuasive?', o:['Completeness and accuracy, given known principal, rate and schedule','Rights and obligations attaching to the underlying bank borrowing itself','Existence of the lending institution as a separate legal entity','Classification of the loan between current and non-current portions'], c:0, why:'Recomputing expected interest from principal, rate, and tenure is a strong test of whether the recorded charge is complete and accurate. Rights, existence of counterparties, and current versus non-current split need documentary examination rather than analytics.' },
  { q:'An auditor plans to rely solely on substantive analytical procedures for a material revenue stream assessed as having a significant risk. Under the standards this is:', o:['Acceptable, provided the expectation developed is sufficiently precise','Acceptable, provided management gives a signed representation on revenue','Acceptable only where the internal audit function has tested that stream','Not acceptable, since a significant risk demands tests of details'], c:3, why:'Where a significant risk is identified, substantive procedures responsive to that risk must include tests of details, so analytics alone are insufficient. Precision of the expectation does not remove that requirement.' },
  { q:'The MOST important reason an auditor disaggregates data by month when performing analytics over cost of sales is that:', o:['Monthly data is inherently more reliable than annual summary data','Offsetting misstatements between periods are less likely to be hidden','It removes the need to test the reliability of the underlying source data','Monthly data automatically satisfies the requirement for tests of details'], c:1, why:'Annual aggregation lets overstatements in one period offset understatements in another, so monthly analysis narrows the window in which errors can hide. Disaggregation does not make data inherently more reliable, and reliability testing is still required.' },
  { q:'Which of the following would MOST undermine the effectiveness of a trend analysis of repairs and maintenance expense?', o:['A stable manufacturing base with no change in capacity during the year','Consistent vendor and annual maintenance contract arrangements year on year','A material change in the capitalisation policy during the current year','Repairs expense standing at 3 percent of revenue in both of the years'], c:2, why:'A change in the capitalisation threshold breaks the comparability of the trend, because amounts previously expensed may now sit in fixed assets. The other options describe conditions of stability, which make trend analysis more, not less, effective.' },
  { q:'SA 520 requires analytical procedures to be performed near the end of the audit in order to:', o:['Replace the need for a final review of the statements by the partner','Confirm that every journal entry posted in the year has been tested','Recalculate the materiality level to be used for the following year','Help form an overall conclusion that the statements are consistent'], c:3, why:'Closing analytics support the overall conclusion by testing whether the statements as a whole align with the auditor understanding of the entity. They are additional to, not a substitute for, the partner review and other required procedures.' },
  { q:'An auditor computes expected depreciation as opening gross block times the average rate and finds a difference of 9 percent. The MOST likely legitimate cause to investigate first is:', o:['A change in useful life estimates or major additions and disposals','A misstatement in the trade payables balance at the reporting date','An error in the cut-off applied to revenue around the year end','An understatement of the deferred tax liability carried in the accounts'], c:0, why:'A simple opening balance model ignores mid year additions, disposals, and revisions to useful lives, all of which shift the depreciation charge. The other items sit in unrelated cycles and would not explain a depreciation variance.' },
  { q:'When using industry data as the basis for an expectation, the principal limitation is that:', o:['Industry composite data is never made publicly available in India at all','Industry data may not be used for risk assessment purposes at all','Policies, product mix and scale may differ from the industry composite','Using industry data converts the procedure into a test of controls'], c:2, why:'Composite industry figures blend entities with different policies, mixes, and scale, so differences may reflect these rather than misstatement. That limits precision but does not bar the data from being used as a risk assessment input.' },
  { q:'The auditor sets the acceptable difference for a substantive analytical procedure over rental income at 25 percent of performance materiality rather than 100 percent. This choice reflects:', o:['A wish to reduce the overall audit effort spent on rental income','A need for higher assurance and room to aggregate other misstatements','A requirement of SA 320 that every threshold be a quarter of materiality','An assessment that the risk of material misstatement here is very low'], c:1, why:'A tighter threshold is set when more assurance is being drawn from the procedure and to leave room for aggregating undetected misstatements elsewhere. A tighter threshold increases rather than reduces audit effort, and no standard prescribes a fixed fraction.' },
  { q:'Which is a valid reason to perform an analytical procedure as a risk assessment procedure even though it will provide no substantive assurance?', o:['It may flag unusual transactions, amounts or ratios indicating risks','It satisfies the need for sufficient appropriate evidence over balances','It automatically reduces the sample size required for tests of details','It allows the auditor to omit the understanding of internal control'], c:0, why:'Risk assessment analytics are required precisely to flag unusual items and relationships that point to risks needing response. They do not themselves constitute substantive evidence, nor do they displace the required understanding of internal control.' },
  { q:'An entity records a 30 percent revenue rise while receivables days increase from 45 to 96 and operating cash flow declines. The MOST appropriate auditor response is to:', o:['Accept the movement as normal for a company in a growth phase','Rely on the management representation that all recorded revenue is genuine','Increase materiality to reflect the larger revenue base for the year','Treat it as an indicator of overstatement and design specific procedures'], c:3, why:'Revenue growing far faster than cash collection is a classic fraud and cut-off indicator that calls for targeted procedures on occurrence and recoverability. Raising materiality or relying on a representation would reduce rather than increase the response to a heightened risk.' }
];
MCQ_BANK['documentation'] = [
  { q:'The experienced auditor test in SA 230 requires documentation sufficient to enable an experienced auditor with no previous connection with the audit to understand:', o:['Every conversation held with management over the course of the audit','The commercial terms of the audit engagement and the basis of the fee','The nature, timing and extent of procedures, results and conclusions','The internal quality control policies operated by the audit firm'], c:2, why:'The test focuses on the audit work itself, its results, and the significant judgements and conclusions drawn. Fee arrangements and firm level quality control policies are not what the experienced auditor test addresses.' },
  { q:'Under SA 230 the assembly of the final audit file should be completed on a timely basis after the date of the auditor report, ordinarily not more than:', o:['30 days','45 days','60 days','90 days'], c:2, why:'SA 230 indicates that an appropriate time limit for assembling the final audit file is ordinarily not more than 60 days after the date of the auditor report. The 60 day period is the assembly deadline and is distinct from the minimum retention period.' },
  { q:'The retention period for audit engagement documentation under the relevant quality control requirements is ordinarily no shorter than:', o:['Seven years from the date of the auditor report or group report','Five years from the date on which the auditor report was signed','Ten years from the balance sheet date of the financial statements','Three years from the date the audit file assembly was completed'], c:0, why:'Retention should ordinarily be no shorter than seven years from the date of the auditor report, or the group auditor report where later. Confusing this with the sixty day assembly period is a frequent error.' },
  { q:'After the date of the auditor report but before file assembly is complete, the auditor deletes superseded draft workpapers. This is:', o:['Prohibited in all cases, as nothing may be removed after the report date','Permissible, since assembly is administrative and adds no new conclusions','Permissible only with the written approval of those charged with governance','Permissible only if the deletion is disclosed within the auditor report'], c:1, why:'During the assembly period the auditor may perform administrative tasks such as deleting superseded drafts and sorting papers, because these do not change audit conclusions. What is prohibited is deleting or discarding documentation of substance before the retention period ends.' },
  { q:'The auditor performs a new procedure after the date of the auditor report in response to a query from a regulator. SA 230 requires documentation of:', o:['Only the additional procedure that was performed for the regulator','The name of the regulator and the fee charged for the additional work','A revised auditor report reflecting the additional work performed','The reasons, when and by whom made and reviewed, and the conclusions'], c:3, why:'When documentation is added after the report date, SA 230 requires recording the reasons, the who and when of the change and its review, and the additional procedures and conclusions. Merely filing the new procedure without this trail defeats the audit trail requirement.' },
  { q:'Which statement about written representations under SA 580 is CORRECT?', o:['Written representations are sufficient appropriate evidence on their own','Written representations are evidence but never sufficient by themselves','Written representations remove the need to test management estimates','Written representations may be dated at any point in the assembly period'], c:1, why:'SA 580 is explicit that representations are evidence but never sufficient on their own for the matters they address. They also cannot substitute for other evidence the auditor could reasonably expect to be available.' },
  { q:'Under SA 580, written representations should be dated:', o:['As near as practicable to, but not after, the date of the auditor report','On the balance sheet date to which the audited financial statements relate','Within sixty days after the date on which the auditor report is dated','On the date the financial statements are approved by the shareholders'], c:0, why:'The representations must cover all periods referred to in the report and be dated as near as practicable to but not after the date of the auditor report. Dating them after the report would leave the intervening period uncovered.' },
  { q:'Management refuses to provide the written representation regarding its responsibility for the preparation of the financial statements. The auditor should:', o:['Issue a qualified opinion and describe the refusal in the basis section','Obtain an oral representation from management instead and document it','Withdraw the audit report that has already been issued to the members','Disclaim an opinion, since all other representations become unreliable'], c:3, why:'Refusal of the fundamental representations about managements responsibilities undermines the reliability of all representations, so SA 580 requires a disclaimer. A qualification would understate the effect on the audit as a whole.' },
  { q:'An audit team documents that no exceptions were noted in a control test but does not record which items were tested. Under SA 230 the primary deficiency is that:', o:['The specific items tested are not identified, so work cannot be redone','A conclusion of no exceptions is not a valid audit conclusion at all','The working paper should have been signed by the client finance head too','The working paper does not carry a cross reference to materiality'], c:0, why:'SA 230 requires recording the identifying characteristics of the items tested so the work is traceable and re-performable. Without them an experienced auditor cannot evaluate whether the conclusion is supported.' },
  { q:'Which of the following would ordinarily NOT need to be retained in the audit documentation?', o:['Significant matters discussed with management, and when and with whom held','The basis for the conclusion on the reasonableness of an estimate','Superseded drafts and duplicate copies replaced by corrected versions','Documentation of discussions on significant matters with governance'], c:2, why:'Superseded drafts and duplicates replaced by corrected versions may be removed during assembly since they do not evidence the final conclusions. The other items are precisely the significant matters SA 230 requires to be documented and retained.' },
  { q:'The auditor concludes that an accounting estimate is reasonable but the documentation records only the final number agreed with management. This fails SA 230 because it does not record:', o:['The audit fee attributable to the work performed on the estimate','The prior year comparative amount recorded for the very same estimate','The names of every member of the engagement team involved in it','The professional judgements made and the basis for the conclusion'], c:3, why:'Where significant professional judgement is exercised, SA 230 requires documentation of the judgement and its basis so the reasoning is auditable. Recording only the agreed figure leaves the judgement invisible.' },
  { q:'A representation from management about the completeness of related party relationships and transactions is required because:', o:['It removes the auditor responsibility to search for undisclosed relations','Management holds the knowledge, but the representation supplements work','SA 550 permits sole reliance on representations for related parties','The Companies Act 2013 requires it to be obtained in place of testing'], c:1, why:'Management holds the primary knowledge of related parties, so a representation is required, but it complements procedures such as reviewing registers, minutes and confirmations. Treating it as a substitute would leave undisclosed relationships undetected.' },
  { q:'If management provides a written representation that the auditor concludes is not reliable, SA 580 requires the auditor to:', o:['Accept the representation but place reduced reliance upon it','Request a second representation signed by those charged with governance','Take action, including assessing the effect on the audit opinion','Report the matter to the Registrar of Companies without any delay'], c:2, why:'Doubt about integrity or reliability of a representation casts doubt on other representations and evidence generally, and may require modification of the opinion. Simply obtaining a second signature does not address the underlying reliability concern.' },
  { q:'SA 230 requires documentation of discussions of significant matters. The record should include:', o:['The nature of the matters, and the timing and the participants involved','Only the final conclusion that the engagement team reached on the matter','A verbatim transcript of the whole discussion as it actually occurred','The commercial impact on the client of the matter that was discussed'], c:0, why:'The standard calls for the nature of the matters, and the timing and participants of the discussion, so the audit trail is complete. A verbatim transcript is neither required nor practical.' },
  { q:'Which document is LEAST likely to be considered audit documentation under SA 230?', o:['Checklists and analyses prepared by members of the engagement team','Abstracts of significant contracts obtained by the audit team','Letters of confirmation received directly from third parties','The entity accounting records and underlying source documents'], c:3, why:'The entity accounting records and underlying source documents are audit evidence held by the client, not the auditor documentation, though copies or abstracts placed on file become documentation. The other three are classic examples of working papers.' },
  { q:'Where the auditor departs from a relevant requirement of an SA, SA 230 requires documentation of:', o:['The departure alone, since alternative procedures are a judgement matter','The reasons for departure and how alternatives achieved the aim','Approval obtained from the Institute for departing from the requirement','A modification of the auditor report describing the departure made'], c:1, why:'The documentation must show the reasons for departure and how the alternative procedures met the objective of the requirement. No external approval is needed, and a departure handled this way does not by itself trigger a report modification.' },
  { q:'A written representation about managements intention to hold an investment to maturity is MOST usefully corroborated by:', o:['A second representation obtained from the entity audit committee','A confirmation of the current market value obtained from the broker','Past practice, board minutes, forecasts and the ability to hold','The professional judgement of the engagement partner on its own'], c:2, why:'Intent representations require corroboration through history of similar holdings, documented board decisions, and the financial ability to hold. Market value confirmation addresses measurement, not intention.' },
  { q:'The auditor documents the identifying characteristics of items tested for a purchase order sample. An acceptable identifying characteristic would be:', o:['All of the purchase orders included within the selected sample','A representative selection of purchase orders raised in the year','Approximately sixty purchase orders selected from across the year','Purchase orders PO 4501 to PO 4560 raised between April and June'], c:3, why:'Identifying characteristics must let another auditor locate the same items, which specific document numbers and dates achieve. Vague descriptions such as representative or approximately sixty give no way to reperform the test.' }
];
MCQ_BANK['revenue'] = [
  { q:'Under Ind AS 115, a promised good or service is distinct only if:', o:['It is sold separately by the entity at some point during the period','The customer can benefit from it alone and it is separately identifiable','It has a stand-alone selling price that is directly observable in the market','The entity can identify a separate cost centre for that promise'], c:1, why:'Both the capable of being distinct test and the distinct within the context of the contract test must be met. Observable stand-alone selling price is relevant to allocation, not to whether the promise is distinct.' },
  { q:'An entity sells equipment and provides complex installation that significantly customises the equipment. Under Ind AS 115 the likely conclusion is:', o:['One obligation, as the goods and installation form a combined output','Two obligations, since the installation could be performed by others','Two obligations, since the equipment has an observable separate price','Revenue is deferred in full until the warranty period has expired'], c:0, why:'Significant customisation means the entity is providing a combined output, so the promises are not separately identifiable within the contract. That a third party could theoretically install does not override the integration test.' },
  { q:'The constraint on variable consideration requires an entity to include variable amounts only to the extent that:', o:['The amount is more likely than not to be received from the customer','The variable element is less than 10 percent of the transaction price','The customer has confirmed the variable amount to the entity in writing','It is highly probable no significant reversal of revenue will occur'], c:3, why:'Ind AS 115 uses the highly probable no significant reversal threshold, which is a higher hurdle than more likely than not. There is no percentage safe harbour for variable consideration.' },
  { q:'Which factor MOST indicates the entity is a principal rather than an agent?', o:['The entity has full discretion in establishing the price for the good','The entity earns a commission set as a fixed percentage of each sale','The entity controls the specified good before it passes to the buyer','The name of the entity appears on the invoice sent to the customer'], c:2, why:'Control of the specified good before transfer is the overarching principle, with price discretion and inventory risk serving only as indicators supporting it. Invoice branding and commission form are presentation features that do not determine the conclusion.' },
  { q:'A performance obligation is satisfied over time if the entity performance creates an asset with no alternative use AND:', o:['The customer settles the agreed contract price in equal instalments','The entity has an enforceable right to payment for work completed','The term of the contract extends beyond a period of twelve months','The entity uses percentage of completion in its internal costing'], c:1, why:'The no alternative use criterion must be paired with an enforceable right to payment for performance completed to date, including a reasonable profit margin. Instalment payments and contract length are not criteria in the standard.' },
  { q:'An entity recognises revenue but its right to consideration is conditional on completing a further milestone. The amount should be presented as:', o:['A contract asset, as the right is conditioned on more than time','A trade receivable, since the related revenue has been recognised','Deferred revenue within current liabilities on the balance sheet','Other current assets, with no further disclosure being required'], c:0, why:'A receivable arises only when the right to consideration is unconditional, needing nothing beyond passage of time. Where a further performance condition exists, the balance is a contract asset and carries different disclosure and impairment considerations.' },
  { q:'A contract includes a significant financing component when:', o:['Any payment by the customer is deferred beyond a period of thirty days','The contract price exceeds the cash selling price by any amount at all','The customer settles the contract price in a foreign currency instead','Payment timing gives either party a significant benefit of financing'], c:3, why:'The test is whether the payment timing provides a significant financing benefit to either party, assessed against the cash selling price. A practical expedient allows the component to be ignored where the period between transfer and payment is one year or less.' },
  { q:'An entity grants a customer a right to return goods within 30 days. Under Ind AS 115 the entity should:', o:['Recognise full revenue and disclose the return right as contingent','Defer all of the revenue until the thirty day return period lapses','Recognise revenue net of expected returns, with a refund liability','Treat the right of return as a separate performance obligation'], c:2, why:'Return rights are variable consideration, so revenue excludes expected returns and a refund liability plus an asset for the right to recover goods are recognised. A right of return is expressly not a separate performance obligation under the standard.' },
  { q:'Consideration payable to a customer that is not in exchange for a distinct good or service should be:', o:['Accounted for as a reduction of the transaction price recognised','Recognised as a selling and distribution expense as it is incurred','Capitalised as a contract cost and amortised over the contract term','Recognised as a separate performance obligation in the contract'], c:0, why:'Payments to a customer reduce the transaction price unless they buy a distinct good or service at fair value. Classifying such payments as marketing expense inflates both revenue and expenses.' },
  { q:'Which allocation basis does Ind AS 115 require for the transaction price across multiple performance obligations?', o:['The relative cost incurred on each of the separate performance obligations','Relative stand-alone selling prices, estimated where not observable','Equal allocation of the transaction price across the obligations','The individual amounts stated in the contract in every situation'], c:1, why:'Allocation follows relative stand-alone selling prices, estimated using approaches such as adjusted market assessment, expected cost plus margin, or residual where permitted. Contractual stated prices are used only where they represent stand-alone selling prices.' },
  { q:'An audit team is testing revenue cut-off for goods shipped FOB destination. The MOST relevant evidence around the year end is:', o:['Sales invoices dated during the final week of the financial year','The reconciliation of the sales ledger control account at the year end','Purchase orders received from customers before the year end date','Proof of delivery evidencing the date the customer obtained control'], c:3, why:'With FOB destination terms, control transfers on delivery, so delivery evidence determines the correct period. Invoice dates are set by the entity and can be manipulated, which is why they are the weaker choice.' },
  { q:'Incremental costs of obtaining a contract, such as a sales commission payable only on winning the contract, should be:', o:['Expensed as incurred in every case, whatever the length of contract','Netted against the revenue recognised on the related contract','Recognised as an asset if recoverable, with a one year expedient','Recognised as a contract liability until the contract completes'], c:2, why:'Ind AS 115 requires capitalisation of recoverable incremental acquisition costs, with an expedient permitting immediate expense where the amortisation period would not exceed one year. Salaries payable regardless of contract success are not incremental and are expensed.' },
  { q:'An entity sells a machine with a two year assurance type warranty required by law and an optional extended warranty. The correct treatment is:', o:['Both of the warranties are separate performance obligations of the entity','The assurance warranty is a provision, the extended one an obligation','Both of the warranties are provisions recognised under Ind AS 37','Neither warranty is recognised until a valid claim actually arises'], c:1, why:'Assurance warranties that merely confirm the product meets agreed specifications are provisions, while service type warranties sold separately are performance obligations with allocated revenue. Treating the assurance warranty as a performance obligation would improperly defer revenue.' },
  { q:'For a bill and hold arrangement, revenue can be recognised only if, in addition to the customer having requested the arrangement, the:', o:['Goods are identified as the customer property and ready for transfer','Invoice has been raised and payment received fully in advance','Goods held are insured by the entity against loss or damage in store','Customer has provided a written and signed purchase order form'], c:0, why:'Ind AS 115 sets specific criteria including a substantive reason for the arrangement, identification of the goods as the customer property, readiness for transfer, and inability of the entity to redirect them. Invoicing and payment alone do not establish transfer of control.' },
  { q:'Which measure of progress would ordinarily be INAPPROPRIATE for a service contract where the entity efforts are expended evenly?', o:['Time elapsed as a proportion of the total contract period agreed','Costs incurred relative to the total costs expected on the contract','Surveys of the performance that has been completed to that date','Units of standard product delivered where delivery is uneven'], c:3, why:'A units delivered measure would distort revenue where deliveries do not track the pattern of effort under an evenly expended service contract. Time elapsed, cost to cost, and surveys of work performed all track the transfer of the service more faithfully.' },
  { q:'Under the expected value method for estimating variable consideration, the entity should:', o:['Use the single most likely outcome of the possible amounts','Use the maximum possible amount of consideration that is receivable','Use the probability weighted sum, suiting many similar contracts','Use the amount stated in the contract whatever the probability'], c:2, why:'The expected value method is the probability weighted approach and fits populations of many similar contracts, such as volume rebates. The most likely amount method is the alternative and suits contracts with only two possible outcomes.' },
  { q:'An auditor identifies that side letters granting extended return rights were not provided to the finance team. The primary revenue audit risk is:', o:['Overstatement of revenue, as the true terms alter transfer of control','Understatement of the trade payables balance at the reporting date','Misclassification between current and non-current assets on the balance sheet','Understatement of the deferred tax asset recognised in the accounts'], c:0, why:'Undisclosed side letters change the substance of the arrangement and typically mean revenue was recognised too early or at too high an amount. This is a recognised fraud risk area, which is why searching for side agreements is a standard revenue procedure.' },
  { q:'A contract liability arises when:', o:['The entity holds an unconditional right to the consideration due','Consideration is received, or unconditionally due, before transfer','The customer has disputed an invoice raised on it by the entity','The entity has performed the work but has not yet raised an invoice'], c:1, why:'A contract liability reflects the obligation to transfer goods or services for consideration already received or unconditionally due. Performance ahead of invoicing produces a contract asset, which is the opposite position.' }
];
MCQ_BANK['leases'] = [
  { q:'Under Ind AS 116, a contract contains a lease only if it conveys the right to control the use of an identified asset. Control requires the customer to have:', o:['Legal title to the underlying asset throughout the whole contract term','An option to purchase the underlying asset at the end of the term','Physical possession of the underlying asset at all times in use','Substantially all the economic benefits and the right to direct use'], c:3, why:'Control is defined by the combination of obtaining substantially all economic benefits and directing how and for what purpose the asset is used. Title, possession, and purchase options are not the defining tests.' },
  { q:'A supplier has a substantive substitution right over the asset throughout the period of use. The consequence under Ind AS 116 is:', o:['The asset is identified, but the lease is classified as short-term','There is no identified asset, so the contract contains no lease','The customer still recognises a right-of-use asset at its fair value','The contract is treated as a service concession arrangement instead'], c:1, why:'A substantive substitution right, meaning the supplier has the practical ability to substitute and would benefit economically from doing so, means no identified asset and therefore no lease. A right that is only exercisable on malfunction or repair is not substantive.' },
  { q:'The lease liability at commencement is measured at the present value of lease payments not yet paid, discounted using:', o:['The incremental borrowing rate of the lessee in all circumstances','The risk free rate on government securities of a comparable tenure','The rate implicit in the lease if readily determinable, else IBR','The weighted average cost of capital of the lessee at commencement'], c:2, why:'Ind AS 116 requires the implicit rate where readily determinable, falling back to the incremental borrowing rate. Lessees commonly cannot determine the implicit rate because they do not know the unguaranteed residual value, which is why the IBR is used in practice.' },
  { q:'Which of the following is NOT included in the initial measurement of the right-of-use asset?', o:['Variable payments linked to future sales, not based on an index','Payments made at or before commencement, less incentives received','An estimate of dismantling and restoration costs to be incurred','Initial direct costs that have been incurred by the lessee itself'], c:0, why:'Variable payments linked to sales or usage are excluded from both the liability and the asset and are expensed as incurred. Payments varying with an index or rate are included, measured using the index at commencement.' },
  { q:'The low value exemption in Ind AS 116 is applied:', o:['By reference to the materiality level determined for the lessee','Only where the lessee also applies the short-term exemption to all leases','Only to leases whose term is shorter than a period of twelve months','Asset by asset, on the value of the asset when new, whatever lessee size'], c:3, why:'Low value is assessed on the absolute value of the underlying asset when new and is applied lease by lease, independent of the lessee size or materiality. The exemption is not available if the lessee subleases or expects to sublease the asset.' },
  { q:'The short-term lease exemption is unavailable where:', o:['The lease term is exactly twelve months and has no options','The lease contains a purchase option granted to the lessee','The lessor happens to be a related party of the lessee company','The underlying asset leased is a motor vehicle used by staff'], c:1, why:'A lease containing a purchase option cannot be a short-term lease under Ind AS 116, regardless of its term. A twelve month lease with no purchase option does qualify, and the exemption is an election by class of underlying asset.' },
  { q:'A lease modification that increases the scope by adding the right to use an additional asset, with consideration increased by an amount commensurate with the stand-alone price for that increase, is accounted for as:', o:['A remeasurement of the existing liability at a revised discount rate','A termination of the original lease and recognition of a new lease','A separate lease accounted for independently of the original lease','An immediate gain or loss recognised within profit or loss for the year'], c:2, why:'Both conditions being met, increased scope and commensurate price increase, requires the modification to be treated as a separate lease. Where the price increase is not commensurate, the existing liability is remeasured using a revised discount rate instead.' },
  { q:'A lease modification decreases the scope of the lease. The lessee should:', o:['Reduce the right-of-use asset proportionately and book a gain or loss','Adjust the right-of-use asset alone, with no gain or loss arising at all','Recognise the whole reduction in the lease liability as deferred income','Treat the reduction in scope as though it were a separate new lease'], c:0, why:'A scope decrease requires proportionate reduction of the right-of-use asset with any difference against the remeasured liability recognised in profit or loss. Deferring the effect misstates both the asset and the period result.' },
  { q:'Under Ind AS 116, a lessor classifies a lease as a finance lease when:', o:['The lease term covers more than 75 percent of the asset economic life','It transfers substantially all the risks and rewards of ownership','The present value of lease payments exceeds 90 percent of fair value','Legal title to the asset passes at the end of the lease in all cases'], c:1, why:'Classification rests on whether substantially all risks and rewards of ownership transfer, assessed using indicators rather than bright lines. The 75 percent and 90 percent figures are US style bright lines and are not thresholds in Ind AS 116.' },
  { q:'A lessee remeasures the lease liability using a REVISED discount rate when:', o:['Payments alter because of a market rent review clause in the contract','The credit standing of the lessee entity improves during the term','The consumer price index used for escalation of the rent changes','The lease term changes, or the purchase option assessment changes'], c:3, why:'Changes in lease term or purchase option assessment require an unchanged cash flow pattern to be rediscounted at a revised rate. Index or rate driven payment changes are remeasured using the original discount rate, which is the common trap.' },
  { q:'A ten year property lease has a market rent review after five years. At commencement the lessee should:', o:['Use the rent in effect at commencement and remeasure on the review','Include estimated future market rent increases in the lease payments','Treat the whole lease as variable and expense the payments made','Recognise a provision now for the expected future rent increase'], c:0, why:'Market rent reviews are not based on an index or rate in the sense of a formula driven adjustment, so the lessee uses the rent in effect and remeasures when the change takes effect. Forecasting rent increases into the initial liability is not permitted.' },
  { q:'Which audit procedure is MOST effective in addressing the completeness of the lease population under Ind AS 116?', o:['Recomputing the discount unwind on leases already in the register','Confirming the lease terms with lessors already listed in the register','Scanning rent and hire expense accounts and reviewing board minutes','Agreeing the opening right-of-use asset to the prior year figure'], c:2, why:'Completeness risk lies with arrangements never entered in the register, so procedures must look outside it, such as scanning expense accounts and contract approvals. Testing items already in the register addresses accuracy but cannot detect omissions.' },
  { q:'A sale and leaseback where the transfer does NOT qualify as a sale under Ind AS 115 should be accounted for by the seller-lessee as:', o:['Derecognition of the asset and recognition of a right-of-use asset','A right-of-use asset at its fair value with the gain taken to OCI','A full gain on the sale and an operating lease expense taken thereafter','Continued recognition of the asset and a financial liability raised'], c:3, why:'If control does not transfer, no sale has occurred, so the asset stays on the balance sheet and the proceeds are a financial liability under Ind AS 109. Recognising a gain would be recognising profit on a financing transaction.' },
  { q:'The lease term under Ind AS 116 comprises the non-cancellable period plus:', o:['Every optional renewal period that is available to it under the contract','Optional periods where the reasonably certain test is met by the lessee','Any period for which the lessee has historically occupied premises','Renewal periods only where the lessor has no right to refuse them'], c:1, why:'Only options the lessee is reasonably certain to exercise, and termination options it is reasonably certain not to exercise, extend the lease term. Including all available options regardless of intent overstates both the asset and the liability.' },
  { q:'A manufacturer dealer lessor enters a finance lease. At commencement it recognises:', o:['Selling profit or loss as on an outright sale, plus finance income','Only finance income spread across the term of the finance lease','The asset at cost, depreciated over its estimated useful life','A right-of-use asset together with a matching lease liability raised'], c:0, why:'Manufacturer or dealer lessors recognise selling profit or loss at commencement, calculated using a market rate of interest, and then finance income over the term. Deferring all profit into finance income would misstate both revenue and margin.' },
  { q:'Which characteristic would MOST support the conclusion that the customer directs the use of an identified asset?', o:['The supplier operates the asset under its own protocols throughout','The underlying asset is physically located at the supplier premises','The customer decides what output is produced, when, and how much','The customer pays a fixed monthly fee for the use of the asset'], c:2, why:'Deciding the how and for what purpose of use during the period of use is the core of directing use. Location of the asset and the payment structure are not determinative, and supplier controlled operation with predetermined output points away from a lease.' },
  { q:'A lessee elects the short-term exemption for a class of office equipment leases. It must:', o:['Recognise a right-of-use asset but no corresponding lease liability at all','Capitalise the payments and amortise them over the asset expected life','Recognise a lease liability but no corresponding right-of-use asset','Expense the payments on a straight-line basis and disclose the election'], c:3, why:'The exemption results in straight-line recognition of the payments as expense, with specific disclosure of the election and expense amount. Partial recognition of only an asset or only a liability is not an option under the standard.' },
  { q:'In auditing lease data, which input would ordinarily be the HIGHEST risk of material misstatement in the lease liability?', o:['The monthly fixed rent that is stated in the executed lease contract','The incremental borrowing rate applied and the lease term assessed','The commencement date shown on the signed handover certificate','The currency in which the lease contract has been denominated'], c:1, why:'The discount rate and the lease term involve significant estimation and judgement and small changes materially shift the liability. Contractual rent and handover dates are objectively verifiable from documents and carry far less estimation risk.' }
];
MCQ_BANK['fininst'] = [
  { q:'Under Ind AS 109, a financial asset is measured at amortised cost only if:', o:['The hold to collect model applies and the cash flows are SPPI','The instrument is a debt security quoted in an active public market','Management designates it as amortised cost at initial recognition','The instrument has a fixed maturity of more than one financial year'], c:0, why:'Both the hold to collect business model and the SPPI test must be met for amortised cost. Quotation in an active market and maturity length are irrelevant to classification, and there is no free designation into amortised cost.' },
  { q:'A loan contains a term allowing the borrower to prepay at an amount that includes reasonable compensation for early termination. This term:', o:['Automatically fails the SPPI test, forcing measurement at FVTPL alone','Requires the prepayment feature to be bifurcated as a derivative','Requires the loan to be classified and measured at FVOCI instead','Does not by itself fail SPPI, as reasonable compensation is allowed'], c:3, why:'Ind AS 109 accepts prepayment features where the amount substantially represents unpaid principal, interest and reasonable early termination compensation. Embedded derivatives are not bifurcated from financial asset hosts in any case, which is a key change from the old standard.' },
  { q:'An equity investment not held for trading is designated at fair value through other comprehensive income. On disposal:', o:['The cumulative gain held in OCI is reclassified to profit or loss','Only the dividends received are recognised in profit on disposal','The cumulative gain stays in equity and is never recycled to profit','The entity restates the prior period comparative figures on disposal'], c:2, why:'For the equity FVOCI election there is no recycling of amounts to profit or loss on disposal, which distinguishes it from the debt FVOCI category. Dividends on such equity investments are recognised in profit or loss when the right to receive is established.' },
  { q:'A portfolio of debt instruments is managed with the objective of both collecting contractual cash flows and selling, and the cash flows are SPPI. The correct classification is:', o:['Amortised cost, with interest under the effective interest method','FVOCI, with cumulative gains recycled to profit on derecognition','FVTPL, with all fair value movements taken to profit or loss','Equity FVOCI, with no recycling of gains on disposal at all'], c:1, why:'The hold to collect and sell business model with SPPI cash flows produces debt FVOCI, where amounts accumulated in OCI are recycled on derecognition. Interest, impairment and foreign exchange for such assets still go through profit or loss.' },
  { q:'Under the general expected credit loss model, an instrument moves from Stage 1 to Stage 2 when:', o:['Credit risk has increased significantly since initial recognition','The borrower has defaulted on the contractual payments now due','The instrument has been outstanding for more than twelve months','The exposure exceeds the internal single borrower limit that is set'], c:0, why:'Stage 2 is triggered by a significant increase in credit risk since initial recognition, at which point lifetime ECL is measured but interest is still computed on gross carrying amount. Actual credit impairment moves the asset to Stage 3, where interest is computed on the net carrying amount.' },
  { q:'For a Stage 3 credit impaired financial asset, interest revenue is calculated by applying the effective interest rate to:', o:['The gross carrying amount before deducting any loss allowance held','The original contractual amount of the loan that was advanced','The amortised cost, being gross carrying amount net of allowance','The fair value of the collateral held as security for the loan'], c:2, why:'Once an asset is credit impaired, interest is recognised on the net amortised cost after deducting the allowance. Applying the rate to the gross amount is correct only for Stage 1 and Stage 2 assets.' },
  { q:'The simplified approach under Ind AS 109 for trade receivables without a significant financing component requires:', o:['Twelve month expected credit losses to be held at all times instead','Fair value measurement of the receivable at each reporting date','Losses only where objective evidence of impairment is present','Lifetime expected credit losses from the outset, with no staging'], c:3, why:'The simplified approach mandates lifetime ECL from day one and removes the need to track significant increases in credit risk. Recognising losses only on objective evidence is the superseded incurred loss approach.' },
  { q:'Ind AS 109 requires that the rebuttable presumption of a significant increase in credit risk arises when contractual payments are more than:', o:['More than 15 days past due on the contractual payments','More than 30 days past due on the contractual payments','More than 60 days past due on the contractual payments','More than 90 days past due on the contractual payments'], c:1, why:'The rebuttable presumption for a significant increase in credit risk is 30 days past due, whereas 90 days past due is the rebuttable presumption for default. Confusing the two thresholds causes assets to be staged incorrectly.' },
  { q:'An expected credit loss measurement under Ind AS 109 must:', o:['Reflect the single most likely outcome of the credit exposure','Be unbiased, probability weighted, discounted and forward looking','Ignore forward looking information so as to avoid any speculation','Use only the historical loss rates of the last three financial years'], c:1, why:'ECL is a probability weighted, discounted estimate that incorporates reasonable and supportable forward looking information available without undue cost or effort. Using a single best case outcome or purely historical rates fails the measurement objective.' },
  { q:'An entity transfers receivables to a bank but retains a guarantee for the first 20 percent of credit losses and continues to collect from customers. Most likely the entity:', o:['Neither transfers nor retains all risks, so the control test applies','Derecognises the receivables in full, since legal title has passed','Recognises a gain on sale equal to the full carrying amount involved','Reclassifies the transferred receivables to FVTPL at the date of sale'], c:0, why:'Where risks and rewards are neither substantially transferred nor retained, the control test applies and retained servicing plus a first loss guarantee typically means continuing involvement. Legal transfer of title alone does not achieve derecognition under Ind AS 109.' },
  { q:'Reclassification of financial assets under Ind AS 109 is permitted:', o:['Whenever management changes its intention for a single instrument','Only with the prior approval of those charged with governance given','At each reporting date, for any of the measurement categories used','Only on a business model change, applied prospectively and rarely'], c:3, why:'Reclassification is driven solely by a change in business model, is expected to be very infrequent, and is applied prospectively. Equity instruments and assets designated at FVTPL under the fair value option can never be reclassified.' },
  { q:'For a cash flow hedge, the effective portion of the gain or loss on the hedging instrument is:', o:['Recognised in profit or loss immediately as it arises each period','Adjusted against the carrying amount of the hedged item in all cases','Recognised in OCI and accumulated in the cash flow hedge reserve','Deferred and presented as a contract asset on the balance sheet'], c:2, why:'The effective portion goes to OCI in the cash flow hedge reserve, with any ineffective portion recognised immediately in profit or loss. Adjusting the hedged item carrying amount is the fair value hedge mechanic, not the cash flow hedge mechanic.' },
  { q:'Under Ind AS 109, hedge accounting requires an economic relationship between hedged item and hedging instrument, the effect of credit risk not dominating value changes, and:', o:['A hedge ratio matching the quantity actually used to hedge the risk','A quantitative effectiveness result within the 80 to 125 percent band','Retrospective effectiveness testing carried out at each reporting date','Formal approval of the hedge relationship by the audit committee'], c:0, why:'Ind AS 109 replaced the bright line 80 to 125 percent test with a principles based hedge ratio requirement linked to actual risk management. Retrospective bright line testing is no longer a condition for hedge accounting.' },
  { q:'A financial liability is measured at FVTPL and the entity elects to present changes attributable to its own credit risk in OCI. Those amounts:', o:['They are recycled to profit or loss when the liability is settled early','They are added to the carrying amount of the liability every period','They must be reversed if the credit spread of the entity narrows','They are never transferred to profit, though they may move in equity'], c:3, why:'Own credit risk gains and losses presented in OCI are never recycled to profit or loss, avoiding the counterintuitive result of booking profit as credit quality deteriorates. Transfers within equity are permitted.' },
  { q:'Which cost treatment is correct at initial recognition under Ind AS 109?', o:['Transaction costs are added to the fair value of the FVTPL assets','FVTPL costs go to profit at once, other categories adjust cost','Transaction costs are always capitalised whatever the category','Transaction costs are recognised in other comprehensive income'], c:1, why:'For FVTPL instruments transaction costs are expensed immediately, while for amortised cost and FVOCI they are included in the initial measurement and amortised through the effective interest rate. Treating them uniformly misstates both the carrying value and interest income.' },
  { q:'A trade receivable is sold at a deep discount to a factor without recourse, and the entity has no continuing involvement. The correct treatment is:', o:['Retain the receivable on the balance sheet and recognise a liability','Reclassify the receivable to FVOCI at the date of the factoring','Derecognise it and take the difference on consideration to profit','Recognise the discount as a reduction of revenue under Ind AS 115'], c:2, why:'Where substantially all risks and rewards have transferred with no continuing involvement, the asset is derecognised and the loss on sale hits profit or loss. The discount is a financing cost of the factoring arrangement, not an adjustment to the original transaction price.' },
  { q:'When auditing an ECL model, which element is ordinarily the HIGHEST estimation uncertainty?', o:['The macroeconomic scenarios, their weights and probability of default','The gross carrying amount of the loan book extracted from the ledger','The contractual rate of interest charged on each of the individual loans','The number of loan accounts making up the portfolio at year end'], c:0, why:'Macro scenario selection, scenario weighting and PD estimation involve significant management judgement and drive the loss allowance materially. Ledger balances, contractual rates and account counts are objectively verifiable data with low estimation uncertainty.' },
  { q:'A debt instrument classified at FVOCI is impaired. The loss allowance is:', o:['Deducted from the carrying amount of the asset on the balance sheet','Recognised only at the point of derecognition of the debt instrument','Ignored, because the fair value already reflects the credit risk','Charged to profit or loss with the offsetting entry made in OCI'], c:3, why:'For debt FVOCI the asset stays at fair value on the balance sheet, so the ECL charge goes to profit or loss with the offset in OCI rather than reducing the carrying amount. Assuming fair value alone handles credit risk would leave the impairment charge missing from profit or loss.' }
];
